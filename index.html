  ['forecast','Ausblick','navdt'], ['ziele','Ziele',''], ['konten','Konten',''] ];

  return NAV_PRIMARY.map(([v,label,cls])=>
      `<button class="${cls}${VIEW===v?' on':''}" onclick="goView('${v}')">${label}</button>`).join('')

    + `<button class="navdt navsub" onclick="openTaxPlanner()">Steuer-Planer</button>`
    + `<button class="navdt navsub" onclick="openGlossarySheet()">Wie rechnet die App?</button>`

function render(){
  applyTheme();
  el('hsub').textContent = S.settings.profileName || 'Persönliche Finanzen';
  const inWizard = WIZ !== null || (!S.setupComplete && VIEW!=='checks');
  el('gearBtn').style.display = inWizard ? 'none' : '';

/* ─────────── Bausteine ─────────── */
/* chevPad (V1.3a): Top-Level-Konten OHNE Spaces (Kreditkarte, Zweitkonto …) im
   Home-Block bekommen eine leere Chevron-Spalte, damit ihre Emoji-/Namensspalte
   exakt unter den Hauptkonten (die einen Chevron tragen) fluchtet — sonst sitzt
   die Zeile 34px weiter links und der Block wirkt schief. */
/* Tracker-Zeile am Topf-Konto (N6, SPEC 2.46): «davon Serafe: X · für variable
   Kosten: Y». Bewusst eine schlichte Textzeile — kein Zielsystem, keine
   goalId, keine Invariante. Erscheint nur am eingerichteten Topf und nur, wenn
   überhaupt etwas gebunden ist. Was NICHT zugeordnet werden kann, steht als
   «frei» daneben — lieber ehrlich als vollständig. */
function potTrackerLine(accId){
  if(accId !== S.settings.varReserveToId) return '';
  const b = potBreakdown(S, accId);
  if(!b) return '';
  /* Die Zeile steht, sobald der Topf eingerichtet ist — auch wenn noch nichts
     gebunden ist. Sie erst ab dem ersten Zurücklegen zu zeigen, wäre genau dann
     stumm, wenn Leo wissen will, ob der Topf überhaupt wirkt. */
  let txt = b.parts.length
    ? 'davon ' + b.parts.map(p=>`${esc(p.name)}: ${fmtAmt(p.amount)}`).join(' · ')
    : 'nichts zugeordnet';
  /* Der Steuer-Zähler ist bewusst vom Kontostand getrennt (2.25) — gebunden
     kann also mehr sein, als im Topf liegt. Das gehört gesagt, nicht versteckt. */
  /* N10: seit Z den verfügbaren Anteil ausschöpft (2.50b), ist «genau
     aufgegangen» der NORMALFALL, nicht mehr der Zufall. Vorher endete die Zeile
     dann stumm nach dem letzten Teil und sah aus, als fehle etwas (im Screenshot
     gesehen) — darum steht die 0 jetzt ausgeschrieben. */
  txt += b.rest>0 ? ' · frei: '+fmtAmt(b.rest) : b.rest<0 ? ' · ungedeckt: '+fmtAmt(-b.rest) : ' · frei: '+fmtAmt(0);
  /* Noch offene Rücklage mitnennen: erklärt die Lücke zwischen «geplant» und
     «liegt da», ohne dass Leo dafür in die Einstellungen muss. */
  const open = varReserveQuickItem(S, S.settings.currentMonthId);
  if(open && open.amount>0) txt += ' · offen: '+fmtAmt(open.amount)+' zurückzulegen';
  return `<div class="rsub potline">${txt}</div>`;
}
/* Volle Aufteilung «Was liegt im Topf?» (N6) — geteilt zwischen Konto-Editor
   (erreichbar durch Antippen des Topf-Kontos in JEDER Ansicht) und dem Planer,
   damit es nur EINE Quelle gibt. Zeigt die Teile X/Y/Steuer, frei/ungedeckt, die
   offene Rücklage und — für die variablen Kosten — die einzelnen Posten mit
   «bezahlt/offen aus dem Topf». */
function potBreakdownCard(potId, st){
  st = st || S;
  if(!potId || potId!==st.settings.varReserveToId) return '';
  const b = potBreakdown(st, potId);
  if(!b) return '';
  const row = (label, val, cls) => `<div class="row" style="min-height:0;padding:4px 2px">
    <div class="rsub">${label}</div><div class="num amt ${cls||''}">${val}</div></div>`;
  const parts = b.parts.length
    ? b.parts.map(p=>row((p.emoji?esc(p.emoji)+' ':'')+esc(p.name), fmtAmt(p.amount))).join('')
    : `<div class="row hint" style="min-height:0">Noch nichts zugeordnet.</div>`;
  const items = varItemStatus(st, st.settings.currentMonthId).filter(it=>it.amount>0);
  const itemsHtml = items.length ? `<div class="rsub" style="margin-top:8px;opacity:.75">Variable Posten dieses Geldmonats</div>`
    + items.map(it=>`<div class="row" style="min-height:0;padding:3px 2px">
        <div class="rsub">${esc(it.name)}${it.paid>0?' · '+fmtAmt(it.paid)+' aus Topf bezahlt':''}</div>
        <div class="num amt">${fmtAmt(it.amount)}</div></div>`).join('') : '';
  const open = varReserveQuickItem(st, st.settings.currentMonthId);
  const openHtml = (open && open.amount>0) ? `<div class="warnbox mt1">Noch <b>${fmtMoney(open.amount)}</b> nicht zurückgelegt — als Schnellaktion «Variable Kosten (Rücklage)» offen.</div>` : '';
  return `<div class="card mt2">
    <div class="rname">Aufteilung im Topf «${esc(b.pot.name)}»</div>
    <div class="rsub" style="margin:2px 0 6px;opacity:.75;white-space:normal">Saldo ${fmtMoney(b.pot.balance)}. Die Teile sind gerechnet (aus Rücklagen &amp; Verlauf), kein zweites Konto.</div>
    ${parts}
    ${row('<b>frei</b>', b.rest>0?fmtAmt(b.rest):b.rest<0?fmtAmt(b.rest)+' (ungedeckt)':fmtAmt(0), b.rest<0?'neg':'')}
    ${itemsHtml}
    ${openHtml}</div>`;
}
function accRow(a, indent, quick, chevPad){
  const sub = [a.bank, KIND_LABELS[a.kind]].filter(Boolean).join(' · ');
  const left = `<span class="emoji">${esc(a.emoji)||'▪︎'}</span>
      <div style="min-width:0"><div class="rname">${esc(a.name)}</div><div class="rsub">${esc(sub)}</div>${potTrackerLine(a.id)}</div>`;
  const amt = `<span class="num amt ${a.balance<0?'neg':''}">${fmtMoney(a.balance)}</span>`;
  if(!quick){
    return `<button class="row tap ${indent?'indent':''}" onclick="openAccountForm('${a.id}')">
      <div class="rl">${left}</div>${amt}</button>`;
  }
  /* Quick-Variante (SPEC 2.18): antippbar zum Bearbeiten + kleines +/− */
  const canWithdraw = a.kind!=='creditcard';
  return `<div class="row ${indent?'indent':''}">
    ${chevPad?'<span class="chev" aria-hidden="true"></span>':''}
    <button class="rowmain" onclick="openAccountForm('${a.id}')">${left}</button>
    <div class="rowq">${amt}
      ${canWithdraw?`<button class="qadj" aria-label="Entnehmen" onclick="openQuickAdjust('account','${a.id}',-1)">−</button>`:''}
      <button class="qadj" aria-label="Einzahlen" onclick="openQuickAdjust('account','${a.id}',1)">＋</button>
    </div></div>`;
}

/* ─────────── Home: feste, kuratierte Kontoblatt-Seite (SPEC 2.14, N1) ───────────
   Kein Raster, kein Drag & Drop, keine Karten: ein vertikaler Fluss voll-breiter
   Abschnitte in fester Reihenfolge. Die Bänder liegen nie zwei nebeneinander →
   strukturell keine Löcher. homeLayout bleibt im Schema (Migration/Export/Import/
   Merge/Diff), wird hier aber nicht mehr gelesen; die frühere Blockkonfiguration
   (Drag & Drop, ▲▼, Voll/Halb, An/Aus, «Home anpassen») ist entfallen. */
function rHome(){
  /* Status-Band + kritische Warnung immer zuoberst, ausserhalb der Abschnitts-
     folge (SPEC 2.14/2.38: nicht ausblendbar, nicht verschiebbar). Danach die
     feste Reihenfolge: Hero (Gesamtvermögen + Rest/Frei/Lohn) → Heute zu tun →
     Vermögensverlauf → Dieser Monat & Jahr → Konten & Spaces → Verlauf. Jeder
     Abschnitt läuft voll breit — nie zwei ungleich hohe Boxen nebeneinander. */
  return blockStatusBand()
    + blockHero()
    + blockToday()
    + blockWealthChart()
    + blockMonthYear()
    + blockAccounts()
    + blockLedger();
}
/* DnD-Handler + hgSpans/hgWrap entfernt (N1): das Home ist eine feste
   Band-Seite ohne Raster. homeLayoutMoveTo bleibt als pure Schema-Funktion
   (Selbst-Checks/Kompatibilität), wird aber vom Home nicht mehr aufgerufen. */
/* Backup-Nudge + «Kommt bald» (E7) werden seit U3 im «Heute zu tun»-Block
   gerendert (blockToday, Abschnitte 5/6) — hier lebt nur noch der 1-Tap-Export. */
function quickBackup(){ downloadExport('kontoblatt-backup'); render(); showToast('Backup heruntergeladen'); }
/* N1 — Hero: Gesamtvermögen dominant (oberste Typo-Stufe, tabellarische Ziffern),
   darunter eine Haarlinie und die Kennzahl-Reihe «Rest zum Ausgeben · Frei pro
   Tag · Nächster Lohn». Vereint den früheren Gesamtvermögen-Anker und den
   Rest-Hero (blockRest); alle Zahlen aus restToSpend/dailyBudget — keine neue
   Rechnung. «Rest» behält die gepunktete Herkunfts-Marke (→ openRestSheet). */
function statCell(k, v, cls, q, onclick, prov){
  const inner = `<span class="sk">${esc(k)}</span><span class="sv ${cls||''}${prov?' prov':''}">${v}</span>${q?`<span class="sq">${esc(q)}</span>`:''}`;
  return onclick ? `<button class="statcell tap" onclick="${onclick}">${inner}</button>`
                 : `<div class="statcell">${inner}</div>`;
}
function blockHero(){
  const total = round2(S.accounts.reduce((s,a)=>s+a.balance,0));
  const n = S.accounts.length;
  const r = restToSpend(S);
  const db = dailyBudget(S, today());
  let cells = '';
  if(r){
    /* N16: die Kennzahl selbst bleibt der Rest bis auf null — nur die
       Qualifikation darunter nennt den Betrag, der bis zur Notlinie wirklich
       noch weg darf (Leben eingeschlossen). Reines Readout von r.free; ohne
       gesetzte Schwelle (min 0) wäre es dieselbe Zahl doppelt → dann nichts. */
    const restQ = r.min>0
      ? (r.free>=0 ? 'frei bis Minimum '+fmtAmt(r.free) : fmtAmt(-r.free)+' unter Minimum')
      : null;
    cells += statCell('Rest zum Ausgeben', fmtAmt(r.rest), r.rest<0?'neg':'', restQ, 'openRestSheet()', true);
    if(db && db.days!=null){
      /* N11: die Qualifikation nennt jetzt die Quelle der Zahl (Leben-Budget),
         nicht mehr das geschützte Minimum — die Kennzahl kennt es nicht mehr. */
      const dbQ = db.noBudget ? 'kein Budget-Posten'
                : db.warn     ? 'Budget aufgebraucht'
                : 'aus '+(db.name||'Budget')+' '+fmtAmt(db.budget);
      if(db.days>0){
        cells += statCell('Frei pro Tag', db.perDay!=null ? '~'+fmtAmt(db.perDay) : '—',
          db.warn?'neg':'', dbQ, 'openLivingSheet()', false);
        cells += statCell('Nächster Lohn', 'in '+db.days+' Tg.', '', 'bis Lohntag', null, false);
      } else if(db.days===0){
        cells += statCell('Frei pro Tag', db.perDay!=null ? '~'+fmtAmt(db.perDay) : '—', db.warn?'neg':'', dbQ, 'openLivingSheet()', false);
        cells += statCell('Nächster Lohn', 'heute', '', 'Lohntag', null, false);
      } else {
        cells += statCell('Frei pro Tag', '—', 'neg', dbQ, 'openLivingSheet()', false);
        cells += statCell('Lohn überfällig', (-db.days)+' Tg.', 'neg', null, null, false);
      }
    }
  }
  /* Kontext-Warnungen des Rests (aus blockRest übernommen — nichts geht verloren) */
  const month = monthById(S, S.settings.currentMonthId);
  const warnHtml = (r && r.warn==='negative')
    ? `<div class="warnbox strong">Offene Verpflichtungen übersteigen das Hauptkonto um <b>${fmtMoney(-r.rest)}</b>.</div>`
    : (r && r.warn==='low')
    ? `<div class="warnbox">Unter deiner Warnschwelle von ${fmtMoney(r.min)}.</div>` : '';
  const dbWarn = (db && db.warn && db.days!=null && db.days>0)
    ? `<div class="warnbox">${esc(db.name||'Leben')}-Budget aufgebraucht — ${fmtMoney(db.spent)} von ${fmtMoney(db.budget)} ausgegeben, noch ${db.days} Tag${db.days>1?'e':''} bis zum Lohn.</div>` : '';
  const noMain = !r ? `<div class="hint mt1">Kein Hauptkonto vorhanden — unter «Konten» ein Konto der Art «Hauptkonto» anlegen.</div>` : '';
  const noMonth = (r && !month) ? '<div class="warnbox">Der aktuelle Monat ist noch nicht angelegt — unter «Monate» anlegen.</div>' : '';
  return `<section class="home-hero">
    <span class="lbl">Gesamtvermögen · ${n} ${n===1?'Konto':'Konten'}</span>
    <div class="hero-total num ${total<0?'neg':''}">${fmtMoney(total)}</div>
    ${cells?`<hr class="hero-rule"><div class="statrow">${cells}</div>`:''}
    ${noMain}${noMonth}${dbWarn}${warnHtml}
  </section>`;
}

/* Seitenleisten-Cockpit (E5, SPEC 2.34): volles Cockpit auf ALLEN Ansichten —
   Gesamtvermögen · Rest · ~/Tag · Heute zu tun (immer, auch bei 0) · Monat mini.
   Auf Home bewusst doppelt zu Anker/Hero (das Panel ist auf allen anderen
   Ansichten das einzige Cockpit). Nur Readouts bestehender Fns. Desktop-only. */
function sideInfoPanel(){
  if(!S || !S.setupComplete) return '';
  const total = round2(S.accounts.reduce((s,a)=>s+a.balance,0));
  const r = restToSpend(S);
  const db = dailyBudget(S, today());
  const m = monthById(S, S.settings.currentMonthId);
  /* U3.2: identischer Zähler wie der «Heute zu tun»-Blocktitel — zählt nur
     die im Block sichtbaren offenen Punkte (nach De-Dup, nie mehr als dort). */
  const nOpen = todayOpenCount(S), nNew = todayNewCount(S);
  /* Hero = leises Label über grossem Wert; Kompaktzeile = Label links, Wert
     (+ optionale leise Qualifikation wie «geschätzt») rechts. */
  const hero = (k,v,cls,onclick)=>`<button class="si-hero" onclick="${onclick}"><span class="si-hk">${k}</span><span class="si-hv num prov ${cls||''}">${v}</span></button>`;
  const row = (k,v,cls,q,onclick)=>`<button class="si-row" onclick="${onclick}"><span class="si-k">${k}</span><span class="si-rt"><span class="si-v num prov ${cls||''}">${v}</span>${q?`<span class="si-q">${esc(q)}</span>`:''}</span></button>`;
  let html = `<div id="sideinfo"><span class="si-lbl">Überblick</span>`;
  html += hero('Gesamtvermögen', fmtMoney(total), total<0?'neg':'', "goView('konten')");
  if(r) html += hero('Rest zum Ausgeben', fmtMoney(r.rest), r.warn?'neg':'', "goView('home')");
  /* N16: dieselbe Zusatzzahl wie im Hero — das Panel ist auf allen Ansichten
     ausser Home das einzige Cockpit, dort darf der Rest nicht ohne seine
     Notlinie stehen. Reines Readout, gleiche Formulierung wie im Hero. */
  if(r && r.min>0) html += `<div class="si-note${r.free<0?' warn':''}">${r.free>=0
    ? 'noch '+fmtAmt(r.free)+' frei bis zum Minimum von '+fmtAmt(r.min)
    : fmtAmt(-r.free)+' unter dem Minimum von '+fmtAmt(r.min)}</div>`;
  if(db && db.days!=null && db.days>0){
    const bl = (db.name||'Leben')+'-Budget';
    html += db.perDay!=null
      ? `<div class="si-note">~${fmtAmt(db.perDay)}/Tag aus ${esc(bl)} (${fmtAmt(db.budget)}) · Lohn in ${db.days} Tag${db.days>1?'en':''}</div>`
      : db.noBudget
      ? `<div class="si-note">Kein Budget-Posten im Monat — «Frei pro Tag» braucht einen Fix-Posten ohne Verknüpfung</div>`
      : `<div class="si-note warn">${esc(bl)} aufgebraucht (${fmtAmt(db.spent)} von ${fmtAmt(db.budget)}) — noch ${db.days} Tg. bis Lohn</div>`;
  }
  /* «Heute zu tun» ist ein Text-Zähler (kein Geldbetrag) → ohne num/prov */
  html += `<button class="si-row" onclick="goView('home')"><span class="si-k">Heute zu tun</span><span class="si-rt"><span class="si-v">${nOpen} offen</span>${nNew?`<span class="si-q">${nNew} neu</span>`:''}</span></button>`;
  if(m){
    const inc = monthIncome(S,m), exp = monthExpenses(S,m), sal = round2(inc.amount-exp.amount);
    html += `<span class="si-lbl">Aktueller Monat · ${esc(m.name)}</span>`
      + row('Lohn', fmtAmt(inc.amount), 'pos', inc.label, `openMonth('${m.id}')`)
      + row('Ausgaben', fmtAmt(exp.amount), 'neg', exp.label, `openMonth('${m.id}')`)
      + row('Monats-Saldo', fmtAmt(sal), sal<0?'neg':'pos', null, `openMonth('${m.id}')`);
  }
  return html + `</div>`;
}

/* Home-Konfiguration entfällt mit N1: Reihenfolge/Sichtbarkeit/Breite sind fest
   kuratiert (kein Drag & Drop, kein ▲▼/Voll-Halb/An-Aus, kein «Home anpassen»-
   Sheet). homeLayout bleibt im Schema; homeLayoutMove/Toggle/WideToggle bleiben
   als pure, testgeprüfte Schema-Funktionen bestehen (nur von der UI nicht mehr
   aufgerufen). BLOCK_LABELS bleibt für Migration/Kompatibilität erhalten. */

/* ─────────── Liquiditäts-Chart: Planmonate gestrichelt, antippbar ─────────── */
/* N1 — Vermögensverlauf: EIN Abschnitt, EIN Zeitstrahl (Monatslabels nur einmal
   unten), zwei übereinanderliegende Spuren mit je EIGENER Y-Skala. Löst das
   Skalen-Problem der gemeinsamen Achse (Gesamtvermögen vier-/fünfstellig,
   Hauptkonto/Minimum dreistellig — auf einer Achse verschwindet die Prognose).
   Spur 1 (~60 %): Gesamtvermögen (netWorthSeries), solid bis aktueller Monat,
   gestrichelt für Planmonate. Spur 2 (~40 %): Hauptkonto-Prognose (forecast(),
   gestrichelt) + Minimum-Linie (Warnfarbe) + Ring auf firstBelowId. Rechnung
   unverändert: netWorthSeries + forecast(); der Ausblick-Chart bleibt separat.

   N1-FIX — VOLLE BANDBREITE OHNE SCHRIFT-VERZERRUNG: Die viewBox-Breite ist NICHT
   mehr fix (560), sondern an die tatsächliche Renderbreite gekoppelt — dann bleibt
   der Skalierungsfaktor (Renderbreite ÷ viewBox-Breite) bei ~1 und die 10.5–12-px-
   Schrift behält echte px bei JEDER Bandbreite (375/960/1280/1600). wealthChartSvg(W)
   ist rein: nur W ändert die Geometrie (X-Skala läuft bis W−padR, Höhe H bleibt fix).
   blockWealthChart() baut mit einer Schätzung (isDesktopInput-Muster), fitWealthChart()
   misst nach dem Mount die echte Containerbreite und zeichnet die SVG scale-1 neu —
   kein max-width-Hack, keine Linksbündigkeit mehr, voll breit wie jeder Abschnitt.
   Datenquelle unverändert (netWorthSeries + forecast()). */
function blockWealthChart(){
  const W0 = (typeof isDesktopInput==='function' && isDesktopInput()) ? 1000 : 560;
  const svg = wealthChartSvg(W0);
  if(!svg) return '';   /* < 2 Vermögenspunkte: Abschnitt entfällt (wie bisher) */
  const f = forecast(S);
  const status = (f && f.firstBelowId)
    ? `<div class="warnbox">Hauptkonto fällt in <b>${esc(monthLabel(f.firstBelowId))}</b> unter das Minimum von ${fmtMoney(f.minAtFirstBelow)}${f.minUniform==null?' (Warnschwelle dieses Monats)':''}.</div>`
    : (f ? `<div class="hint mt1">Hauptkonto bleibt im Ausblick über ${f.minUniform!=null?'deinem Minimum von '+fmtMoney(f.minUniform):'der Warnschwelle jedes Monats'}.</div>` : '');
  /* N15: die Bildunterschrift sprach bisher NUR über den Ausblick — mit der
     rückgerechneten Vergangenheit war das vertretbar. Jetzt zeigt der Chart
     AUFGEZEICHNETE Unterschreitungen mit rotem Ring, und ein «bleibt über
     deinem Minimum» direkt darunter widerspräche einer echten Beobachtung.
     Reine Anzeige: liest dieselbe Liste, die die Ringe setzt (mainHistSeries),
     rechnet nichts. Vergangenheit zuerst — der Chart liest sich links→rechts. */
  const histLow = mainHistSeries(S).filter(r=>r.mainEnd < r.min);
  const last = histLow[histLow.length-1];
  const histTxt = !histLow.length ? '' : `<div class="warnbox">Aufgezeichnet: Hauptkonto lag ${
      histLow.length===1
        ? `Ende <b>${esc(monthLabel(last.id))}</b> bei ${fmtMoney(last.mainEnd)} — unter der damals geltenden Schwelle von ${fmtMoney(last.min)}`
        : `in <b>${histLow.length} abgeschlossenen Monaten</b> unter der jeweils geltenden Schwelle, zuletzt Ende ${esc(monthLabel(last.id))} bei ${fmtMoney(last.mainEnd)}`
    }.</div>`;
  return `<section><span class="lbl sec">Vermögensverlauf${glossBtn('minimum')}</span>
    <div class="home-chart" id="wealthchart" data-cw="${W0}">${svg}</div>
    ${histTxt}${status}
    <div class="hint mt1">Zwei Spuren, ein Zeitstrahl — je eigene Skala. Gestrichelt = Projektion (dieselben Zahlen wie Engpass-Karte &amp; Ausblick). Punkt antippen für die Herkunft. <button class="linkbtn" style="padding:0;font-size:inherit" onclick="goView('forecast')">Zum Ausblick ›</button></div>
  </section>`;
}
/* fitWealthChart (N1-FIX): nach dem Mount die echte Containerbreite messen und die
   SVG mit W = Containerbreite neu zeichnen → viewBox-Breite == Renderbreite ⇒
   Skalierungsfaktor exakt 1 ⇒ Schrift in echten px, bei jeder Bandbreite gleich
   gross und lesbar. Idempotent (data-cw merkt sich die zuletzt gezeichnete Breite;
   nur bei echter Abweichung wird neu gezeichnet). Headless/ohne Layout: no-op. */
/* N3.2: Chart-Hover-Readout. Nur schneller Blick — Klick/Tap bleibt das Herkunfts-
   Sheet, Handy hat kein Hover. Der Inhalt (data-tip) wird beim SVG-Bau aus DENSELBEN
   Funktionswerten (netWorthSeries/forecast()) formatiert — keine zweite Rechnung.
   Positionierung an clientX/Y mit Viewport-Klemmung ⇒ nie an den Chart-Rändern
   (erster/letzter Punkt) abgeschnitten. */
function chartTipShow(evt, el){
  const box = (typeof document!=='undefined') && document.getElementById('charttip');
  if(!box) return;
  box.innerHTML = (el.getAttribute('data-tip')||'').split('§').map((s,i)=>
    i===0 ? '<b>'+s+'</b>'
          : '<span class="ctl'+(s.charAt(0)==='!'?' warnv':'')+'">'+(s.charAt(0)==='!'?s.slice(1):s)+'</span>'
  ).join('');
  box.hidden = false;
  chartTipMove(evt);
  requestAnimationFrame(()=>box.classList.add('show'));
}
function chartTipMove(evt){
  const box = (typeof document!=='undefined') && document.getElementById('charttip');
  if(!box || box.hidden) return;
  const pad = 12, w = box.offsetWidth, h = box.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = evt.clientX + 14, y = evt.clientY - h - 12;
  if(x + w + pad > vw) x = evt.clientX - w - 14;   /* rechter Rand → links vom Cursor */
  if(x < pad) x = pad;
  if(y < pad) y = evt.clientY + 18;                /* oberer Rand → unter den Cursor */
  if(y + h + pad > vh) y = vh - h - pad;
  box.style.left = x + 'px'; box.style.top = y + 'px';
}
function chartTipHide(){
  const box = (typeof document!=='undefined') && document.getElementById('charttip');
  if(box){ box.classList.remove('show'); box.hidden = true; }
}
/* Readout-Text aus bestehenden Werten (keine neue Rechnung): Zeile 1 fett = Monat,
   dann je « · »-getrennte Zeilen; ein führendes «!» markiert die Warn-Zeile (unter
   Minimum). Für die Attribut-Einbettung neutralisiert (kein «, ', <, >). */
function tipText(parts){ return parts.join('§').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mainVsMin(val, min){
  const d = round2(val - min);
  return d>=0 ? fmtAmt(d)+' über Minimum' : '!'+fmtAmt(-d)+' unter Minimum';
}
/* N4-Ergänzungen des Readouts — AUSSCHLIESSLICH aus Werten, die der Tooltip
   ohnehin schon trägt; keine neue Rechnung, keine zweite Quelle.
   · tipDelta: Differenz zweier benachbarter Punkte DERSELBEN Serie. Erster
     Punkt (prev == null) → kein Δ (die Zeile entfällt ganz).
   · tipQual: das Wort zur Linienart, die der Chart schon zeichnet (durchgezogen
     vs. gestrichelt). Reines Mapping des Monats-status, den der Punkt bereits
     trägt — NIE ein zweiter Blick in monthIncome o.ä.
     done = abgeschlossener Monat (aus Buchungen) · curr = laufend, enthält noch
     Ausstehendes · plan = gestrichelte Projektion. Vokabular wie im Glossar.
     N5: `track` unterscheidet die beiden Spuren im laufenden Monat. Vermögens-Spur
     (track 'worth') = Summe echter Kontostände ⇒ «aktuell», nicht «geschätzt» (nichts
     ist geschätzt) und nicht «effektiv» (der Monat läuft noch). Prognose-Spur ohne
     track = weiterhin «geschätzt» — dort IST der Monatsendwert eine Projektion.
     done/plan sind in beiden Spuren gleich. */
function tipDelta(val, prev){
  if(prev==null || val==null) return null;
  const d = round2(val - prev);
  return (d>0?'+':'') + fmtAmt(d) + ' zum Vormonat';
}
function tipQual(status, track){ return status==='plan' ? 'geplant' : (status==='curr' ? (track==='worth' ? 'aktuell' : 'geschätzt') : 'effektiv'); }
function fitWealthChart(){
  if(typeof document==='undefined') return;
  const c = document.getElementById('wealthchart');
  if(!c) return;
  const w = Math.round(c.clientWidth);
  if(!(w>0)) return;   /* verborgen / noch kein Layout → Schätzung stehen lassen */
  if(Math.abs(w - (+c.dataset.cw||0)) <= 2) return;
  const svg = wealthChartSvg(w);
  if(svg){ c.dataset.cw = w; c.innerHTML = svg; }
}
/* ─────────── N9: Minimum-Linie als STUFE (beide Charts, eine Mechanik) ───────────
   Jeder Monat trägt seine eigene Schwelle (forecast().rows[].min), also ist die
   Linie keine Gerade mehr, sondern eine Treppe: pro Punkt ein waagrechtes Stück
   von der Mitte zum Vorgänger bis zur Mitte zum Nachfolger (Ränder bis an den
   Plot-Rand), an jedem Wechsel ein senkrechter Verbinder. Gleiche Nachbarwerte
   werden zu EINEM Lauf zusammengefasst ⇒ im Normalfall (eine Schwelle für alle)
   entsteht exakt die bisherige durchgehende Linie, Pixel für Pixel.
   REINE ZEICHNUNG: kein Wert wird hier gerechnet, nur `min` je Zeile gelesen. */
function minStepRuns(pts, xL, xR){
  const runs = [];
  pts.forEach((p,i)=>{
    const x0 = i===0 ? xL : (pts[i-1].x + p.x)/2;
    const x1 = i===pts.length-1 ? xR : (p.x + pts[i+1].x)/2;
    const last = runs[runs.length-1];
    if(last && last.min===p.min) last.x1 = x1;
    else runs.push({min:p.min, x0, x1});
  });
  return runs;
}
function minStepPath(runs, Y){
  let out = '';
  runs.forEach((r,i)=>{
    const y = Y(r.min);
    out += `<line x1="${r.x0.toFixed(1)}" y1="${y.toFixed(1)}" x2="${r.x1.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    if(i>0) out += `<line x1="${r.x0.toFixed(1)}" y1="${Y(runs[i-1].min).toFixed(1)}" x2="${r.x0.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75"/>`;
  });
  return out;
}
function minAriaLabel(runs){
  return runs.length===1 ? 'mit Minimum-Linie bei '+fmtTick(runs[0].min)
    : 'mit gestufter Minimum-Linie ('+runs.map(r=>fmtTick(r.min)).join(', ')+')';
}
/* ─────────── N15: die Vergangenheit von Spur 2 ist AUFGEZEICHNET (SPEC 2.54) ───────────
   N14 hatte die Vergangenheit aus liquiditySeries zurückgerechnet. Das war
   Fiktion: `liq` ist Lohn − Ausgaben des HAUSHALTS, nicht die Bewegung des
   Hauptkontos — Transfers in Spaces/Töpfe sind darin neutral, obwohl sie echte
   Abflüsse vom Hauptkonto sind. Die Kurve lag darum systematisch zu hoch und
   trug (Abstand zu Spur 1 konstant) gar keine eigene Information. Sie ist
   ersatzlos entfernt.

   Statt zu rechnen wird jetzt AUFGEZEICHNET: `state.mainSnapshots[monthId]` ist
   der echte Saldo, den der Cutover beim Abschluss dieses Monats festgehalten
   hat (recordMainSnapshot). Diese Funktion liest ihn nur — sie leitet nichts
   ab, sie ergänzt nichts, sie schätzt nichts.

   Drei Filter, alle aus demselben Grundsatz «kein Punkt statt falscher Punkt»:
   · nur Monate VOR dem laufenden — ab dort zeichnet forecast(), das ist die
     Naht (kein Doppelpunkt, keine Lücke);
   · nur Monate, die es in state.months noch gibt — sonst fehlen Name/Jahr
     und die x-Position auf dem gemeinsamen Zeitstrahl;
   · Monate ohne Aufzeichnung liefern GAR NICHTS. Bestandsstände starten
     deshalb leer und füllen sich vorwärts, Cutover für Cutover.

   `status:'done'` wird bewusst gesetzt statt aus dem Monat gelesen: ein
   aufgezeichneter Saldo IST eine effektive Tatsache, auch wenn der Monat im
   Modell (etwa nach manuellem Zurückstellen) noch 'plan' heisst. Davon hängen
   Readout-Wort («effektiv») und Linienart (durchgezogen) ab.
   `min` kommt aus effectiveMinimum — dieselbe einzige Quelle wie
   forecast().rows[].min, damit die Minimum-Linie über Vergangenheit UND
   Zukunft derselben Regel folgt und automatisch mitzieht, wenn diese Regel
   je erweitert wird. */
function mainHistSeries(state){
  const snaps = (state.mainSnapshots && typeof state.mainSnapshots==='object') ? state.mainSnapshots : {};
  const cur = state.settings.currentMonthId;
  return state.months
    .filter(m => m.id < cur && Object.prototype.hasOwnProperty.call(snaps, m.id))
    .map(m => ({id:m.id, name:m.name, year:m.year, status:'done',
                min:effectiveMinimum(state, m.id), mainEnd:snaps[m.id], hist:true}))
    .sort((a,b)=>a.id<b.id?-1:1);
}
function wealthChartSvg(W){
  const nwAll = netWorthSeries(S);
  if(nwAll.length<2) return '';
  const nw = nwAll.slice(-12);
  const n = nw.length;
  const idx = {}; nw.forEach((p,i)=>idx[p.id]=i);
  const f = forecast(S);
  const fRows = (f && f.rows) ? f.rows.filter(r=>r.mainEnd!=null && idx[r.id]!=null).map(r=>Object.assign({hist:false}, r)) : [];
  /* N15: die Vergangenheit sind AUFGEZEICHNETE Stände (mainHistSeries), die
     Zukunft kommt unverändert aus forecast(). Beide Mengen sind disjunkt —
     mainHistSeries endet vor dem laufenden Monat, forecast() beginnt dort:
     die Naht braucht keinen Anker und kann keinen Doppelpunkt erzeugen.
     Ohne Aufzeichnungen bleibt exakt das Verhalten vor N14 übrig (Spur beginnt
     am laufenden Monat); das ist bei Bestandsständen der Normalfall. */
  const histRows = mainHistSeries(S).filter(r=>idx[r.id]!=null);
  const mRows = histRows.concat(fRows).sort((a,b)=>idx[a.id]-idx[b.id]);
  const hasF = mRows.length>=2;

  const padL=20, padR=20, top=16, bottom=28, gap=18;
  /* Spur 2 trägt Vergangenheit UND Prognose auf EINER Skala — die Spanne ist
     damit deutlich grösser als früher (nur Ausblick). Mit den alten 60 px wurde
     ein vergangenes Tief von ein paar hundert Franken zu zwei, drei Pixeln und
     war neben der Minimum-Linie nicht mehr als Unterschreitung lesbar (an
     375 px gar nicht). 88 px geben der Spur die Auflösung zurück; Spur 1 (t1H)
     bleibt unangetastet. Gilt unter N15 unverändert: die Vergangenheit ist
     jetzt aufgezeichnet statt gerechnet, die Spanne bleibt dieselbe. */
  const t1H=94, t2H = hasF?88:0;
  const H = top + t1H + (hasF?gap+t2H:0) + bottom;
  const plotW = W - padL - padR;
  const X = i => n===1 ? W/2 : padL + (i/(n-1))*plotW;

  /* ── Spur 1: Gesamtvermögen ── */
  const wVals = nw.map(p=>p.worth);
  let w1=Math.max.apply(null,wVals), w0=Math.min.apply(null,wVals);
  if(w1===w0){ w1+=100; w0-=100; } else { const s=(w1-w0)*0.12; w1+=s; w0-=s; }
  const Y1 = v => top + (w1-v)/(w1-w0)*t1H;
  const p1 = nw.map((p,i)=>({x:X(i), y:Y1(p.worth), p}));
  const fp = nw.findIndex(p=>p.status==='plan');
  /* N3.3: Spur 1 (Gesamtvermögen) segmentweise semantisch — steigend pos, fallend
     neg. Keine Minimum-Linie hier ⇒ keine Kollision mit der Warnfarbe. Richtung ist
     zusätzlich aus der Geometrie ablesbar; im Farbschwäche-Modus einfarbig Amber. */
  const cbMode = !!(S.settings && S.settings.colorBlindMode);
  let line1html = '';
  for(let i=1;i<n;i++){
    const a=p1[i-1], b=p1[i];
    const dashed = fp>=0 && i>=fp;   /* Plan-Segmente bleiben gestrichelt (unverändert) */
    const col = cbMode ? 'var(--acc)' : (b.p.worth>=a.p.worth ? 'var(--pos)' : 'var(--neg)');
    line1html += `<path d="M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="2"${dashed?' stroke-dasharray="4 3" opacity="0.85"':''}/>`;
  }
  const dots1 = p1.map((q,i)=>`<g onclick="openNetWorthSheet('${q.p.id}')" style="cursor:pointer" data-tip="${tipText([q.p.name+' '+q.p.year+' · '+tipQual(q.p.status,'worth'), 'Gesamtvermögen '+fmtMoney(q.p.worth), tipDelta(q.p.worth, i>0?nw[i-1].worth:null)].filter(Boolean))}" onmouseenter="chartTipShow(event,this)" onmousemove="chartTipMove(event)" onmouseleave="chartTipHide()">
      <rect x="${(q.x-16).toFixed(1)}" y="${(top-6).toFixed(1)}" width="32" height="${(t1H+12).toFixed(1)}" fill="transparent"/>
      <circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${q.p.status==='curr'?4:3}" fill="${q.p.status==='plan'?'var(--card)':'var(--acc)'}" stroke="var(--acc)" stroke-width="1.5"/>
      ${q.p.status==='curr'?`<text x="${q.x.toFixed(1)}" y="${(q.y-8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${fmtAmt(q.p.worth)}</text>`:''}
    </g>`).join('');
  const t1lab = `<text x="${padL}" y="${(top-4).toFixed(1)}" font-size="10.5" font-weight="700" fill="var(--mut)" letter-spacing=".05em">GESAMTVERMÖGEN</text>`;

  /* ── Spur 2: Hauptkonto — Ist (Vergangenheit + laufender Monat) + Prognose,
        mit Minimum-Linie (eigene Skala) ── */
  let track2='', t2lab='';
  if(hasF){
    const mVals = mRows.map(r=>r.mainEnd).concat(mRows.map(r=>r.min));
    let m1=Math.max.apply(null,mVals), m0=Math.min.apply(null,mVals);
    const span=(m1-m0)||1; m1+=span*0.16; m0-=span*0.16;
    const base = top+t1H+gap;
    const Y2 = v => base + (m1-v)/(m1-m0)*t2H;
    const p2 = mRows.map(r=>({x:X(idx[r.id]), y:Y2(r.mainEnd), r}));
    /* N3.3: Minimum-Linie in Warnrot (--neg) — die kritische Schwelle. Hebt sich
       klar von der amberfarbenen Hauptkonto-Spur ab; Rot bleibt der Warnung
       vorbehalten (Linie + firstBelowId-Ring/-Wert), nie den Alltags-Punkten.
       N9: pro Monat eine eigene Schwelle ⇒ Stufenlinie, jeder Lauf beschriftet. */
    const minRuns = minStepRuns(mRows.map((r,k)=>({x:p2[k].x, min:r.min})), padL, W-padR);
    const curveY2At = x => {
      for(let i=1;i<p2.length;i++){
        if(x<=p2[i].x){ const a=p2[i-1], b=p2[i];
          return a.y + (b.y-a.y)*((x-a.x)/((b.x-a.x)||1)); }
      }
      return p2[p2.length-1].y;
    };
    /* Beschriftung des Minimum-Laufs (N14, unter N15 unverändert gültig). Bisher
       sass sie fest am linken Rand des Laufs — das ging, solange links vom
       laufenden Monat nichts war. Jetzt
       beginnt die Kurve dort und lief quer durch die Schrift («Minimum 600»
       durchgestrichen, an 375 px unlesbar). Neu wird innerhalb des Laufs die
       Stelle gesucht, an der die Kurve über die GANZE Textbreite am weitesten
       weg ist; die Seite (über/unter der Linie) entscheidet wie bisher die
       Kurve. Reine Platzierung — der Wert und die Linie selbst ändern sich nicht. */
    const gapOver = (x0, x1, y) => {
      let g = Infinity;
      for(let t=0;t<=6;t++){ const x = x0 + (x1-x0)*(t/6); g = Math.min(g, Math.abs(y - curveY2At(x))); }
      return g;
    };
    const runY = minRuns.map(r=>Y2(r.min));
    const minLine = minStepPath(minRuns, Y2)
      + minRuns.map((r,k)=>{
          const txt = (k===0?'Minimum ':'') + fmtTick(r.min);
          /* Breite aus dem ECHTEN Text statt fester Konstante: «Minimum 1'200»
             misst ~85 px und ragte mit der alten 78 genau über die Stufenkante
             hinaus — die Kollisionsprüfung unten sah die Überlappung deshalb
             nicht. Nie schmaler als die bisherigen Werte, damit sich an
             bestehenden Platzierungen nichts zum Schlechteren ändert. */
          const y = runY[k], tw = Math.max(k===0 ? 78 : 40, txt.length*6.4);
          const xL = r.x0+2, xR = Math.max(xL, Math.min(r.x1-tw, W-padR-tw));
          let x = xL, best = -1;
          for(let t=0;t<=8;t++){
            const cx = xL + (xR-xL)*(t/8), g = gapOver(cx, cx+tw, y);
            if(g > best){ best = g; x = cx; }
          }
          /* N15: die Beschriftung muss nicht nur der KURVE ausweichen, sondern
             auch den NACHBARLÄUFEN der eigenen Stufenlinie. Aufgefallen an
             einem echten Screenshot: liegen zwei Schwellen nur wenige Pixel
             auseinander (600 und 1'200 auf einer Skala, die bis 4'750 reicht,
             sind ~9 px), dann strich der 600er-Lauf quer durch «Minimum 1'200».
             Ein Lauf zählt nur, wenn er die Textbox auch waagrecht überlappt.
             Reine Platzierung — Wert, Höhe und Verlauf der Linien bleiben. */
          const hitsRun = yy => minRuns.some((o,j)=> j!==k && o.x1 > x-8 && o.x0 < x+tw+8 && Math.abs(runY[j]-yy) < 9);
          /* wie im Ausblick-Chart: auf die kurvenfreie Seite der Linie */
          let yy = (y <= curveY2At(x+tw/2)) ? y-4 : y+13;
          if(hitsRun(yy) && !hitsRun(yy===y-4 ? y+13 : y-4)) yy = (yy===y-4) ? y+13 : y-4;
          if(yy<base+9) yy = y+13; else if(yy>base+t2H) yy = y-4;
          return `<text x="${x.toFixed(1)}" y="${yy.toFixed(1)}" font-size="11" font-weight="650" fill="var(--neg)">${esc(txt)}</text>`;
        }).join('');
    /* Ist durchgezogen, Prognose gestrichelt — GENAU die Konvention von
       Spur 1 (dort `fp`), keine neue Farbsemantik: die Spur bleibt durchgehend
       Amber, nur die Linienart trennt Ist von Projektion. Segment k ist
       gestrichelt, sobald sein Endpunkt ein Plan-Monat ist ⇒ Vergangenheit und
       laufender Monat solid, ab dem ersten Plan-Monat gestrichelt. Die Naht
       liegt damit auf demselben x wie in Spur 1 — beide Spuren wechseln die
       Linienart an derselben Stelle des gemeinsamen Zeitstrahls. */
    const fp2 = p2.findIndex(q=>q.r.status==='plan');
    let line2 = '';
    for(let k=1;k<p2.length;k++){
      const a=p2[k-1], b=p2[k];
      /* N15 — LÜCKEN BLEIBEN LÜCKEN. Die Vergangenheit ist eine Menge einzelner
         Beobachtungen, keine Kette: fehlt für einen Monat dazwischen eine
         Aufzeichnung (übersprungener Cutover, weil die App wochenlang nicht
         offen war), dann wird auch keine Linie darüber gezogen. Eine Gerade
         von Mai nach September behauptete vier Monatsstände, die niemand
         beobachtet hat — dieselbe Sorte Fiktion, die N15 gerade entfernt.
         Die Prognose ist ausgenommen: ihre Zeilen sind eine echte Kette
         (jede aus der vorherigen gerechnet), dort ist die Verbindung eine
         Aussage, die forecast() deckt. Darum greift die Regel nur, sobald ein
         Ende der Strecke ein aufgezeichneter Punkt ist. */
      if((a.r.hist || b.r.hist) && (idx[b.r.id] - idx[a.r.id]) !== 1) continue;
      const dashed = fp2>=0 && k>=fp2;
      line2 += `<path d="M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="2"${dashed?' stroke-dasharray="4 3" opacity="0.9"':''}/>`;
    }
    /* N3.3: Spur 2 (Hauptkonto) bleibt AMBER. Warnrot AUSSCHLIESSLICH für die
       Minimum-Linie + den firstBelowId-Ring/-Wert — sonst würde Rot zur Alltags-
       farbe und verlöre die kritische Bedeutung. */
    const dots2 = p2.map((q,i)=>{
      const isFirst = !!(f && q.r.id===f.firstBelowId);
      /* Die Unterschreitungs-Markierung greift auch rückwirkend.
         `firstBelowId` (Engpass-Logik in forecast()) bleibt unangetastet — für
         die Zukunft markiert weiterhin GENAU dieser eine Punkt. Zusätzlich
         markiert die Zeichnung jeden VERGANGENEN Punkt, der unter seiner
         eigenen Schwelle liegt; sonst bliebe ein zurückliegendes Tief stumm.
         N15: das trifft jetzt ausschliesslich AUFGEZEICHNETE Punkte — die
         Rückrechnung, auf der diese Markierung unter N14 auch erscheinen
         konnte, gibt es nicht mehr. Kein Ring steht mehr auf einem Wert, den
         die App sich selbst ausgedacht hat. */
      const mark = isFirst || (q.r.hist && q.r.mainEnd < q.r.min);
      /* Die Wertbeschriftung kann auch am ERSTEN Punkt hängen (ein
         Tief ganz links). Zentriert stünde sie dort halb ausserhalb der SVG und
         würde abgeschnitten — darum in die Plotfläche geklemmt. Betrifft
         genauso den letzten Punkt am rechten Rand. */
      const halfW = 5 + fmtTick(q.r.mainEnd).length*3.6;
      const lx = Math.min(Math.max(q.x, padL+halfW), W-padR-halfW);
      const lbl = mark ? `<text x="${lx.toFixed(1)}" y="${(q.y> base+t2H/2 ? q.y-9 : q.y+16).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="750" fill="var(--neg)">${fmtTick(q.r.mainEnd)}</text>` : '';
      /* Vergangene Punkte haben kein Ausblick-Sheet (forecast() kennt sie nicht)
         → Hover-Readout ja, Klick nein. Kein Zeigefinger, der ins Leere führt. */
      const tap = q.r.hist ? '' : ` onclick="openForecastSheet('${q.r.id}')" style="cursor:pointer"`;
      return `<g${tap} data-tip="${tipText([q.r.name+' '+q.r.year+' · '+tipQual(q.r.status), 'Hauptkonto '+fmtMoney(q.r.mainEnd), tipDelta(q.r.mainEnd, i>0?mRows[i-1].mainEnd:null), mainVsMin(q.r.mainEnd, q.r.min)].filter(Boolean))}" onmouseenter="chartTipShow(event,this)" onmousemove="chartTipMove(event)" onmouseleave="chartTipHide()">
        <rect x="${(q.x-16).toFixed(1)}" y="${(base-6).toFixed(1)}" width="32" height="${(t2H+12).toFixed(1)}" fill="transparent"/>
        ${mark?`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="7" fill="none" stroke="var(--neg)" stroke-width="1.5" opacity="0.6"/>`:''}
        <circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${mark?4:3}" fill="${q.r.status==='plan'?'var(--card)':'var(--acc)'}" stroke="var(--acc)" stroke-width="1.5"/>
        ${lbl}
      </g>`;
    }).join('');
    t2lab = `<text x="${padL}" y="${(base-4).toFixed(1)}" font-size="10.5" font-weight="700" fill="var(--mut)" letter-spacing=".05em">HAUPTKONTO · IST + PROGNOSE</text>`;
    track2 = minLine + line2 + dots2;
  }

  /* ── Gemeinsamer Zeitstrahl (Monatslabels nur EINMAL, ganz unten) ── */
  const axisY = H - 9;
  const labels = nw.map((p,i)=>`<text class="provt" x="${X(i).toFixed(1)}" y="${axisY}" text-anchor="middle" font-size="12" fill="var(--mut)"${p.status==='curr'?' font-weight="700"':''}>${esc(p.name.slice(0,3))}</text>`).join('');

  /* Nur die SVG — Titel/Status/Fussnote liegen in blockWealthChart, damit
     fitWealthChart ausschliesslich die Grafik neu zeichnet. viewBox-Breite = W
     (an die Renderbreite gekoppelt), Höhe H fix ⇒ scale-1, echte px. */
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:var(--sp2)" role="img"
        aria-label="Vermögensverlauf: Gesamtvermögen und Hauptkonto (Ist und Prognose) ${hasF?esc(minAriaLabel(minStepRuns(mRows.map(r=>({x:X(idx[r.id]), min:r.min})), padL, W-padR))):'mit Minimum-Linie'}, ein Zeitstrahl, getrennte Skalen">
      ${t1lab}${line1html}${dots1}
      ${t2lab}${track2}
      ${labels}
    </svg>`;
}
/* forecastSubChart + blockNetWorthChart entfernt (N1): beide Home-Kurven sind in
   blockWealthChart (ein Abschnitt, zwei Spuren, ein Zeitstrahl) aufgegangen.
   forecastChartSvg bleibt (Ausblick-Ansicht rForecast); die Herkunfts-Sheets
   openForecastSheet/openNetWorthSheet bleiben unverändert. */

/* ─────────── U5.1: Forecast-Chart — Hauptkonto-Stand mit Minimum-Linie ───────────
   Beantwortet «wann falle ich unter mein Minimum?» als Bild. NUR Zeichnung:
   Daten kommen fertig aus forecast() (rows[].mainEnd, firstBelowId, min) —
   dieselbe Quelle wie Ausblick-Liste und Engpass-Karte, KEINE neue Rechnung. */
function fmtTick(v){ return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,"'").replace('-','−'); }
function forecastChartSvg(f){
  const s = f.rows.filter(r=>r.mainEnd!=null).slice(0,12);
  if(s.length<2) return '';
  const W=560,H=190,padL=56,padR=52,top=16,bottom=30;
  const plotW=W-padL-padR, plotH=H-top-bottom;
  const vals=s.map(r=>r.mainEnd).concat(s.map(r=>r.min));
  let max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  const span=(max-min)||1; max+=span*0.14; min-=span*0.14;
  const X=i=>padL+(i/(s.length-1))*plotW;
  const Y=v=>top+(max-v)/(max-min)*plotH;
  /* dezente Gridlines auf «schönen» Werten (~3 Linien) */
  const steps=[100,200,250,500,1000,2000,2500,5000,10000,20000];
  const step=steps.find(c=>c>=(max-min)/3)||steps[steps.length-1];
  let grid='';
  for(let v=Math.ceil(min/step)*step; v<=max; v+=step){
    grid+=`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.55"/>`
        + `<text x="${padL-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mut)">${fmtTick(v)}</text>`;
  }
  /* Minimum-Linie (gestrichelt, Warnfarbe) + Beschriftung im Plot */
  const pts=s.map((r,i)=>({x:X(i),y:Y(r.mainEnd),r}));
  /* N9: eine Schwelle je Monat ⇒ Stufenlinie. Trägt der ganze Ausblick dieselbe
     Schwelle (Normalfall), liefert minStepRuns EINEN Lauf über die volle Breite
     = die bisherige Gerade; nur dann greift auch die N8-Ausweich-Mechanik der
     Beschriftung, die genau für diese eine Beschriftung gebaut wurde. */
  const minRuns = minStepRuns(pts.map(p=>({x:p.x, min:p.r.min})), padL, W-padR);
  const yMin=Y(minRuns[0].min);
  /* N8-Queue: die Beschriftung klebte fest links an der Linie und legte sich
     damit genau auf den Monatswert, wenn die Kurve gleich links unter das
     Minimum fällt (KK-Schuld-Fall). Sie weicht jetzt aus — waagrecht auf die
     freie Seite, notfalls senkrecht auf die Gegenseite der Linie. Dieselbe
     Mechanik wie bei den Monatslabels in N1-FIX: reine Darstellung, es ändert
     sich keine Zahl und keine Position eines Datenpunkts. */
  const minTxt = 'Minimum '+fmtTick(minRuns[0].min);
  const minW = minTxt.length*6.2;
  const labelled = pts.filter((p,i)=>p.r.id===f.firstBelowId || i===pts.length-1);
  const clash = (x0,x1,yT)=>labelled.some(p=>{
    /* Kasten des Wertlabels — GENAU dort, wo der Punkt-Renderer unten zeichnet:
       beim Unterschreiter mittig über dem Punkt (untere Plot-Hälfte) bzw. unter
       ihm, beim letzten Monat rechts daneben. */
    const isFirst = p.r.id===f.firstBelowId;
    const ly = isFirst ? (p.y>top+plotH/2 ? p.y-10 : p.y+18) : p.y+4;
    const lx0 = isFirst ? p.x-34 : p.x+6, lx1 = isFirst ? p.x+34 : p.x+52;
    return x1>lx0 && x0<lx1 && Math.abs(yT-ly)<16;
  });
  const yAbove = Math.max(12, yMin-5), yBelow = yMin+14;
  const fits = yMin-5>=12;
  let yTxt = fits ? yAbove : yBelow, xTxt = padL+4, anchor = 'start';
  if(clash(xTxt, xTxt+minW, yTxt)){
    xTxt = W-padR-4; anchor = 'end';
    if(clash(xTxt-minW, xTxt, yTxt)){ xTxt = padL+4; anchor = 'start'; yTxt = fits ? yBelow : yAbove; }
  }
  /* N3.3: Minimum-Linie in Warnrot (--neg) — kritische Schwelle, klar von Amber getrennt.
     N9: EINE Schwelle über alles (Normalfall) → exakt die bisherige Beschriftung
     samt N8-Ausweichen. Mehrere Läufe → jeder Lauf wird an seinem Anfang mit
     seinem eigenen Wert beschriftet, und zwar auf der Seite der Linie, auf der
     die Kurve NICHT verläuft (sonst legt sich die Zahl auf die Prognose). */
  const curveYAt = x => {
    for(let i=1;i<pts.length;i++){
      if(x<=pts[i].x){ const a=pts[i-1], b=pts[i];
        return a.y + (b.y-a.y)*((x-a.x)/((b.x-a.x)||1)); }
    }
    return pts[pts.length-1].y;
  };
  const runLabel = (r,k) => {
    const y = Y(r.min), x = r.x0+4;
    const above = y <= curveYAt(x);       /* Linie über der Kurve → Text nach oben */
    let yy = above ? y-6 : y+15;
    if(yy<12) yy = y+15; else if(yy>top+plotH-2) yy = y-6;
    return `<text x="${x.toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="start" font-size="11.5" font-weight="650" fill="var(--neg)">${k===0?esc('Minimum ')+fmtTick(r.min):fmtTick(r.min)}</text>`;
  };
  const minLine = minStepPath(minRuns, Y) + (minRuns.length===1
    ? `<text x="${xTxt.toFixed(1)}" y="${yTxt.toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="650" fill="var(--neg)">${esc(minTxt)}</text>`
    : minRuns.map(runLabel).join(''));
  /* Alles ab dem aktuellen Monatsende ist Projektion → Linie gestrichelt
     (dieselbe Sprache wie die Planmonate der anderen Charts). */
  const path=`<path d="${pts.map((p,k)=>(k?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>`;
  const dots=pts.map((p,i)=>{
    const isFirst=p.r.id===f.firstBelowId, isLast=i===pts.length-1;
    /* N3.3: Punkte AMBER; Warnrot nur für Minimum-Linie + firstBelowId-Ring/-Wert. */
    let lbl='';
    if(isFirst){ /* der Monat, in dem die Kurve unter die Linie fällt */
      const up=p.y>top+plotH/2;
      lbl=`<text x="${p.x.toFixed(1)}" y="${(up?p.y-10:p.y+18).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="750" fill="var(--neg)">${fmtTick(p.r.mainEnd)}</text>`;
    } else if(isLast){
      lbl=`<text x="${(p.x+8).toFixed(1)}" y="${(p.y+4).toFixed(1)}" text-anchor="start" font-size="11.5" font-weight="650" fill="var(--ink)">${fmtTick(p.r.mainEnd)}</text>`;
    }
    return `<g onclick="openForecastSheet('${p.r.id}')" style="cursor:pointer" data-tip="${tipText([p.r.name+' '+p.r.year+' · '+tipQual(p.r.status), 'Hauptkonto '+fmtMoney(p.r.mainEnd), tipDelta(p.r.mainEnd, i>0?s[i-1].mainEnd:null), mainVsMin(p.r.mainEnd, p.r.min)].filter(Boolean))}" onmouseenter="chartTipShow(event,this)" onmousemove="chartTipMove(event)" onmouseleave="chartTipHide()">
      <rect x="${(p.x-plotW/(pts.length-1)/2).toFixed(1)}" y="0" width="${(plotW/(pts.length-1)).toFixed(1)}" height="${H}" fill="transparent"/>
      ${isFirst?`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="none" stroke="var(--neg)" stroke-width="1.5" opacity="0.6"/>`:''}
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.status==='curr'||isFirst?4:3}" fill="${p.r.status==='plan'?'var(--card)':'var(--acc)'}" stroke="var(--acc)" stroke-width="1.5"/>
      ${lbl}
      <text class="provt" x="${p.x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isFirst?'var(--neg)':'var(--mut)'}"${p.r.status==='curr'||isFirst?' font-weight="700"':''}>${esc(p.r.name.slice(0,3))}</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:10px" role="img"
      aria-label="Prognose: Hauptkonto-Stand am Monatsende, ${esc(minAriaLabel(minRuns))}">
    ${grid}${minLine}${path}${dots}
  </svg>`;
}
/* ─────────── U5.3: Glossar «Wie rechnet die App?» ───────────
   EIN Sheet, destilliert aus den bestehenden Erklärtexten (Herkunfts-Sheets,
   Einstellungs-Hinweise) und den SPEC-Definitionen — KEINE neuen Definitionen,
   keine Rechnung. Erreichbar über ⓘ an Blocktiteln, die Navigation («Bereiche»)
   und die Einstellungen. */
const GLOSSARY = [
 {id:'geldmonat', term:'Geldmonat', text:'Dein Planungsmonat läuft von Lohntag zu Lohntag (5.&nbsp;Arbeitstag des Monats), nicht vom 1. bis 31. Vor dem Lohntag ist noch der Vormonat aktiv — so entsteht kein falsches Minus, nur weil der neue Lohn noch nicht da ist. Buchungen behalten immer ihr echtes Kalenderdatum; nur Rest, Engpass und Planung folgen dem Geldmonat.'},
 {id:'rest', term:'Rest zum Ausgeben', text:'Aktueller Hauptkonto-Saldo minus alles, was in diesem Geldmonat noch vom Hauptkonto weg muss (offene Abbuchungen, Fix-Transfers, Sparraten, Rücklagen). Bewusst vom Kontostand gerechnet, nicht vom Lohn. «Leben» wird im laufenden Monat nicht zusätzlich geschätzt. Diese Zahl rechnet bis auf <b>null</b> herunter. Die kleine Zeile darunter — <b>«frei bis Minimum»</b> — ist derselbe Betrag minus der Warnschwelle dieses Monats: so viel darf insgesamt noch weg, ohne die Notlinie zu berühren, <b>inklusive</b> allem, was diesen Monat noch fürs Leben weggeht (das steckt im Rest drin, weil es oben nicht projiziert wird). Nicht verwechseln mit «Frei pro Tag»: das ist das Alltagsbudget aus deinen Budget-Posten, diese Zahl hier ist die Obergrenze bis zur Notlinie.'},
 {id:'minimum', term:'Minimum (Warnschwelle)', text:'Der Wert, der dein Hauptkonto schützt. Es gilt <b>eine Schwelle pro Monat</b>: normalerweise die globale aus den Einstellungen, und wenn du im Monats-Detail «Warnschwelle diesen Monat» ausfüllst, für diesen einen Monat deine eigene. Kreditkarten-Vorrang, Engpass-Warnung, Tagesbudget und die Minimum-Linie in der Prognose prüfen alle gegen die Schwelle des Monats, über den sie reden — nie gegen zwei verschiedene. Die App setzt den Monatswert nie von selbst.'},
 {id:'tagesbudget', term:'Frei pro Tag («~/Tag aus dem Leben-Budget»)', text:'(Leben-Budget − Leben-Verbrauch) ÷ Tage bis zum nächsten Lohntag. Das <b>Leben-Budget</b> ist die Summe deiner monatlichen Fix-Posten <b>ohne Verknüpfung</b> — die Budgetzeilen, die nie als Buchung abgehakt werden. Der <b>Verbrauch</b> sind deine echten Ausgaben ab Hauptkonto in diesem Geldmonat (Lohntag bis Lohntag), <b>ohne</b> die abgehakten Fixkosten-Abbuchungen; Transfers in Spaces, Eingänge und Rückerstattungen zählen nicht. Ist das Budget aufgebraucht, warnt die App, statt einen negativen Durchschnitt zu zeigen. Die Warnschwelle (Minimum) spielt hier bewusst <b>keine</b> Rolle mehr — sie ist die Notlinie für Chart, Engpass und Kreditkarten-Vorrang, nicht dein Alltagsbudget.'},
 {id:'ueberschuss', term:'Überschuss', text:'Monatslohn minus Pflicht-Fixkosten des Monats. Basis fürs %-Sparen: die Spar-Töpfe werden aus dem Überschuss verteilt und zählen selbst nicht hinein; variable Einmalkosten auch nicht. Negativer Überschuss → Töpfe 0.'},
 {id:'effektiv', term:'effektiv · geschätzt · geplant', text:'Jede Lohnzahl trägt ihr Etikett: «effektiv» = manuell eingetragener Lohn plus alle gebuchten «Eingang: Lohn». «geschätzt» = Arbeitstage × Tagessatz, solange nichts Echtes da ist. «geplant» = reine Schätzung eines Zukunftsmonats. Ein manuell eingetragener Lohn hat immer Vorrang vor der Schätzung.'},
 {id:'zielgebunden', term:'«Gehört zu deinen Sparzielen»', text:'Ein Konto/Space, auf das mindestens ein Sparziel zeigt. Jede Bewegung dort fragt, zu welchem Ziel sie zählt — so bleiben Kontostand und Ziel-Stände synchron (Kontostand = Summe der Ziel-Stände). Weicht beides ab, meldet es die Ziele-Ansicht; die App gleicht nie automatisch an.'}
];
function glossBtn(term){
  return `<button class="glossi" aria-label="Begriff erklärt — Glossar öffnen" onclick="event.stopPropagation();openGlossarySheet('${term}')">ⓘ</button>`;
}
function openGlossarySheet(term){
  const items = GLOSSARY.map(g=>`<div class="gitem${term===g.id?' ghl':''}" id="gl_${g.id}">
      <div class="gterm">${g.term}</div><div class="gtext">${g.text}</div></div>`).join('');
  openSheet(`<div class="shead">Wie rechnet die App?</div>
    <div class="ssub">Die Begriffe hinter den Zahlen — kurz erklärt. Die konkreten Zahlen dahinter zeigt jeweils «Herkunft ›» an der Zahl selbst.</div>
    ${items}
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
  if(term){ const t=document.getElementById('gl_'+term); if(t) t.scrollIntoView({block:'start'}); }
}
function openNetWorthSheet(id){
  const s = netWorthSeries(S).find(x=>x.id===id);
  const m = monthById(S,id);
  if(!s || !m) return;
  const inc=monthIncome(S,m), exp=monthExpenses(S,m);
  openSheet(`<div class="shead">Gesamtvermögen · ${esc(monthLabel(id))}</div>
    <div class="ssub">Rekonstruiert relativ zum heutigen Gesamtvermögen über die Monats-Saldi (Lohn − Ausgaben).${s.status==='plan'?' Geplanter Monat: Projektion.':''}</div>
    <div class="row"><div class="rsub">Lohn <span class="chip">${inc.label}</span></div><div class="num amt pos">+${fmtAmt(inc.amount)}</div></div>
    <div class="row"><div class="rsub">Ausgaben <span class="chip">${exp.label}</span></div><div class="num amt neg">−${fmtAmt(exp.amount)}</div></div>
    <div class="row"><div class="rsub">Monats-Saldo</div><div class="num amt ${s.saldo<0?'neg':'pos'}">${fmtMoney(s.saldo)}</div></div>
    <div class="row"><div class="rname">Gesamtvermögen Ende ${esc(m.name)}</div><div class="num amt ${s.worth<0?'neg':''}">${fmtMoney(s.worth)}</div></div>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
function openLiquiditySheet(monthId){
  const m = monthById(S,monthId);
  if(!m) return;
  const inc = monthIncome(S,m), exp = monthExpenses(S,m);
  const liq = round2(inc.amount-exp.amount);
  let expRows;
  if(exp.label==='aus Buchungen'){
    expRows = S.ledger.filter(l=>l.date.slice(0,7)===monthId && (l.type==='ausgang' || (l.type==='anpassung' && l.amount<0)))
      .map(l=>`<div class="row"><div class="rl"><div style="min-width:0"><div class="rname">${esc(l.desc)||ledgerKindLabel(l)}</div>
        <div class="rsub">${fmtDate(l.date)} · ${ledgerKindLabel(l)}</div></div></div>
        <div class="num amt neg">−${fmtAmt(Math.abs(l.amount))}</div></div>`).join('');
  } else {
    expRows = m.fixed.map(f=>{ const fa = fixAmount(f); const ch = fixChildren(f);
      return `<div class="row"><div class="rl"><span class="emoji">${esc(f.emoji)||'▪︎'}</span>
        <div><div class="rname">${esc(f.name)}</div>${f.recurrence==='yearly'?`<div class="rsub">${fmtAmt(fa)}/Jahr · anteilig ÷ 12</div>`:''}${ch?`<div class="rsub">${ch.length} Unterposten · ${esc(ch.map(c=>c.name).join(', '))}</div>`:''}</div></div>
        <div class="num amt neg">−${fmtAmt(f.recurrence==='yearly'?round2(fa/12):fa)}</div></div>`; }).join('')
      + m.variable.map(v=>`<div class="row"><div class="rl"><div class="rname">${esc(v.name)} <span class="chip">variabel</span></div></div>
        <div class="num amt neg">−${fmtAmt(v.amount)}</div></div>`).join('');
  }
  openSheet(`<div class="shead">Liquidität · ${esc(monthLabel(monthId))}</div>
    <div class="ssub">Herkunft: Monatslohn minus Ausgaben — dieselben dynamischen Werte wie im Monats-Detail und YTD.${m.status==='plan'?' Geplanter Monat: reine Schätzung (im Chart gestrichelt).':''}</div>
    <div class="row"><div class="rsub">Lohn <span class="chip">${inc.label}</span></div><div class="num amt pos">+${fmtAmt(inc.amount)}</div></div>
    <div class="row"><div class="rsub">Ausgaben <span class="chip">${exp.label}</span></div><div class="num amt neg">−${fmtAmt(exp.amount)}</div></div>
    ${expRows?`<div class="mt2"><span class="lbl">Ausgaben im Detail</span>${expRows}</div>`:''}
    <div class="row"><div class="rname">Liquidität</div><div class="num amt ${liq<0?'neg':'pos'}">${fmtMoney(liq)}</div></div>
    <button class="btn btn-ghost" onclick="closeSheet();openMonth('${monthId}')">Zum Monat ›</button>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}

/* Herkunft der Lohnzahl (SPEC 2.20 D): Gesamt = Instant Pays + Restauszahlung */
function openIncomeSheet(monthId){
  const m = monthById(S,monthId);
  if(!m) return;
  const inc = monthIncome(S,m);
  const ipSum = instantPaySum(S,monthId), poSum = salaryPayoutSum(S,monthId);
  const rows = m.extraIncome.map(x=>`<div class="row"><div class="rl"><div class="rname">${esc(x.desc)||'Eingang: Lohn'}</div></div><div class="num amt pos">+${fmtAmt(x.amount)}</div></div>`).join('');
  /* N17 (2.55): zwei Quellen, zwei Zeilen, eine Summe. Der Festlohn erscheint
     nur, wenn er eingeschaltet ist — sonst sieht das Sheet aus wie vor N17. */
  const fs = S.workModel.fixedSalary;
  const fxPct = m.fixedPensum!=null ? m.fixedPensum : fs.pensumPercent;
  /* N18: dieselben zwei Zeilen wie in N17 — die Festlohn-Zeile ergänzt nur den
     Zahltag bzw. sagt, ab wann die Quelle überhaupt gilt. Der Betrag kommt
     weiter aus inc.fixed (monthIncome), hier wird nichts nachgerechnet. */
  const fxStart = nMonthId(fs.startMonthId);
  const fxBefore = !!(fxStart && m.id < fxStart);
  const fxEnt = fixedSalaryEntries(S, monthId);
  const fxDesc = fxBefore
    ? 'noch nicht aktiv · ab '+esc(monthLabel(fxStart))
    : (fxEnt.length ? 'gebucht am '+fxEnt.map(e=>fmtDate(e.date)).join(' · ')+' — ersetzt die Planzahl'
    : fmtAmt(fxPct)+' % · '+fmtAmt(fs.fullPensumAmount)+' bei 100 % · erwartet ~'+fs.payoutDay+'.');
  openSheet(`<div class="shead">Lohn · ${esc(monthLabel(monthId))}</div>
    <div class="ssub">Monatslohn = ${inc.label}. ${fs.enabled?'Zwei Quellen — Schichtlohn und Festlohn nach Pensum — werden addiert. ':''}${ipSum>0?'Der Schichtlohn setzt sich aus Instant Pays (Vorschüsse) und der Restauszahlung zusammen — nie doppelt gezählt.':'Effektiver Schichtlohn = manueller Lohn (falls gesetzt) plus alle «Eingang: Lohn».'}</div>
    ${m.incomeOverride!=null?`<div class="row"><div class="rsub">Manueller Lohn (Vorrang, Schicht)</div><div class="num amt">${fmtMoney(m.incomeOverride)}</div></div>`:''}
    ${ipSum>0?`<div class="row"><div class="rsub">Instant Pay (Vorschüsse)</div><div class="num amt">${fmtMoney(ipSum)}</div></div>`:''}
    ${poSum>0?`<div class="row"><div class="rsub">Restauszahlung</div><div class="num amt">${fmtMoney(poSum)}</div></div>`:''}
    ${rows?`<div class="mt1"><span class="lbl">Eingänge im Detail</span>${rows}</div>`:''}
    ${fs.enabled?`<div class="mt1"><span class="lbl">Quellen</span>
      <div class="row"><div class="rsub">Schichtlohn</div><div class="num amt">${fmtMoney(inc.shift)}</div></div>
      <div class="row"><div class="rsub potline">Festlohn${fs.name?' «'+esc(fs.name)+'»':''} (${fxDesc})</div><div class="num amt">${fmtMoney(inc.fixed)}</div></div></div>`:''}
    <div class="row"><div class="rname">Monatslohn</div><div class="num amt pos">${fmtMoney(inc.amount)}</div></div>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}

/* ─────────── N1 — «Dieser Monat & Jahr»: blockCurrentMonth + blockYearProgress
   in EINEM Band — Kennzahl-Reihe (Lohn effektiv/geschätzt · Ausgaben · Monats-
   Saldo) + schmaler Jahresbalken + YTD-Saldo. Sichtbar auf Handy UND Laptop
   (kein Desktop-Ausblenden mehr). Nur Anzeige — Zahlen aus monthIncome/
   monthExpenses/ytdStats, keine neue Rechnung. ───────────── */
function blockMonthYear(){
  const curId = S.settings.currentMonthId;
  const m = monthById(S, curId);
  const mNum = parseInt(curId.slice(5,7),10);
  const pct = Math.round(mNum/12*100);
  const ytd = ytdStats(S);
  let cells;
  if(m){
    const inc = monthIncome(S,m), exp = monthExpenses(S,m);
    const saldo = round2(inc.amount-exp.amount);
    cells = `<div class="statrow">
      ${statCell('Lohn', fmtAmt(inc.amount), 'pos', inc.label, "openMonth('"+m.id+"')", false)}
      ${statCell('Ausgaben', fmtAmt(exp.amount), 'neg', exp.label, "openMonth('"+m.id+"')", false)}
      ${statCell('Monats-Saldo', fmtAmt(saldo), saldo<0?'neg':'pos', null, "openMonth('"+m.id+"')", false)}
    </div>`;
  } else {
    cells = `<div class="hint mt1">Der aktuelle Monat ist noch nicht angelegt — unter «Monate» anlegen.</div>`;
  }
  return `<section><span class="lbl sec">Dieser Monat &amp; Jahr · ${esc(m?m.name+' '+m.year:germanMonthName(curId)+' '+curId.slice(0,4))}</span>
    ${cells}
    <div class="row mt2" style="border-bottom:none;padding-bottom:4px;min-height:0">
      <div class="rsub">${esc(germanMonthName(curId))} · Monat ${mNum} von 12</div><div class="num amt">${pct} %</div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <button class="row tap mt1" onclick="goView('monate')">
      <div class="rsub">YTD-Saldo seit ${esc(monthLabel(ytd.from))}</div>
      <div class="num amt ${ytd.saldo<0?'neg':'pos'}">${fmtMoney(ytd.saldo)}</div></button>
  </section>`;
}
/* ─────────── To-Dos / Checkliste (E3, SPEC 2.33) ─────────── */
let TODOS_SHOW_DONE = false;   /* Session-Toggle, kein Setting */
let TODOS_SHOW_LATER = false;  /* N4: «Später (n)» eingeklappt — ebenfalls flüchtig */
function todoSortKey(t){
  /* offen zuerst; darin: high → neu → älteste zuerst */
  return [t.status==='done'?1:0, t.priority==='high'?0:1, t.seen?1:0, t.createdAt, t.id];
}
function todoBadges(t){
  const b = [];
  if(!t.seen && t.status==='open') b.push('<span class="chip warn">NEU</span>');
  if(t.priority==='high') b.push('<span class="chip on">wichtig</span>');
  if(t.category) b.push('<span class="chip">'+esc(t.category)+'</span>');
  if(t.monthId) b.push('<span class="chip">'+esc(monthLabel(t.monthId))+'</span>');
  /* N4: noch nicht erschienen → das Datum steht in der «Später»-Zeile selbst */
  if(!todoDueToShow(t)) b.push('<span class="chip">ab '+esc(fmtDate(t.showFrom))+'</span>');
  if(t.source==='system') b.push('<span class="chip">auto</span>');
  return b.join(' ');
}
/* Der frühere To-Do-Block (E3) ist in «Heute zu tun» (blockToday, U3.2)
   aufgegangen — die Zeilen-Darstellung lebt dort (todayTodoRow). */
function todayTodoRow(t){
  const act = t.source==='system' ? sysTodoAction(t.id) : null;
  return `<div class="row" style="${act?'flex-wrap:wrap':''}">
    ${t.source==='system'
      ? `<span class="qcheck" style="border-style:dashed" title="löst sich automatisch, wenn behoben" aria-hidden="true"></span>`
      : `<button class="qcheck" style="${t.status==='done'?'background:var(--acc)':''}" aria-label="Erledigt umschalten" onclick="toggleTodo('${t.id}')"></button>`}
    <button style="text-align:left;flex:1;min-width:0;padding:4px 0" onclick="openTodoSheet('${t.id}')">
      <div class="rname" style="white-space:normal;${t.status==='done'?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.title)} ${todoBadges(t)}</div>
      ${t.detail && t.status==='open' ? `<div class="rsub" style="white-space:normal">${esc(t.detail.length>90?t.detail.slice(0,90)+'…':t.detail)}</div>`:''}
    </button>
    ${act?`<div style="flex-basis:100%"><button class="linkbtn" style="padding:2px 0 2px 34px" onclick="runSysTodoAction('${t.id}')">${esc(act.label)} ›</button></div>`:''}
  </div>`;
}
function toggleTodo(id){
  const t = S.todos.find(x=>x.id===id);
  if(!t || t.source==='system') return;
  const was = t.status;
  t.status = was==='open' ? 'done' : 'open';
  t.doneAt = t.status==='done' ? today() : null;
  t.seen = true;
  haptic(); commitState();
  if(t.status==='done') showToast('Erledigt: '+t.title, ()=>{ const x=S.todos.find(y=>y.id===id); if(x){ x.status='open'; x.doneAt=null; } commitState(); });
}
function markTodosSeen(){
  S.todos.forEach(t=>{ t.seen = true; });
  commitState();
}
function openTodoSheet(id){
  const t = S.todos.find(x=>x.id===id);
  if(!t) return;
  if(!t.seen){ t.seen = true; commitState(); }   /* gesehen (SPEC 2.33) */
  const meta = [t.source==='system'?'automatisch (löst sich selbst)':(t.source==='claude'?'aus Import (Claude)':'manuell'),
    t.priority==='high'?'wichtig':null, t.category, t.monthId?monthLabel(t.monthId):null,
    t.showFrom?(todoDueToShow(t)?'sichtbar seit '+fmtDate(t.showFrom):'erscheint am '+fmtDate(t.showFrom)):null,
    'erstellt '+fmtDate(t.createdAt), t.doneAt?'erledigt '+fmtDate(t.doneAt):null].filter(Boolean).join(' · ');
  const act = t.source==='system' ? sysTodoAction(t.id) : null;
  openSheet(`<div class="shead">${esc(t.title)}</div>
    <div class="ssub">${esc(meta)}</div>
    ${t.detail?`<div class="card" style="margin-top:var(--sp1);white-space:pre-wrap">${esc(t.detail)}</div>`:''}
    ${act?`<button class="btn btn-acc" onclick="closeSheet();runSysTodoAction('${t.id}')">${esc(act.label)}</button>
      <div class="hint" style="padding:4px 2px">Dieses To-Do löst sich automatisch, sobald die Bedingung behoben ist — gebucht wird nie ohne deine Bestätigung.</div>`:''}
    ${t.source!=='system'?`<button class="btn btn-acc" onclick="toggleTodo('${t.id}');closeSheet()">${t.status==='open'?'Erledigt ✓':'Wieder öffnen'}</button>`:''}
    ${t.source==='manual'?`<button class="btn btn-ghost" onclick="openTodoForm('${t.id}')">Bearbeiten</button>
      <button class="btn btn-danger" onclick="deleteTodo('${t.id}')">Löschen</button>`:''}
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
/* Aktion eines System-To-Dos ausführen (E4): Rate setzen löst direkt (mit Undo);
   KK/Steuer öffnen die bestehenden Bestätigungs-Flows. */
function runSysTodoAction(id){
  const act = sysTodoAction(id);
  if(!act) return;
  if(act.kind==='goal') setGoalRateToNeeded(act.goalId);
  else if(act.kind==='goalexp') openGoalForm(act.goalId);
  else if(act.kind==='kk') openCcSheet(act.ccId);
  else if(act.kind==='tax') openTaxPlanner();
  else if(act.kind==='reserve') markPlannedReserveUsed(act.reserveId);
}
/* N20 (SPEC 2.57): «gebraucht» ist eine Zustands-Notiz, KEINE Buchung — das
   Geld liegt bereits auf dem Zielkonto, die echte Zahlung läuft über den
   normalen Buchungs-Fluss. Danach fällt die Bedingung weg und syncSystemTodos
   entfernt den Eintrag von selbst. Rückgängig über Snapshot (Muster N9). */
function markPlannedReserveUsed(id){
  const r = S.plannedReserves.find(x=>x.id===id);
  if(!r) return;
  const snap = deepClone(S);
  r.status = 'done';
  haptic(); commitState();
  showToast('Als gebraucht markiert: '+r.name, restoreFn(snap));
}
function openTodoForm(id){
  const t = id ? S.todos.find(x=>x.id===id) : null;
  if(t && t.source!=='manual') return;
  const catOpts = TODO_CATEGORIES.map(c=>`<option value="${c}" ${t&&t.category===c?'selected':''}>${c}</option>`).join('');
  openSheet(`<div class="shead">${t?'To-Do bearbeiten':'Neues To-Do'}</div>
    <label class="fld"><span class="lbl">Titel</span><input type="text" id="td_title" value="${esc(t?t.title:'')}"></label>
    <label class="fld"><span class="lbl">Details (optional)</span><textarea id="td_detail">${esc(t?t.detail:'')}</textarea></label>
    <div class="frow">
      <label class="fld"><span class="lbl">Priorität</span><select id="td_prio">
        <option value="normal" ${!t||t.priority==='normal'?'selected':''}>normal</option>
        <option value="high" ${t&&t.priority==='high'?'selected':''}>wichtig</option></select></label>
      <label class="fld"><span class="lbl">Kategorie</span><select id="td_cat">
        <option value="" ${!t||!t.category?'selected':''}>— keine —</option>${catOpts}</select></label>
    </div>
    <label class="fld"><span class="lbl">Monat (optional)</span>${monthYearPicker('td_month', t&&t.monthId?t.monthId:'', {allowEmpty:true})}</label>
    <label class="fld"><span class="lbl">Erscheint ab (optional)</span>
      <input type="date" id="td_showfrom" value="${esc(t&&t.showFrom?t.showFrom:'')}"></label>
    <div class="hint" style="padding:0 2px 2px">Leer = sofort im «Heute zu tun». Mit Datum wartet die To-Do unter «Später», bis sie dran ist.</div>
    <button class="btn btn-acc" onclick="saveTodo('${id||''}')">Speichern</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveTodo(id){
  const title = el('td_title').value.trim();
  if(!title){ showToast('Bitte einen Titel angeben.'); return; }
  const t = id ? S.todos.find(x=>x.id===id) : null;
  const sf = el('td_showfrom').value;
  const vals = { title, detail: el('td_detail').value.trim(),
    priority: el('td_prio').value, category: el('td_cat').value || null,
    monthId: nMonthId(el('td_month').value),
    showFrom: /^\d{4}-\d{2}-\d{2}$/.test(sf) ? sf : null };   /* leer = null (N4) */
  if(t) Object.assign(t, vals);
  else S.todos.push(Object.assign({ id:uid(), createdAt:today(), status:'open',
    source:'manual', doneAt:null, seen:true }, vals));
  closeSheet(); commitState();
}
function deleteTodo(id){
  const t = S.todos.find(x=>x.id===id);
  if(!t || t.source!=='manual') return;
  const snap = deepClone(S);
  S.todos = S.todos.filter(x=>x.id!==id);
  closeSheet(); commitState();
  showToast('To-Do gelöscht', restoreFn(snap));
}
/* U3.1: EINE Quelle aller Warn-Bedingungen — jede Karte behält ihre bestehende
   Ein-Tap-Aktion (KK → openCcSheet, Engpass → openShortfallSheet/openInstantPay,
   Ziel → Ziele-Ansicht, Steuer → Steuer-Planer). Nur Umgruppierung der
   bestehenden Anzeige — Rechenquellen unverändert (ccPriorityProposals,
   shortfallProjection, goalsBehindPlan, taxCoherence).
   key      = stabiler Bedingungs-Key; für Bedingungen mit System-To-Do EXAKT
              dessen Key (sys_kk_… / sys_goal_… / sys_tax_overdue) → De-Dup U3.3.
   critical = bleibt volle Karte ÜBER dem Band (KK-Schuld offen, Hauptkonto
              negativ — reiner Saldo-Read, keine neue Rechnung).
   important= zählt in der Band-Zusammenfassung als «wichtig». */
function warningItems(state){
  const items = [];
  ccPriorityProposals(state).forEach(p=>{
    const stepTxt = p.steps.map(s=>fmtAmt(s.amount)+' aus '+(s.kind==='goal'?'Ziel «'+s.name+'»':s.name)).join(' · ');
    items.push({key:'sys_kk_'+p.ccId, critical:true, important:true,
      html:`<div class="warnbox strong" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Kreditkarten-Vorrang · ${esc(p.ccName)}</div>
      <div style="margin-top:4px">Schuld ${fmtMoney(p.debt)} — ${esc(p.respName)} kann sie nicht allein begleichen.</div>
      <div style="margin-top:4px">Vorschlag: ${esc(stepTxt)||'keine Deckung möglich'}</div>
      ${p.uncovered>0?`<div style="margin-top:4px">Ungedeckt bleiben ${fmtMoney(p.uncovered)}.</div>`:''}
      <button class="btn btn-ghost mt2" onclick="openCcSheet('${p.ccId}')">Vorschlag prüfen</button>
    </div>`});
  });
  const main = mainAccount(state);
  if(main && main.balance<0){
    items.push({key:'main_negative', critical:true, important:true,
      html:`<div class="warnbox strong" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Hauptkonto negativ</div>
      <div style="margin-top:4px">«${esc(main.name)}» steht bei ${fmtMoney(main.balance)}.</div>
      <button class="btn btn-ghost mt2" onclick="openRestSheet()">Herkunft prüfen</button>
    </div>`});
  }
  const sp = shortfallProjection(state);
  if(sp && sp.warn){
    const ip = state.workModel.instantPay;
    items.push({key:'shortfall', critical:false, important:true,
      html:`<div class="warnbox" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Engpass-Warnung</div>
      <div style="margin-top:4px">${esc(germanMonthName(sp.worstMonthId))} droht ~${fmtAmt(sp.missing)} ${esc(state.settings.currency)} unter dein Minimum${sp.shifts!=null?' → ca. '+sp.shifts+' Schichten Instant Pay (à '+fmtAmt(ip.amountPerShift)+')':''}.</div>
      <button class="rsub" style="display:block;text-align:left;padding:0;margin-top:4px" onclick="openShortfallSheet()">Ende ${esc(germanMonthName(state.settings.currentMonthId))}: ${fmtAmt(sp.cp1)}${sp.min2!=null&&sp.min2!==sp.min1?' (Min '+fmtAmt(sp.min1)+')':''}${sp.cp2!=null?' · Ende '+esc(germanMonthName(sp.nextPlanId))+': '+fmtAmt(sp.cp2)+(sp.min2!==sp.min1?' (Min '+fmtAmt(sp.min2)+')':''):''}${sp.min2==null||sp.min2===sp.min1?' · Minimum '+fmtAmt(sp.min1):''} · Herkunft ›</button>
      <div class="rsub" style="margin-top:2px">Reine Information — es wird nichts gebucht. Im Monats-Check final klären.</div>
      ${ip.enabled?`<button class="btn btn-ghost mt1" onclick="openInstantPay()">Instant Pay erfassen</button>`:''}
    </div>`});
  }
  /* Ziel-/Steuer-Kohärenz (SPEC 2.30): meldet nur — Fix erst auf Tap. Pro
     Bedingung EINE Karte (stabile Keys fürs De-Dup mit den System-To-Dos). */
  goalsBehindPlan(state).forEach(c=>{
    items.push({key:'sys_goal_'+c.goalId, critical:false, important:false,
      html:`<div class="warnbox" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Sparziel «${esc(c.name)}» hinter Plan</div>
      <div style="margin-top:4px">${c.monthlyChf!=null?fmtAmt(c.monthlyChf):'—'} → nötig ${fmtAmt(c.needed)}/Mo bis ${esc(monthLabel(c.targetDate))}</div>
      <div class="rsub" style="margin-top:4px">Nichts wird automatisch geändert — Rate anpassen geht mit einem Tap.</div>
      <button class="btn btn-ghost mt1" onclick="goView('ziele')">Zu den Zielen</button>
    </div>`});
  });
  const tc = taxCoherence(state);
  if(tc && tc.overdue){
    items.push({key:'sys_tax_overdue', critical:false, important:true,
      html:`<div class="warnbox strong" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Steuer-Rücklage reicht nicht</div>
      <div style="margin-top:4px">Fälligkeit ${esc(monthLabel(tc.dueMonth))} erreicht — es fehlen ${fmtMoney(tc.missing)} im Topf.</div>
      <button class="btn btn-ghost mt1" onclick="openTaxPlanner()">Zum Steuer-Planer</button>
    </div>`});
  } else if(tc && tc.rateHigh){
    items.push({key:'tax_rate_high', critical:false, important:false,
      html:`<div class="warnbox" style="margin-top:0;margin-bottom:12px">
      <div class="wt">Steuer-Rücklage prüfen</div>
      <div style="margin-top:4px">Nötige Rücklage ${fmtAmt(tc.rate)}/Mo wirkt hoch (über Ø-Liquidität der Planmonate) — im Monats-Check prüfen.</div>
      <button class="btn btn-ghost mt1" onclick="openTaxPlanner()">Zum Steuer-Planer</button>
    </div>`});
  }
  return items;
}
/* U3.1 Status-Band: kritische Warnungen bleiben volle Karten, der Rest steckt
   kompakt in einem aufklappbaren <details>-Band («⚠ N Hinweise · M wichtig»).
   Inhalt ist IMMER im DOM (Barrierefreiheit + Selbst-Checks); Klappzustand ist
   bewusst flüchtig (kein Setting). Kein homeLayout-Block — rHome rendert das
   Band immer zuoberst, nicht ausblendbar, nicht verschiebbar (SPEC 2.14/2.38). */
function blockStatusBand(){
  const items = warningItems(S);
  if(!items.length) return '';
  const crit = items.filter(i=>i.critical), rest = items.filter(i=>!i.critical);
  const nImp = rest.filter(i=>i.important).length;
  const band = rest.length ? `<details class="statusband">
    <summary>⚠ ${rest.length} Hinweis${rest.length>1?'e':''}${nImp?' · '+nImp+' wichtig':''}<span class="sb-chev" aria-hidden="true">▾</span></summary>
    <div class="sb-items">${rest.map(i=>i.html).join('')}</div>
  </details>` : '';
  return `<section>${crit.map(i=>i.html).join('')}${band}</section>`;
}
/* Alle Warnkarten voll ausgeschrieben — wird nur noch vom Monats-Assistenten
   (Schritt 5, Abschluss-Übersicht) genutzt; Home zeigt stattdessen das Band. */
function blockWarnings(){
  const items = warningItems(S);
  return items.length ? `<section>${items.map(i=>i.html).join('')}</section>` : '';
}
function openCcSheet(ccId){
  const p = ccPriorityProposals(S).find(x=>x.ccId===ccId);
  if(!p){ closeSheet(); return; }
  const rows = p.steps.map(s=>`<div class="row"><div class="rl"><div style="min-width:0"><div class="rname">${s.kind==='goal'?'Ziel «'+esc(s.name)+'»':esc(s.name)}</div>
      ${s.newRate!=null?`<div class="rsub">neue nötige Rate: ${fmtAmt(s.newRate)}/Mo${s.rateHigh?' · Rate wirkt hoch — im Monats-Check prüfen':''}</div>`:''}</div></div>

    <button class="btn btn-acc" onclick="doApplyCc('${p.ccId}')">Vorschlag buchen</button>

function doApplyCc(ccId){
  const snap = deepClone(S);
  const p = applyCcProposal(S,ccId);

/* Überschuss-Herkunft (Etappe 4, SPEC 2.9 / Sonderfall 5) */
function openSurplusSheet(monthId){
  const m = monthById(S,monthId);
  if(!m) return;
  const sur = surplusFor(S,m);
  const inc = monthIncome(S,m);
  const rows = m.fixed.map(f=>{ const fa = fixAmount(f); const ch = fixChildren(f);
    return `<div class="row"><div class="rl"><span class="emoji">${esc(f.emoji)||'▪︎'}</span>
      <div><div class="rname">${esc(f.name)}</div>${f.recurrence==='yearly'?`<div class="rsub">${fmtAmt(fa)}/Jahr · anteilig ÷ 12</div>`:''}${ch?`<div class="rsub">Σ ${ch.length} Unterposten</div>`:''}</div></div>
    <div class="num amt neg">−${fmtAmt(f.recurrence==='yearly'?round2(fa/12):fa)}</div></div>`; }).join('');
  openSheet(`<div class="shead">Überschuss · ${esc(monthLabel(monthId))}</div>
    <div class="ssub">Überschuss = Monatslohn (effektiv/geschätzt) − Pflicht-Fixkosten. Die %-Töpfe selbst und variable Einmalkosten zählen nicht hinein.</div>
    <div class="row"><div class="rsub">Lohn <span class="chip">${inc.label}</span></div><div class="num amt pos">+${fmtAmt(sur.income)}</div></div>
    ${rows || '<div class="row hint">Keine Pflicht-Fixkosten in diesem Monat.</div>'}
    <div class="row"><div class="rname">Überschuss</div><div class="num amt ${sur.surplus<0?'neg':'pos'}">${fmtMoney(sur.surplus)}</div></div>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
function qaSubLabel(i){
  if(i.kind==='kk') return 'Kreditkarte begleichen · '+accName(S,i.toId);
  if(i.passive) return 'Nur rechnerisch · läuft übers Konto, nicht abhakbar'
    + (i.childCount ? ' · Σ '+i.childCount+' Unterposten' : '');
  /* N10: Unterposten eines Sammelpostens — der Elternposten steht nie selbst in
     der Liste, darum nennt die Zeile ihn hier (sonst hängt «Netflix» im Raum). */
  if(i.childOf) return 'Teil von '+i.parentName+' · '+(i.kind==='transfer' ? accName(S,i.fromId)+' → '+accName(S,i.toId) : 'Abbuchung · '+accName(S,i.fromId));
  if(i.pot) return fmtAmt(i.percent)+' % vom Überschuss · → '+accName(S,i.toId);
  /* N6: «beides anzeigen» wie bei der Jahresrücklage (2.12) — die Summe der
     geplanten variablen Kosten UND, falls schon etwas liegt, dass es die
     Differenz ist (sonst wirkt der kleinere Betrag wie ein Rechenfehler). */
  if(i.varReserve) return (i.varReserved>0 ? 'Differenz zu Σ '+fmtAmt(i.varTotal)+' geplant' : 'Σ geplante variable Kosten')
    +' · '+accName(S,i.fromId)+' → '+accName(S,i.toId);
  /* N20: die Zeile nennt Quelle → Ziel wie jede Rücklage; «überfällig» sagt,
     dass der Rücklege-Monat schon durch ist (die Aktion verschwindet nie
     stillschweigend), und der Gebraucht-Monat sagt, wofür es liegen bleibt. */
  if(i.plannedReserve) return accName(S,i.fromId)+' → '+accName(S,i.toId)
    + (i.overdue ? ' · überfällig' : '')
    + (i.needMonthId ? ' · gebraucht '+monthLabel(i.needMonthId) : '');
  if(i.kind==='transfer') return accName(S,i.fromId)+' → '+accName(S,i.toId);
  return 'Abbuchung · '+accName(S,i.fromId);
}
/* blockRest ist in blockHero aufgegangen (N1): «Rest zum Ausgeben» ist jetzt die
   erste Kennzahl der Hero-Kennzahl-Reihe (mit gepunkteter Herkunfts-Marke →

   openRestSheet (die volle Herkunft samt Rest-Erklärung) bleibt unverändert. */

  const r = restToSpend(S);
  if(!r) return;
