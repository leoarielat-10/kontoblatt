  if(!deepEqual(lw.instantPay, iw.instantPay)) lines.push(`Instant Pay ${onOff(lw.instantPay.enabled)} ${fmtAmt(lw.instantPay.amountPerShift)} → ${onOff(iw.instantPay.enabled)} ${fmtAmt(iw.instantPay.amountPerShift)}`);
  if(lw.holidayRegion !== iw.holidayRegion) lines.push(`Feiertagsregion «${lw.holidayRegion||'—'}» → «${iw.holidayRegion||'—'}»`);
  /* N17: der Festlohn steckt im import-geschützten workModel-Block (Sonderfall 23),
     also muss der Nutzer VOR dem Haken sehen, was sich änderte. */
  if(!deepEqual(lw.fixedSalary, iw.fixedSalary)){
    /* N18: Startmonat und Zahltag gehören in dieselbe Zeile — sie sind Teil
       des import-geschützten Blocks und ändern die Zahl (Startmonat) bzw. die
       Planung (Zahltag), also darf man sie nicht blind abhaken. */
    const fmtFS = f => f.enabled ? `${onOff(true)} ${f.name?'«'+f.name+'» ':''}${fmtAmt(f.fullPensumAmount)} bei 100 % · ${fmtAmt(f.pensumPercent)} % · ab ${f.startMonthId?monthLabel(f.startMonthId):'Beginn'} · Zahltag ${f.payoutDay}.` : onOff(false);
    lines.push(`Festlohn ${fmtFS(lw.fixedSalary)} → ${fmtFS(iw.fixedSalary)}`);
  }
  }
  if(p.savingsModel){
  const lv = local.savingsModel, iv = inc.savingsModel;
  if(lv.mode !== iv.mode) lines.push(`Sparmodell ${lv.mode==='percent'?'% vom Überschuss':'feste Beträge'} → ${iv.mode==='percent'?'% vom Überschuss':'feste Beträge'}`);
  if(!deepEqual(lv.allocations, iv.allocations)) lines.push(`Spar-Töpfe werden ersetzt (${lv.allocations.length} → ${iv.allocations.length})`);
  }
  if(p.taxPlan){
  const lt = local.taxPlan, it = inc.taxPlan;
  if(lt.enabled !== it.enabled) lines.push(`Steuer-Planer ${onOff(lt.enabled)} → ${onOff(it.enabled)}`);
  if(lt.amount !== it.amount) lines.push(`Steuer-Betrag ${fmtAmt(lt.amount)} → ${fmtAmt(it.amount)}`);
  if(lt.reserved !== it.reserved) lines.push(`Steuer-Rücklage ${fmtAmt(lt.reserved)} → ${fmtAmt(it.reserved)}`);
  if((lt.dueMonth||null) !== (it.dueMonth||null)) lines.push(`Steuer-Fälligkeit ${lt.dueMonth?monthLabel(lt.dueMonth):'kein festes Datum'} → ${it.dueMonth?monthLabel(it.dueMonth):'kein festes Datum'}`);
  if(lt.reserveToId !== it.reserveToId || lt.fromId !== it.fromId) lines.push('Steuer-Konten (Rücklage/Quelle) geändert');
  }
  return lines;
}

/* ─────────── Konten-Löschung: Schutz + Bereinigung (SPEC 2.2) ─────────── */
function accountRefs(st,id){
  let fk=0, mp=0, g=0, led=0, alloc=0;
  st.fixedCosts.forEach(f=>{ if(f.fromId===id||f.toId===id||f.reserveToId===id) fk++; });
  st.months.forEach(m=>m.fixed.forEach(f=>{ if(f.fromId===id||f.toId===id||f.reserveToId===id) mp++; }));
  st.goals.forEach(x=>{ if(x.accountId===id) g++; });
  st.ledger.forEach(l=>{ if(l.fromId===id||l.toId===id) led++; });
  st.savingsModel.allocations.forEach(a=>{ if(a.targetId===id) alloc++; });
  const spaces = st.accounts.filter(a=>a.parentId===id).length;
  return { fk, mp, g, led, alloc, spaces, total: fk+mp+g+led+alloc };
}
function canDeleteAccount(st,id){
  const a = st.accounts.find(x=>x.id===id);
  if(!a) return {ok:false, reason:'missing'};
  const spaces = st.accounts.filter(x=>x.parentId===id).length;
  if(spaces>0) return {ok:false, reason:'spaces', count:spaces};
  return {ok:true};
}
function deleteAccountCleanup(stIn,id){
  const st = deepClone(stIn);
  const acc = st.accounts.find(a=>a.id===id);
  if(!acc) return st;
  const main = st.accounts.find(a=>a.kind==='main' && a.id!==id) || st.accounts.find(a=>a.id!==id) || null;
  const mainId = main ? main.id : null;
  function fixItem(f){
    if(f.kind==='transfer' && f.toId===id){ f.kind='debit'; f.toId=null; }   /* Transfer aufs Konto → Abbuchung */
    if(f.fromId===id) f.fromId = mainId;                                      /* Quelle → Hauptkonto */
    if(f.toId===id) f.toId = mainId;
    if(f.reserveToId===id) f.reserveToId = mainId;                            /* Rücklage-Ziel umhängen */
  }
  st.fixedCosts.forEach(fixItem);
  st.months.forEach(m=>m.fixed.forEach(fixItem));
  st.goals.forEach(gl=>{ if(gl.accountId===id) gl.accountId = mainId; });     /* Ziel-Zuordnung umhängen */
  st.savingsModel.allocations = st.savingsModel.allocations.filter(a=>a.targetId!==id);
  /* N6: der Topf für die variablen Kosten wird NICHT aufs Hauptkonto umgehängt
     (eine Rücklage aufs Hauptkonto wäre sinnlos — sie soll das Geld ja gerade
     dort wegnehmen). Feld auf null = «nicht eingerichtet» → keine Aktion mehr,
     Leo wählt bewusst neu. Bereits gebuchte Rücklagen bleiben im Verlauf. */
  if(st.settings.varReserveToId===id) st.settings.varReserveToId = null;
  /* Verlauf bleibt als Historie stehen; gelöschte IDs werden bei der Anzeige
     als "(gelöschtes Konto)" aufgelöst. */
  st.accounts = st.accounts.filter(a=>a.id!==id);
  return st;
}
function accName(st,id){
  if(!id) return '—';
  const a = st.accounts.find(x=>x.id===id);
  return a ? a.name : '(gelöschtes Konto)';
}

/* ─────────── Persistenz ─────────── */
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ showToast('Speichern fehlgeschlagen (Speicher gesperrt?)'); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    return migrateToV1(JSON.parse(raw)).state;
  }catch(e){ return defaultState(); }
}
/* Lokale Wiederherstellungspunkte (E7): separater LS-Key, nicht im State. */
function loadSnapshots(){
  try{ const r=localStorage.getItem(SNAP_KEY); const a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
/* Schreibt den Ring und hält ihn unter SNAP_BUDGET: passt er nicht, fallen die
   ÄLTESTEN Punkte weg (nie der jüngste) — und wenn localStorage trotzdem
   ablehnt (Quota), wird weiter gekürzt statt still nichts zu sichern. */
function saveSnapshots(a){
  let list = Array.isArray(a) ? a.slice() : [];
  while(list.length){
    let raw;
    try{ raw = JSON.stringify(list); }catch(e){ return; }
    if(raw.length > SNAP_BUDGET && list.length > 1){ list.pop(); continue; }
    try{ localStorage.setItem(SNAP_KEY, raw); return; }
    catch(e){ if(list.length<=1) return; list.pop(); }
  }
}
function recordSnapshot(label){ try{ saveSnapshots(pushSnapshot(loadSnapshots(), S, null, label)); }catch(e){} }

/* ════════════════════════════════════════════════════════════════════
   CLOUD-SYNC ÜBER GITHUB (N23, SPEC 2.61 · Sonderfall 33)
   Manuell: ein Knopf hoch, ein Knopf runter. Kein Hintergrund-Automatismus,
   kein Polling, kein Merge ohne Bestätigung.

   SICHERHEITS-ARCHITEKTUR — der Grund, warum das hier so aussieht:
   Die Zugangsdaten (owner/repo/path/token) leben in einem EIGENEN
   localStorage-Key NEBEN dem App-State (Muster von SNAP_KEY, 2.21).
   Daraus folgt strukturell — nicht durch Disziplin, sondern durch Bauweise:
   · defaultState()/normalizeState() kennen kein Sync-Feld. Der State kann
     die Zugangsdaten gar nicht tragen, also kann exportStateJSON() sie auch
     nicht ausgeben — weder in die Datei, noch ins Copy-Feld, noch in ein
     Kurz-JSON, noch in den Upload.
   · syncUploadBody() bekommt die Zugangsdaten NICHT als Argument. Was die
     Funktion nie sieht, kann sie nicht mitschicken.
   · syncErrorText() bekommt nur Status + Richtung. Ein Token-Leck in einer
     Fehlermeldung ist baulich ausgeschlossen.
   Das Token verlässt die App an GENAU EINER Stelle: dem Authorization-Header
   in ghFetch(). Es wird nie geloggt und nie in eine Meldung gehängt.
   ════════════════════════════════════════════════════════════════════ */
const SYNC_KEY = 'kontoblatt.sync';
const SYNC_PATH_DEFAULT = 'kontoblatt-state.json';
const SYNC_BRANCH = 'main';

/* UTF-8-sicheres Base64 (die Contents-API nimmt ausschliesslich Base64).
   btoa/atob arbeiten auf «binary strings» — ein Byte je Zeichen — und werfen
   bei allem über U+00FF: «Fällig», «Grüsse», «Sparziel für März» reichen schon.
   Deshalb erst nach UTF-8-Bytes kodieren (TextEncoder), dann nach Base64;
   zurück genau umgekehrt. KEIN unescape/encodeURIComponent-Hack — unescape
   ist deprecated und trägt nur bis U+FFFF. Die Byte→String-Wandlung läuft in
   Blöcken, weil String.fromCharCode(...bytes) bei einem kompletten Export
   (hunderttausende Bytes) den Aufruf-Stack sprengt. */
function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(String(str==null?'':str));
  const CH = 0x8000;
  let bin = '';
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
}
function base64ToUtf8(b64){
  /* GitHub liefert Base64 mit Zeilenumbrüchen — die verträgt atob nicht. */
  const bin = atob(String(b64==null?'':b64).replace(/\s+/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* EINE Serialisierung für Datei-Download, Copy-Feld und Upload. exportJSON()
   ruft genau diese Funktion mit S auf; es gibt keine zweite Stelle, die einen
   State zum Versand zusammenbaut — und damit auch keine zweite, die etwas
   Zusätzliches hineinlegen könnte. */
function exportStateJSON(st){ return JSON.stringify(st, null, 2); }

/* ─── Zugangsdaten: eigene Speicherschicht, komplett neben dem App-State ─── */
function defaultSyncCfg(){
  return {owner:'', repo:'', path:SYNC_PATH_DEFAULT, token:'', lastUpload:'', lastDownload:''};
}
function normalizeSyncCfg(raw){
  const d = defaultSyncCfg();
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return d;
  const s = v => (typeof v==='string') ? v.trim() : '';
  d.owner = s(raw.owner);
  d.repo = s(raw.repo);
  d.path = s(raw.path) || SYNC_PATH_DEFAULT;
  d.token = s(raw.token);
  d.lastUpload = s(raw.lastUpload);
  d.lastDownload = s(raw.lastDownload);
  return d;
}
function loadSyncCfg(){
  try{
    const r = (typeof localStorage!=='undefined') ? localStorage.getItem(SYNC_KEY) : null;
    return normalizeSyncCfg(r ? JSON.parse(r) : null);
  }catch(e){ return defaultSyncCfg(); }
}
function saveSyncCfg(cfg){
  try{ if(typeof localStorage!=='undefined') localStorage.setItem(SYNC_KEY, JSON.stringify(normalizeSyncCfg(cfg))); }
  catch(e){}
}
function syncConfigured(cfg){
  const c = normalizeSyncCfg(cfg);
  return !!(c.owner && c.repo && c.path && c.token);
}
/* Pfad-Segmente EINZELN kodieren: Schrägstriche sind im Contents-Endpunkt
   echte Ordnertrenner und dürfen nicht zu %2F werden. */
function syncContentsUrl(cfg){
  const c = normalizeSyncCfg(cfg);
  const path = c.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+path;
}
function syncStamp(d){ const x = d || new Date(); return isNaN(x.getTime()) ? '' : x.toISOString(); }

/* Der PUT-Körper. Bekommt bewusst KEINE Zugangsdaten — Inhalt ist der
   Export-Text, sonst nichts. `sha` nur, wenn die Datei drüben schon liegt
   (ohne sha lehnt GitHub das Überschreiben mit 422 ab, mit falschem mit 409). */
function syncUploadBody(state, sha, ts){
  const body = {
    message: 'Kontoblatt Sync '+String(ts||''),
    content: utf8ToBase64(exportStateJSON(state)),
    branch: SYNC_BRANCH
  };
  if(sha) body.sha = String(sha);
  return body;
}

/* Fehlertexte: nur Status + Richtung. Jeder Fall bekommt einen eigenen,
   handlungsfähigen Satz — «Fehler beim Sync» hilft niemandem. */
function syncErrorText(status, dir){
  const up = dir!=='download';
  switch(status){
    case 0:      return 'Keine Verbindung zu GitHub — Netzwerk prüfen und erneut versuchen.';
    case 'json': return 'Die Datei im Repository ist kein gültiges JSON — es wurde nichts übernommen.';
    case 'big':  return 'Die Datei im Repository ist zu gross für den direkten Abruf (über 1 MB) — GitHub liefert dann keinen Inhalt zurück.';
    case 401:    return 'Anmeldung abgelehnt (401) — das Token ist ungültig oder abgelaufen. Neues Token erstellen und hier eintragen.';
    case 403:    return 'Zugriff verweigert (403) — dem Token fehlt das Recht «Contents: Read and write» für dieses Repository, oder GitHub bremst gerade (Rate-Limit).';
    case 404:    return up
      ? 'Repository oder Pfad nicht gefunden (404) — Benutzername und Repository prüfen; das Token braucht Zugriff auf genau dieses (private) Repository.'
      : 'Noch nichts hochgeladen (404) — unter diesem Pfad liegt im Repository keine Datei. Erst «Hochladen».';
    case 409:    return 'Konflikt (409) — die Datei drüben hat sich zwischenzeitlich geändert. Nochmal «Hochladen».';
    case 422:    return 'GitHub hat die Anfrage abgelehnt (422) — meist ein veralteter Dateistand (sha) oder der Branch «'+SYNC_BRANCH+'» existiert dort nicht. Nochmal versuchen.';
  }
  return 'GitHub antwortet mit Status '+String(status)+' — '+(up?'Hochladen':'Herunterladen')+' abgebrochen.';
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 2: Monats-Motor, Verlauf, Schnellaktionen, Rest, YTD.
   Pure Funktionen auf dem State (headless testbar).
   ════════════════════════════════════════════════════════════════════ */

function monthById(state,id){ return state.months.find(m=>m.id===id); }
function mainAccount(state){ return state.accounts.find(a=>a.kind==='main') || null; }
function fmtDate(d){ return d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4) : '—'; }

/* Salden ändern sich NUR über Buchungen (applyEntry) ODER über einen direkten
   Saldo-Edit, der einen Anpassungs-Eintrag dokumentiert — nie beides für
   dieselbe Bewegung (Sonderfall 6). Anpassungs-Einträge werden beim Anlegen
   NICHT angewendet (der Edit hat den Saldo schon gesetzt); applyEntry(-1)
   beim Löschen rechnet sie sauber zurück. */
function applyEntry(state,l,dir){
  const acc = id => state.accounts.find(a=>a.id===id) || null;
  const from = acc(l.fromId), to = acc(l.toId);
  if(l.type==='eingang'||l.type==='refund'){ if(to) to.balance = round2(to.balance + dir*l.amount); }
  else if(l.type==='ausgang'){ if(from) from.balance = round2(from.balance - dir*l.amount); }
  else if(l.type==='transfer'){
    if(from) from.balance = round2(from.balance - dir*l.amount);
    if(to) to.balance = round2(to.balance + dir*l.amount);
  }
  else if(l.type==='anpassung'){ if(to) to.balance = round2(to.balance + dir*l.amount); }
  /* Ziel-Kopplung (SPEC 2.27 / Sonderfall 13): trägt die Buchung ein goalId,
     wandert der Anteil des zielgebundenen Kontos synchron in goal.saved —
     applyEntry(-1) beim Löschen rechnet BEIDE Seiten zurück. Invariante:
     balance === Σ saved der Ziele dieses Kontos. */
  if(l.goalId){
    const g = state.goals.find(x=>x.id===l.goalId);
    if(g && g.accountId){
      if(g.accountId===l.toId) g.saved = round2(g.saved + dir*l.amount);
      else if(g.accountId===l.fromId) g.saved = round2(g.saved - dir*l.amount);
    }
  }
}
/* Zielgebundene Konten (SPEC 2.27): Konten, auf die mindestens ein Sparziel
   zeigt — OHNE das Hauptkonto (Migration-Fallback zeigt Ziele sonst dorthin).
   Bewegungen an ihnen verlangen ein Ziel (ledger.goalId). */
function goalBackedIds(state){
  const set = new Set();
  state.goals.forEach(g=>{ if(g.accountId) set.add(g.accountId); });
  const main = mainAccount(state);
  if(main) set.delete(main.id);
  return set;
}
function goalsForAccount(state,accId){ return state.goals.filter(g=>g.accountId===accId); }
/* Spaces-Total (SPEC 2.34/E4): Σ aller Space-Salden eines Hauptkontos — zum
   Abgleich mit dem Total der Bank-App (dort: Hauptkonto + Spaces). */
function spacesTotal(state, mainId){
  return round2(state.accounts.filter(a=>a.kind==='space' && a.parentId===mainId)
    .reduce((s,a)=>s+a.balance,0));
}
/* Abgleich (Sonderfall 13, nur melden): Differenz Konto-Saldo vs Σ saved. */
function goalBackedDrift(state){
  const out = [];
  goalBackedIds(state).forEach(id=>{
    const acc = state.accounts.find(a=>a.id===id);
    if(!acc) return;
    const sum = round2(goalsForAccount(state,id).reduce((s,g)=>s+g.saved,0));
    const diff = round2(acc.balance - sum);
    out.push({accountId:id, name:acc.name, balance:acc.balance, goalsSum:sum, diff});
  });
  return out;
}
/* Geldmonat eines Eingangs: explizites moneyMonthId (Instant Pay / Lohn-
   Auszahlung, Etappe 6), sonst das Kalenderdatum. */
function ledgerMoneyMonth(l){ return (l.type==='eingang' && l.moneyMonthId) ? l.moneyMonthId : l.date.slice(0,7); }
function addBooking(state,b){
  const type = nEnum(b.type,['eingang','ausgang','refund','transfer'],'ausgang');
  const source = nEnum(b.source,LEDGER_SOURCES,'manual');
  const entry = { id:uid(), type, desc:nStr(b.desc,''), amount:parseAmount(b.amount),
    fromId:b.fromId||null, toId:b.toId||null, date:nDate(b.date),
    incomeKind: type==='eingang' ? (b.incomeKind==='lohn'?'lohn':'allgemein') : null,
    /* N6: auch die varReserve-Buchung trägt ihren Geldmonat (siehe normalizeState). */
    moneyMonthId: ((type==='eingang' || source==='varReserve') && nMonthId(b.moneyMonthId)) ? nMonthId(b.moneyMonthId) : null,
    goalId: (typeof b.goalId==='string' && b.goalId) ? b.goalId : null,
    source };
  /* N12: dieselbe Regel wie in normalizeState — Schlüssel nur, wenn false. */
  if(b.countsAsLiving===false) entry.countsAsLiving = false;
  state.ledger.push(entry);
  forwardEntryEffect(state,entry);
  return entry;
}
/* N22 (SPEC 2.59): die volle Wirkung EINER Buchung auf den Stand — Salden und
   goal.saved über applyEntry, plus die extraIncome-Spiegelung eines Lohn-
   Eingangs. Bisher stand dieselbe Sache zweimal da (vorwärts in addBooking,
   rückwärts in deleteEntry); jetzt EINMAL, in zwei Richtungen. Das ist die
   Voraussetzung dafür, dass «Bearbeiten» keine dritte Saldo-Rechnung braucht,
   sondern nur zurück + neu vorwärts ist.
   ANPASSUNGEN: bewusst KEINE Ausnahme. Ein Anpassungs-Eintrag wird bei der
   ANLAGE nicht angewendet (der Saldo-Edit hat den Saldo schon gesetzt) —
   deshalb ruft saveAccount forwardEntryEffect auch nicht auf. Sobald er aber
   einmal steht, IST er die dokumentierte Bewegung: zurückrechnen (deleteEntry,
   seit je) und wieder anwenden (Bearbeiten) müssen symmetrisch sein, sonst
   verschöbe jede Änderung den Saldo um den alten Betrag. */
function forwardEntryEffect(state,l){
  applyEntry(state,l,1);
  /* "Eingang: Lohn" zählt als Einkommen des zugeordneten GELDMONATS →
     in month.extraIncome spiegeln (kanonische Quelle der Lohnrechnung). */
  if(l.type==='eingang' && l.incomeKind==='lohn'){
    const mo = monthById(state, ledgerMoneyMonth(l));
    if(mo) mo.extraIncome.push({desc:l.desc, amount:l.amount});
  }
}
function reverseEntryEffect(state,l){
  applyEntry(state,l,-1);
  if(l.type==='eingang' && l.incomeKind==='lohn'){
    const mo = monthById(state, ledgerMoneyMonth(l));
    if(mo){
      const j = mo.extraIncome.findIndex(x=>x.desc===l.desc && x.amount===l.amount);
      if(j>=0) mo.extraIncome.splice(j,1);
    }
  }
}
function deleteEntry(state,id){
  const i = state.ledger.findIndex(l=>l.id===id);
  if(i<0) return false;
  reverseEntryEffect(state, state.ledger[i]);
  state.ledger.splice(i,1);
  return true;
}

/* ─────────── Verlauf-Einträge bearbeiten (N22, SPEC 2.59) ───────────
   EDITIERBAR ist nur, was der Nutzer selbst erfasst hat: eine manuelle Buchung
   (source 'manual') oder eine Saldo-Anpassung (type 'anpassung'). Alle Auto-/
   System-Einträge bleiben gesperrt — nicht aus Vorsicht, sondern weil sie an
   Zählern und Status ausserhalb des Verlaufs hängen: salaryPayout/instantPay/
   fixedSalaryPayout tragen den Geldmonat, aus dem Lohnfenster und
   fixedSalaryBookedFor gelesen wird; varReserve IST der Rücklagen-Zähler des
   Monats (2.46); ccPriority und plannedReserve gehören zu einem Vorschlag bzw.
   einer geplanten Rücklage; quickAction hängt an quickActionsDone;
   quickDeposit und claudeProposal sind die Buchungsspur einer Aktion, die
   anderswo als erledigt gilt. Freies Bearbeiten würde die Buchung von ihrem
   Auslöser entkoppeln — löschen (und neu auslösen) bleibt der ehrliche Weg. */
const ENTRY_EDIT_BLOCKED_SOURCES = ['quickAction','ccPriority','instantPay','salaryPayout',
  'claudeProposal','quickDeposit','varReserve','fixedSalaryPayout','plannedReserve'];
function entryEditable(l){
  if(!l) return false;
  if(ENTRY_EDIT_BLOCKED_SOURCES.indexOf(l.source)>=0) return false;
  return l.source==='manual' || l.type==='anpassung';
}
/* SPEC 2.8: Anpassungen entstehen nur für nicht-zukünftige Monate. Beim
   Bearbeiten gilt dieselbe Grenze für das NEUE Datum — sonst wäre die Regel
   über den Umweg «erst heute anlegen, dann vordatieren» zu umgehen. */
function adjustDateAllowed(state, dateStr){
  const cur = state.settings ? state.settings.currentMonthId : null;
  if(!cur) return true;
  return String(dateStr||'').slice(0,7) <= cur;
}
/* Reine Feld-Ableitung: alter Eintrag + Änderungswunsch → neuer Eintrag.
   Kein State wird angefasst. Was NICHT im patch steht, bleibt unverändert —
   id, source, goalId, moneyMonthId und countsAsLiving überleben also, ausser
   der Nutzer ändert genau diese Dimension. Normalisiert wird mit denselben
   Helfern wie in addBooking (nEnum/parseAmount/nStr/nDate), damit ein
   bearbeiteter Eintrag Feld für Feld aussieht wie ein neu erfasster. */
function buildEditedEntry(old, patch){
  patch = patch || {};
  const has = k => Object.prototype.hasOwnProperty.call(patch,k);
  const e = Object.assign({}, old);
  if(old.type==='anpassung'){
    /* Anpassung: Betrag MIT Vorzeichen (− senkt den Saldo), Beschreibung,
       Datum. Typ und Konto bleiben — sie gehört zu genau EINEM Konto. */
    if(has('amount')) e.amount = round2(parseAmount(patch.amount));
    if(!e.amount) return null;
  } else {
    if(has('type')) e.type = nEnum(patch.type,['eingang','ausgang','refund','transfer'],old.type);
    if(has('amount')) e.amount = Math.abs(round2(parseAmount(patch.amount)));
    if(has('fromId')) e.fromId = patch.fromId || null;
    if(has('toId'))   e.toId   = patch.toId   || null;
    /* Felder, die der neue Typ nicht kennt, fallen weg — wie in addBooking. */
    if(e.type==='eingang'||e.type==='refund') e.fromId = null;
    if(e.type==='ausgang') e.toId = null;
    e.incomeKind = e.type==='eingang'
      ? (has('incomeKind') && patch.incomeKind ? (patch.incomeKind==='lohn'?'lohn':'allgemein')
         : (old.incomeKind==='lohn'?'lohn':'allgemein'))
      : null;
    if(has('goalId')) e.goalId = (typeof patch.goalId==='string' && patch.goalId) ? patch.goalId : null;
    if(!(e.amount>0)) return null;
  }
  if(has('desc')) e.desc = nStr(patch.desc,'');
  if(has('date')) e.date = nDate(patch.date);
  if(has('moneyMonthId')) e.moneyMonthId = nMonthId(patch.moneyMonthId);
  /* Dieselbe Zuständigkeitsregel wie in normalizeState: das Feld gibt es nur
     am Eingang (und an der varReserve-Buchung, die hier nie editierbar ist). */
  if(e.type!=='eingang' && e.source!=='varReserve') e.moneyMonthId = null;
  /* N12: der Schlüssel existiert NUR mit dem Wert false — nie als undefined. */
  if(has('countsAsLiving')){
    if(patch.countsAsLiving===false) e.countsAsLiving = false;
    else delete e.countsAsLiving;
  }
  return e;
}
/* Bearbeiten = alte Wirkung zurück, Felder ersetzen, neue Wirkung anwenden.
   Die id bleibt (der Eintrag ist derselbe, nur richtiger erfasst), die
   Reihenfolge im ledger[] bleibt (Position i), und weil beide Richtungen
   dieselben Primitive nutzen, gilt hinterher exakt derselbe Stand wie bei
   einer Neuerfassung mit den neuen Werten. Es entsteht KEINE zweite
   Saldo-Quelle: hier wird nichts gerechnet, nur zweimal angewendet. */
function editEntry(state,id,patch){
  const i = state.ledger.findIndex(l=>l.id===id);
  if(i<0) return null;
  const old = state.ledger[i];
  if(!entryEditable(old)) return null;
  const next = buildEditedEntry(old, patch);
  if(!next) return null;
  if(next.type==='anpassung' && !adjustDateAllowed(state, next.date)) return null;
  reverseEntryEffect(state, old);
  state.ledger[i] = next;
  forwardEntryEffect(state, next);
  return next;
}

/* ─────────── «Saldo danach» (N22, SPEC 2.60) ───────────
   Wirkung EINER Buchung auf EIN Konto — dieselbe Fallunterscheidung wie
   applyEntry, nur als Zahl statt als Mutation. null heisst «dieses Konto ist
   von dieser Buchung nicht berührt» (nicht 0), damit ein Transfer über 0.00
   nicht mit «unberührt» verwechselt wird. */
function entryDelta(l, accId){
  if(!l || !accId) return null;
  let d = 0, touched = false;
  if(l.type==='eingang' || l.type==='refund' || l.type==='anpassung'){
    if(l.toId===accId){ d += l.amount; touched = true; }
  } else if(l.type==='ausgang'){
    if(l.fromId===accId){ d -= l.amount; touched = true; }
  } else if(l.type==='transfer'){
    if(l.fromId===accId){ d -= l.amount; touched = true; }
    if(l.toId===accId){ d += l.amount; touched = true; }
  }
  return touched ? round2(d) : null;
}
/* VERBINDLICH (N14-Lektion): «Saldo danach» wird NICHT aus Formeln
   rekonstruiert. Anker ist der ECHTE, gespeicherte Kontostand; von dort läuft
   der Verlauf pro Konto RÜCKWÄRTS (neuester → ältester) in exakt der
   Ordnung, in der die Liste ohnehin sortiert ist (Datum absteigend,
   Tie-Break: spätere ledger-Position zuerst). Damit ist der Wert am neuesten
   Eintrag eines Kontos per Konstruktion === account.balance — die Anzeige kann
   gar nicht vom realen Stand abweichen, statt bloss zu sollen.
   Nur für auflösbare, EXISTIERENDE Konten: fehlt der reale Anker (gelöschtes
   Konto), gibt es keinen Wert — nie einen erfundenen Saldo (Muster N15).
   REINE ANZEIGE: diese Funktion liest state und schreibt nichts.
   EHRLICHE GRENZE: der Rückwärtslauf ist so gut wie der Verlauf. Bewegungen
   ohne Eintrag — Startsalden aus dem Setup-Assistenten, Saldo-Edits vor
   setupComplete, ein Import, dessen Konten und Verlauf aus verschiedenen
   Ständen stammen — stehen nicht im ledger. Sie verfälschen nie den NEUESTEN
   Wert (der ist der Anker), sondern wandern in die älteren. Genau deshalb
   wird angekert und nicht rekonstruiert. */
function balancesAfter(state){
  const out = {};
  const running = {};
  state.accounts.forEach(a=>{ running[a.id] = a.balance; });
  sortedLedgerOf(state).forEach(l=>{
    [l.fromId, l.toId].forEach(accId=>{
      if(!accId || !Object.prototype.hasOwnProperty.call(running, accId)) return;
      if(out[l.id] && Object.prototype.hasOwnProperty.call(out[l.id], accId)) return;
      const d = entryDelta(l, accId);
      if(d===null) return;
      if(!out[l.id]) out[l.id] = {};
      out[l.id][accId] = round2(running[accId]);
      running[accId] = round2(running[accId] - d);
    });
  });
  return out;
}

/* Lohnlogik (SPEC 2.3 / 2.20, N8-Teil-B): incomeOverride hat IMMER Vorrang und
   ist IMMER der BRUTTO-Gesamtlohn des Geldmonats — Instant Pays sind darin
   bereits enthalten. Weil jeder «Eingang: Lohn» beim Buchen nach
   month.extraIncome gespiegelt wird (addBooking), steckt der Vorschuss-Anteil
   dort ein zweites Mal → bei gesetztem Override GENAU EINMAL wieder abziehen.
   So lesen Planung (monthIncome) und Lohntag (autoSalaryWindow/bookSalaryPayout)
   denselben Wert als brutto; vorher las nur monthIncome ihn als netto — das war
   der Bug. Ohne Override bleibt alles wie gehabt: gebuchter Lohn schlägt die
   Schätzung workdays × ratePerWorkday. Plan-Monate sind "geplant". */
function shiftIncome(state,month){
  const extra = round2(month.extraIncome.reduce((s,x)=>s+x.amount,0));
  let amount, label;
  if(month.incomeOverride!=null){
    amount = round2(month.incomeOverride + (extra - instantPaySum(state, month.id)));
    label='effektiv';
  }
  else if(extra>0){ amount = extra; label='effektiv'; }
  else { amount = round2((month.workdays||0) * state.workModel.ratePerWorkday); label='geschätzt'; }
  if(month.status==='plan') label='geplant';
  return {amount,label};
}

/* Festlohn als ZWEITE Lohnquelle (N17, SPEC 2.55) — pensum-basiert, netto.
   Die EINZIGE Lesestelle für workModel.fixedSalary und months[].fixedPensum:
   wer den Festlohn braucht, ruft diese Funktion, niemand rechnet ihn nach.
     · enabled=false  → 0. Das ist der Anker für jeden Bestandsstand.
     · pct = months[].fixedPensum ?? workModel.fixedSalary.pensumPercent
       (?? und nicht ||, weil 0 ein GÜLTIGER Monatswert ist: «dieser Monat
       ohne Festlohn» — || würde daraus fälschlich das Standard-Pensum machen).
     · Betrag = fullPensumAmount × pct / 100, round2 wie parseAmount überall.
   N18 (2.55): dazwischen der STARTMONAT. Ein gültiges fs.startMonthId sperrt
   jeden Monat DAVOR auf 0 — der Festlohn greift nicht mehr rückwirkend in
   Monate, in denen es die Stelle noch gar nicht gab. Verglichen wird als
   STRING: bei 'YYYY-MM' ist die lexikografische Ordnung die chronologische
   (feste Breite, führende Null), deshalb braucht es kein Date-Parsing.
   startMonthId null/fehlend/kaputt → nMonthId liefert null → keine Sperre,
   also Zeichen für Zeichen das N17-Verhalten. nMonthId wird hier ERNEUT
   angewandt (nicht bloss auf die Normalisierung vertraut), weil diese
   Funktion — wie der `!fs`-Schutz eine Zeile höher — auch von Hand gebaute
   Stände sieht. */
function fixedIncomeFor(state,month){
  const fs = state.workModel.fixedSalary;
  if(!fs || !fs.enabled) return 0;
  const start = nMonthId(fs.startMonthId);
  if(start && month && month.id < start) return 0;
  /* N19 (2.56): GEBUCHT SCHLÄGT PLAN — exakt das Muster der Schicht-Quelle
     («gebuchter Lohn schlägt die Schätzung», shiftIncome). Liegt für diesen
     Geldmonat mindestens ein Festlohn-Eingang im Verlauf, ist die Summe DIESER
     Eingänge der Festlohn des Monats; sonst gilt weiter die Pensum-Planzahl.
     ENTWEDER/ODER, nie beides — deshalb ist Doppelzählung strukturell
     unmöglich und nicht bloss verboten. Bestandsstände haben keine solche
     Buchung ⇒ dieser Zweig feuert dort nie und N17/N18 bleiben byte-gleich. */
  if(month && fixedSalaryBookedFor(state, month.id)) return fixedSalaryPaidSum(state, month.id);
  const pct = (month && month.fixedPensum!=null) ? month.fixedPensum : fs.pensumPercent;
  if(!(pct>0)) return 0;
  return round2(fs.fullPensumAmount * pct / 100);
}

/* Monatslohn = Schicht-Quelle + Festlohn-Quelle. Zwei Jobs im selben Monat
   sind ausdrücklich erlaubt; die beiden Quellen wissen nichts voneinander.
   Das Label folgt WEITER der Schicht-Quelle (2.3): es beschreibt, wie sicher
   der variable Teil ist — der Festlohn ist per Konstruktion eine Planzahl und
   könnte das Label weder verbessern noch verschlechtern.
   incomeOverride bezieht sich NUR auf die Schicht-Quelle (2.3/2.20) und lässt
   den Festlohn unangetastet — sonst könnte man die zweite Quelle nicht mehr
   getrennt planen, was der ganze Zweck dieser Etappe ist. */
function monthIncome(state,month){
  const shift = shiftIncome(state,month);
  const fx = fixedIncomeFor(state,month);
  return { amount: round2(shift.amount + fx), label: shift.label, shift: shift.amount, fixed: fx };
}

/* Sonderfall 22, N8 umgedeutet: «Override + gebuchter Instant Pay» ist seit
   Teil B der NORMALFALL (Brutto-Override, Vorschuss wird abgezogen) und darf
   NICHT mehr warnen. Es bleiben zwei echte Unplausibilitäten:
     · kind 'low'   — Override < Instant Pays: der Vorschuss wäre grösser als
                      der ganze Brutto-Lohn (dieselbe Schwelle, an der auch
                      bookSalaryPayout die Buchung verweigert).
     · kind 'paid'  — für diesen Geldmonat ist die Rest-Auszahlung schon
                      gebucht (bookSalaryPayout hat den Override dabei bewusst
                      genullt). Wer danach von Hand wieder einen Override setzt,
                      zählt den Lohn doppelt — genau das fing die alte Warnung,
                      und genau das muss sie weiter fangen.
   Die Warnung blockiert nichts und rechnet die Konsequenz mit EINER Quelle vor:
   `total` ist das Ergebnis der monthIncome-Formel, nicht eine zweite Rechnung. */
function overrideSalaryConflict(state, monthId, newOverride){
  if(newOverride==null) return null;
  const m = monthById(state, monthId);
  if(!m) return null;
  const instant = instantPaySum(state, monthId);
  const payout  = salaryPayoutSum(state, monthId);
  const kind = newOverride < instant ? 'low' : (payout>0 ? 'paid' : null);
  if(!kind) return null;
  const extra = round2(m.extraIncome.reduce((s,x)=>s+x.amount,0));
  /* `total` muss weiter das Ergebnis der monthIncome-Formel sein (s. o.) —
     seit N17 gehört der Festlohn dazu, sonst zeigte die Warnung eine Zahl,
     die im Monats-Detail nirgends steht. Die Prüfung selbst (kind) bleibt
     rein auf der Schicht-Quelle: gewarnt wird über Override vs. Vorschüsse. */
  return { kind, instant, payout, booked: round2(instant+payout),
           total: round2(newOverride + (extra - instant) + fixedIncomeFor(state, m)) };
}

/* Ausgaben (SPEC 2.6): tatsächliche Abflüsse per Buchungsdatum — Ausgänge plus
   negative Anpassungen. Transfers, Eingänge und Refunds sind neutral.
   N11: das Kriterium «zählt als Ausgabe» ist in outflowAmount herausgezogen —
   Wort für Wort dieselbe Regel, nur an EINER Stelle. Rückgabe null heisst
   «keine Ausgabe» (nicht 0), damit ein Ausgang über 0.00 den `has`-Merker
   weiter genauso setzt wie vorher. Zweiter Leser: livingSpent (2.32). */
function outflowAmount(l){
  if(l.type==='ausgang') return l.amount;
  if(l.type==='anpassung' && l.amount<0) return -l.amount;
  return null;
}
function monthOutflowsActual(state,monthId){
  let sum=0, has=false;
  state.ledger.forEach(l=>{
    if(l.date.slice(0,7)!==monthId) return;
    const a = outflowAmount(l);
    if(a!==null){ sum += a; has=true; }
  });
  return {sum:round2(sum), has};
}
function monthPlannedOutflows(month){
  let s=0;
  month.fixed.forEach(f=>{ const a = fixAmount(f); s += f.recurrence==='yearly' ? a/12 : a; });
  month.variable.forEach(v=>{ s += v.amount; });
  return round2(s);
}
/* Sonderfall 1: abgeschlossene Monate OHNE Abfluss-Buchungen fallen auf
   Planwerte zurück (nicht 0) — sonst wäre YTD massiv falsch. */
function monthExpenses(state,month){
  if(month.status==='plan') return {amount:monthPlannedOutflows(month), label:'geplant'};
  const a = monthOutflowsActual(state,month.id);
  if(month.status==='done' && !a.has) return {amount:monthPlannedOutflows(month), label:'Planwerte'};
  return {amount:a.sum, label:'aus Buchungen'};
}
/* N5/B4: YTD heisst «year to date» — das Fenster endet IMMER an der Jahresgrenze.
   Startmonat = MAX(ytdStartMonthId, Jahresanfang des aktuellen Monats): innerhalb
   des Jahres gilt die Einstellung weiter («zähle nicht vor diesem Monat»), über die
   Jahresgrenze hinaus kann sie nicht mehr kumulieren. settings bleibt unangetastet —
   eine Nutzer-Einstellung wird nie stillschweigend überschrieben; die Rechnung stimmt
   von selbst. Beide Anzeigen beschriften sich aus dem zurückgegebenen `from`. */
function ytdStats(state){
  const to = state.settings.currentMonthId;
  const yearStart = to.slice(0,4)+'-01';
  const set = state.settings.ytdStartMonthId;
  const from = set > yearStart ? set : yearStart;
  let income=0, expenses=0, count=0;
  state.months.forEach(m=>{
    if(m.id<from || m.id>to) return;
    count++;
    income += monthIncome(state,m).amount;
    expenses += monthExpenses(state,m).amount;
  });
  return {income:round2(income), expenses:round2(expenses), saldo:round2(income-expenses), from, to, count};
}

/* Schnellaktionen (SPEC 2.8): AUSSCHLIESSLICH aus den expliziten
   kind/fromId/toId-Verknüpfungen — kein Raten über Namen/Schlüsselwörter.
   Jahresposten (SPEC 2.12): Monatsrücklage = Jahresbetrag ÷ 12 als Transfer
   aufs Rücklage-Konto. */
function quickActionsFor(state,monthId){
  const month = monthById(state,monthId);
  if(!month) return {open:[], total:0, doneCount:0};
  const done = state.quickActionsDone[monthId] || {};
  const all = [];
  month.fixed.forEach(f=>{
    const fa = fixAmount(f);
    if(fa<=0) return;
    /* passive (SPEC 2.28): nur rechnerisch — steckt schon laufend im Saldo,
       am Monatsende abhaken wäre Doppelbuchung → keine Schnellaktion. Gilt
       unverändert für Sammelposten: passiv → auch die Unterposten sind reine
       Aufschlüsselung (SPEC 2.50), kein Häkchen. */
    if(f.passive) return;
    if(f.recurrence==='yearly'){
      const amt = round2(fa/12);
      if(f.fromId && f.reserveToId) all.push({fixedId:f.id,name:f.name,emoji:f.emoji,amount:amt,kind:'transfer',fromId:f.fromId,toId:f.reserveToId,yearlyAmount:fa});
      else if(f.kind==='debit' && f.fromId) all.push({fixedId:f.id,name:f.name,emoji:f.emoji,amount:amt,kind:'debit',fromId:f.fromId,toId:null,yearlyAmount:fa});
      return;
    }
    /* N10 (SPEC 2.50): Sammelposten mit Unterposten erzeugt EIN Item PRO KIND
       und KEINES für sich selbst. Damit ist Doppelzählung strukturell
       unmöglich — den Elternposten als Ganzes gibt es hier gar nicht mehr.
       Der Merker liegt pro Kind in quickActionsDone[monthId][id::childId];
       «alle Kinder erledigt» = der Sammelposten ist erledigt (er hat dann
       kein offenes Item mehr, ohne Sonderabfrage). */
    const ch = fixChildren(f);
    if(ch){
      ch.forEach(c=>{
        const ca = parseAmount(c.amount);
        if(ca<=0) return;
        const base = {fixedId:f.id+'::'+c.id, name:c.name, emoji:f.emoji, amount:ca,
          yearlyAmount:null, childOf:f.id, parentName:f.name};
        if(f.kind==='transfer' && f.fromId && f.toId) all.push(Object.assign(base,{kind:'transfer',fromId:f.fromId,toId:f.toId}));
        else if(f.kind==='debit' && f.fromId) all.push(Object.assign(base,{kind:'debit',fromId:f.fromId,toId:null}));
      });
      return;
    }
    if(f.kind==='transfer' && f.fromId && f.toId) all.push({fixedId:f.id,name:f.name,emoji:f.emoji,amount:fa,kind:'transfer',fromId:f.fromId,toId:f.toId,yearlyAmount:null});
    else if(f.kind==='debit' && f.fromId) all.push({fixedId:f.id,name:f.name,emoji:f.emoji,amount:fa,kind:'debit',fromId:f.fromId,toId:null,yearlyAmount:null});
  });
  /* %-Töpfe erscheinen als Schnellaktionen (SPEC 2.9); 0-Töpfe (negativer
     Überschuss) und per Doppelzähl-Schutz übersprungene erzeugen kein Item. */
  savingsPots(state,monthId).forEach(p=>{
    if(!p.skipped && p.amount>0 && p.fromId) all.push(p);
  });
  /* Steuer-Rücklage (E9) als Verpflichtung einhängen — verhält sich wie ein
     Jahresrücklage-Posten, aber mit dynamischer, editierbarer Rate. */
  const tr = taxReserveQuickItem(state, monthId);
  if(tr) all.push(tr);
  /* Rücklage variable Kosten (N6) — gleiches Muster. Ihr Zustand steckt NICHT
     in quickActionsDone, sondern in der Differenz «Σ variable − zurückgelegt»
     (der Verlauf ist der Zähler). Deshalb entscheidet der Betrag über offen/
     erledigt: > 0 = offen, 0 = erledigt. Nur so rechnet die Aktion nach, wenn
     Leo einen Posten nachträglich ändert — ein Häkchen würde sie stumm schalten. */
  const vr = varReserveQuickItem(state, monthId);
  if(vr) all.push(vr);
  /* Geplante Rücklagen (N20, SPEC 2.57) — EIGENES Konzept, nicht Teil von
     variable[]/varReserve. Ihr Zustand steckt in plannedReserves[].status,
     nicht in quickActionsDone: sie sind offen, solange status 'planned' ist
     (plannedReserveItems filtert schon darauf), und verschwinden mit dem
     Buchen von selbst. Der `done`-Filter unten greift sie deshalb nie —
     executeQuickAction schreibt für sie bewusst KEINEN Merker (Muster N6). */
  plannedReserveItems(state, monthId).forEach(x=>all.push(x));
  const open = all.filter(x=> x.varReserve ? x.amount>0 : !done[x.fixedId]);
  return {open, total:all.length, doneCount:all.length-open.length};
}
function executeQuickAction(state,monthId,fixedId){
  const qa = quickActionsFor(state,monthId).open.find(x=>x.fixedId===fixedId);
  if(!qa) return null;
  /* N6: die Rücklage der variablen Kosten trägt ihren Geldmonat im Eintrag und
     setzt bewusst KEINEN Erledigt-Merker — der Verlauf führt den Stand
     (varReservedFor). Erneutes Erledigen ist unmöglich, weil die Differenz
     danach 0 ist und die Aktion damit nicht mehr offen ist. */
  const entry = addBooking(state,{ type: qa.kind==='transfer'?'transfer':'ausgang',
    desc:(qa.emoji?qa.emoji+' ':'')+qa.name, amount:qa.amount,
    fromId:qa.fromId, toId:qa.toId, date:today(),
    source: qa.varReserve ? 'varReserve' : (qa.plannedReserve ? 'plannedReserve' : 'quickAction'),
    moneyMonthId: qa.varReserve ? monthId : null });
  if(qa.varReserve) return entry;
  /* N20 (SPEC 2.57): der Zustand einer geplanten Rücklage lebt in ihrem
     `status`, nicht in quickActionsDone — ein zweiter Merker wären zwei
     Wahrheiten. Rückgängig läuft über den Snapshot (doQuickAction), der den
     status zusammen mit Saldo und Verlauf auf 'planned' zurückstellt. */
  if(qa.plannedReserve){
    const pr = state.plannedReserves.find(x=>x.id===qa.reserveId);
    if(pr) pr.status = 'reserved';
    return entry;
  }
  if(!state.quickActionsDone[monthId]) state.quickActionsDone[monthId]={};
  state.quickActionsDone[monthId][qa.fixedId]=true;
  /* Steuer-Rücklage erhöht den eigenen "bereits zurückgelegt"-Zähler (E9),
     damit das Rücklage-Konto auch andere Mittel halten kann. */
  if(qa.tax) state.taxPlan.reserved = round2(state.taxPlan.reserved + qa.amount);
  return entry;
}

/* Vorlage→Monate-Übernahme (SPEC 2.28/2.31, E2): Monats-Kopien matchen über
   tplId (robust, seit E2 beim Anlegen gesetzt), ältere Kopien ohne tplId über
   den NAMEN. done-Monate werden NIE angefasst. Felder: passive, dueMonth. */
function tplMatches(tpl, f){
  return f.tplId ? f.tplId===tpl.id : f.name===tpl.name;
}
/* N10: `children` ist ein ARRAY. Ein `!==`-Vergleich wäre hier immer «ungleich»
   (Referenzvergleich) → die Übernahme würde jeden Monat als Treffer melden und
   allen Monaten DIESELBE Array-Referenz unterschieben (eine Änderung an einem
   Monat hätte alle anderen mitverändert). Darum: Wert-Vergleich beim Prüfen und
   deepClone beim Zuweisen. Alle anderen Felder (passive/dueMonth) bleiben Wort
   für Wort beim bisherigen Identitätsvergleich. */
function tplFieldEq(field, a, b){
  if(field!=='children') return a===b;
  return deepEqual(a||null, b||null);
}
function tplFieldVal(field, value){
  return field==='children' ? (value ? deepClone(value) : undefined) : value;
}
function tplPropagationTargets(state, tpl, field, value){
  return state.months.filter(m=>m.status!=='done' && m.fixed.some(f=>tplMatches(tpl,f) && !tplFieldEq(field,f[field],value)));
}
function applyTplFieldToMonths(state, tpl, field, value){
  let n=0;
  state.months.forEach(m=>{
    if(m.status==='done') return;
    m.fixed.forEach(f=>{
      if(tplMatches(tpl,f) && !tplFieldEq(field,f[field],value)){
        f[field] = tplFieldVal(field, value);
        if(!f.tplId) f.tplId = tpl.id;  /* Verknüpfung dauerhaft reparieren */
        n++;
      }
    });
  });
  return n;
}
/* Stilles Scheitern verhindern (E2): curr/plan-Monate mit Posten, aber OHNE
   Treffer für diese Vorlage → Kandidaten fürs manuelle Zuordnungs-Sheet. */
function tplUnmatchedMonths(state, tpl){
  return state.months.filter(m=>m.status!=='done' && m.fixed.length>0 && !m.fixed.some(f=>tplMatches(tpl,f)));
}
/* Manuelle Zuordnung: setzt tplId auf der gewählten Monats-Kopie und übernimmt
   die Felder der Vorlage-Änderung. */
function assignTplToMonthItem(state, tpl, monthId, fixedId, changes){
  const m = monthById(state, monthId);
  const f = m ? m.fixed.find(x=>x.id===fixedId) : null;
  if(!f) return false;
  f.tplId = tpl.id;
  (changes||[]).forEach(c=>{ f[c.field] = tplFieldVal(c.field, c.value); });
  return true;
}

/* ─────────── N9: EINE Schwelle je Monat (SPEC 2.15 neu gefasst / 2.49) ───────────
   `effectiveMinimum(state, monthId)` ist ab jetzt die EINZIGE Quelle der
   Warnschwelle. month.liquidMinimum (optional) schlägt settings.liquidMinimum
   (globaler Default). Kein zweites Schwellensystem, keine Automatik: gesetzt
   wird der Monatswert nur von Hand (Monats-Detail) oder per Vorschlag.
   Jeder Verbraucher fragt für DEN Monat, über den er redet — Mehr-Monats-
   Stellen (Engpass-Checkpoints, Prognose) fragen pro Checkpoint/Zeile. */
function effectiveMinimum(state, monthId){
  const m = monthById(state, monthId);
  const v = m ? m.liquidMinimum : null;
  return (typeof v==='number' && isFinite(v) && v>=0) ? v : state.settings.liquidMinimum;
}

/* "Rest zum Ausgeben" (SPEC 2.7, Sonderfall 2): aktueller Hauptkonto-Saldo
   MINUS alle diesen Monat noch offenen Verpflichtungen ab Hauptkonto.
   Bewusst vom Kontostand, nicht vom Lohn. "Leben" (kind none) wird im
   laufenden Monat NICHT projiziert. Etappe 3 ergänzt: KK-Begleichung ab
   Hauptkonto + offene Sparraten/%-Töpfe. */
function restToSpend(state){
  const main = mainAccount(state);
  if(!main) return null;
  const items = quickActionsFor(state,state.settings.currentMonthId).open.filter(x=>x.fromId===main.id).slice();
  /* Passive Fixkosten (SPEC 2.28 / Sonderfall 14): zählen VOLL als offene
     Verpflichtung ab Hauptkonto (konservativ), sind aber nicht abhakbar —
     quickActionsFor liefert sie bewusst nicht. */
  const cm = monthById(state, state.settings.currentMonthId);
  if(cm) cm.fixed.forEach(f=>{
    const fa = fixAmount(f);
    if(!f.passive || fa<=0) return;
    if(f.fromId && f.fromId!==main.id) return;
    /* N10: ein passiver Sammelposten zählt als EINE Verpflichtung über Σ
       children — er ist nicht abhakbar, also gibt es hier nichts zu einzeln
       Erledigendem; die Aufschlüsselung steht im Monats-Detail und im Editor. */
    items.push({fixedId:'passive_'+f.id, name:f.name, emoji:f.emoji, amount:fa,
      kind:'passive', fromId:main.id, toId:null, yearlyAmount:null, passive:true,
      childCount: fixChildren(f) ? f.children.length : 0});
  });
  /* KK-Begleichung zählt im Rest, falls sie ab Hauptkonto erfolgen müsste
     (SPEC 2.7): zuständig ist das Konto gleicher Bank, sonst das Hauptkonto. */
  state.accounts.forEach(cc=>{
    if(cc.kind!=='creditcard' || cc.balance>=0) return;
    const resp = responsibleAccountFor(state,cc);
    if(resp && resp.id===main.id) items.push({fixedId:'kk_'+cc.id, name:'KK-Begleichung '+cc.name,
      emoji:cc.emoji, amount:round2(-cc.balance), kind:'kk', fromId:main.id, toId:cc.id, yearlyAmount:null});
  });
  const open = round2(items.reduce((s,x)=>s+x.amount,0));
  const rest = round2(main.balance - open);
  /* N9: Schwelle des LAUFENDEN Monats (Rest ist eine reine Monatsgrösse).
     `min` wandert mit ins Ergebnis, damit Anzeige und Rechnung nie driften. */
  const min = effectiveMinimum(state, state.settings.currentMonthId);
  /* N16 (SPEC 2.7 erweitert): derselbe Rest, nur bis zur Warnschwelle statt bis
     auf null gerechnet. `rest` beantwortet «was darf weg, bis das Konto leer
     ist» — das respektiert die Notlinie nicht. `free` beantwortet «was darf weg,
     bis ich sie berühre». KEINE neue Rechnung und keine zweite Quelle: dieselben
     `items`, dieselbe `min`, an der eine Zeile weiter unten schon die Warnfarbe
     hängt. «Leben» ist darin ENTHALTEN, nicht abgezogen — der Rest projiziert
     Budget-Posten ohne Verknüpfung im laufenden Monat bewusst nicht (2.7), der
     Betrag deckt also auch alles, was diesen Monat noch fürs Leben weggeht.
     Bewusst NICHT bei 0 gekappt: negativ ist die Aussage «Schwelle bereits
     unterschritten» und deckungsgleich mit warn 'low'/'negative' (N16 (2)). */
  const free = round2(rest - min);
  return { rest, open, items, main, min, free,
    warn: rest<0 ? 'negative' : (rest<min ? 'low' : null) };
}

/* Monats-Anlage (Kopie der Fixkosten-Vorlage) + manueller aktueller Monat
   (SPEC 2.4): Umstellen setzt den bisherigen aktuellen Monat auf "done";
   Schnellaktionen und Rest springen mit, weil sie currentMonthId lesen. */
function createMonthFromTemplate(state,id,status){
  const month = { id, name:germanMonthName(id), year:parseInt(id.slice(0,4),10),
    status:status||'plan', workdays:0, incomeOverride:null, extraIncome:[], fixedPensum:null,
    /* tplId verweist auf den Vorlage-Posten (SPEC 2.28/E2) — Übernahmen
       Vorlage→Monat matchen darüber, unabhängig vom Namen. */
    fixed: state.fixedCosts.map(f=>Object.assign(deepClone(f),{id:uid(), tplId:f.id})),
    variable:[], liquidMinimum:null, note:'' };
  state.months.push(month);
  state.months.sort((a,b)=>a.id<b.id?-1:1);
  return month;
}
function setCurrentMonth(state,id){
  state.months.forEach(m=>{ if(m.status==='curr') m.status='done'; });
  let m = monthById(state,id);
  if(!m) m = createMonthFromTemplate(state,id,'curr');
  m.status = 'curr';
  state.settings.currentMonthId = id;
  return m;
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 3: %-Sparmodell, Jahres-Fälligkeit, KK-Vorrang, Engpass.
   ════════════════════════════════════════════════════════════════════ */

/* Überschuss (SPEC 2.9 / Sonderfall 5): Monatslohn (effektiv/geschätzt)
   − alle PFLICHT-Fixkosten des Monats (yearly anteilig ÷12). Die %-Töpfe
   selbst stehen nie in month.fixed; variable Einmalkosten zählen NICHT. */
function surplusFor(state,month){
  const income = monthIncome(state,month).amount;
  let fix = 0;
  month.fixed.forEach(f=>{ const a = fixAmount(f); fix += f.recurrence==='yearly' ? a/12 : a; });
  fix = round2(fix);
  return {income, fix, surplus: round2(income - fix)};
}

/* %-Töpfe: verteilen den Überschuss prozentual auf Ziel-Konten. Doppelzähl-
   Schutz: hat der Monat noch einen festen Transfer aufs gleiche Ziel, wird
   KEIN Topf-Item erzeugt (skipped). Negativer Überschuss → Töpfe 0 CHF. */
function savingsPots(state,monthId){
  if(state.savingsModel.mode!=='percent') return [];
  const month = monthById(state,monthId);
  if(!month) return [];
  const main = mainAccount(state);
  const sur = surplusFor(state,month).surplus;
  return state.savingsModel.allocations.map(a=>{
    const acc = state.accounts.find(x=>x.id===a.targetId);
    if(!acc) return null;
    const skipped = month.fixed.some(f=>f.kind==='transfer' && f.toId===a.targetId && fixAmount(f)>0);
    const amount = (!skipped && sur>0) ? round2(sur*a.percent/100) : 0;
    return {fixedId:'pot_'+a.targetId, targetId:a.targetId, name:acc.name, emoji:acc.emoji,
      percent:a.percent, amount, kind:'transfer', fromId:main?main.id:null, toId:a.targetId,
      yearlyAmount:null, pot:true, skipped};
  }).filter(Boolean);
}

/* fix→percent-Umschaltung (SPEC 2.9): nur nach Bestätigung; entfernt feste
   Sparposten (Transfers auf Topf-Ziele) aus Vorlage + aktuellem Monat. */
function affectedFixedForPercent(st){
  const targets = new Set(st.savingsModel.allocations.map(a=>a.targetId));
  const list = [];
  st.fixedCosts.forEach(f=>{ if(f.kind==='transfer' && f.toId && targets.has(f.toId)) list.push({scope:'Vorlage', id:f.id, name:f.name}); });
  const cm = monthById(st, st.settings.currentMonthId);
  if(cm) cm.fixed.forEach(f=>{ if(f.kind==='transfer' && f.toId && targets.has(f.toId)) list.push({scope:cm.name+' '+cm.year, id:f.id, name:f.name}); });
  return list;
}
function switchToPercent(st){
  const aff = affectedFixedForPercent(st);
  const ids = new Set(aff.map(x=>x.id));
  st.fixedCosts = st.fixedCosts.filter(f=>!ids.has(f.id));
  const cm = monthById(st, st.settings.currentMonthId);
  if(cm) cm.fixed = cm.fixed.filter(f=>!ids.has(f.id));
  st.savingsModel.mode = 'percent';
  return aff;
}

/* Jahresrechnung im dueMonth (SPEC 2.12): begleichbar aus dem angesparten
   Topf. Ansparen ≠ bezahlen — die Rechnung ist KEINE Rest-Verpflichtung
   (kommt nicht vom Hauptkonto), die Zahlung zählt genau einmal als Ausgang. */
function yearlyDueFor(state,monthId){
  const month = monthById(state,monthId);
  if(!month) return [];
  const mNum = parseInt(monthId.slice(5,7),10);
  const done = state.quickActionsDone[monthId] || {};
  const out = [];
  month.fixed.forEach(f=>{
    const fa = fixAmount(f);
    if(f.recurrence!=='yearly' || f.dueMonth!==mNum || fa<=0) return;
    if(done['due_'+f.id]) return;
    const payFromId = f.reserveToId || f.fromId || null;
    if(!payFromId) return;
    out.push({fixedId:f.id, dueKey:'due_'+f.id, name:f.name, emoji:f.emoji, amount:fa, payFromId});
  });
  return out;
}
function payYearlyDue(state,monthId,fixedId){
  const d = yearlyDueFor(state,monthId).find(x=>x.fixedId===fixedId);
  if(!d) return null;
  const entry = addBooking(state,{type:'ausgang', desc:(d.emoji?d.emoji+' ':'')+d.name+' (Jahresrechnung)',
    amount:d.amount, fromId:d.payFromId, date:today(), source:'quickAction'});
  if(!state.quickActionsDone[monthId]) state.quickActionsDone[monthId]={};
  state.quickActionsDone[monthId][d.dueKey]=true;
  return entry;
}

/* KK-Vorrang (SPEC 2.10 / Sonderfall 3). Zuständig = Konto gleicher Bank
   (kein Space, keine KK), sonst Hauptkonto. liquidMinimum schützt NUR das
   Hauptkonto; andere Quellen dürfen bis 0. Topf-Reihenfolge: Ziele ohne
   Datum zuerst, dann fernstes Zieldatum zuerst. Alles nur Vorschlag. */
function responsibleAccountFor(state,cc){
  const same = state.accounts.find(a=>a.id!==cc.id && a.kind!=='creditcard' && a.kind!=='space' && a.bank && a.bank===cc.bank);
  return same || mainAccount(state);
}
function monthsUntil(fromMonthId,toMonthId){
  const fy=parseInt(fromMonthId.slice(0,4),10), fm=parseInt(fromMonthId.slice(5,7),10);
  const ty=parseInt(toMonthId.slice(0,4),10), tm=parseInt(toMonthId.slice(5,7),10);
  return Math.max(1,(ty-fy)*12+(tm-fm));
}
function avgPlanLiquidity(state){
  const plans = state.months.filter(m=>m.status==='plan');
  if(!plans.length) return null;
  let s=0;
  plans.forEach(m=>{ s += monthIncome(state,m).amount - monthPlannedOutflows(m); });
  return round2(s/plans.length);
}

/* Ziel-Kohärenz (SPEC 2.30 / Sonderfall 16): nötige Rate = aufgerundet
   (target − saved) ÷ Restmonate (monthsUntil: Zielmonat inkl., aktueller
   exkl.) — EINE Formel, identisch mit der KK-Vorrang-Neuberechnung (2.10). */
function goalNeededRate(state, g, savedOverride){
  if(!(g.target>0) || !g.targetDate) return null;
  const saved = savedOverride!=null ? savedOverride : g.saved;
  const remaining = monthsUntil(state.settings.currentMonthId, g.targetDate);
  return Math.max(0, Math.ceil((g.target - saved)/remaining));
}
/* Vergleichsbasis: fixed → rate (CHF/Mo); percent → CHF aus dem aktuellen
   Überschuss (dieselbe Rechnung wie die Ziele-Anzeige). Nur melden — hinter
   Plan wird NIE automatisch korrigiert (Ein-Tap-Fix auf Wunsch). */
function goalCoherence(state){
  const month = monthById(state, state.settings.currentMonthId);
  const out = [];
  state.goals.forEach(g=>{
    /* Kohärenz nur für Ziele mit Betrag UND Datum (wie bisher goalNeededRate!=null). */
    if(!(g.target>0) || !g.targetDate) return;
    /* N2 (B2): Zieldatum in der Vergangenheit → «abgelaufen» statt Fantasie-Rate
       (monthsUntil kappt auf 1 → sonst ganzer Restbetrag als «Rate/Mo»). Kein
       «hinter Plan», keine Rate; Datum wird NIE automatisch verschoben. */
    const expired = g.targetDate < state.settings.currentMonthId;
    const needed = expired ? null : goalNeededRate(state,g);
    let monthlyChf = null;
    if(g.rateMode==='fixed') monthlyChf = g.rate;
    else if(state.savingsModel.mode==='percent' && month)
      monthlyChf = round2(Math.max(0, surplusFor(state,month).surplus) * g.rate/100);
    const behind = !expired && monthlyChf!=null && monthlyChf < needed;
    out.push({goalId:g.id, name:g.name, rateMode:g.rateMode, rate:g.rate,
      monthlyChf, needed, behind, expired, targetDate:g.targetDate});
  });
  return out;
}
function goalsBehindPlan(state){ return goalCoherence(state).filter(c=>c.behind); }
/* Steuer «bezahlt» (SPEC 2.25/N2): der Merker quickActionsDone[dueMonth]['tax_due']
   (gesetzt von payTaxBill) IST der Erledigt-Zustand — KEIN Auto-Roll, KEIN neues
   Schema-Feld. Solange er steht, gilt der Plan als beglichen und wartet auf einen
   neuen dueMonth (dessen Merker leer ist → Reaktivierung). */
function taxPaid(state){
  const tp = state.taxPlan;
  return !!(tp.enabled && tp.dueMonth && (state.quickActionsDone[tp.dueMonth]||{})['tax_due']);
}
/* Steuer-Kohärenz (SPEC 2.30): taxMonthlyRate IST die nötige Rate (selbst-
   anpassend). Flags: überfällig/nicht gedeckt (deutlich) + «Rate wirkt hoch»
   (dezent — gleiche Semantik wie KK-Vorrang rateHigh). Bezahlt (N2) → kein Flag. */
function taxCoherence(state){
  const tp = state.taxPlan;
  if(!tp.enabled || !tp.dueMonth || tp.amount<=0) return null;
  if(taxPaid(state)) return null;   /* N2 (B1): bezahlt → kein overdue/rateHigh mehr */
  const rate = taxMonthlyRate(state);
  const missing = round2(Math.max(0, tp.amount - tp.reserved));
  const overdue = state.settings.currentMonthId >= tp.dueMonth && missing > 0;
  const avg = avgPlanLiquidity(state);
  return {rate, missing, overdue, rateHigh: avg!=null && rate>avg, dueMonth: tp.dueMonth};
}

/* System-To-Dos (SPEC 2.33 / Sonderfall 20): Soll-Liste aus den Kohärenz-
   Bedingungen (2.30) + KK-Vorrang (2.10), stabile Keys pro Bedingung. */
function systemTodos(state){
  const list = [];
  goalCoherence(state).forEach(c=>{
    if(c.expired){
      /* N2 (B2): eigener Key (sys_goalexp_ kollidiert nicht mit sys_goal_) → Ein-Tap
         öffnet den Ziel-Editor, nie eine Rate. */
      list.push({ key:'sys_goalexp_'+c.goalId, category:'sparen',
        title:'Zieldatum «'+c.name+'» abgelaufen — neu setzen oder Ziel abschliessen',
        detail:'Das Zieldatum '+monthLabel(c.targetDate)+' liegt in der Vergangenheit. Im Ziel-Editor ein neues Datum setzen oder das Ziel abschliessen.' });
    } else if(c.behind){
      list.push({ key:'sys_goal_'+c.goalId, category:'sparen',
        title:'Sparziel «'+c.name+'» hinter Plan',
        detail:'Beitrag '+(c.monthlyChf!=null?fmtAmt(c.monthlyChf):'—')+'/Mo → nötig '+fmtAmt(c.needed)+'/Mo bis '+monthLabel(c.targetDate)+'. In der Ziele-Ansicht fixen (Ein-Tap).' });
    }
  });
  const tc = taxCoherence(state);
  if(tc && tc.overdue){
    list.push({ key:'sys_tax_overdue', category:'steuern',
      title:'Steuer-Rücklage reicht nicht',
      detail:'Fälligkeit '+monthLabel(tc.dueMonth)+' erreicht — es fehlen '+fmtMoney(tc.missing)+' im Topf.' });
  }
  ccPriorityProposals(state).forEach(p=>{
    list.push({ key:'sys_kk_'+p.ccId, category:'kk',
      title:'Kreditkarte «'+p.ccName+'» begleichen',
      detail:'Schuld '+fmtMoney(p.debt)+' — Vorschlagskarte auf Home prüfen (KK-Vorrang).' });
  });
  /* N13 (SPEC 2.52): ein Fixposten, dessen Aktion mangels Konto-Verknüpfung gar
     nicht ausführbar IST, verschwindet lautlos — quickActionsFor erzeugt kein
     Item (SPEC 2.8: keine Aktion ohne explizite Verknüpfung, kein Raten) und
     restToSpend zählt ihn deshalb nicht als offene Verpflichtung, WÄHREND
     monthPlannedOutflows den Betrag weiterrechnet. Der Posten ist also im Plan,
     aber weder abhakbar noch im Rest. Dieser Hinweis macht genau diese Lücke
     sichtbar — er RECHNET nichts und SETZT nichts (ein geratenes Quellkonto
     wäre eine Buchung gegen ein erfundenes Konto). Nur laufender/geplanter
     Monat: in abgeschlossenen Monaten ist der Posten Historie.
     Betrag über fixAmount → ein Sammelposten (2.50) wird über Σ children
     beurteilt, nicht über sein Rückfall-`amount`. */
  state.months.forEach(m=>{
    if(m.status!=='curr' && m.status!=='plan') return;
    m.fixed.forEach(f=>{
      if(f.passive || f.kind==='none' || fixAmount(f)<=0) return;
      const missTo = f.kind==='transfer' && !f.toId;
      if(!(!f.fromId || missTo)) return;
      /* Beide Enden können fehlen; benannt wird, was WIRKLICH fehlt — «kein
         Quellkonto» bei einem Transfer ohne Ziel wäre schlicht falsch. */
      const was = !f.fromId ? (missTo ? 'weder Quell- noch Zielkonto' : 'kein Quellkonto') : 'kein Zielkonto';
      list.push({ key:'sys_nosrc_'+m.id+'_'+f.id, category:'allgemein',
        title:'Posten «'+f.name+'» ('+monthLabel(m.id)+') hat '+was+' — erscheint in keiner Schnellaktion',
        detail:fmtMoney(fixAmount(f))+' stehen im Monatsplan, aber ohne vollständige Konto-Verknüpfung ist die Aktion nicht ausführbar: der Posten fehlt in den Schnellaktionen und im «Rest zum Ausgeben» — der Rest zeigt also zu viel als frei an. Im Fixkosten-Editor das Konto setzen; danach löst sich dieser Hinweis von selbst auf.' });
    });
  });
  /* N20 (SPEC 2.57): das Geld ist zurückgelegt und der Gebraucht-Monat ist da.
     Bedingung — status 'reserved' UND ein needMonthId, der erreicht oder
     überschritten ist. Wie jedes System-To-Do erscheint es, solange die
     Bedingung wahr ist, und löst sich auf, sobald status 'done' ist; showFrom
     wird NIE gesetzt (2.33) — die Bedingung IST die Sichtbarkeitsregel.
     Erinnerung, keine Buchung: die echte Zahlung läuft über den normalen
     Buchungs-Fluss aus dem Zielkonto. */
  state.plannedReserves.forEach(r=>{
    if(r.status!=='reserved' || !r.needMonthId) return;
    if(r.needMonthId > state.settings.currentMonthId) return;
    list.push({ key:'sys_reserve_'+r.id, category:'sparen',
      title:'Fällig: '+r.name+' — '+fmtMoney(parseAmount(r.amount))+' liegt auf '+accName(state, r.toId),
      detail:'Zurückgelegt für '+monthLabel(r.needMonthId)+'. Zahl die Ausgabe aus «'+accName(state, r.toId)
        +'» und markier die Rücklage danach als gebraucht — gebucht wird hier nichts.'
        + (r.note ? ' Notiz: '+r.note : '') });
  });
  return list;
}
/* Idempotenter Abgleich: legt fehlende system-todos an (immer high, seen:false),
   aktualisiert Titel/Detail, und ENTFERNT Einträge, deren Bedingung weg ist —
   auto-auflösend. claude/manual-todos bleiben unberührt (bis zum Abhaken). */
function syncSystemTodos(state){
  const want = systemTodos(state);
  const keys = new Set(want.map(w=>w.key));
  state.todos = state.todos.filter(t=>t.source!=='system' || keys.has(t.id));
  want.forEach(w=>{
    const t = state.todos.find(x=>x.id===w.key);
    if(t){ t.title = w.title; t.detail = w.detail; t.status = 'open'; }
    /* showFrom bleibt bei System-To-Dos IMMER null (N4): sie erscheinen genau
       dann, wenn ihre Bedingung wahr ist — ein Erscheinungsdatum wäre eine
       zweite, konkurrierende Sichtbarkeitsregel. */
    else state.todos.push({ id:w.key, createdAt:today(), title:w.title, detail:w.detail,
      status:'open', priority:'high', category:w.category, monthId:null,
      source:'system', doneAt:null, showFrom:null, seen:false });
  });
  return state.todos.filter(t=>t.source==='system').length;
}
function todoOpenCount(state){ return state.todos.filter(t=>t.status==='open').length; }
function todoNewCount(state){ return state.todos.filter(t=>!t.seen && t.status==='open').length; }
/* U3.3 De-Duplizierung: To-Dos, die der «Heute zu tun»-Block anzeigt — System-
   To-Dos, deren Bedingung bereits im Status-Band steht, werden NICHT nochmal
   gerendert (eine Bedingung erscheint nie doppelt). Abgleich über den stabilen
   Key aus warningItems(), bewusst NICHT über source allein: ein künftiges
   System-To-Do ohne Band-Gegenstück bliebe im Block sichtbar. Die System-To-Do-
   Engine (systemTodos/syncSystemTodos/Merge) ist davon unberührt — reine Anzeige. */
/* showFrom (N4, SPEC 2.33): Erscheinungsdatum. null oder <= heute → sichtbar wie
   bisher; > heute → noch nicht dran. Reiner String-Vergleich (ISO-Datum sortiert
   lexikografisch) — keine Zeitzonen-Rechnerei. */
function todoDueToShow(t, ref){ return !t.showFrom || t.showFrom <= (ref || today()); }
function todayVisibleTodos(state, ref){
  const band = new Set(warningItems(state).map(i=>i.key));
  return state.todos.filter(t=>!(t.source==='system' && band.has(t.id)) && todoDueToShow(t, ref));
}
/* Die per showFrom (noch) verborgenen To-Dos — auffindbar im eingeklappten
   «Später (n)», damit nichts unsichtbar verschwindet. Dieselbe Band-De-Dup wie
   todayVisibleTodos: was im Band steht, taucht auch hier nie auf. */
function todayLaterTodos(state, ref){
  const band = new Set(warningItems(state).map(i=>i.key));
  return state.todos.filter(t=>!(t.source==='system' && band.has(t.id)) && !todoDueToShow(t, ref));
}
/* U3.2: EIN Zähler für Block-Titel UND Seitenleisten-Panel — zählt NUR die im
   Block tatsächlich gerenderten offenen Punkte NACH der De-Duplizierung:
   offene Schnellaktionen + fällige Jahres-/Steuerrechnungen + sichtbare offene
   To-Dos. Im Band unterdrückte System-To-Dos zählen NICHT mit. */
function todayOpenCount(state, ref){
  const monthId = state.settings.currentMonthId;
  const hasMonth = !!monthById(state,monthId);
  const qa = hasMonth ? quickActionsFor(state,monthId) : {open:[]};
  const dues = hasMonth ? yearlyDueFor(state,monthId) : [];
  const tax = hasMonth ? taxDueFor(state) : null;
  return qa.open.length + dues.length + (tax?1:0)
       + todayVisibleTodos(state, ref).filter(t=>t.status==='open').length;
}
function todayNewCount(state, ref){ return todayVisibleTodos(state, ref).filter(t=>t.status==='open' && !t.seen).length; }
/* Ein-Tap-Aktion eines System-To-Dos (SPEC 2.33/E4): aus dem stabilen Key
   abgeleitet — reines Mapping, kein Schema-Feld. Bucht NIE ohne Bestätigung. */
function sysTodoAction(id){
  /* N20: eigener Prefix, kollidiert mit keinem bestehenden Key. Die Aktion
     markiert NUR den Status — sie bucht nichts (2.57). */
  if(id.startsWith('sys_reserve_')) return {kind:'reserve', reserveId:id.slice(12), label:'Als gebraucht markieren'};
  if(id.startsWith('sys_goalexp_')) return {kind:'goalexp', goalId:id.slice(12), label:'Zieldatum neu setzen'};
  if(id.startsWith('sys_goal_')) return {kind:'goal', goalId:id.slice(9), label:'Rate auf nötig setzen'};
  if(id.startsWith('sys_kk_'))   return {kind:'kk',   ccId:id.slice(7),   label:'Vorschlag prüfen'};
  if(id==='sys_tax_overdue')     return {kind:'tax',                      label:'Zum Steuer-Planer'};
  return null;
}
function ccPriorityProposals(state){
  const main = mainAccount(state);
  const out = [];
  /* N9: KK-Vorrang ist eine Aussage über JETZT → Schwelle des laufenden Monats. */
  const min = effectiveMinimum(state, state.settings.currentMonthId);
  state.accounts.forEach(cc=>{
    if(cc.kind!=='creditcard' || cc.balance>=0) return;
    const debt = round2(-cc.balance);
    const resp = responsibleAccountFor(state,cc);
    if(!resp) return;
    const isMain = main && resp.id===main.id;
    const avail = round2(Math.max(0, isMain ? resp.balance - min : resp.balance));
    if(avail>=debt) return; /* zuständiges Konto schafft es allein → keine Karte */
    const steps = [];
    let need = debt;
    const fromResp = round2(Math.min(need,avail));
    if(fromResp>0){ steps.push({kind:'account', accountId:resp.id, name:resp.name, amount:fromResp}); need = round2(need-fromResp); }
    const goals = state.goals.slice().sort((a,b)=>{
      if(!a.targetDate && !b.targetDate) return 0;
      if(!a.targetDate) return -1;
      if(!b.targetDate) return 1;
      return a.targetDate<b.targetDate ? 1 : (a.targetDate>b.targetDate ? -1 : 0);
    });
    const avgLiq = avgPlanLiquidity(state);
    goals.forEach(g=>{
      if(need<=0 || g.saved<=0 || !g.accountId) return;
      const take = round2(Math.min(need,g.saved));
      const savedAfter = round2(g.saved-take);
      /* EINE Formel (SPEC 2.30): goalNeededRate mit dem Stand NACH Entnahme */
      const newRate = goalNeededRate(state, g, savedAfter);
      const rateHigh = newRate!=null && avgLiq!=null && newRate>avgLiq; /* "deutlich über Ø-Liquidität der Planmonate" */
      steps.push({kind:'goal', goalId:g.id, name:g.name, accountId:g.accountId, amount:take, newRate, rateHigh});
      need = round2(need-take);
    });
    out.push({ccId:cc.id, ccName:cc.name, debt, respId:resp.id, respName:resp.name, min,
      steps, covered:round2(debt-need), uncovered:round2(Math.max(0,need))});
  });
  return out;
}
function applyCcProposal(state,ccId){
  const p = ccPriorityProposals(state).find(x=>x.ccId===ccId);
  if(!p) return null;
  p.steps.forEach(s=>{
    if(s.amount<=0) return;
    /* Goal-Steps buchen mit goalId → applyEntry senkt saved synchron
       (SPEC 2.27); hier nur noch die Raten-Anpassung. */
    addBooking(state,{type:'transfer', desc:'KK-Vorrang '+p.ccName+' ← '+s.name,
      amount:s.amount, fromId:s.accountId, toId:p.ccId, date:today(),
      goalId: s.kind==='goal' ? s.goalId : null, source:'ccPriority'});
    if(s.kind==='goal'){
      const g = state.goals.find(x=>x.id===s.goalId);
      if(g && s.newRate!=null && g.rateMode==='fixed') g.rate = s.newRate;
    }
  });
  return p;
}

/* Abflüsse eines Plan-Monats AB HAUPTKONTO (SPEC 2.11): ALLE Fixposten (auch
   "Leben"), soweit nicht explizit von fremdem Konto, + variable Kosten + %-Töpfe.
   EINZIGE Quelle dieser Zahl — von Engpass-Karte UND Forecast (E8) genutzt. */
function planMonthMainOutflowDetail(state, month){
  const main = mainAccount(state);
  const items = []; let out = 0;
  if(main && month){
    month.fixed.forEach(f=>{
      if(f.fromId && f.fromId!==main.id) return;        /* explizit fremde Quelle */
      const fa = fixAmount(f);
      const a = f.recurrence==='yearly' ? round2(fa/12) : fa;
      out += a; items.push({name:f.name, amount:a});
    });
    month.variable.forEach(v=>{ out += v.amount; items.push({name:(v.name||'Variabel')+' (variabel)', amount:v.amount}); });
    savingsPots(state, month.id).forEach(p=>{ if(!p.skipped && p.amount>0){ out += p.amount; items.push({name:'Topf '+p.name+' ('+fmtAmt(p.percent)+' %)', amount:p.amount}); } });
  }
  return { out: round2(out), items };
}
function planMonthMainOutflow(state, month){ return planMonthMainOutflowDetail(state, month).out; }

/* Engpass-Erkennung (SPEC 2.11 / Sonderfall 4): zwei Checkpoints, jeweils
   "bevor der nächste Lohn eintrifft". Ausstehender Lohn zählt NUR, wenn der
   Monatslohn noch "geschätzt" ist. Reine Information — bucht nichts. */
function shortfallProjection(state){
  const main = mainAccount(state);
  if(!main) return null;
  const curId = state.settings.currentMonthId;
  const month = monthById(state,curId);
  const r = restToSpend(state);
  let pendingIncome = 0;
  if(month){
    const inc = monthIncome(state,month);
    if(inc.label==='geschätzt') pendingIncome = inc.amount;
  }
  /* CP1: dieselbe Verpflichtungs-Menge wie "Rest zum Ausgeben" — "Leben"
     wird im laufenden Monat NICHT projiziert. */
  const cp1 = round2(main.balance + pendingIncome - (r?r.open:0));
  const nextPlan = state.months.find(m=>m.id>curId && m.status==='plan');
  let cp2 = null, cp2Detail = null;
  if(nextPlan){
    const inc2 = monthIncome(state,nextPlan).amount;
    const det = planMonthMainOutflowDetail(state, nextPlan); /* EINZIGE Abfluss-Quelle */
    cp2 = round2(cp1 + inc2 - det.out);
    cp2Detail = { income:inc2, out:det.out, items:det.items };
  }
  /* N9: JEDER Checkpoint prüft gegen die Schwelle SEINES Monats (min1/min2).
     Bei gleicher Schwelle ist das rechnerisch identisch zum bisherigen
     Math.min(cp1,cp2) gegen eine Konstante — der grössere Fehlbetrag gehört
     zum kleineren Checkpoint, und bei Gleichstand gewinnt weiter cp1. */
  const min1 = effectiveMinimum(state, curId);
  const min2 = nextPlan ? effectiveMinimum(state, nextPlan.id) : null;
  const base = { cp1, cp2, nextPlanId:nextPlan?nextPlan.id:null,
    mainBalance:main.balance, pendingIncome, open:(r?r.open:0), cp2Detail, min1, min2 };
  const d1 = round2(min1 - cp1);
  const d2 = (cp2!=null) ? round2(min2 - cp2) : null;
  const useCp2 = (d2!=null && d2>d1);
  const missing = useCp2 ? d2 : d1;
  if(missing<=0) return Object.assign(base, {warn:false});
  const ip = state.workModel.instantPay;
  const shifts = (ip.enabled && ip.amountPerShift>0) ? Math.ceil(missing/ip.amountPerShift) : null;
  return Object.assign(base, {warn:true, worst:round2(useCp2 ? cp2 : cp1), min:(useCp2 ? min2 : min1),
    missing, shifts, worstMonthId:useCp2 ? nextPlan.id : curId});
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 4: Home-Layout, Liquiditäts-Verlauf, Feedback, Aktionsplan.
   ════════════════════════════════════════════════════════════════════ */

/* Konfigurierbares Home (SPEC 2.14): Reihenfolge + Sichtbarkeit leben in
   settings.homeLayout. Das Status-Band (U3: kritische Warnkarten + kompaktes
   Band) ist bewusst KEIN homeLayout-Block — rHome rendert es immer zuoberst. */
function homeLayoutMove(state,block,dir){
  const hl = state.settings.homeLayout;
  const i = hl.findIndex(e=>e.block===block);
  if(i<0) return false;
  const j = i + (dir<0 ? -1 : 1);
  if(j<0 || j>=hl.length) return false;
  const t = hl[i]; hl[i] = hl[j]; hl[j] = t;
  return true;
}
function homeLayoutToggle(state,block){
  const e = state.settings.homeLayout.find(x=>x.block===block);
  if(!e) return false;
  e.visible = !e.visible;
  return true;
}
/* Breit/Schmal pro Block (U3-LAYOUT, SPEC 2.34): reine Darstellungs-Präferenz,
   wirkt nur auf dem Desktop-Raster; unbekannte Blöcke → false. */
function homeLayoutWideToggle(state,block){
  const e = state.settings.homeLayout.find(x=>x.block===block);
  if(!e) return false;
  e.wide = !e.wide;
  return true;
}
/* Drag & Drop-Reorder (SPEC 2.35/E5): verschiebt `block` VOR `beforeBlock`
   (null = ans Ende). Arbeitet über Block-NAMEN — Einträge dazwischen (auch
   unsichtbare) behalten ihre relative Ordnung. Reihenfolge = row-major-
   Leserichtung des Desktop-Rasters (Index 0 = oben links). */
function homeLayoutMoveTo(state, block, beforeBlock){
  const hl = state.settings.homeLayout;
  const i = hl.findIndex(e=>e.block===block);
  if(i<0 || block===beforeBlock) return false;
  const entry = hl.splice(i,1)[0];
  const j = beforeBlock==null ? hl.length : hl.findIndex(e=>e.block===beforeBlock);
  if(j<0){ hl.splice(i,0,entry); return false; }   /* unbekanntes Ziel → zurück */
  hl.splice(j,0,entry);
  return true;
}

/* Liquiditäts-Verlauf: dynamische Monats-Liquidität = Lohn − Ausgaben, mit
   denselben dynamischen Werten wie Monats-Detail und YTD (SPEC 2.6).
   Planmonate bleiben reine Schätzung und werden im Chart abgesetzt. */
function liquiditySeries(state){
  return state.months.map(m=>{
    const inc = monthIncome(state,m), exp = monthExpenses(state,m);
    return { id:m.id, name:m.name, year:m.year, status:m.status,
      income:inc.amount, incomeLabel:inc.label,
      expenses:exp.amount, expensesLabel:exp.label,
      liq:round2(inc.amount-exp.amount) };
  });
}

function feedbackOpenCount(state){ return state.feedback.filter(f=>f.status==='open').length; }

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 5: eine Warnschwelle + Geldmonat (Lohntag-gekoppelt).
   ════════════════════════════════════════════════════════════════════ */

/* Puffer-Empfehlung (SPEC 2.15): Pflicht-Fixkosten des Monats ÷ 2. liquidMinimum
   bleibt die EINZIGE Schwelle für KK-Vorrang- und Engpass-Warnung — dieser Wert
   wird nur vorgeschlagen, nie automatisch gesetzt. */
function mandatoryFixedTotal(state, monthId){
  const m = monthById(state, monthId);
  if(!m) return 0;
  let fix = 0;
  m.fixed.forEach(f=>{ const a = fixAmount(f); fix += f.recurrence==='yearly' ? a/12 : a; });
  return round2(fix);
}
function bufferSuggestion(state){ return round2(mandatoryFixedTotal(state, state.settings.currentMonthId)/2); }

/* Lohntag = 5. Arbeitstag des Kalendermonats, Feiertage via holidayRegion
   (AG: Schweizer Feiertage + Berchtoldstag). Reine Kalenderrechnung —
   Verlaufs-/Buchungsdaten bleiben davon unberührt (SPEC 2.16). */
function easterSunday(year){
  const a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
    f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(year, month-1, day));
}
function ymdUTC(dt){ return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate()); }
function addDaysUTC(dt,n){ const d=new Date(dt.getTime()); d.setUTCDate(d.getUTCDate()+n); return d; }
function holidaysForYear(year, region){
  const set = new Set();
  if(!region) return set;                 /* ohne Region: nur Wochenenden zählen als frei */
  set.add(year+'-01-01');                  /* Neujahr */
  const E = easterSunday(year);
  set.add(ymdUTC(addDaysUTC(E,-2)));       /* Karfreitag */
  set.add(ymdUTC(addDaysUTC(E, 1)));       /* Ostermontag */
  set.add(ymdUTC(addDaysUTC(E,39)));       /* Auffahrt */
  set.add(ymdUTC(addDaysUTC(E,50)));       /* Pfingstmontag */
  set.add(year+'-08-01');                  /* Nationalfeiertag */
  set.add(year+'-12-25');                  /* Weihnachten */
  set.add(year+'-12-26');                  /* Stephanstag */
  if(region==='AG') set.add(year+'-01-02');/* Berchtoldstag (Aargau) */
  return set;
}
function isWorkday(dateStr, region){
  const y=+dateStr.slice(0,4), m=+dateStr.slice(5,7), d=+dateStr.slice(8,10);
  const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay(); /* 0 So … 6 Sa */
  if(dow===0 || dow===6) return false;
  return !holidaysForYear(y,region).has(dateStr);
}
function nthWorkdayOfMonth(monthId, n, region){
  const y=+monthId.slice(0,4), m=+monthId.slice(5,7);
  let count=0;
  for(let d=1; d<=31; d++){
    const dt=new Date(Date.UTC(y,m-1,d));
    if(dt.getUTCMonth()!==m-1) break;      /* Monatsende überschritten */
    const s=ymdUTC(dt);
    if(isWorkday(s,region)){ if(++count===n) return s; }
  }
  return null;
}
function paydayOf(monthId, region){ return nthWorkdayOfMonth(monthId, 5, region); }
/* N19: der ERWARTETE Zahltag des Festlohns als echtes Datum. payoutDay ist ein
   Kalendertag 1–31 (2.55); im Februar oder einem 30-Tage-Monat wird er auf den
   letzten Tag geklemmt, statt in den Folgemonat zu rutschen. Das ist eine reine
   ERWARTUNG für Fenster und Beschriftung — gebucht wird immer mit dem Datum,
   das der Nutzer im Sheet setzt (der Lohn kommt mal am 23., mal am 27.). */
function daysInMonthOf(monthId){
  const y=+monthId.slice(0,4), m=+monthId.slice(5,7);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function fixedPayoutDate(monthId, payoutDay){
  const d = Math.min(Math.max(1, payoutDay|0) || 1, daysInMonthOf(monthId));
  return monthId+'-'+pad2(d);
}
function prevMonthId(id){ const y=+id.slice(0,4), m=+id.slice(5,7); return m===1 ? (y-1)+'-12' : y+'-'+pad2(m-1); }

/* Aktiver Geldmonat (SPEC 2.16): Geldmonat M läuft vom Lohntag M bis zum Tag
   vor dem Lohntag M+1. Zwischen Monatsbeginn und Lohntag ist der VORHERIGE
   Kalendermonat der aktive Geldmonat → kein Falsch-Minus vor dem Lohn. */
function activeMoneyMonthId(state, todayStr){
  const region = state.workModel.holidayRegion;
  const cm = todayStr.slice(0,7);
  const pd = paydayOf(cm, region);
  return (pd && todayStr >= pd) ? cm : prevMonthId(cm);
}
/* Auto-Cutover am Lohntag: neuer Geldmonat wird aktiv, vorheriger wird "done".
   Nur vorwärts — manuelles Umstellen (SPEC 2.4) behält Vorrang. lastCutoverMonthId
   merkt die zuletzt automatisch gesetzte Grenze, damit eine manuelle Auswahl
   zwischen zwei Lohntagen nicht wieder überschrieben wird. */
/* ─────────── N15: aufgezeichnete Hauptkonto-Monatsstände (SPEC 2.54) ───────────
   Beim Monatswechsel wird der TATSÄCHLICHE Saldo des soeben abgeschlossenen
   Monats festgehalten. Das ist die einzige Schreibstelle, und sie ist einmalig:
   ein vorhandener Eintrag wird NIE überschrieben und NIE nachgerechnet — er ist
   eine Beobachtung, kein abgeleiteter Wert. Wer ihn ändern wollte, müsste die
   Vergangenheit umschreiben; genau das soll unmöglich sein.
   Gibt true zurück, wenn wirklich etwas aufgezeichnet wurde. */
function recordMainSnapshot(state, monthId, balance){
  if(!nMonthId(monthId)) return false;
  if(typeof balance!=='number' || !isFinite(balance)) return false;
  if(!state.mainSnapshots || typeof state.mainSnapshots!=='object') state.mainSnapshots = {};
  if(Object.prototype.hasOwnProperty.call(state.mainSnapshots, monthId)) return false;   /* nie überschreiben */
  state.mainSnapshots[monthId] = round2(balance);
  return true;
}
function applyMoneyMonthCutover(state, todayStr){
  if(!state.setupComplete) return false;
