  const target = activeMoneyMonthId(state, todayStr);
  if(target === state.settings.lastCutoverMonthId) return false;
  if(target > state.settings.currentMonthId){
    /* N15: der Monat, der HIER zu Ende geht, ist der bisherige currentMonthId —
       und sein echter Schlussstand ist der Saldo in genau diesem Moment, bevor
       setCurrentMonth den Geldmonat weiterstellt. Springt der Cutover über
       mehrere Monate (App lange nicht geöffnet), bekommt nur der unmittelbar
       abgeschlossene Monat einen Stand: für die übersprungenen gibt es keine
       Beobachtung, und geraten wird nicht. */
    const main = mainAccount(state);
    if(main) recordMainSnapshot(state, state.settings.currentMonthId, main.balance);
    setCurrentMonth(state, target);
  }
  state.settings.lastCutoverMonthId = target;
  return true;
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 6: Auto-Lohn + Instant Pay (Vorschuss), universelle
   Schnell-Einzahlung, Claude-Vorschläge (Import-Inbox).
   ════════════════════════════════════════════════════════════════════ */

function addDaysStr(s,n){ const y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8,10); return ymdUTC(new Date(Date.UTC(y,m-1,d+n))); }
function daysBetween(a,b){ const ya=+a.slice(0,4),ma=+a.slice(5,7),da=+a.slice(8,10),yb=+b.slice(0,4),mb=+b.slice(5,7),db=+b.slice(8,10);
  return Math.round((Date.UTC(yb,mb-1,db)-Date.UTC(ya,ma-1,da))/86400000); }

/* Instant Pay (Vorschuss) = Eingänge source 'instantPay'; Rest-Auszahlung =
   source 'salaryPayout'. Beide via moneyMonthId dem Geldmonat zugeordnet. */
function instantPaySum(state, monthId){
  return round2(state.ledger.filter(l=>l.type==='eingang' && l.source==='instantPay' && ledgerMoneyMonth(l)===monthId).reduce((s,l)=>s+l.amount,0));
}
function salaryPayoutSum(state, monthId){
  return round2(state.ledger.filter(l=>l.type==='eingang' && l.source==='salaryPayout' && ledgerMoneyMonth(l)===monthId).reduce((s,l)=>s+l.amount,0));
}
function salaryBookedFor(state, monthId){
  return state.ledger.some(l=>l.type==='eingang' && l.source==='salaryPayout' && ledgerMoneyMonth(l)===monthId);
}
/* N19 (SPEC 2.56): der tatsächlich eingegangene FESTLOHN eines Geldmonats.
   Zustand im VERLAUF statt in einem Zähler (Muster N6/2.46) — wer die Buchung
   löscht, hat automatisch wieder die Planzahl, ohne dass irgendwo ein Merker
   nachgeführt werden müsste. Eigene source, damit der Festlohn NIE mit der
   Schicht-Quelle (instantPay/salaryPayout) verwechselt oder addiert wird. */
function fixedSalaryPaidSum(state, monthId){
  return round2(state.ledger.filter(l=>l.type==='eingang' && l.source==='fixedSalaryPayout' && ledgerMoneyMonth(l)===monthId).reduce((s,l)=>s+l.amount,0));
}
function fixedSalaryEntries(state, monthId){
  return state.ledger.filter(l=>l.type==='eingang' && l.source==='fixedSalaryPayout' && ledgerMoneyMonth(l)===monthId)
    .sort((a,b)=>a.date<b.date?-1:1);
}
function fixedSalaryBookedFor(state, monthId){
  return state.ledger.some(l=>l.type==='eingang' && l.source==='fixedSalaryPayout' && ledgerMoneyMonth(l)===monthId);
}
/* Zielmonat für einen NEUEN Instant Pay / die nächste Lohn-Erwartung: der
   Kalendermonat, solange sein Lohn noch nicht (rest-)gebucht ist, sonst der
   Folgemonat (der nächste vorzuschiessende Geldmonat). */
function salaryTargetMonthId(state, todayStr){
  const cm = todayStr.slice(0,7);
  return salaryBookedFor(state, cm) ? nextMonthId(cm) : cm;
}
function nextPaydayDate(state, todayStr){ return paydayOf(salaryTargetMonthId(state,todayStr), state.workModel.holidayRegion); }
function daysUntilNextSalary(state, todayStr){ const pd=nextPaydayDate(state,todayStr); return pd ? daysBetween(todayStr,pd) : null; }

/* ─────────── N11: «Frei pro Tag» rechnet im Leben-Budget (SPEC 2.32 neu) ───────────
   Bis N10 mass diese Kennzahl den Abstand zur Notlinie: (Rest − liquidMinimum) ÷ Tage.
   Das beantwortet «wie nah bin ich am Polster», nicht «wie viel kann ich heute
   ausgeben» — und weil der Rest auch alle noch offenen Verpflichtungen enthält,
   sprang die Zahl beim Abhaken einer Fixkosten-Abbuchung, ohne dass sich am
   Alltagsgeld irgendetwas geändert hätte. Neu:

       Frei pro Tag = (Leben-Budget − Leben-Verbrauch) ÷ Tage bis zum Lohntag

   `liquidMinimum` kommt in DIESER Kennzahl nicht mehr vor. Als Notlinie bleibt es
   unangetastet: Minimum-Linie im Chart, Engpass-Karte, KK-Vorrang, Rest-Warnfarbe
   rechnen unverändert über effectiveMinimum. */

/* Leben-Budget = Σ der MONATLICHEN Fix-Posten OHNE Verknüpfung (kind 'none') des
   Monats — aus dem Monat gelesen, nie ein konstanter Betrag.
   Warum kind 'none' und nicht der Name «Leben»: Verknüpfungen entstehen
   ausschliesslich aus kind/fromId/toId, nie über Namen oder Schlüsselwörter
   (SPEC 2.8) — und 'none' ist im Modell genau die Klasse «Budgetzeile ohne
   Buchungsspur», also die Posten, die restToSpend im laufenden Monat schon heute
   bewusst NICHT projiziert (2.7). Jahresposten bleiben draussen: sie sind
   Rücklage, kein Alltagsgeld. `name` trägt den Posten-Namen fürs Etikett, sobald
   es genau einen gibt — sonst beschriftet sich die Anzeige generisch. */
function livingBudget(state, monthId){
  const m = monthById(state, monthId);
  const items = m ? m.fixed.filter(f=>f.kind==='none' && f.recurrence!=='yearly' && fixAmount(f)>0) : [];
  return { amount: round2(items.reduce((s,f)=>s+fixAmount(f),0)), items,
           name: items.length===1 ? items[0].name : null };
}

/* Fenster des Geldmonats (SPEC 2.16): Lohntag M bis zum Tag VOR Lohntag M+1 —
   exakt die Grenze, die activeMoneyMonthId zieht. Bewusst NICHT der
   Kalendermonat: Einkäufe am 1.–6. eines Monats sind vor dem Lohn und damit noch
   aus dem Budget des Vormonats bezahlt. Ohne Lohntag (theoretisch: Monat ohne
   Arbeitstag) fällt das Fenster auf den Kalendermonat zurück. */
function moneyMonthWindow(state, monthId){
  const region = state.workModel.holidayRegion;
  const from = paydayOf(monthId, region);
  const nx   = paydayOf(nextMonthId(monthId), region);
  if(!from || !nx) return {from: monthId+'-01', to: monthId+'-31', fallback:true};
  return {from, to: addDaysStr(nx,-1), fallback:false};
}

/* Leben-Verbrauch = die Ist-Ausgaben AB HAUPTKONTO in diesem Fenster, ohne die
   Fixkosten-Abbuchungen. Die Ausgaben-Definition ist die bestehende aus 2.6
   (outflowAmount) — keine zweite Rechenquelle. Die Abgrenzung ist eindeutig,
   weil eine abgehakte Schnellaktion ihre Herkunft trägt: executeQuickAction und
   payTaxBill buchen als source 'quickAction' und nichts anderes tut das.
   Alles Übrige ab Hauptkonto ist Alltag — manuelle Ausgaben, Ausgaben aus der
   Schnell-Einzahlung, negative Anpassungen (Saldo-Korrektur = echtes Geld, 2.6).
   Transfers in Spaces/UBS/KK, Eingänge und Refunds fallen schon über
   outflowAmount weg, Ausgaben aus einem Space über die Konto-Prüfung.

   N12: die drei zeitunabhängigen Bedingungen («ist das überhaupt eine
   Alltags-Ausgabe ab Hauptkonto?») sind in livingEligible herausgezogen —
   Wort für Wort dieselbe Regel, nur an EINER Stelle, damit die Checkbox
   «Zählt zu Leben» nachweislich genau dort erscheint, wo sie auch wirkt.
   Muster wie N11 mit outflowAmount. Das Zeitfenster bleibt draussen: es
   gehört zur Kennzahl, nicht zur Frage «kommt in Frage». */
function livingEligible(state, l){
  const main = mainAccount(state);
  if(!main) return false;
  if(outflowAmount(l)===null) return false;
  if(l.source==='quickAction') return false;
  return l.type==='ausgang' ? l.fromId===main.id : l.toId===main.id;
}
function livingSpent(state, monthId){
  const main = mainAccount(state);
  const w = moneyMonthWindow(state, monthId);
  if(!main) return {sum:0, entries:[], from:w.from, to:w.to};
  const entries = state.ledger.filter(l=>{
    if(l.date < w.from || l.date > w.to) return false;
    if(!livingEligible(state, l)) return false;
    /* N12 (SPEC 2.51): die einzige neue Bedingung. Fehlendes Feld = zählt. */
    return l.countsAsLiving !== false;
  });
  return {sum: round2(entries.reduce((s,l)=>s+outflowAmount(l),0)), entries, from:w.from, to:w.to};
}

/* Frei pro Tag. Verbrauch ≥ Budget → warn (kein negativer Durchschnitt), kein
   Budget-Posten im Monat → noBudget (die Kennzahl kann nichts aussagen und sagt
   das auch). Kein Hauptkonto → null, wie bisher. */
function dailyBudget(state, todayStr){
  if(!mainAccount(state)) return null;
  const monthId = state.settings.currentMonthId;
  const b  = livingBudget(state, monthId);
  const sp = livingSpent(state, monthId);
  const days = daysUntilNextSalary(state, todayStr);
  const left = round2(b.amount - sp.sum);
  const perDay = (b.amount>0 && days!=null && days>0 && left>0) ? round2(left/days) : null;
  return { days, budget:b.amount, name:b.name, spent:sp.sum, left, perDay,
           from:sp.from, to:sp.to,
           noBudget: b.amount<=0, warn: b.amount>0 && left<=0 };
}

/* Auto-Lohn-Fenster: ab 2 Kalendertagen vor dem Lohntag des laufenden
   Kalendermonats, solange dessen Rest-Auszahlung noch nicht gebucht ist. */
function autoSalaryWindow(state, todayStr){
  const cm = todayStr.slice(0,7);
  const pd = paydayOf(cm, state.workModel.holidayRegion);
  if(!pd) return null;
  if(salaryBookedFor(state, cm)) return null;
  if(todayStr < addDaysStr(pd,-2)) return null;
  const mo = monthById(state, cm);
  const gross = mo ? (mo.incomeOverride!=null ? mo.incomeOverride : round2((mo.workdays||0)*state.workModel.ratePerWorkday)) : 0;
  const instant = instantPaySum(state, cm);
  const instantCount = state.ledger.filter(l=>l.type==='eingang' && l.source==='instantPay' && ledgerMoneyMonth(l)===cm).length;
  return { targetId:cm, payday:pd, daysUntil:daysBetween(todayStr,pd), gross, instant, instantCount, payout:round2(Math.max(0,gross-instant)) };
}
/* Instant Pay erfassen (jederzeit): manueller Vorschuss-Eingang aufs Hauptkonto,
   dem nächsten vorzuschiessenden Geldmonat zugeordnet (fehlt der Monat → anlegen). */
function captureInstantPay(state, opts){
  const main = mainAccount(state); if(!main) return null;
  const amt = round2(parseAmount(opts.amount)); if(amt<=0) return null;
  const target = nMonthId(opts.targetId) || salaryTargetMonthId(state, today());
  if(!monthById(state, target)) createMonthFromTemplate(state, target, 'plan');
  return addBooking(state, {type:'eingang', incomeKind:'lohn', source:'instantPay',
    desc:'Instant Pay Vorschuss', amount:amt, toId:main.id, date:opts.date||today(), moneyMonthId:target});
}
/* Auto-Lohn bestätigen: bucht NUR die Rest-Auszahlung (Gesamtlohn − Instant Pays)
   und löst den Cutover aus (manuelles Umstellen hat Vorrang). Keine Doppelzählung:
   Monatslohn = Gesamt = Instant Pays + Rest-Auszahlung. */
function bookSalaryPayout(state, targetId, grossRaw){
  const main = mainAccount(state); if(!main) return {error:'Kein Hauptkonto vorhanden.'};
  /* N15 — HIER, nicht weiter unten: dieser Aufruf bucht den Lohn ZUERST
     (addBooking) und stellt den Geldmonat ERST DANACH weiter. Der Schlussstand
     des abgeschlossenen Monats ist deshalb der Saldo VOR der Lohnbuchung.
     Würde er unten bei `lastCutoverMonthId` abgegriffen, trüge der alte Monat
     den Lohn des neuen — ein Fehler, der grösser wäre als die Rückrechnung,
     die N15 gerade entfernt. Nur die ZAHL merken, nicht das Konto-Objekt:
     addBooking mutiert main.balance in place. */
  const closingId = state.settings.currentMonthId;
  const closingBalance = main.balance;
  const gross = round2(parseAmount(grossRaw));
  let mo = monthById(state, targetId);
  const instant = instantPaySum(state, targetId);
  if(gross < instant) return {error:'Gesamtlohn '+fmtAmt(gross)+' ist kleiner als die Instant Pays '+fmtAmt(instant)+' — bitte korrigieren.'};
  if(!mo) mo = createMonthFromTemplate(state, targetId, 'plan');
  mo.incomeOverride = null; /* Lohn wird nun über Buchungen erfasst — kein doppelter Override */
  const payout = round2(gross - instant);
  const entry = addBooking(state, {type:'eingang', incomeKind:'lohn', source:'salaryPayout',
    desc: instant>0 ? 'Lohn (Rest-Auszahlung)' : 'Lohn', amount:payout, toId:main.id, date:today(), moneyMonthId:targetId});
  let cutover=false;
  if(targetId > state.settings.currentMonthId){
    recordMainSnapshot(state, closingId, closingBalance);   /* N15: Stand VOR der Lohnbuchung */
    setCurrentMonth(state, targetId); cutover=true;
  }
  state.settings.lastCutoverMonthId = targetId;
  return { entry, gross, instant, payout, cutover, targetId };
}

/* ─── N19 (SPEC 2.56): Festlohn manuell buchen, wenn er WIRKLICH kommt ───
   payoutDay (N18) ist die Erwartung; das echte Geld trifft mal am 23., mal am
   27. ein. Darum gibt es keinen Automatismus, sondern EINEN Knopf mit frei
   wählbarem Datum und frei wählbarem Betrag.

   `fixedSalaryWindow` sucht den ÄLTESTEN Geldmonat, dessen Festlohn fällig,
   aber noch nicht gebucht ist — so verschwindet die Karte nicht stillschweigend,
   wenn man einen Monat verpasst hat (sie sagt dann «überfällig»). Der Plan-
   Betrag kommt aus `fixedIncomeFor`, NICHT aus einer zweiten Rechnung: das
   Fenster erbt damit die Anker (aus ⇒ 0, vor dem Startmonat ⇒ 0, Pensum 0 ⇒ 0)
   und kann gar nicht anderes behaupten als das Monats-Detail.
   `state.months` ist aufsteigend sortiert (normalizeState) — die Schleife
   bricht am laufenden Kalendermonat ab und greift nie in die Zukunft. */
const FIXED_SALARY_LEAD_DAYS = 3;
function fixedSalaryWindow(state, todayStr){
  const fs = state.workModel.fixedSalary;
  if(!fs || !fs.enabled) return null;
  if(!mainAccount(state)) return null;
  const cutoff = todayStr.slice(0,7);
  for(let i=0;i<state.months.length;i++){
    const m = state.months[i];
    if(m.id > cutoff) break;
    if(fixedSalaryBookedFor(state, m.id)) continue;
    const plan = fixedIncomeFor(state, m);
    if(!(plan>0)) continue;
    const due = fixedPayoutDate(m.id, fs.payoutDay);
    if(todayStr < addDaysStr(due, -FIXED_SALARY_LEAD_DAYS)) continue;
    return { targetId:m.id, plan, due, daysUntil:daysBetween(todayStr,due),
             overdue: todayStr > due, name:fs.name };
  }
  return null;
}
/* Bucht den Festlohn als echten Eingang aufs Hauptkonto.
   incomeKind BEWUSST 'allgemein', nicht 'lohn': ein 'lohn'-Eingang wird von
   addBooking nach month.extraIncome gespiegelt und damit Teil der SCHICHT-
   Quelle (shiftIncome) — der Festlohn stünde dann in der falschen Spalte und
   käme über fixedIncomeFor ein zweites Mal dazu. Die Zuordnung zum Geldmonat
   trägt stattdessen moneyMonthId, gelesen von fixedSalaryPaidSum. */
function bookFixedSalary(state, targetIdRaw, amountRaw, dateRaw){
  const main = mainAccount(state); if(!main) return {error:'Kein Hauptkonto vorhanden.'};
  const fs = state.workModel.fixedSalary;
  if(!fs || !fs.enabled) return {error:'Die Festlohn-Quelle ist im Arbeitsmodell ausgeschaltet.'};
  const target = nMonthId(targetIdRaw);
  if(!target) return {error:'Kein gültiger Geldmonat.'};
  const start = nMonthId(fs.startMonthId);
  if(start && target < start) return {error:'Der Festlohn gilt erst ab '+monthLabel(start)+'.'};
  const amount = round2(parseAmount(amountRaw));
  if(!(amount>0)) return {error:'Der Betrag muss grösser als 0.00 sein.'};
  if(!monthById(state, target)) createMonthFromTemplate(state, target, 'plan');
  const entry = addBooking(state, {type:'eingang', incomeKind:'allgemein', source:'fixedSalaryPayout',
    desc: fs.name ? 'Festlohn «'+fs.name+'»' : 'Festlohn',
    amount, toId:main.id, date:nDate(dateRaw), moneyMonthId:target});
  return { entry, amount, targetId:target, date:entry.date };
}

/* Universelle Schnell-Einzahlung/-Entnahme (SPEC 2.18): Space ↔ Hauptkonto per
   Transfer, Sparziel per Ziel-Einzahlung (+ Transfer aufs Ziel-Konto), sonstiges
   Konto als Eingang/Ausgang. Alles landet im Verlauf; Rückgängig via Snapshot.
   Entnahme-Modus (SPEC 2.29 / Sonderfall 15): opts.mode 'expense' (Ausgang —
   Geld weg, zählt als Abfluss; DEFAULT bei Entnahme) oder 'transfer' (internes
   Umbuchen auf Parent/Hauptkonto, neutral). opts.goalId koppelt die Bewegung
   an ein Sparziel (SPEC 2.27, zielgebundene Konten). */
function quickAdjust(state, kind, id, sign, amountRaw, opts){
  opts = opts || {};
  const amount = round2(Math.abs(parseAmount(amountRaw)));
  if(amount<=0) return null;
  const main = mainAccount(state);
  if(kind==='goal'){
    const g = state.goals.find(x=>x.id===id); if(!g) return null;
    let amt = amount;
    if(sign<0) amt = Math.min(amt, g.saved);
    if(amt<=0) return null;
    let entry=null;
    if(g.accountId && main && g.accountId!==main.id){
      /* Buchung trägt goalId → applyEntry führt saved synchron (SPEC 2.27);
         hier NICHT zusätzlich mutieren (Doppelzählung). */
      entry = addBooking(state, sign>0
        ? {type:'transfer', desc:'Einzahlung Ziel «'+g.name+'»', amount:amt, fromId:main.id, toId:g.accountId, date:today(), goalId:g.id, source:'quickDeposit'}
        : {type:'transfer', desc:'Entnahme Ziel «'+g.name+'»', amount:amt, fromId:g.accountId, toId:main.id, date:today(), goalId:g.id, source:'quickDeposit'});
    } else {
      g.saved = round2(g.saved + sign*amt);
    }
    return {entry, amount:amt, sign};
  }
  const a = state.accounts.find(x=>x.id===id); if(!a) return null;
  const goalId = (typeof opts.goalId==='string' && opts.goalId) ? opts.goalId : null;
  if(a.kind==='space' && a.parentId && state.accounts.some(x=>x.id===a.parentId)){
    let entry;
    if(sign>0){
      entry = addBooking(state, {type:'transfer', desc:'Einzahlung '+a.name, amount, fromId:a.parentId, toId:a.id, date:today(), goalId, source:'quickDeposit'});
    } else if(opts.mode==='transfer'){
      entry = addBooking(state, {type:'transfer', desc:'Entnahme '+a.name+' (intern)', amount, fromId:a.id, toId:a.parentId, date:today(), goalId, source:'quickDeposit'});
    } else {
      /* Default Space-Entnahme = Ausgabe: Netto-Effekt der realen Kette
         Space → Hauptkonto → bezahlen; zählt als Abfluss (SPEC 2.6).
         N6: opts.purpose (Posten-Name aus dem Topf-«Wofür?») wird die
         Beschreibung → der Namens-Abgleich ordnet die Zahlung zu. */
      entry = addBooking(state, {type:'ausgang', desc: opts.purpose || ('Ausgabe aus '+a.name), amount, fromId:a.id, date:today(), goalId, source:'quickDeposit'});
    }
    return {entry, amount, sign};
  }
  let entry;
  if(sign>0){
    entry = addBooking(state, {type:'eingang', incomeKind:'allgemein', desc:'Einzahlung '+a.name, amount, toId:a.id, date:today(), goalId, source:'quickDeposit'});
  } else if(opts.mode==='transfer' && main && a.id!==main.id){
    entry = addBooking(state, {type:'transfer', desc:'Entnahme '+a.name+' (intern)', amount, fromId:a.id, toId:main.id, date:today(), goalId, source:'quickDeposit'});
  } else {
    entry = addBooking(state, {type:'ausgang', desc: opts.purpose || ('Entnahme '+a.name), amount, fromId:a.id, date:today(), goalId, source:'quickDeposit'});
  }
  return {entry, amount, sign};
}

/* Claude-Vorschläge (SPEC 2.19): Import-Inbox, NIE automatisch angewendet.
   Annehmen führt alle Aktionen aus (Verlauf-Quelle 'claudeProposal'). */
function proposalOpenCount(state){ return state.claudeProposals.filter(p=>p.status==='open').length; }
function proposalActionText(state, a){
  if(a.kind==='transfer') return 'Transfer '+fmtMoney(a.amount)+': '+accName(state,a.fromId)+' → '+accName(state,a.toId)+(a.desc?' · '+a.desc:'');
  if(a.kind==='setBalance') return 'Saldo «'+accName(state,a.accountId)+'» auf '+fmtMoney(a.amount)+' setzen (Anpassung)'+(a.desc?' · '+a.desc:'');
  if(a.kind==='setField'){
    const mm = PROPOSAL_SETFIELD_MONTH_RE.exec(String(a.path==null?'':a.path));
    if(mm) return 'Warnschwelle '+monthLabel(mm[1])+' → '+(nOptAmount(a.value)==null ? 'global' : fmtAmt(nOptAmount(a.value)));
    return 'Einstellung '+a.path+' → '+esc(String(a.value));
  }
  return 'Hinweis: '+(a.text||a.desc||'');
}
function setProposalPathValue(state, path, value){
  const mm = PROPOSAL_SETFIELD_MONTH_RE.exec(String(path==null?'':path));
  if(mm){ const m = monthById(state, mm[1]); if(m) m.liquidMinimum = nOptAmount(value); return; }
  if(path==='settings.liquidMinimum') state.settings.liquidMinimum = parseAmount(value);
  else if(path==='settings.monthsFilter') state.settings.monthsFilter = nEnum(value,['all','active','archive'],state.settings.monthsFilter);
  else if(path==='settings.monthsSort') state.settings.monthsSort = nEnum(value,['desc','asc'],state.settings.monthsSort);
  else if(path==='workModel.ratePerWorkday') state.workModel.ratePerWorkday = parseAmount(value);
  else if(path==='workModel.instantPay.amountPerShift') state.workModel.instantPay.amountPerShift = parseAmount(value);
}
function applyProposal(state, id){
  const p = state.claudeProposals.find(x=>x.id===id);
  if(!p || p.status!=='open') return null;
  const done = [];
  const gb = goalBackedIds(state);
  /* Zielgebundene Konten (SPEC 2.27): Aktionen an ihnen brauchen ein gültiges
     action.goalId (Ziel des betroffenen Kontos) — sonst wird die Aktion mit
     Hinweis übersprungen. NIE raten. */
  const goalFor = (accId, goalId) => {
    if(!gb.has(accId)) return {ok:true, goalId:null};
    const g = state.goals.find(x=>x.id===goalId && x.accountId===accId);
    return g ? {ok:true, goalId:g.id} : {ok:false, goalId:null};
  };
  p.actions.forEach(a=>{
    if(a.kind==='transfer' && a.fromId && a.toId && a.amount>0){
      const gbSide = gb.has(a.fromId) ? a.fromId : (gb.has(a.toId) ? a.toId : null);
      const chk = gbSide ? goalFor(gbSide, a.goalId) : {ok:true, goalId:null};
      if(!chk.ok || (gb.has(a.fromId) && gb.has(a.toId))){
        done.push({kind:'skipped', reason:'Zielgebundenes Konto ohne gültiges Ziel — Aktion übersprungen', action:a});
        return;
      }
      const e = addBooking(state,{type:'transfer', desc:a.desc||'Vorschlag: Transfer', amount:a.amount, fromId:a.fromId, toId:a.toId, date:today(), goalId:chk.goalId, source:'claudeProposal'});
      done.push({kind:'transfer', entry:e});
    } else if(a.kind==='setBalance' && a.accountId){
      const acc = state.accounts.find(x=>x.id===a.accountId);
      if(acc){
        const chk = goalFor(acc.id, a.goalId);
        if(!chk.ok){
          done.push({kind:'skipped', reason:'Zielgebundenes Konto ohne gültiges Ziel — Aktion übersprungen', action:a});
          return;
        }
        const delta = round2(a.amount - acc.balance);
        acc.balance = round2(a.amount);
        /* Anpassung wird bei Anlage nicht angewendet → saved hier direkt führen. */
        if(chk.goalId){
          const g = state.goals.find(x=>x.id===chk.goalId);
          if(g) g.saved = round2(g.saved + delta);
        }
        const e = { id:uid(), type:'anpassung', desc:a.desc||'Vorschlag: Saldo gesetzt', amount:delta, fromId:null, toId:acc.id, date:today(), incomeKind:null, moneyMonthId:null, goalId:chk.goalId, source:'claudeProposal' };
        state.ledger.push(e);
        done.push({kind:'setBalance', entry:e});
      }
    } else if(a.kind==='setField' && setFieldPathAllowed(a.path)){
      /* N9: monatsindizierter Pfad auf einen nicht vorhandenen Monat wird
         übersprungen statt still zu verpuffen (Muster der Ziel-Prüfung oben). */
      const mm = PROPOSAL_SETFIELD_MONTH_RE.exec(String(a.path));
      if(mm && !monthById(state, mm[1])){
        done.push({kind:'skipped', reason:'Monat '+monthLabel(mm[1])+' ist nicht angelegt — Aktion übersprungen', action:a});
        return;
      }
      setProposalPathValue(state, a.path, a.value);
      done.push({kind:'setField', path:a.path, value:a.value});
    } else if(a.kind==='note'){
      done.push({kind:'note'});
    }
  });
  p.status = 'accepted';
  return { proposal:p, done };
}
function dismissProposal(state, id){
  const p = state.claudeProposals.find(x=>x.id===id);
  if(p && p.status==='open'){ p.status='dismissed'; return p; }
  return null;
}
/* Prüft, ob das Annehmen eines Vorschlags das Hauptkonto unter liquidMinimum
   drückt (klarer Hinweis, SPEC 2.19). Simuliert auf einem Klon. */
function proposalMainBelowMin(state, id){
  const clone = deepClone(state);
  applyProposal(clone, id);
  const m = mainAccount(clone);
  /* N9: gegen die Schwelle des laufenden Monats — und zwar auf dem KLON, der die
     Aktionen schon enthält (ein Vorschlag darf die Monats-Schwelle selbst setzen). */
  const min = effectiveMinimum(clone, clone.settings.currentMonthId);
  return (m && m.balance < min) ? round2(min - m.balance) : 0;
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 7: Datensicherheit, Verlauf-Filter, Vermögensverlauf,
   Kommt-bald, Neutralitäts-Scan. Snapshots liegen SEPARAT in localStorage
   (nicht im State — kein Export/Merge, keine Rekursion).
   ════════════════════════════════════════════════════════════════════ */

const SNAP_KEY = 'kontoblatt.snapshots';
const SNAP_MAX = 10;
/* Byte-Budget für den Ring (N8). Gemessen: ein schwerer Stand (900 Buchungen,
   12 Monate à 12 Fixposten) wiegt rund 224 KB → 10 Punkte ≈ 2.2 MB, was den
   localStorage eines Alltags-Standes noch nicht sprengt, im Extremfall aber
   nahe an die 5-MB-Grenze käme. saveSnapshots wirft darum die ältesten Punkte
   weg, bis der Ring unter das Budget passt — lieber 4 sichere Punkte als 10,
   die still nicht mehr geschrieben werden. */
const SNAP_BUDGET = 1500000;

/* Backup-Nudge: Tage seit letztem Export; > 14 (oder nie) → Nudge */
function daysSinceBackup(state, todayStr){
  const b = state.settings.lastBackupAt;
  return b ? daysBetween(b, todayStr) : null;
}
function backupNudgeNeeded(state, todayStr){
  const d = daysSinceBackup(state, todayStr);
  return d===null || d>14;
}

/* Kurzbeschreibung eines Wiederherstellungspunkts (N8). Rein aus dem Vergleich
   des vorigen mit dem neuen Zustand abgeleitet — KEIN neues Feld an den
   Aktionen, keine einzige Call-Site muss etwas mitgeben. Der Snapshot entsteht
   NACH der Änderung, das Label beschreibt also die Aktion, die zu diesem Stand
   geführt hat. Reihenfolge = Spezifität: die konkrete Buchung schlägt jeden
   Zähler. Muss auch mit Schrott-Zuständen umgehen (Tests/Fremd-Importe). */
const SNAP_TYPE_WORD = {eingang:'Eingang', ausgang:'Ausgang', refund:'Rückerstattung',
  transfer:'Transfer', anpassung:'Anpassung'};
function snapLabel(prev, next){
  if(!next || typeof next!=='object') return 'Änderung';
  if(!prev || typeof prev!=='object') return 'Erster gesicherter Stand';
  const arr = (o,k)=> Array.isArray(o[k]) ? o[k] : [];
  const pl = arr(prev,'ledger'), nl = arr(next,'ledger');
  if(nl.length > pl.length){
    const seen = {}; pl.forEach(l=>{ if(l && l.id) seen[l.id]=1; });
    const add = nl.filter(l=>l && !seen[l.id]);
    const last = add[add.length-1];
    if(!last) return 'Neue Buchung';
    const more = add.length>1 ? ' · +'+(add.length-1)+' weitere' : '';
    return (SNAP_TYPE_WORD[last.type]||'Buchung')+': '+(last.desc||'ohne Titel')+more;
  }
  if(nl.length < pl.length) return (pl.length-nl.length)>1 ? 'Buchungen gelöscht' : 'Buchung gelöscht';
  const grew = k => arr(next,k).length !== arr(prev,k).length;
  if(grew('goals'))   return arr(next,'goals').length   > arr(prev,'goals').length   ? 'Sparziel angelegt'  : 'Sparziel gelöscht';
  if(grew('accounts'))return arr(next,'accounts').length> arr(prev,'accounts').length? 'Konto angelegt'     : 'Konto gelöscht';
  if(grew('months'))  return arr(next,'months').length  > arr(prev,'months').length  ? 'Monat angelegt'     : 'Monat gelöscht';
  if(grew('todos'))   return arr(next,'todos').length   > arr(prev,'todos').length   ? 'To-Do angelegt'     : 'To-Do gelöscht';
  if(grew('fixedCosts')) return arr(next,'fixedCosts').length > arr(prev,'fixedCosts').length ? 'Fixkosten-Vorlage angelegt' : 'Fixkosten-Vorlage gelöscht';
  if(!deepEqual(arr(prev,'todos'), arr(next,'todos')))        return 'To-Dos geändert';
  if(!deepEqual(arr(prev,'goals'), arr(next,'goals')))        return 'Sparziele geändert';
  if(!deepEqual(arr(prev,'months'), arr(next,'months')))      return 'Monatsdaten geändert';
  if(!deepEqual(prev.taxPlan, next.taxPlan))                  return 'Steuer-Planer geändert';
  if(!deepEqual(arr(prev,'fixedCosts'), arr(next,'fixedCosts'))) return 'Fixkosten geändert';
  if(!deepEqual(prev.quickActionsDone, next.quickActionsDone))return 'Schnellaktion abgehakt';
  if(!deepEqual(arr(prev,'accounts'), arr(next,'accounts')))  return 'Kontostand geändert';
  if(!deepEqual(prev.settings, next.settings))                return 'Einstellung geändert';
  return 'Änderung';
}
/* Lokale Wiederherstellungspunkte: die letzten SNAP_MAX Zustände, neuester zuerst;
   aufeinanderfolgende identische Zustände werden nicht doppelt gesichert.
   `label` überschreibt die abgeleitete Kurzbeschreibung (nur der Rücksprung
   selbst nutzt das — er ist keine Datenänderung, die sich ablesen liesse). */
function pushSnapshot(list, state, ts, label){
  list = Array.isArray(list) ? list : [];
  if(list[0] && deepEqual(list[0].state, state)) return list;
  const lbl = label || snapLabel(list[0] ? list[0].state : null, state);
  return [{ts: ts||new Date().toISOString(), label: lbl, state: deepClone(state)}].concat(list).slice(0, SNAP_MAX);
}
/* «vor X Minuten» (N8) — grobe, lesbare Relativzeit für die Rückgängig-Liste. */
function relTime(ts, nowMs){
  const t = new Date(ts).getTime();
  if(isNaN(t)) return '';
  const s = Math.max(0, Math.round(((nowMs||Date.now()) - t)/1000));
  if(s < 45) return 'gerade eben';
  const min = Math.round(s/60);
  if(min < 60) return 'vor '+min+' '+(min===1?'Minute':'Minuten');
  const h = Math.round(min/60);
  if(h < 24) return 'vor '+h+' '+(h===1?'Stunde':'Stunden');
  const d = Math.round(h/24);
  return 'vor '+d+' '+(d===1?'Tag':'Tagen');
}

/* Verlauf-Suche + Filter (E7): Text (Beschreibung/Betrag/Art), Typ, Konto,
   Zeitraum. Sortierung wie im Verlauf (neueste zuerst). */
function filterLedger(state, o){
  o = o || {};
  const q = (o.q||'').trim().toLowerCase();
  const rows = [];
  state.ledger.forEach((l,i)=>{
    if(o.type && o.type!=='all' && l.type!==o.type) return;
    if(o.accId && o.accId!=='all' && l.fromId!==o.accId && l.toId!==o.accId) return;
    if(o.from && l.date < o.from) return;
    if(o.to && l.date > o.to) return;
    if(q){
      const hay = ((l.desc||'')+' '+fmtAmt(l.amount)+' '+ledgerKindLabel(l)).toLowerCase();
      if(hay.indexOf(q)<0) return;
    }
    rows.push({l,i});
  });
  return rows.sort((a,b)=> a.l.date===b.l.date ? b.i-a.i : (a.l.date<b.l.date?1:-1)).map(x=>x.l);
}

/* Vermögensverlauf: Gesamtvermögen je Monat, rekonstruiert relativ zum aktuellen
   Gesamtvermögen über die Monats-Saldi (Lohn − Ausgaben). Planmonate = Projektion. */
function netWorthSeries(state){
  const total = round2(state.accounts.reduce((s,a)=>s+a.balance,0));
  const anchor = state.settings.currentMonthId;
  const saldoOf = m => round2(monthIncome(state,m).amount - monthExpenses(state,m).amount);
  return state.months.map(m=>{
    let worth;
    if(m.id===anchor) worth = total;
    else if(m.id < anchor){
      let s=0; state.months.forEach(k=>{ if(k.id>m.id && k.id<=anchor) s+=saldoOf(k); });
      worth = round2(total - s);
    } else {
      let s=0; state.months.forEach(k=>{ if(k.id>anchor && k.id<=m.id) s+=saldoOf(k); });
      worth = round2(total + s);
    }
    return {id:m.id, name:m.name, year:m.year, status:m.status, worth, saldo:saldoOf(m)};
  });
}

/* "Kommt bald": Jahresrechnungen, deren Fälligkeitsmonat in den nächsten
   monthsAhead Monaten liegt. Reine Information, bucht nichts. */
function monthDiffId(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12 + (+b.slice(5,7)-+a.slice(5,7)); }
function upcomingBills(state, todayStr, monthsAhead){
  monthsAhead = monthsAhead||3;
  const cm = todayStr.slice(0,7);
  const curM = +cm.slice(5,7);
  const out = [];
  state.fixedCosts.forEach(f=>{
    const fa = fixAmount(f);
    if(f.recurrence!=='yearly' || !f.dueMonth || fa<=0) return;
    let y = +cm.slice(0,4);
    if(f.dueMonth < curM) y++;
    const dueId = y+'-'+pad2(f.dueMonth);
    const diff = monthDiffId(cm, dueId);
    if(diff>=0 && diff<=monthsAhead) out.push({name:f.name, emoji:f.emoji, amount:fa, dueId, monthsAway:diff});
  });
  return out.sort((a,b)=>a.monthsAway-b.monthsAway);
}

/* Neutralitäts-Scan (SPEC Prinzip 0): der frische Default-Stand enthält KEINE
   hartkodierten Nutzerdaten (Namen, Banken, Beträge, Monate, Ziele). */
function neutralityAudit(){
  const d = defaultState();
  const issues = [];
  if(d.setupComplete) issues.push('setupComplete sollte false sein');
  if(d.settings.profileName!=='') issues.push('profileName nicht leer');
  if(d.accounts.length) issues.push('Konten vordefiniert');
  if(d.months.length) issues.push('Monate vordefiniert');
  if(d.goals.length) issues.push('Ziele vordefiniert');
  if(d.fixedCosts.length) issues.push('Fixkosten vordefiniert');
  if(d.ledger.length) issues.push('Verlauf vordefiniert');
  if(d.todos.length) issues.push('To-Dos vordefiniert');
  if(d.workModel.ratePerWorkday!==0 || d.workModel.ratePerHour!==0) issues.push('Löhne vordefiniert');
  if(d.workModel.holidayRegion!=='') issues.push('Region vordefiniert');
  if(d.savingsModel.allocations.length) issues.push('Spar-Töpfe vordefiniert');
  return issues;
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 8: geführter Monats-Ablauf + Planungs-Hilfen.
   REINE ORCHESTRIERUNG bestehender Funktionen — keine neue Rechenlogik.
   ════════════════════════════════════════════════════════════════════ */

/* Forecast (SPEC 2.22): kettet die BESTEHENDE Plan-/Engpass-Rechnung über alle
   Plan-Monate. Start = shortfallProjection.cp1 (Ende aktueller Geldmonat), dann
   je Plan-Monat + monthIncome − planMonthMainOutflow (dieselbe Zahl wie die
   Engpass-Karte). Liquidität/Vermögen aus liquiditySeries/netWorthSeries. */
function forecast(state){
  const main = mainAccount(state);
  if(!main) return null;
  const sp = shortfallProjection(state);
  const curId = state.settings.currentMonthId;
  const liqById = {}; liquiditySeries(state).forEach(x=>liqById[x.id]=x);
  const nwById = {}; netWorthSeries(state).forEach(x=>nwById[x.id]=x);
  const rows = [];
  let running = sp ? sp.cp1 : null;
  let firstBelowId = null;
  const cur = monthById(state, curId);
  if(cur){
    /* N9: rows[].min = Schwelle DIESES Monats (effectiveMinimum). Die frühere
       Konstante f.min gibt es nicht mehr — die Minimum-Linie ist eine Stufe,
       und firstBelowId prüft jede Zeile gegen ihre eigene Schwelle. */
    const minCur = effectiveMinimum(state, curId);
    rows.push({id:curId, name:cur.name, year:cur.year, status:cur.status, min:minCur,
      liq:liqById[curId]?liqById[curId].liq:null, worth:nwById[curId]?nwById[curId].worth:null, mainEnd:running});
    if(running!=null && running<minCur) firstBelowId = curId;
  }
  state.months.filter(m=>m.id>curId && m.status==='plan').sort((a,b)=>a.id<b.id?-1:1).forEach(m=>{
    const inc = monthIncome(state,m).amount;
    const out = planMonthMainOutflow(state,m);
    const minM = effectiveMinimum(state, m.id);
    running = (running==null) ? null : round2(running + inc - out);
    rows.push({id:m.id, name:m.name, year:m.year, status:'plan', min:minM,
      liq:liqById[m.id]?liqById[m.id].liq:null, worth:nwById[m.id]?nwById[m.id].worth:null, mainEnd:running, income:inc, outMain:out});
    if(running!=null && running<minM && !firstBelowId) firstBelowId = m.id;
  });
  /* minUniform: EIN Wert, solange alle Zeilen dieselbe Schwelle tragen (der
     Normalfall) — sonst null. Nur für Texte, die von «deinem Minimum» in der
     Einzahl sprechen dürfen; gerechnet wird ausschliesslich mit rows[].min. */
  const mins = rows.map(r=>r.min);
  const minUniform = mins.length && mins.every(v=>v===mins[0]) ? mins[0] : null;
  const belowRow = firstBelowId ? rows.find(r=>r.id===firstBelowId) : null;
  return { rows, firstBelowId, minUniform, minAtFirstBelow: belowRow ? belowRow.min : null };
}

/* Umverteilungs-Helfer (SPEC 2.23): von EINEM Konto/Space auf mehrere andere;
   Summe raus = Summe rein. Nutzt bestehende Transfer-Buchungen. */
function redistribute(state, fromId, allocs, fromGoalId){
  const from = state.accounts.find(a=>a.id===fromId);
  if(!from) return {error:'Quelle nicht gefunden', entries:[]};
  const gb = goalBackedIds(state);
  const valid = (Array.isArray(allocs)?allocs:[])
    .map(a=>({toId:a.toId, amount:round2(Math.abs(parseAmount(a.amount))), goalId:(typeof a.goalId==='string'&&a.goalId)?a.goalId:null}))
    .filter(a=>a.toId && a.toId!==fromId && a.amount>0 && state.accounts.some(x=>x.id===a.toId));
  const total = round2(valid.reduce((s,a)=>s+a.amount,0));
  if(total<=0) return {error:'Keine Zielbeträge', entries:[], total:0};
  /* Ziel-Kopplung (SPEC 2.27): zielgebundene Quelle → fromGoalId an jeder
     Buchung, zielgebundenes Ziel → alloc.goalId. Beides zugleich blockt die UI. */
  const entries = valid.map(a=>addBooking(state,{type:'transfer', desc:'Umverteilung '+from.name+' → '+accName(state,a.toId),
    amount:a.amount, fromId:fromId, toId:a.toId, date:today(),
    goalId: gb.has(fromId) ? (fromGoalId||null) : (gb.has(a.toId) ? a.goalId : null),
    source:'quickDeposit'}));
  return { entries, total, count:valid.length };
}

/* KK begleichen ohne Engpass (SPEC 2.10-Orchestrierung): das zuständige Konto
   zahlt die volle Schuld. Nur einsetzen, wenn KEIN ccPriorityProposal vorliegt
   (sonst deckt die Vorschlagskarte, KK-Vorrang). Transfer — nie Doppelzählung. */
function payCreditCard(state, ccId){
  const cc = state.accounts.find(a=>a.id===ccId);
  if(!cc || cc.kind!=='creditcard' || cc.balance>=0) return null;
  const resp = responsibleAccountFor(state, cc);
  if(!resp) return null;
  const amount = round2(-cc.balance);
  return addBooking(state,{type:'transfer', desc:'KK-Begleichung '+cc.name, amount, fromId:resp.id, toId:cc.id, date:today(), source:'quickAction'});
}

/* Monats-Assistent — Datenquellen je Schritt (reine Auswahl aus bestehender
   Logik, keine neue Rechnung): */
function assistantSteps(state){
  const monthId = state.settings.currentMonthId;
  const qa = quickActionsFor(state, monthId);          /* bestehende Schnellaktionen */
  const dist = qa.open.filter(x=>!x.pot);              /* Fixkosten/Spaces/Jahresrücklagen */
  const pots = qa.open.filter(x=>x.pot);               /* %-Spar-Töpfe */
  const cards = state.accounts.filter(a=>a.kind==='creditcard' && a.balance<0);
  const props = ccPriorityProposals(state);
  const ccItems = cards.map(cc=>({cc, proposal: props.find(p=>p.ccId===cc.id)||null}));
  return { monthId, salary: autoSalaryWindow(state, today()), dist, pots, cards:ccItems,
    total: qa.total, doneCount: qa.doneCount };
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe 9: Steuer-Planer (dynamische Rücklage) + Lohn-Prognose.
   Steuer-Rücklage = Erweiterung der Jahreskosten-Rücklage (2.12): gleiches
   Verhalten, aber dynamisches, editierbares Ziel statt fix ÷ 12.
   ════════════════════════════════════════════════════════════════════ */

function taxRemainingMonths(state){ return Math.max(1, monthDiffId(state.settings.currentMonthId, state.taxPlan.dueMonth)); }
/* Monatsrate = aufgerundet (Betrag − bereits zurückgelegt) ÷ verbleibende Monate. */
function taxMonthlyRate(state){
  const tp = state.taxPlan;
  if(!tp.enabled || !tp.dueMonth || tp.amount<=0) return 0;
  return Math.max(0, Math.ceil((tp.amount - tp.reserved) / taxRemainingMonths(state)));
}
/* Schnellaktion "Steuern (Rücklage)" — nur im aktuellen Geldmonat und nur VOR
   dem Fälligkeitsmonat. Verhält sich wie eine Verpflichtung (zählt im Rest). */
function taxReserveQuickItem(state, monthId){
  const tp = state.taxPlan;
  if(!tp.enabled || !tp.dueMonth || monthId!==state.settings.currentMonthId) return null;
  if(monthId >= tp.dueMonth) return null;
  if(taxPaid(state)) return null;   /* N2 (B1): bezahlt → keine Rücklage-Schnellaktion (Absicherung gegen manuell zurückgestellten Monat) */
  const main = mainAccount(state);
  const fromId = tp.fromId || (main?main.id:null);
  if(!fromId || !tp.reserveToId) return null;
  const rate = taxMonthlyRate(state);
  if(rate<=0) return null;
  return {fixedId:'tax_reserve', name:'Steuern (Rücklage)', emoji:'📋', amount:rate,
    kind:'transfer', fromId, toId:tp.reserveToId, yearlyAmount:tp.amount, tax:true};
}
/* Fällige Steuerrechnung im dueMonth — begleichbar aus dem Rücklage-Topf.
   Ansparen ≠ Bezahlen: belastet den Rest NICHT (kommt nicht vom Hauptkonto). */
function taxDueFor(state){
  const tp = state.taxPlan;
  if(!tp.enabled || !tp.dueMonth || tp.amount<=0) return null;
  if(state.settings.currentMonthId !== tp.dueMonth) return null;
  if((state.quickActionsDone[tp.dueMonth]||{})['tax_due']) return null;
  const payFromId = tp.reserveToId || tp.fromId || null;
  if(!payFromId) return null;
  return {dueKey:'tax_due', name:'Steuern', emoji:'📋', amount:tp.amount, payFromId, reserved:tp.reserved};
}
function payTaxBill(state){
  const d = taxDueFor(state);
  if(!d) return null;
  const mid = state.taxPlan.dueMonth;
  const entry = addBooking(state,{type:'ausgang', desc:'📋 Steuern (Jahresrechnung)', amount:d.amount, fromId:d.payFromId, date:today(), source:'quickAction'});
  if(!state.quickActionsDone[mid]) state.quickActionsDone[mid]={};
  state.quickActionsDone[mid]['tax_due']=true;
  state.taxPlan.reserved = 0;   /* Zähler zurücksetzen nach Zahlung */
  return entry;
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe N6: variable Kosten zur Seite legen (SPEC 2.46).
   Muster = Steuer-Rücklage (2.25): dynamisch gerechnet, in quickActionsFor
   eingehängt, zählt im Rest, Ansparen ≠ Bezahlen.
   KERNPUNKT: variable[] bekommt KEINE Rolle in einer Rechnung des laufenden
   Monats. restToSpend/monthExpenses/surplusFor/shortfallProjection bleiben
   unangetastet — der Rest sinkt, weil das GELD das Hauptkonto verlässt.
   ════════════════════════════════════════════════════════════════════ */

/* Einfacher Namens-Abgleich (bewusst KEIN Fuzzy-Matching): Beschreibung enthält
   den Namen des Postens oder umgekehrt, case-insensitiv. Trifft es nicht, ist
   das kein Fehler — die Warnung schweigt dann einfach. Kürzestes Wort ≥ 3
   Zeichen, damit ein Posten «TV» nicht jede Buchung trifft. */
function varMatch(desc, name){
  const a = (desc||'').trim().toLowerCase(), b = (name||'').trim().toLowerCase();
  if(a.length<3 || b.length<3) return false;
  return a.includes(b) || b.includes(a);
}
/* Σ der geplanten variablen Kosten eines Monats — reine Anzeige/Rücklage-Basis,
   NICHT Teil einer Monatsrechnung. */
function varTotalFor(state, monthId){
  const m = monthById(state, monthId);
  if(!m) return 0;
  return round2(m.variable.reduce((s,v)=>s+v.amount,0));
}
/* Bereits zurückgelegt für DIESEN Geldmonat = Σ der varReserve-Buchungen mit
   diesem moneyMonthId. Bewusst KEIN eigener Zähler: der Verlauf IST der Stand
   → Rückgängig/Löschen rechnet ohne Sonderweg zurück (der Steuer-Zähler
   `reserved` brauchte dafür Snapshot-Undo). */
function varReservedFor(state, monthId){
  return round2(state.ledger.filter(l=>l.source==='varReserve' && l.moneyMonthId===monthId)
    .reduce((s,l)=>s+l.amount,0));
}
/* Datum der ersten Rücklage für diesen Geldmonat — Startpunkt für «davon schon
   bezahlt» (alles davor kann die Rücklage nicht verbraucht haben). */
function varReserveSince(state, monthId){
  const ds = state.ledger.filter(l=>l.source==='varReserve' && l.moneyMonthId===monthId).map(l=>l.date).sort();
  return ds.length ? ds[0] : null;
}
/* Aus dem Topf gegen die Rücklage bezahlt: Ausgänge aus dem Topf ab der ersten
   Rücklage, deren Beschreibung zu einem variablen Posten dieses Geldmonats
   passt (derselbe Matcher wie die Warnung — EINE Regel, nicht zwei).
   N10: das ist die ZUORDNUNGS-Grösse («was wurde erkennbar aus dem Topf für
   variable Posten bezahlt»). Der Tracker-Wert Z hängt seit N10 NICHT mehr daran
   (er kommt aus Plan + Topf-Saldo, s. varInPot) — die Zahl bleibt als eigene
   Aussage stehen und trennt im Selbst-Check «Zuordnung» von «Deckung». */
function varSpentAgainstReserve(state, monthId){
  const pot = state.settings.varReserveToId;
  const since = varReserveSince(state, monthId);
  const m = monthById(state, monthId);
  if(!pot || !since || !m) return 0;
  return round2(state.ledger.filter(l=>l.type==='ausgang' && l.fromId===pot && l.date>=since
    && m.variable.some(v=>varMatch(l.desc, v.name))).reduce((s,l)=>s+l.amount,0));
}
/* ─── N10 / Teil A: Z folgt der Realität (SPEC 2.50b, ersetzt die N6-Herleitung) ───
   FRÜHER: Z = zurückgelegt − davon bezahlt. Das las die zurückgelegte SUMME aus
   dem Verlauf — nie den Plan, nie den Topf-Saldo. Darum blieb Z auf 305 stehen,
   obwohl der Plan längst 400 sagte oder das Geld per Anpassung wieder draussen
   war, und der Tracker meldete «ungedeckt», wo nichts ungedeckt war.
   JETZT: Z = min(Σ variable des Geldmonats, verfügbarer Topf-Anteil).
   · Plan hoch (305→400) → Z zieht nach, sofern der Topf es deckt.
   · Geld raus (Anpassung/Zahlung von anderswo) → Topf-Saldo sinkt → Z sinkt →
     «ungedeckt» verschwindet von selbst.
   DECKEL-REIHENFOLGE (verbindlich): reicht der Topf nicht für alles, wird in
   der Reihenfolge Steuern (Y) → Jahresrücklagen/Serafe (X) → variable Kosten (Z)
   gedeckt. Y und X bleiben bewusst SALDO-UNABHÄNGIG (2.25) — sie behalten ihren
   vollen Anspruch und weichen einander nie; Z ist der einzige Teil, der weicht,
   weil er der flüchtigste ist. Bleibt nach Y+X nichts übrig, ist Z = 0 und die
   Unterdeckung von Y+X steht weiter ehrlich als «ungedeckt» in der Zeile. */
function potPartsBeforeVar(state, potId){
  const parts = [];
  if(!potId) return parts;
  /* WICHTIG zur Deckel-Reihenfolge Y→X→Z: weil WEDER Y (Steuern, 2.25) NOCH X
     (Jahresrücklagen) beschnitten wird, ist ihre Reihenfolge ZUEINANDER
     arithmetisch nicht beobachtbar — für Z zählt allein ihre Summe. Beobachtbar
     ist nur, dass Z zuletzt kommt und als einziger Teil weicht. Darum stehen die
     Teile hier weiter in der Anzeige-Reihenfolge von 2.46 (Jahresposten, dann
     Steuern) — die Tracker-Zeile bleibt Wort für Wort, wie sie dokumentiert ist. */
  /* Jahresposten mit Rücklage auf diesen Topf — über die Monats-Kopien, weil
     dort der historische Betrag UND der Erledigt-Merker hängen. */
  const yearly = {};
  state.months.forEach(m=>{
    const done = state.quickActionsDone[m.id] || {};
    m.fixed.forEach(f=>{
      const fa = fixAmount(f);
      if(f.recurrence!=='yearly' || f.reserveToId!==potId || fa<=0) return;
      if(!done[f.id]) return;
      const key = f.tplId || f.name;
      if(!yearly[key]) yearly[key] = {name:f.name, emoji:f.emoji, in:0};
      yearly[key].in = round2(yearly[key].in + fa/12);
    });
  });
  Object.keys(yearly).forEach(k=>{
    const y = yearly[k];
    const paid = round2(state.ledger.filter(l=>l.type==='ausgang' && l.fromId===potId && varMatch(l.desc, y.name))
      .reduce((s,l)=>s+l.amount,0));
    const amount = round2(Math.max(0, y.in - paid));
    if(amount>0) parts.push({key:'yearly:'+k, name:y.name, emoji:y.emoji, amount});
  });
  /* Steuer-Rücklage: bestehender Zähler, kein zweiter. */
  const tp = state.taxPlan;
  if(tp.enabled && tp.reserveToId===potId && tp.reserved>0)
    parts.push({key:'tax', name:'Steuern', emoji:'📋', amount:round2(tp.reserved)});
  return parts;
}
/* Was im Topf noch für die variablen Kosten übrig ist, nachdem Y und X ihren
   vollen Anspruch angemeldet haben. Nie negativ. */
function potVarAvailable(state, potId){
  if(!potId) return 0;
  const pot = state.accounts.find(a=>a.id===potId);
  if(!pot) return 0;
  const bound = round2(potPartsBeforeVar(state, potId).reduce((s,p)=>s+p.amount,0));
  return round2(Math.max(0, pot.balance - bound));
}
/* Tracker-Z: der Teil des Topfs, der die variablen Kosten dieses Geldmonats
   tatsächlich deckt — Plan, gedeckelt auf das, was wirklich da ist. */
function varInPot(state, monthId){
  const potId = state.settings.varReserveToId;
  if(!potId) return 0;
  return round2(Math.min(varTotalFor(state, monthId), potVarAvailable(state, potId)));
}
/* Pro-Posten-Stand des Geldmonats: geplant, davon aus dem Topf bezahlt (Namens-
   Abgleich wie die Warnung), Rest. Speist die «Wofür?»-Auswahl beim Zahlen aus
   dem Topf UND die Aufteilungs-Anzeige. Kein neues Feld — die Zuordnung entsteht
   allein daraus, dass die Buchung den Posten-Namen trägt (2.46). */
function varItemStatus(state, monthId){
  const pot = state.settings.varReserveToId;
  const since = varReserveSince(state, monthId);
  const m = monthById(state, monthId);
  if(!m) return [];
  return m.variable.map(v=>{
    let paid = 0;
    if(pot && since) paid = round2(state.ledger.filter(l=>l.type==='ausgang' && l.fromId===pot
      && l.date>=since && varMatch(l.desc, v.name)).reduce((s,l)=>s+l.amount,0));
    return {name:v.name, amount:round2(v.amount), paid, remaining:round2(Math.max(0, v.amount-paid))};
  });
}
/* Schnellaktion «Variable Kosten (Rücklage)» — nur im aktuellen Geldmonat.
   Betrag = Σ variable − bereits zurückgelegt. Erhöht Leo einen Posten NACH dem
   Zurücklegen, erscheint die Differenz als neue Aktion; reduziert er, wird nie
   negativ gebucht (die Aktion gilt dann als erledigt). */
function varReserveQuickItem(state, monthId){
  const potId = state.settings.varReserveToId;
  if(!potId || monthId!==state.settings.currentMonthId) return null;
  const pot = state.accounts.find(a=>a.id===potId);
  const main = mainAccount(state);
  if(!pot || !main || pot.id===main.id) return null;
  /* Zielgebundene Konten (SPEC 2.27) verlangen ein Pflicht-Ziel je Bewegung —
     eine Schnellaktion kann das nicht raten. Topf zielgebunden → keine Aktion. */
  if(goalBackedIds(state).has(potId)) return null;
  const total = varTotalFor(state, monthId);
  if(total<=0) return null;
  const reserved = varReservedFor(state, monthId);
  const delta = round2(total - reserved);
  return {fixedId:'var_reserve', name:'Variable Kosten (Rücklage)', emoji:'🧾',
    amount: delta>0 ? delta : 0, kind:'transfer', fromId:main.id, toId:potId,
    yearlyAmount:null, varReserve:true, varTotal:total, varReserved:reserved};
}
/* Tracker am Topf-Konto: «davon Serafe: X · Steuern: Y · variable Kosten: Z».
   X = Jahresrücklagen auf diesen Topf (SPEC 2.12/2.31) aus den erledigten
       Schnellaktionen (quickActionsDone) — der bestehende Merker, KEIN neuer
       Zähler — minus passende Entnahmen aus dem Topf. Saldo-unabhängig.
   Y = Steuer-Rücklage aus dem bestehenden Zähler taxPlan.reserved. Bewusst
       saldo-unabhängig (2.25) — daran ändert N10 NICHTS.
   Z = varInPot: seit N10 saldo-ABHÄNGIG (Plan, gedeckelt auf den Rest nach Y+X).
   EHRLICHE GRENZE: die Ausgangs-Seite von X hängt am Namens-Abgleich — eine
   anders benannte Zahlung wird nicht erkannt (siehe Bericht). Z braucht den
   Abgleich nicht mehr: es sieht den Topf-Saldo und damit jede Entnahme. */
function potBreakdown(state, potId){
  if(!potId) return null;
  const pot = state.accounts.find(a=>a.id===potId);
  if(!pot) return null;
  /* Y (Steuern) + X (Jahresrücklagen) in der Deckel-Reihenfolge — EINE Quelle,
     geteilt mit potVarAvailable, damit Anzeige und Deckel nie auseinanderlaufen. */
  const parts = potPartsBeforeVar(state, potId).slice();
  /* Variable Kosten des aktuellen Geldmonats — nur am eingerichteten Topf;
     varInPot liest settings.varReserveToId, kennt also potId nicht von selbst. */
  const v = (potId===state.settings.varReserveToId) ? varInPot(state, state.settings.currentMonthId) : 0;
  if(v>0) parts.push({key:'variable', name:'variable Kosten', emoji:'🧾', amount:v});
  const known = round2(parts.reduce((s,p)=>s+p.amount,0));
  return { pot, parts, known, rest: round2(pot.balance - known) };
}
/* Doppelzahlungs-Warnung (SPEC 2.46): Ausgang vom HAUPTKONTO, dessen
   Beschreibung zu einem variablen Posten des Geldmonats passt, während für
   variable Kosten noch Geld im Topf liegt. Nicht-blockierend, bucht nichts,
   bucht nie automatisch um — reine Warnung. */
function potPayHint(state, b){
  const potId = state.settings.varReserveToId;
  const main = mainAccount(state);
  if(!potId || !main) return null;
  if(b.type!=='ausgang' || b.fromId!==main.id) return null;
  const monthId = state.settings.currentMonthId;
  const m = monthById(state, monthId);
  if(!m) return null;
  const y = varInPot(state, monthId);
  if(y<=0) return null;
  const hit = m.variable.find(v=>varMatch(b.desc, v.name));
  if(!hit) return null;
  const pot = state.accounts.find(a=>a.id===potId);
  return { item:hit, inPot:y, potName: pot ? pot.name : '—' };
}

/* ════════════════════════════════════════════════════════════════════
   ENGINE — Etappe N20: GEPLANTE RÜCKLAGE (SPEC 2.57).
   Ein EIGENES Konzept neben den variablen Kosten — nicht deren Erweiterung:
   ein benannter Betrag, den man in einem Monat zurücklegt und in einem (evtl.
   anderen) Monat braucht.
   ABGRENZUNG, der Kern: variable[] (2.6/2.46) und der Sonstiges-Topf
   (varReserve/2.50b) sind NICHT angefasst — kein neues Feld, keine neue Rolle,
   keine Formeländerung dort. plannedReserves[] fliesst in KEINE Bestands-
   rechnung (surplusFor, monthPlannedOutflows, monthExpenses, shortfallProjection,
   planMonthMainOutflow, varReserve-Tracker). Die einzige Geld-Wirkung ist der
   physische Transfer beim Zurücklegen — exakt das Prinzip aus 2.46.
   ════════════════════════════════════════════════════════════════════ */

/* Ist diese Rücklage überhaupt ausführbar? Alles, was fehlt oder kaputt ist,
   führt zu «keine Aktion» — nie zu einem geratenen Konto und nie zu einem
   negativen Transfer (Muster varReserveToId === null, 2.46).
   Zielgebundene Konten (SPEC 2.27) sind ausgeschlossen: dort verlangt jede
   Bewegung ein Pflicht-Ziel, das eine Schnellaktion nicht raten darf. */
function plannedReserveBlocker(state, r){
  if(!r) return 'missing';
  if(!(parseAmount(r.amount)>0)) return 'amount';
  if(!nMonthId(r.executeMonthId)) return 'month';
  if(!r.toId || !state.accounts.some(a=>a.id===r.toId)) return 'account';
  const main = mainAccount(state);
  if(!main) return 'main';
  if(r.toId===main.id) return 'account';
  if(goalBackedIds(state).has(r.toId)) return 'goalbacked';
  return null;
}
function plannedReserveActionable(state, r){ return plannedReserveBlocker(state, r)===null; }

/* Die offenen «Zurücklegen»-Aktionen des aktiven Geldmonats.
   FÄLLIG ODER ÜBERFÄLLIG (`executeMonthId <= monthId`): ein verpasster Monat
   verschwindet nicht stillschweigend, sondern steht weiter da — dieselbe
   Haltung wie fixedSalaryWindow (2.56, «ältester offener Monat gewinnt»).
   Quelle ist IMMER das Hauptkonto; damit zählt die Aktion im «Rest zum
   Ausgeben» GRATIS über den bestehenden Filter (restToSpend filtert
   quickActionsFor(...).open auf fromId===main.id) — es gibt dort KEINE neue
   Regel. «Ansparen ≠ Bezahlen» (2.46): das Buchen senkt Saldo UND offene
   Verpflichtung um denselben Betrag, der Rest bleibt; er sinkt, sobald die
   Rücklage ENTSTEHT.
   Nur im aktiven Geldmonat (wie varReserveQuickItem/taxReserveQuickItem):
   die Aktion gehört zum Monat, in dem gehandelt wird, nicht zu jedem Monat,
   den man gerade ansieht. */
function plannedReserveItems(state, monthId){
  if(monthId!==state.settings.currentMonthId) return [];
  const main = mainAccount(state);
  if(!main) return [];
  return state.plannedReserves.filter(r=>
      r.status==='planned' && plannedReserveActionable(state, r) && r.executeMonthId<=monthId)
    .map(r=>({ fixedId:'pres_'+r.id, name:'Zurücklegen: '+r.name, emoji:'🗓️',
      amount: round2(parseAmount(r.amount)), kind:'transfer', fromId:main.id, toId:r.toId,
      yearlyAmount:null, plannedReserve:true, reserveId:r.id,
      overdue: r.executeMonthId<monthId, needMonthId:r.needMonthId }));
}

/* Lohn-Prognose (reine Anzeige): voraussichtlicher Gesamtlohn des Jahres —
   effektiv für done/curr, Schätzung für plan; AUSSCHLIESSLICH via monthIncome. */
function salaryForecast(state){
  const year = state.settings.currentMonthId.slice(0,4);
  const curId = state.settings.currentMonthId;
  let total=0, remaining=0; const items=[];
  state.months.filter(m=>m.id.slice(0,4)===year).sort((a,b)=>a.id<b.id?-1:1).forEach(m=>{
    const inc = monthIncome(state,m);
    total += inc.amount;
    if(m.status==='plan' && m.id>=curId) remaining += inc.amount;
    items.push({id:m.id, name:m.name, amount:inc.amount, label:inc.label, status:m.status});
  });
  return { year, total:round2(total), remaining:round2(remaining), items };
}

    try{ fn(ok); }catch(e){ det.push({ok:false,msg:'Ausnahme: '+(e&&e.message||e)}); }
    results.push({name, ok: det.length>0 && det.every(d=>d.ok), details:det});

  T('N8/B — incomeOverride IST der Brutto-Gesamtlohn (Instant Pay genau einmal abgezogen)', ok=>{
    const mk = (over) => {

      return st;
    };
    /* VOR dem Lohntag: Brutto 5100 eingetragen, 765 davon schon als Vorschuss
       geflossen. Der Vorschuss steht als Spiegel in extraIncome → er darf den
       Monatslohn NICHT erhöhen. */
    const st = mk(5100);
    const m = monthById(st,'2026-07');
    ok(monthIncome(st,m).amount===5100,'ohne Vorschuss: Override 5100 → Monatslohn 5100');
    captureInstantPay(st,{amount:765, date:'2026-07-02', targetId:'2026-07'});
    ok(instantPaySum(st,'2026-07')===765 && m.extraIncome.length===1,'Vorschuss 765 gebucht und nach extraIncome gespiegelt');
    ok(monthIncome(st,m).amount===5100,'Kontrollrechnung 1 — vor Lohntag: 5100 + (765 − 765) = 5100, NICHT 5865');
    ok(mainAccount(st).balance===1765,'… der Vorschuss erhöht trotzdem den echten Saldo (1000 + 765)');
    /* Zwei Vorschüsse: der Abzug bleibt exakt einmal, in voller Höhe. */
    captureInstantPay(st,{amount:255, date:'2026-07-03', targetId:'2026-07'});
    ok(instantPaySum(st,'2026-07')===1020 && monthIncome(st,m).amount===5100,'zwei Vorschüsse (765 + 255 = 1020) → Monatslohn bleibt 5100');
    /* Nebeneinnahme, die KEIN Lohn-Spiegel ist, zählt weiter oben drauf. */
    m.extraIncome.push({desc:'Provision', amount:225});
    ok(monthIncome(st,m).amount===5325,'Kontrollrechnung 2 — mit Provision: 5100 + (1245 − 1020) = 5325');
    /* NACH dem Lohntag: bookSalaryPayout nullt den Override, der Fallback über
       die gebuchten Lohn-Eingänge liefert wieder exakt den Brutto-Betrag. */
    const st2 = mk(5100);
    captureInstantPay(st2,{amount:765, date:'2026-07-02', targetId:'2026-07'});
    const w = autoSalaryWindow(st2,'2026-07-06');
    ok(!!w && w.gross===5100 && w.instant===765 && w.payout===4335,'autoSalaryWindow liest denselben Override als brutto: 5100 − 765 = 4335');
    const res = bookSalaryPayout(st2,'2026-07',5100);

    ok(monthIncome(st2,m2).amount===5100,'Kontrollrechnung 3 — nach Lohntag über den Fallback: 765 + 4335 = 5100 brutto');
    /* Die Doppelzähl-Invariante: Monatslohn = Brutto = Vorschüsse + Auszahlung,
       einmal gezählt — und der Saldo bewegt sich um genau denselben Betrag. */
    ok(instantPaySum(st2,'2026-07') + salaryPayoutSum(st2,'2026-07') === monthIncome(st2,m2).amount,
       'INVARIANTE: Vorschüsse + Rest-Auszahlung = Monatslohn (5100), genau einmal gezählt');
    ok(mainAccount(st2).balance===6100,'… und der Saldo stieg um genau 5100 (1000 → 6100), nicht um mehr');
    /* Ohne Override bleibt die bestehende Kette unangetastet. */
    const st3 = mk(null);

  T('N9.4 — INVARIANTE: settings.liquidMinimum wird NIRGENDS direkt gelesen (ausser in effectiveMinimum + Setzern)', ok=>{
    /* Statischer Quelltext-Scan über ALLE Funktionen des Programms: wer
       `settings.liquidMinimum` im Rumpf trägt, taucht auf. Die erwartete Liste
       ist abschliessend — eine vergessene oder neu eingebaute Konstante in
       einem Verbraucher lässt diese Gruppe sofort rot werden. */
    const scan = (()=>{
      const hits=[]; let scanned=0;
      Object.getOwnPropertyNames(typeof globalThis!=='undefined'?globalThis:this).forEach(n=>{
        let v; try{ v = globalThis[n]; }catch(e){ return; }
        if(typeof v!=='function') return;
        let src; try{ src = Function.prototype.toString.call(v); }catch(e){ return; }
        /* eingebaute Funktionen aussortieren — am ENDE des Rumpfs erkannt, nicht
           an einem Vorkommen irgendwo im Text (sonst schliesst diese Prüfung sich
           selbst aus: ihr eigener Quelltext nennt die Zeichenfolge ja). */
        if(/\{\s*\[native code\]\s*\}\s*$/.test(src)) return;
        scanned++;
        if(/settings\s*\.\s*liquidMinimum/.test(src)) hits.push(n);
      });
      return {scanned, hits:hits.sort()};
    })();
    ok(scan.scanned>200,'der Scan sieht das ganze Programm ('+scan.scanned+' Funktionen) — er kann nicht still leer laufen');
    const erlaubt = ['applyBufferSuggestion','claudeHandoffText','effectiveMinimum','normalizeState',
                     'rEinst','rMonat','rWizard','runSelfChecks','setLiquidMinimum','setProposalPathValue'];
    ok(scan.hits.join(',')===erlaubt.join(','),'genau diese Funktionen lesen/schreiben die globale Schwelle direkt: '+scan.hits.join(', '));
    /* Warum jede erlaubte Stelle erlaubt ist — als Text festgehalten, damit die
       Liste nicht zur blossen Abnick-Zeile wird:
       effectiveMinimum = die EINE Quelle (Fallback) · normalizeState/
       setLiquidMinimum/applyBufferSuggestion/setProposalPathValue = Setzer ·
       rEinst/rWizard = die Editoren der globalen Einstellung · rMonat = zeigt
       sie als «global (X)»-Platzhalter neben dem Monatsfeld · claudeHandoffText
       = Dokumentation für Claude · runSelfChecks = diese Tests. */
    ok(/month\s*\?\s*m\.liquidMinimum|m\s*\?\s*m\.liquidMinimum/.test(effectiveMinimum.toString()) || effectiveMinimum.toString().indexOf('m.liquidMinimum')>=0,'effectiveMinimum liest zuerst den Monatswert …');
    ok(/settings\.liquidMinimum/.test(effectiveMinimum.toString()),'… und nutzt die globale Schwelle nur als Rückfall');
    /* Gegenprobe: die Rechen-Verbraucher gehen alle über den Helfer */
    ['restToSpend','ccPriorityProposals','shortfallProjection','forecast','proposalMainBelowMin']

    /* Und: 600 lebt weiterhin nur als Default */
    ok(defaultState().settings.liquidMinimum===600 && normalizeState({schemaVersion:1}).settings.liquidMinimum===600,'600 bleibt reiner Default (N4.2 unverändert gültig)');
  });

     ENTFERNT gegenüber N14: die Gruppen «N14.1 — Vergangenheit aus
     liquiditySeries» (17 Prüfpunkte) und «N14.2 — Zeichnung» (17). Beide
     prüften eine Rückrechnung, die es nicht mehr gibt; N14.1 nagelte sogar
     ausdrücklich fest, dass sie keine eigene Information trägt. Kein Prüfpunkt
     ist umgedreht worden — sie sind weg, und die Aussagen über die ZEICHNUNG
     (Ist solid, Prognose gestrichelt, Naht, Minimum voll breit, Ring nur bei
     Unterschreitung) sind in N15.3 auf echten Daten neu erarbeitet.

     Lage im Fixture (identisch zu N14, damit der Vergleich trägt):
       forecast() Aug 800 · Sep 1600 · firstBelowId null
       netWorthSeries 900 / 1000 / 600 / 1000 / 1800
       aufgezeichnet  Mai 700 · Juni 800 · Juli 400   ← jetzt gespeicherte
                                                        Stände, nicht gerechnet
     ⇒ dieselben fünf Punkte in Spur 2 wie unter N14, aber jeder einzelne davon
       ist entweder eine Aufzeichnung oder eine Prognose. GENAU EINER (Juli 400)
       liegt unter seiner Schwelle 600, firstBelowId ist null — die eine
       Markierung im Bild kann also nur die rückwirkende sein. */
  const mkN15 = o => { o = o||{};
    const mins = o.mins || {};
    const snaps = ('snaps' in o) ? o.snaps : {'2026-05':700,'2026-06':800,'2026-07':400};
    const sts = o.sts || {};
    const mo = (id,name,status,inc,fixed,variable) => ({id, name, year:2026, status:(id in sts)?sts[id]:status,
      incomeOverride:inc, workdays:0, liquidMinimum:(id in mins)?mins[id]:null, fixed, variable});
    return normalizeState({schemaVersion:1, setupComplete:true,
      settings:{currentMonthId:'2026-08', ytdStartMonthId:'2026-05',
                liquidMinimum:('glob' in o)?o.glob:600, currency:'CHF'},
      workModel:{ratePerWorkday:0},
      accounts:[{id:'M',name:'Haupt',kind:'main',balance:1000}],
      mainSnapshots: snaps,
      months:[
        mo('2026-05','Mai','done',1000,[],[{name:'a',amount:900}]),
        mo('2026-06','Juni','done',1000,[],[{name:'b',amount:900}]),
        mo('2026-07','Juli','done',1000,[],[{name:'c',amount:1400}]),
        mo('2026-08','August','curr',400,[{id:'f1',name:'Abo',amount:200,kind:'debit',fromId:'M',recurrence:'monthly'}],[]),
        mo('2026-09','September','plan',1000,[{id:'f2',name:'Abo',amount:200,kind:'debit',fromId:'M',recurrence:'monthly'}],[])]});
  };

     den <svg>-Kopf: das aria-label beschreibt beide Spuren und darf sich mit der
     Minimum-Linie ändern — es ist kein Beleg für «Spur 1 unverändert». */
  const spur1Of = s => (s.split('>GESAMTVERMÖGEN')[1]||'').split('>HAUPTKONTO')[0];
  const spur2Of = s => s.split('>HAUPTKONTO')[1] || '';

  /* Eine Fixture fuer alle N18-Gruppen, absichtlich dieselbe Form wie N17_FIX

  const N18_FIX = (over) => normalizeState({schemaVersion:1, setupComplete:true,
    settings:{currentMonthId:'2026-07', ytdStartMonthId:'2026-06'},
    workModel:{ratePerWorkday:300,
      fixedSalary: Object.assign({enabled:true, name:'Büro', fullPensumAmount:4000, pensumPercent:30}, over||{})},

  T('N18/A — Startmonat: der Festlohn greift nicht rueckwirkend', ok=>{
    const st = N18_FIX({startMonthId:'2026-07'});
    const m = id => monthById(st,id);
    ok(st.workModel.fixedSalary.startMonthId==='2026-07','Startmonat kommt sauber durch die Normalisierung');
    ok(fixedIncomeFor(st,m('2026-06'))===0,'Monat VOR dem Start (Juni < Juli) → 0');
    ok(fixedIncomeFor(st,m('2026-07'))===1200,'Monat GLEICH dem Start (Juli) → 1200 — die Grenze ist einschliessend');
    ok(fixedIncomeFor(st,m('2026-08'))===1200,'Monat NACH dem Start (August) → 1200');
    /* Die Schicht-Quelle bleibt in allen drei Monaten unberuehrt (10/17/12 x 300). */
    ok(monthIncome(st,m('2026-06')).amount===3000 && monthIncome(st,m('2026-06')).fixed===0,
       'Juni: Monatslohn 3000 = nur Schichtlohn, Festlohn-Anteil exakt 0');
    ok(monthIncome(st,m('2026-07')).amount===6300 && monthIncome(st,m('2026-07')).shift===5100,
       'Juli: 5100 Schicht + 1200 Fest = 6300, der Schicht-Anteil ist unveraendert');
    ok(['2026-06','2026-07','2026-08'].every(id=>{
      const r = monthIncome(st,m(id)); return r.amount===round2(r.shift+r.fixed);
    }),'KEINE Doppelzaehlung: Summe = Schicht + Fest, auch mit Startmonat');
    /* Ein Monats-Pensum VOR dem Start darf nichts aufwecken — sonst waere die
       Sperre umgehbar, sobald ein alter Monat aus einem Import ein fixedPensum traegt. */
    m('2026-06').fixedPensum = 60;
    ok(fixedIncomeFor(st,m('2026-06'))===0,'ein fixedPensum:60 im Monat VOR dem Start bleibt wirkungslos (die Sperre steht vor der Pensum-Lesung)');
    m('2026-06').fixedPensum = null;

    const stY = N18_FIX({startMonthId:'2026-01'});
    stY.months.push({id:'2025-12',name:'Dezember',year:2025,status:'done',workdays:10,
      incomeOverride:null,extraIncome:[],fixed:[],variable:[],liquidMinimum:null,fixedPensum:null,note:''});

    ok(fixedIncomeFor(stY,monthById(stY,'2026-06'))===1200,'… und jeder Monat des Startjahres ab Januar traegt den Festlohn');
    /* YTD-Fenster Juni+Juli: nur Juli traegt den Festlohn. */
    ok(ytdStats(st).income===round2(3000+6300),'YTD (Juni+Juli) = 3000 + 6300 = 9300 — der Startmonat wirkt auch in den Ableitungen, ohne dass eine davon ihn kennt');

    /* (h) Typwechsel räumt die Felder auf, die der neue Typ nicht kennt. */

       'Eingang → Ausgang: incomeKind, moneyMonthId und toId fallen weg (Regel aus normalizeState)');

       'Anpassung −120 → −200: 1000 + 120 − 200 = 920 (Anlage wendet nicht an, Bearbeiten rechnet symmetrisch)');
    ok(editEntry(G,'adj',{date:'2026-09-01'})===null && G.ledger[0].date==='2026-07-04',

    ok(adjustDateAllowed(G,'2026-07-31')===true && adjustDateAllowed(G,'2026-08-01')===false,'die Grenze läuft am laufenden Monat (2026-07), nicht am Tag');

  T('N22.3 — «Saldo danach»: am realen Saldo verankert, rückwärts gerechnet, reine Anzeige', ok=>{
    /* Verlauf an EINEM Konto, drei Bewegungen. 1000 − 100 + 50 − 30 = 920. */
    const st = mkN22({accounts:[{id:'M',name:'Haupt',kind:'main',balance:920},
                                {id:'SP',name:'Reisen',kind:'space',balance:200,parentId:'M'},
                                {id:'LT',name:'Longterm',kind:'space',balance:0,parentId:'M'}],
      ledger:[
        {id:'e1',type:'ausgang',desc:'A',amount:100,fromId:'M',toId:null,date:'2026-07-01',source:'manual'},
        {id:'e2',type:'eingang',desc:'B',amount:50,fromId:null,toId:'M',date:'2026-07-02',incomeKind:'allgemein',source:'manual'},
        {id:'e3',type:'ausgang',desc:'C',amount:30,fromId:'M',toId:null,date:'2026-07-03',source:'manual'}]});
    const A = balancesAfter(st);
    ok(A.e3.M===920,'neuester Eintrag am Konto === realer Kontostand 920 — per Konstruktion, nicht per Formel');
    ok(A.e2.M===950 && A.e1.M===900,'rückwärts: davor 950 (920 + 30), davor 900 (950 − 50)');
    /* Reconciliation als Regel über ALLE Konten. */
    const reconcile = state => {
      const map = balancesAfter(state), sorted = sortedLedgerOf(state);
      return state.accounts.every(a=>{
        const newest = sorted.find(l=>map[l.id] && Object.prototype.hasOwnProperty.call(map[l.id], a.id));
        return !newest || map[newest.id][a.id]===a.balance;
      });
    };
    ok(reconcile(st)===true,'Regel über alle Konten: der neueste Wert je Konto === account.balance');
    /* Transfer berührt zwei Konten — beide Seiten mit ihrem eigenen «danach». */

      ledger:[{id:'t1',type:'transfer',desc:'Sparen',amount:200,fromId:'M',toId:'SP',date:'2026-07-05',source:'manual'}]});

    ok(accName(st3,'WEG')==='(gelöschtes Konto)','… die Zeile nennt das Konto weiter als «(gelöschtes Konto)» — nur die Zahl fehlt');
    /* Deterministische Ordnung: gleiches Datum → spätere ledger-Position zuerst. */
    const st4 = mkN22({accounts:[{id:'M',name:'Haupt',kind:'main',balance:700},
                                 {id:'SP',name:'Reisen',kind:'space',balance:200,parentId:'M'},
                                 {id:'LT',name:'Longterm',kind:'space',balance:0,parentId:'M'}],
      ledger:[{id:'d1',type:'ausgang',desc:'erst',amount:100,fromId:'M',toId:null,date:'2026-07-06',source:'manual'},
              {id:'d2',type:'ausgang',desc:'dann',amount:200,fromId:'M',toId:null,date:'2026-07-06',source:'manual'}]});
    ok(sortedLedgerOf(st4).map(l=>l.id).join(',')==='d2,d1','gleiches Datum: die spätere ledger-Position steht oben — exakt wie in der Liste');
    const D = balancesAfter(st4);
    ok(D.d2.M===700 && D.d1.M===900,'… und der Rückwärtslauf folgt genau dieser Ordnung (700 · 900)');
    ok(filterLedger(st4,{}).map(l=>l.id).join(',')==='d2,d1','filterLedger sortiert identisch — die Liste und die Rechnung sehen dieselbe Reihenfolge');
    /* REINE ANZEIGE: balancesAfter schreibt nichts. */
    const st5 = mkN22({ledger:[{id:'w1',type:'ausgang',desc:'A',amount:100,fromId:'M',toId:null,date:'2026-07-01',source:'manual'}]});
    const beforeW = JSON.stringify(st5);
    balancesAfter(st5); balancesAfter(st5);

    const src = balancesAfter.toString() + entryDelta.toString();
    ok(!/\.balance\s*=[^=]/.test(src) && !/\.saved\s*=[^=]/.test(src) && src.indexOf('mainSnapshots')<0,
       'die Quelltexte enthalten keine Zuweisung an account.balance oder goal.saved und kennen mainSnapshots nicht');
    /* Und nach einem Bearbeiten stimmt die Rückwärts-Rechnung weiter. */
    const st6 = mkN22();
    const e6 = addBooking(st6,{type:'ausgang',desc:'A',amount:100,fromId:'M',date:'2026-07-01',source:'manual'});
    addBooking(st6,{type:'transfer',desc:'B',amount:50,fromId:'M',toId:'SP',date:'2026-07-02',source:'manual'});
    ok(reconcile(st6)===true,'vor dem Bearbeiten aufgegangen');
    editEntry(st6, e6.id, {amount:400, fromId:'SP'});
    ok(reconcile(st6)===true,'nach dem Bearbeiten (Betrag UND Konto geändert) geht sie weiter auf');
    const SP6 = st6.accounts.find(a=>a.id==='SP').balance;

       '… und der bearbeitete Eintrag hängt jetzt am NEUEN Konto: SP real −150, davor −200 (der jüngere Transfer brachte +50) → '+balancesAfter(st6)[e6.id].SP);
    ok(balancesAfter(st6)[e6.id].M===undefined,'… und am alten Konto M steht kein Wert mehr — die Buchung berührt es nicht mehr');

      ok(probeSauber()===true,'echt: weder Token noch Owner/Repo/Key stehen im PUT-Körper oder im hochgeladenen JSON');
      const real = exportStateJSON;
      try{
        /* Die realistische Fehlbedienung: «synchronisieren wir die Einstellungen doch gleich mit». */
        exportStateJSON = function(st){ return JSON.stringify(Object.assign({}, st, {sync: loadSyncCfg()}), null, 2); };
        ok(probeSauber()===false,'MUTIERT (Sync-Config wandert in den Payload): die Probe rötet — der Anker prüft wirklich, statt zu behaupten');
      } finally { exportStateJSON = real; }

/* ════════════════════════════════════════════════════════════════════
   UI — läuft nur im Browser (der Test-Harness überspringt diesen Teil,
   weil boot() unten per typeof-document-Guard gestartet wird).
   ════════════════════════════════════════════════════════════════════ */

let S = null;              /* aktueller State */
let VIEW = 'home';
let WIZ = null;            /* {step, single, draft} */
let PENDING_IMPORT = null;
let CUR_MONTH = null;      /* geöffneter Monat in der Detail-Ansicht */
let TOAST_UNDO_FN = null;

function el(id){ return document.getElementById(id); }
function curState(){ return WIZ ? WIZ.draft : S; }
function commitState(){
  if(!WIZ){
    S = normalizeState(S);
    syncSystemTodos(S);   /* System-To-Dos auto-anlegen/-auflösen (SPEC 2.33) */
    saveState(); recordSnapshot();
  }
  render();
}
function goView(v){ VIEW = v; closeSheet(); render(); }
/* N22/TEIL 0 (SPEC 2.58): reiner Scroll-Helfer — setzt den Inhalt auf Anfang.
   INSTANT und reduced-motion-sicher: window.scrollTo(x,y) ohne Options-Objekt
   benutzt 'auto', also keine erzwungene Animation; ein behavior:'smooth' käme
   hier nie vor. Das Fenster ist injizierbar, damit der Helfer ohne DOM prüfbar
   bleibt. Rückgabe true = wirklich gescrollt. */
function scrollContentTop(win){
  const w = win || (typeof window!=='undefined' ? window : null);
  if(!w || typeof w.scrollTo!=='function') return false;
  w.scrollTo(0,0);
  return true;
}
/* Der EINZIGE Aufrufer, der den Sprung nach oben erzwingt: das Wortzeichen.
   Es fragt bewusst NICHT, welche Ansicht gerade offen ist — «Kontoblatt»
   bedeutet immer «Home, von oben», auch wenn Home schon aktiv ist. Jede andere
   Navigation läuft weiter über goView und lässt die Scrollposition in Ruhe. */
function goHomeTop(win){ goView('home'); return scrollContentTop(win); }

function applyTheme(){
  document.documentElement.dataset.theme = S ? S.settings.theme : 'dark';
  document.documentElement.dataset.cb = (S && S.settings.colorBlindMode) ? '1' : '';
}
function setTheme(t){ S.settings.theme = t; saveState(); render(); }

let toastTimer = null;
function showToast(msg, undoFn){
  if(typeof document==='undefined') return;
  const t = el('toast');
  TOAST_UNDO_FN = undoFn || null;
  t.innerHTML = esc(msg) + (undoFn ? ' <button class="toast-undo" onclick="toastUndo()">Rückgängig</button>' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); TOAST_UNDO_FN=null; }, undoFn ? 5200 : 2600);
}
function toastUndo(){
  const fn = TOAST_UNDO_FN;
  TOAST_UNDO_FN = null;
  el('toast').classList.remove('show');
  if(fn) fn();
}
/* Konsistente Rückgängig-Toasts: Snapshot VOR der Mutation ziehen,
   Undo stellt den kompletten Stand wieder her. */
function restoreFn(snap){
  return ()=>{ S = normalizeState(snap); saveState(); render(); showToast('Rückgängig gemacht'); };
}

/* ─────────── Haptik (Progressive Enhancement) ─────────── */
function haptic(ms){ try{ if(typeof navigator!=='undefined' && navigator.vibrate) navigator.vibrate(ms||10); }catch(e){} }

/* ─────────── CHF-Tastenfeld ─────────── */
let PAD_TARGET=null, PAD_STR='', PAD_CB=null;
function padCurr(){ return (typeof S!=='undefined' && S) ? S.settings.currency : 'CHF'; }
/* Ersetzt ein Betrags-Input: verstecktes Feld (id) + antippbare Anzeige, die das
   Zifferblock-Overlay öffnet. Save-Handler lesen weiterhin el(id).value.
   U1.1: ab 960px stattdessen ein echtes Eingabefeld (inputmode="decimal") mit
   DERSELBEN id — Auswertung bleibt überall parseAmount (Komma UND Punkt),
   nur die Eingabemethode ändert sich. Handy (<960px) behält den Zifferblock. */
function isDesktopInput(){
  return typeof window!=='undefined' && window.matchMedia && window.matchMedia('(min-width:960px)').matches;
}
function padField(id, value, ph, cb){
  const v = (value===''||value==null) ? '' : String(value);
  if(isDesktopInput()){
    /* cb (z. B. asRefresh/redSum) feuert wie beim Zifferblock erst nach der
       Eingabe (change = Blur/Enter) — gleiche Semantik wie «Übernehmen». */
    return `<span class="amtwrap"><input type="text" inputmode="decimal" autocomplete="off"
      id="${id}" value="${esc(v)}" placeholder="${esc(ph||'0.00')}"${cb?` onchange="${cb}()"`:''}
      aria-label="Betrag in ${esc(padCurr())}"><span class="curr">${esc(padCurr())}</span></span>`;
  }
  const disp = v!=='' ? fmtAmt(parseAmount(v)) : (ph||'0.00');
  const onclick = cb ? `openPad('${id}', ${cb})` : `openPad('${id}')`;
  return `<input type="hidden" id="${id}" value="${esc(v)}">
    <button type="button" class="padfield" id="${id}_disp" onclick="${onclick}">${esc(disp)}<span class="curr">${esc(padCurr())}</span></button>`;
}
/* Betrag programmatisch setzen (U1.4-Vorlage, U1.7-Chips): bedient beide
   padField-Varianten — Desktop-Input direkt, mobil hidden input + Anzeige. */
function setAmtField(id, val){
  const inp = el(id); if(!inp) return;
  inp.value = String(val);
  const disp = el(id+'_disp');
  if(disp) disp.innerHTML = esc(fmtAmt(parseAmount(val)))+'<span class="curr">'+esc(padCurr())+'</span>';
}
function openPad(id, cb){
  PAD_TARGET=id; PAD_CB=cb||null;
  PAD_STR = String((el(id)&&el(id).value)||'').replace(/[^0-9.]/g,'');
  renderPad();
  el('padwrap').classList.add('show');
}
function padDispHtml(){ return esc(PAD_STR===''?'0':PAD_STR)+'<span class="cur">'+esc(padCurr())+'</span>'; }
function renderPad(){
  const keys=['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  el('pad').innerHTML = `<div class="pad-disp num">${padDispHtml()}</div>
    <div class="pad-grid">${keys.map(k=>`<button type="button" onclick="padKey('${k}')">${k}</button>`).join('')}</div>
    <div class="pad-actions"><button class="btn btn-ghost" onclick="closePad()">Abbrechen</button>
      <button class="btn btn-acc" onclick="padDone()">Übernehmen</button></div>`;
}
function padKey(k){
  haptic(6);
  if(k==='⌫') PAD_STR=PAD_STR.slice(0,-1);
  else if(k==='.'){ if(!PAD_STR.includes('.')) PAD_STR=(PAD_STR===''?'0':PAD_STR)+'.'; }
  else { if(PAD_STR.includes('.') && PAD_STR.split('.')[1].length>=2) return;
    PAD_STR = (PAD_STR==='0') ? k : PAD_STR+k; }
  el('pad').querySelector('.pad-disp').innerHTML = padDispHtml();
}
function padDone(){
  const id=PAD_TARGET, cb=PAD_CB;
  const val = PAD_STR==='' ? '' : String(parseAmount(PAD_STR));
  if(el(id)) el(id).value = val;
  const disp = el(id+'_disp');
  if(disp) disp.innerHTML = esc(val!==''?fmtAmt(parseAmount(val)):'0.00')+'<span class="curr">'+esc(padCurr())+'</span>';
  closePad();
  if(typeof cb==='function') cb(val);
}
function closePad(){ el('padwrap').classList.remove('show'); PAD_TARGET=null; PAD_CB=null; }

   Handy-Dock = 4 Hauptbereiche + «Mehr» (Sheet mit dem Rest, Dock nicht
   überladen); Desktop-Seitenleiste zeigt zusätzlich Verlauf/Ausblick (navdt)
