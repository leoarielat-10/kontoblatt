    ${gb.has(fromId)?`<label class="fld"><span class="lbl">Zu welchem Sparziel zählt die Entnahme? (Pflicht)</span>${goalSel('redg_from', fromId)}</label>`:''}
    ${rows || '<div class="row hint">Keine Zielkonten.</div>'}
    <div class="row mt1"><div class="rname">Summe raus</div><div class="num amt" id="red_sum">${fmtMoney(0)}</div></div>
    <button class="btn btn-acc" onclick="doRedistribute('${fromId}')">Verteilen</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function redSum(){
  const out = el('red_sum'); if(!out) return;
  let s=0;
  document.querySelectorAll('input[id^="red_"]').forEach(inp=>{ s += parseAmount(inp.value); });
  out.textContent = fmtMoney(round2(s));
}
function doRedistribute(fromId){
  const gb = goalBackedIds(S);
  const allocs = S.accounts.filter(a=>a.id!==fromId)
    .map(a=>({toId:a.id, amount:(el('red_'+a.id)||{value:''}).value, goalId:(el('redg_'+a.id)||{value:''}).value||null}))
    .filter(a=>parseAmount(a.amount)>0);
  if(!allocs.length){ showToast('Bitte mindestens einen Zielbetrag eingeben.'); return; }
  /* Ziel-Pflicht (SPEC 2.27) an Quelle und zielgebundenen Zielen */
  const fromGoalId = (el('redg_from')||{value:''}).value || null;
  if(gb.has(fromId) && !fromGoalId){ showToast('Bitte ein Sparziel für die Entnahme wählen — das Konto gehört zu deinen Sparzielen.'); return; }
  const missing = allocs.find(a=>gb.has(a.toId) && !a.goalId);
  if(missing){ showToast('Bitte ein Sparziel für «'+accName(S,missing.toId)+'» wählen — das Konto gehört zu deinen Sparzielen.'); return; }
  const snap = deepClone(S);
  const r = redistribute(S, fromId, allocs, fromGoalId);
  closeSheet();
  if(r.error){ showToast(r.error); return; }
  haptic(12); commitState();
  showToast('Umverteilt: '+fmtMoney(r.total)+' auf '+r.count+' Ziel'+(r.count>1?'e':''), restoreFn(snap));
}

/* ─────────── Monats-Detail ─────────── */
function rMonat(){
  const m = monthById(S,CUR_MONTH);
  if(!m){ VIEW='monate'; return rMonate(); }
  const inc = monthIncome(S,m), exp = monthExpenses(S,m);
  const saldo = round2(inc.amount-exp.amount);
  const chip = {done:'Abgeschlossen',curr:'Aktuell',plan:'Geplant'}[m.status];
  const est = round2((m.workdays||0)*S.workModel.ratePerWorkday);
  const ipSum = instantPaySum(S, m.id);
  const poSum = salaryPayoutSum(S, m.id);
  const ipCount = S.ledger.filter(l=>l.type==='eingang' && l.source==='instantPay' && ledgerMoneyMonth(l)===m.id).length;
  /* N17: Festlohn-Zeile nur, wenn die zweite Quelle überhaupt eingeschaltet ist.
     fxDouble = die einzige Konstellation, in der Doppelzählung droht (2.55,
     Sonderfall 29): geplanter Festlohn UND für den Monat schon gebuchter/
     manuell gesetzter Lohn. Hinweis, kein Zwang — die App bucht nichts um. */
  const fs = S.workModel.fixedSalary;
  const fxNow = fixedIncomeFor(S,m);
  const fxPct = m.fixedPensum!=null ? m.fixedPensum : fs.pensumPercent;
  const fxDouble = fxNow>0 && (m.incomeOverride!=null || m.extraIncome.length>0);
  /* N18 (2.55): Startmonat. fxBefore = dieser Monat liegt VOR dem Startmonat —
     dann ist der Festlohn ruhig «nicht aktiv», ohne Feld und ohne Fehler.
     Dieselbe Bedingung wie in fixedIncomeFor; den BETRAG holt die Ansicht
     trotzdem ausschliesslich von dort (fxNow), sie rechnet nichts nach. */
  const fxStart = nMonthId(fs.startMonthId);
  const fxBefore = !!(fxStart && m.id < fxStart);
  const fxActive = fs.enabled && !fxBefore;
  /* N19: ist der Festlohn dieses Geldmonats gebucht, IST der gebuchte Betrag
     die Zahl (fixedIncomeFor liefert ihn) — dann gibt es hier nichts mehr
     an-/abzuschalten, und das Pensum ist für diesen Monat wirkungslos.
     Rücknahme läuft über das Löschen der Buchung im Verlauf, nicht über einen
     zweiten Schalter (sonst gäbe es zwei Wahrheiten). */
  const fxEntries = fxActive ? fixedSalaryEntries(S, m.id) : [];
  const fxBooked = fxEntries.length>0;
  /* N18: die zwei Quellen als Peers. «Aus» ist kein neues Feld, sondern der
     Wert, mit dem die Quelle ohnehin schweigt: 0 Arbeitstage bzw. Pensum 0.
     shiftWhy erklärt, WORAUS der Schicht-Betrag kommt (die drei Zweige aus
     2.3, hier nur gelesen). */
  const shiftOn = (m.workdays||0) > 0;
  const shiftWhy = m.incomeOverride!=null ? 'manueller Lohn (Vorrang)'
    : (m.extraIncome.length ? m.extraIncome.length+' × gebuchter «Eingang: Lohn»'
    : (m.workdays||0)+' Arbeitstage × '+fmtAmt(S.workModel.ratePerWorkday));
  const shiftNote = (!shiftOn && inc.shift>0)
    ? ' · aus diesem Monat ist der Betrag trotzdem > 0, weil manueller Lohn bzw. Buchungen zählen' : '';
  const fxSub = !fs.enabled ? 'Quelle im Arbeitsmodell aus'
    : (fxBefore ? 'nicht aktiv (ab '+esc(monthLabel(fxStart))+')'
    : (fxBooked ? '<span class="chip on">gebucht</span> '+fxEntries.map(e=>fmtDate(e.date)).join(' · ')+' · ersetzt die Planzahl'
    : (m.fixedPensum!=null?'<span class="chip on">eigenes Pensum</span>':'<span class="chip">Standard</span>')
      + ' '+fmtAmt(fxPct)+' % von '+fmtAmt(fs.fullPensumAmount)+' bei 100 %'));
  const sourceRows = `<div class="mt2"><span class="lbl">Lohnquellen diesen Monat</span>
    <div class="row">
      <div class="rl"><div style="min-width:0">
        <div class="rname">Schichtlohn</div>
        <div class="rsub potline">${esc(shiftWhy)}${esc(shiftNote)}</div></div></div>
      <div class="rowq" style="gap:12px">
        <div class="num amt ${inc.shift>0?'pos':''}">${fmtMoney(inc.shift)}</div>
        <input type="checkbox" aria-label="Schichtlohn diesen Monat" ${shiftOn?'checked':''}
          onchange="setMonthSourceOn('${m.id}','shift',this.checked)"></div>
    </div>
    <div class="row">
      <div class="rl"><div style="min-width:0">
        <div class="rname">Festlohn${fs.name?' «'+esc(fs.name)+'»':''}</div>
        <div class="rsub potline">${fxSub}</div></div></div>
      <div class="rowq" style="gap:12px">
        <div class="num amt ${(fxActive&&fxNow>0)?'pos':''}">${(fs.enabled&&!fxBefore)?fmtMoney(fxNow):'—'}</div>
        ${(fxActive&&!fxBooked)?`<input type="checkbox" aria-label="Festlohn diesen Monat" ${m.fixedPensum===0?'':'checked'}
          onchange="setMonthSourceOn('${m.id}','fixed',this.checked)">`:'<span style="width:22px;flex:none"></span>'}</div>
    </div>
    ${fxBooked?`<div class="hint mt1">Gebucht als Eingang auf dem Hauptkonto — dieser Betrag gilt, nicht das Pensum.
        Rückgängig: den Eintrag im Verlauf löschen, dann greift wieder die Planzahl.</div>`
      :(fxActive&&fxNow>0)?`<div class="hint mt1">Erwartet ~${fs.payoutDay}. · ${fmtMoney(fxNow)} — Planzahl.
        <button class="linkbtn" style="padding:0" onclick="openFixedSalary()">Jetzt buchen ›</button></div>`:''}
  </div>`;
  const extraRows = m.extraIncome.map(x=>`<div class="row"><div class="rsub">${esc(x.desc)||'Eingang: Lohn'}</div><div class="num amt pos">+${fmtAmt(x.amount)}</div></div>`).join('');
  const fixRows = m.fixed.map(f=>{
    const fa = fixAmount(f), ch = fixChildren(f);
    const detail = f.recurrence==='yearly' ? fmtAmt(fa)+'/Jahr · '+fmtAmt(round2(fa/12))+'/Mo' : fmtAmt(fa);
    const action = (f.kind==='transfer' ? '→ '+accName(S,f.toId) : (f.kind==='debit' ? 'Abbuchung' : 'keine Aktion')) + (f.passive?' · nur rechnerisch':'') + (f.recurrence==='yearly'&&f.dueMonth==null?' · läuft dauerhaft':'');
    /* N10 (SPEC 2.50): Sammelposten zeigt seine Unterposten direkt unter sich —
       eingerückt, ohne eigenen Betrag in der Kopfzeile zu verlieren. Beim
       passiven Elternposten ist das die EINZIGE Stelle neben dem Editor, an der
       die Aufschlüsselung im Alltag sichtbar wird (keine Schnellaktion). */
    /* Einrückung MUSS im Inline-padding stecken: ein `padding`-Shorthand hier
       würde das padding-left der .indent-Klasse überschreiben — dann fluchten die
       Unterposten mit der Sektion statt unter ihrem Elternposten (im Screenshot
       gesehen). 40px = die Emoji-Spalte der Elternzeile. */
    const sub = ch ? ch.map(c=>`<div class="row" style="min-height:0;padding:3px 2px 3px 40px;border-top:none">
        <div class="rsub">${esc(c.name)}</div><div class="num amt" style="font-size:13px">${fmtAmt(c.amount)}</div></div>`).join('') : '';
    return `<button class="row tap" onclick="openFixForm('${f.id}','${m.id}')">
      <div class="rl"><span class="emoji">${esc(f.emoji)||'▪︎'}</span><div><div class="rname">${esc(f.name)}</div><div class="rsub">${esc(action)}${ch?' · Σ '+ch.length+' Unterposten':''}</div></div></div>
      <div class="num amt" style="font-size:13.5px">${detail}</div></button>${sub}`;
  }).join('');
  const varRows = m.variable.map((v,i)=>`<div class="row">
    <button class="rowmain tap" style="text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0" onclick="editVariable('${m.id}',${i})">
      <span class="rname">${esc(v.name)}</span><span class="num amt">${fmtAmt(v.amount)}</span></button>
    <button class="linkbtn neg" style="flex:none;margin-left:12px" onclick="removeVariable('${m.id}',${i})">✕</button></div>`).join('');
  /* N20 (SPEC 2.57): die geplanten Rücklagen DIESES Monats — also die, die
     hier zurückgelegt werden (executeMonthId). Der Status-Chip ist bewusst
     ruhig; ist eine Rücklage nicht ausführbar (kein/gelöschtes Zielkonto,
     zielgebunden, Betrag 0), sagt die Zeile es in Worten, statt still nichts
     zu tun — sie verschwindet nie. */
  const PRES_CHIP = {planned:'geplant', reserved:'zurückgelegt', done:'erledigt'};
  const PRES_WHY = {amount:'Betrag muss grösser als 0.00 sein', month:'kein gültiger Rücklege-Monat',
    account:'kein Zielkonto gewählt', main:'kein Hauptkonto vorhanden',
    goalbacked:'Zielkonto gehört zu einem Sparziel — dort verlangt jede Buchung ein Ziel'};
  const presRows = S.plannedReserves.filter(r=>r.executeMonthId===m.id).map(r=>{
    const why = r.status==='planned' ? plannedReserveBlocker(S,r) : null;
    const sub = [ '→ '+accName(S, r.toId),
      r.needMonthId ? 'gebraucht '+monthLabel(r.needMonthId) : 'ohne Gebraucht-Monat',
      why ? 'keine Aktion · '+PRES_WHY[why] : null, r.note||null ].filter(Boolean).join(' · ');
    return `<div class="row">
      <button class="rowmain tap" style="text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0" onclick="openPresForm('${m.id}','${r.id}')">
        <span style="min-width:0"><span class="rname">${esc(r.name)} <span class="chip ${r.status==='reserved'?'on':''}">${PRES_CHIP[r.status]}</span></span>
        <span class="rsub potline" style="display:block">${esc(sub)}</span></span>
        <span class="num amt">${fmtAmt(r.amount)}</span></button>
      <button class="linkbtn neg" style="flex:none;margin-left:12px" aria-label="Rücklage löschen" onclick="removePlannedReserve('${r.id}')">✕</button></div>`;
  }).join('');
  /* Die Liste zeigt die Rücklagen DIESES Monats (executeMonthId). Eine
     überfällige aus einem früheren Monat steht darum in «Heute zu tun», hier
     aber in keiner Liste — ohne diesen Zeiger wäre sie im Monats-Detail stumm.
     Nur im aktiven Geldmonat, weil nur dort die offene Aktion lebt. */
  const presOver = m.id===S.settings.currentMonthId
    ? S.plannedReserves.filter(r=>r.status==='planned' && plannedReserveActionable(S,r) && r.executeMonthId<m.id)
    : [];
  const presOverdue = presOver.length
    ? `<div class="hint mt1">${presOver.length===1?'Eine ältere Rücklage ist':presOver.length+' ältere Rücklagen sind'} noch offen
       (${esc(presOver.map(r=>r.name+' · '+monthLabel(r.executeMonthId)).join(' · '))}) —
       ${presOver.length===1?'sie steht':'sie stehen'} als Aktion unter «Heute zu tun» und ${presOver.length===1?'zählt':'zählen'} im «Rest zum Ausgeben».
       Zum Bearbeiten den Rücklege-Monat öffnen.</div>`
    : '';
  return `<section>
    <button class="linkbtn" onclick="goView('monate')">‹ Monate</button>
    <div class="wiz-title" style="margin-top:4px">${esc(m.name)} ${m.year} <span class="chip ${m.status==='curr'?'on':''}">${chip}</span></div>
    ${m.status!=='curr'?`<button class="btn btn-ghost" onclick="confirmSetCurrent('${m.id}')">Zum aktuellen Monat machen</button>`:''}
  </section>
  <section><span class="lbl sec">Lohn</span>
    <button class="row tap" onclick="openIncomeSheet('${m.id}')"><div class="rsub">Monatslohn <span class="chip">${inc.label}</span> · Herkunft ›</div><div class="num amt pos">${fmtMoney(inc.amount)}</div></button>
    ${ipSum>0?`<div class="row"><div class="rsub">davon Instant Pay bezogen (${ipCount} Vorschü${ipCount===1?'ss':'sse'})</div><div class="num amt">${fmtMoney(ipSum)}</div></div>`:''}
    ${poSum>0?`<div class="row"><div class="rsub">davon Restauszahlung</div><div class="num amt">${fmtMoney(poSum)}</div></div>`:''}
    ${sourceRows}
    <div class="frow mt2">
      <label class="fld"><span class="lbl">Arbeitstage</span><input type="text" id="mo_workdays" inputmode="numeric" value="${m.workdays||''}" onchange="setMonthField('${m.id}','workdays',this.value)"></label>
      <label class="fld"><span class="lbl">Lohn manuell (Vorrang)</span><input type="text" inputmode="decimal" value="${m.incomeOverride!=null?m.incomeOverride:''}" placeholder="automatisch" onchange="setMonthField('${m.id}','incomeOverride',this.value)"></label>
    </div>
    ${fxBefore?`<div class="hint mt2">Der Festlohn${fs.name?' «'+esc(fs.name)+'»':''} gilt erst ab ${esc(monthLabel(fxStart))} — für diesen Monat gibt es nichts einzustellen.</div>`:''}
    ${fxActive?`
      <label class="fld mt2"><span class="lbl">Pensum diesen Monat (%)</span>
        <input type="text" inputmode="decimal" value="${m.fixedPensum!=null?m.fixedPensum:''}" placeholder="Standard (${fmtAmt(fs.pensumPercent)} %)" onchange="setMonthField('${m.id}','fixedPensum',this.value)"></label>
      <div class="hint mt1" ${(fxDouble&&!fxBooked)?'style="color:var(--warn)"':''}>${fxBooked
        ? 'Für diesen Monat ist der Festlohn <b>gebucht</b> — das Pensum ist hier zurzeit wirkungslos und gilt erst wieder, wenn du den Eintrag im Verlauf löschst. Es zu ändern ist trotzdem erlaubt (etwa als Vorbereitung für den nächsten Monat).'
        : fxDouble
        ? 'Für diesen Monat ist bereits Lohn gebucht bzw. manuell eingetragen. Falls darin auch der Festlohn steckt, setz das Pensum hier auf <b>0</b> — sonst zählt er doppelt.'
        : 'Leer lassen = das Standard-Pensum ('+fmtAmt(fs.pensumPercent)+' %) gilt, <b>0</b> = diesen Monat kein Festlohn. Der Festlohn ist eine Planzahl und wird nicht automatisch gebucht; buch ihn mit «Festlohn buchen», sobald er eingegangen ist.'}</div>
    `:''}
    ${extraRows?`<div class="mt2"><span class="lbl">Eingang: Lohn (aus Verlauf)</span>${extraRows}</div>`:''}
    <div class="hint mt2">Schätzung Schichtlohn: ${m.workdays||0} Tage × ${fmtAmt(S.workModel.ratePerWorkday)} = ${fmtAmt(est)}. Ein manuell eingetragener Lohn hat immer Vorrang (er meint die Schicht-Quelle); «Eingang: Lohn»-Buchungen zählen dazu.${fxActive?(fxBooked?' Der gebuchte Festlohn kommt oben drauf.':' Der Festlohn kommt oben drauf.'):''}</div>
  </section>
  <section><span class="lbl sec">Ausgaben</span>
    <div class="row"><div class="rsub">Ausgaben <span class="chip">${exp.label}</span></div><div class="num amt neg">${fmtMoney(exp.amount)}</div></div>
    <div class="row"><div class="rsub">Monats-Saldo</div><div class="num amt ${saldo<0?'neg':'pos'}">${fmtMoney(saldo)}</div></div>
  </section>
  <section><span class="lbl sec">Warnschwelle${glossBtn('minimum')}</span>
    <label class="fld"><span class="lbl">Warnschwelle diesen Monat</span>
      <input type="text" inputmode="decimal" value="${m.liquidMinimum!=null?m.liquidMinimum:''}" placeholder="global (${fmtAmt(S.settings.liquidMinimum)})" onchange="setMonthField('${m.id}','liquidMinimum',this.value)"></label>
    <div class="row"><div class="rsub">Wirksam für ${esc(m.name)} ${m.year} ${m.liquidMinimum!=null?'<span class="chip on">eigener Wert</span>':'<span class="chip">global</span>'}</div><div class="num amt">${fmtMoney(effectiveMinimum(S, m.id))}</div></div>

  </section>
  <section><span class="lbl sec">Fixkosten dieses Monats</span>
    ${fixRows || '<div class="row hint">Keine Posten.</div>'}
    <button class="btn btn-add" onclick="openFixForm(null,'${m.id}')">＋ Posten</button>
  </section>
  <section><span class="lbl sec">Variable Kosten</span>
    ${varRows || '<div class="row hint">Keine.</div>'}
    <button class="btn btn-add" onclick="openVarForm('${m.id}')">＋ Variable Kosten</button>
  </section>
  <section><span class="lbl sec">Geplante Rücklagen (Konto &amp; Termin)</span>
    ${presRows || '<div class="row hint">Keine.</div>'}
    ${presOverdue}
    <button class="btn btn-add" onclick="openPresForm('${m.id}',null)">＋ Geplante Rücklage</button>
    <div class="hint mt1">Ein benannter Betrag, den du in diesem Monat vom Hauptkonto auf ein Konto zurücklegst und später brauchst. Eigenes Konzept neben den variablen Kosten: er zählt in <b>keiner</b> Monatsrechnung mit — der «Rest zum Ausgeben» sinkt allein dadurch, dass die Aktion offen ist und das Geld dann wirklich weggeht.</div>
  </section>
  <section><span class="lbl sec">Notiz</span>
    <label class="fld"><textarea onchange="setMonthField('${m.id}','note',this.value)">${esc(m.note)}</textarea></label>
  </section>`;
}
/* N18 (SPEC 2.55): eine Lohnquelle NUR fuer diesen Monat an/aus. Beide
   Schalter schreiben ausschliesslich das Feld, das die Quelle ohnehin
   steuert — es gibt keine zweite Wahrheit im Datenmodell:
     · Festlohn  aus → months[].fixedPensum = 0, an → null (Standard-Pensum).
       Symmetrisch, weil es einen Standard gibt, auf den «an» zurückfaellt.
     · Schichtlohn aus → months[].workdays = 0. Fuer «an» gibt es KEINEN
       Standard (Arbeitstage sind pro Monat gezaehlt, nicht konfiguriert) —
       also erfindet die App keinen Wert, sondern setzt den Fokus ins Feld.
       Das Versehen «aus» faengt der Rueckgaengig-Toast.
   Die Schicht-/Override-/Instant-Pay-Mathematik wird nur GELESEN. */
function setMonthSourceOn(mid, src, on){
  const m = monthById(S,mid);
  if(!m) return;
  if(src==='fixed'){
    const snap = deepClone(S);
    m.fixedPensum = on ? null : 0;
    commitState();
    showToast(on ? 'Festlohn diesen Monat an (Standard-Pensum)' : 'Festlohn diesen Monat aus', restoreFn(snap));
    return;
  }
  if(on){
    render();
    const f = el('mo_workdays');
    if(f){ f.focus(); if(f.select) f.select(); }
    showToast('Arbeitstage eintragen — dann rechnet der Schichtlohn wieder');
    return;
  }
  const snap = deepClone(S);
  m.workdays = 0;
  commitState();
  showToast('Schichtlohn diesen Monat aus (0 Arbeitstage)', restoreFn(snap));
}
function setMonthField(id,key,val){
  const m = monthById(S,id);
  if(!m) return;
  if(key==='incomeOverride'){
    const nv = String(val).trim()==='' ? null : parseAmount(val);
    /* Sonderfall 22 (N8): nur noch die zwei echten Unplausibilitäten —
       Override < Vorschüsse, oder Override NACH gebuchter Rest-Auszahlung. */
    const conflict = (nv!==m.incomeOverride) ? overrideSalaryConflict(S, id, nv) : null;
    if(conflict){ confirmIncomeOverride(id, nv, conflict); return; }
    m.incomeOverride = nv;
  }
  else if(key==='workdays') m.workdays = parseAmount(val);
  /* N17: leer/kaputt/negativ → null = «Standard-Pensum gilt», 0 bleibt 0
     (dieselbe nOptAmount-Regel wie liquidMinimum und normalizeState). */
  else if(key==='fixedPensum') m.fixedPensum = nOptAmount(val);
  /* N9: leer/kaputt/negativ → null = «global gilt» (dieselbe Regel wie normalizeState). */
  else if(key==='liquidMinimum') m.liquidMinimum = nOptAmount(val);
  else if(key==='note') m.note = String(val);
  commitState();
}
function confirmIncomeOverride(mid, nv, c){
  const head = c.kind==='low' ? 'Lohn kleiner als die Vorschüsse?' : 'Lohn wird doppelt gezählt?';
  const body = c.kind==='low'
    ? `Der manuelle Lohn ist der <b>Brutto-Gesamtlohn</b> für ${esc(monthLabel(mid))} — inklusive Vorschüsse.
       Du trägst ${fmtMoney(nv)} ein, es sind aber bereits <b>${fmtMoney(c.instant)}</b> als Instant Pay geflossen.
       Der Brutto-Lohn wäre damit kleiner als der Vorschuss allein. Ergebnis in der Rechnung: <b>${fmtMoney(c.total)}</b>.`
    : `Für ${esc(monthLabel(mid))} ist die <b>Rest-Auszahlung schon gebucht</b> (${fmtMoney(c.payout)}${c.instant?' plus '+fmtMoney(c.instant)+' Vorschuss':''}).
       Der Lohn steckt damit bereits in den Buchungen; ein manueller Lohn ${fmtMoney(nv)} kommt NICHT an ihre Stelle, sondern OBEN DRAUF
       → Monatslohn <b>${fmtMoney(c.total)}</b> statt ${fmtMoney(c.booked)}.`;
  openSheet(`<div class="shead">${head}</div>
    <div class="ssub">${body} Willst du den manuellen Betrag wirklich setzen?</div>
    <button class="btn btn-acc" onclick="doSetOverride('${mid}', ${nv})">Trotzdem setzen · Monatslohn ${fmtMoney(c.total)}</button>
    <button class="btn btn-ghost" onclick="closeSheet();render()">Abbrechen</button>`);
}
function doSetOverride(mid, nv){
  const m = monthById(S,mid);
  if(m) m.incomeOverride = nv;
  closeSheet(); commitState();
}
function removeVariable(mid,i){
  const m = monthById(S,mid);
  if(!m) return;
  m.variable.splice(i,1);
  commitState();
}
function openVarForm(mid){
  openSheet(`<div class="shead">Variable Kosten</div>
    <label class="fld"><span class="lbl">Name</span><input type="text" id="v_name"></label>
    <label class="fld"><span class="lbl">Betrag</span>${padField('v_amount','')}</label>
    <button class="btn btn-acc" onclick="saveVariable('${mid}')">Hinzufügen</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveVariable(mid){
  const m = monthById(S,mid);
  if(!m) return;
  const name = el('v_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  m.variable.push({name, amount:parseAmount(el('v_amount').value)});

}
/* N2 (A5): bestehenden variablen Posten ändern — Index-Adressierung (kein id an
   variable[]-Einträgen; der Monats-Merge ist grobkörnig, s. N2-Analyse). */
function editVariable(mid,i){
  const m = monthById(S,mid);
  if(!m || !m.variable[i]) return;
  const v = m.variable[i];
  openSheet(`<div class="shead">Variable Kosten bearbeiten</div>
    <label class="fld"><span class="lbl">Name</span><input type="text" id="v_name" value="${esc(v.name)}"></label>
    <label class="fld"><span class="lbl">Betrag</span>${padField('v_amount', v.amount)}</label>
    <button class="btn btn-acc" onclick="saveVariableEdit('${mid}',${i})">Speichern</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveVariableEdit(mid,i){
  const m = monthById(S,mid);
  if(!m || !m.variable[i]) return;
  const name = el('v_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  m.variable[i].name = name;
  m.variable[i].amount = parseAmount(el('v_amount').value);

}
/* ─────────── Geplante Rücklagen (N20, SPEC 2.57) ─────────── */
/* Ein Formular für Anlegen UND Bearbeiten (Muster openFixForm/openTodoForm).
   Zielkonto-Auswahl exakt wie beim Topf (openVarReservePlanner): das Hauptkonto
   ist die QUELLE und darf kein Ziel sein, zielgebundene Konten (2.27) stehen
   disabled drin — sichtbar, aber nicht wählbar, damit klar ist WARUM. */
function openPresForm(mid, id){
  const r = id ? S.plannedReserves.find(x=>x.id===id) : null;
  const main = mainAccount(S);
  const gb = goalBackedIds(S);
  const opts = S.accounts.filter(a=>!main || a.id!==main.id)
    .map(a=>`<option value="${a.id}" ${r&&r.toId===a.id?'selected':''} ${gb.has(a.id)?'disabled':''}>${esc(a.name)} · ${esc(KIND_LABELS[a.kind])}${gb.has(a.id)?' (gehört zu Sparzielen)':''}</option>`).join('');
  openSheet(`<div class="shead">${r?'Geplante Rücklage bearbeiten':'Geplante Rücklage'}</div>
    <div class="ssub">Zurücklegen vom Hauptkonto auf ein Konto — und ein Monat, in dem du es brauchst. Der Betrag zählt in keiner Monatsrechnung mit; er wirkt allein über den Transfer.</div>
    <label class="fld"><span class="lbl">Name</span><input type="text" id="pr_name" value="${r?esc(r.name):''}" placeholder="z. B. Zahnarzt-Selbstbehalt"></label>
    <label class="fld"><span class="lbl">Betrag</span>${padField('pr_amount', r?r.amount:'')}</label>
    <label class="fld"><span class="lbl">Zielkonto</span>
      <select id="pr_to"><option value="">— kein Konto —</option>${opts}</select></label>
    <label class="fld"><span class="lbl">Zurücklegen im Monat</span>${monthYearPicker('pr_exec', r?r.executeMonthId:mid)}</label>
    <label class="fld"><span class="lbl">Gebraucht im Monat (optional)</span>${monthYearPicker('pr_need', r?r.needMonthId:null, {allowEmpty:true, emptyLabel:'— kein Monat —'})}</label>
    <label class="fld"><span class="lbl">Notiz (optional)</span><input type="text" id="pr_note" value="${r?esc(r.note):''}"></label>
    <div class="hint mt1">Ohne Zielkonto (oder mit einem Konto, das zu einem Sparziel gehört) bleibt die Rücklage stehen, erzeugt aber keine Aktion — die App rät kein Konto.</div>
    <button class="btn btn-acc" onclick="savePlannedReserve('${mid}',${r?"'"+r.id+"'":'null'})">${r?'Speichern':'Hinzufügen'}</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function savePlannedReserve(mid, id){
  const name = el('pr_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  const data = { name, amount: parseAmount(el('pr_amount').value),
    toId: el('pr_to').value || null,
    executeMonthId: nMonthId(el('pr_exec').value) || nMonthId(mid),
    needMonthId: nMonthId(el('pr_need').value),
    note: el('pr_note').value.trim() };
  const r = id ? S.plannedReserves.find(x=>x.id===id) : null;
  /* Der Status bleibt beim Bearbeiten unangetastet: er hängt am Geld (die
     Buchung im Verlauf), nicht am Formular — ihn hier zu setzen wären zwei
     Wahrheiten. Neue Rücklagen starten auf 'planned'. */
  if(r) Object.assign(r, data);
  else S.plannedReserves.push(Object.assign({id:uid(), status:'planned'}, data));
  closeSheet(); commitState();
}
function removePlannedReserve(id){
  const i = S.plannedReserves.findIndex(x=>x.id===id);
  if(i<0) return;
  const snap = deepClone(S);
  const name = S.plannedReserves[i].name;
  S.plannedReserves.splice(i,1);
  commitState();
  /* Bewusst mit Undo: anders als eine variable Zeile kann hier schon Geld
     geflossen sein (status 'reserved') — die Buchung im Verlauf bleibt davon
     unberührt, aber der Plan dazu wäre sonst weg. */
  showToast('Rücklage gelöscht: '+name, restoreFn(snap));
}

function confirmSetCurrent(id){
  const old = S.months.find(m=>m.status==='curr');
  openSheet(`<div class="shead">${esc(monthLabel(id))} zum aktuellen Monat machen?</div>
    <div class="ssub">${old ? esc(old.name)+' '+old.year+' wird auf «Abgeschlossen» gesetzt. ' : ''}Schnellaktionen und «Rest zum Ausgeben» springen auf den neuen Monat um.</div>
    <button class="btn btn-acc" onclick="doSetCurrent('${id}')">Umstellen</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function doSetCurrent(id){
  setCurrentMonth(S,id);
  closeSheet(); commitState(); showToast('Aktueller Monat: '+monthLabel(id));
}

/* ─────────── Ziele + Sparmodell ─────────── */
function rZiele(){
  const month = monthById(S, S.settings.currentMonthId);
  const sm = S.savingsModel;
  let smHtml;
  if(sm.mode==='percent' && month){
    const sur = surplusFor(S,month);
    const pots = savingsPots(S,month.id);
    const potRows = pots.map(p=>`<div class="row"><div class="rl"><span class="emoji">${esc(p.emoji)||'▪︎'}</span>
        <div><div class="rname">${esc(p.name)}</div>
        <div class="rsub">${fmtAmt(p.percent)} % vom Überschuss${p.skipped?' · fester Posten vorhanden — kein Topf (Doppelzähl-Schutz)':''}</div></div></div>
      <div class="num amt">${p.skipped?'—':fmtAmt(p.amount)+' '+esc(S.settings.currency)}</div></div>`).join('');
    smHtml = `<section><span class="lbl sec">Sparmodell · % vom Überschuss</span>
      <button class="row tap" onclick="openSurplusSheet('${month.id}')"><div class="rsub" style="text-align:left">Überschuss ${esc(month.name)} = Lohn ${fmtAmt(sur.income)} − Pflicht-Fixkosten ${fmtAmt(sur.fix)} · Herkunft ›</div>
        <div class="num amt ${sur.surplus<0?'neg':''}">${fmtMoney(sur.surplus)}</div></button>
      ${potRows || '<div class="row hint">Keine Töpfe definiert — Einstellungen → Setup-Bereich «Sparmodell».</div>'}
      ${sur.surplus<0?'<div class="warnbox">Negativer Überschuss — alle Töpfe sind 0 CHF.</div>':''}
    </section>`;
  } else {
    smHtml = `<section><span class="lbl sec">Sparmodell · feste Beträge</span>
      <div class="row"><div class="rsub">Sparraten laufen als Fixkosten-Transfers. Umschalten auf %-Sparen: Einstellungen → «Sparmodell».</div></div></section>`;
  }
  /* Ziel-Kohärenz (SPEC 2.30): Badge + nötige Rate + Ein-Tap-Fix, nie automatisch */
  const cohMap = {};
  goalCoherence(S).forEach(c=>{ cohMap[c.goalId]=c; });
  const rows = S.goals.map(g=>{
    const pct = g.target>0 ? Math.min(100, g.saved/g.target*100) : 0;
    let rate;
    if(g.rateMode==='percent'){
      const chf = (sm.mode==='percent' && month) ? round2(Math.max(0,surplusFor(S,month).surplus)*g.rate/100) : null;
      rate = fmtAmt(g.rate)+' %'+(chf!=null?' · '+fmtAmt(chf)+' '+S.settings.currency:'');
    } else rate = fmtMoney(g.rate)+'/Mo';
    const c = cohMap[g.id];
    const cohInfo = c
      ? (c.expired
        ? `<div class="rsub" style="color:var(--neg);margin-top:2px">Zieldatum ${esc(monthLabel(c.targetDate))} abgelaufen — neu setzen oder Ziel abschliessen</div>`
        : (c.behind
          ? `<div class="rsub" style="color:var(--warn);margin-top:2px">Rate ${c.monthlyChf!=null?fmtAmt(c.monthlyChf):'—'} → nötig ${fmtAmt(c.needed)}/Mo bis ${esc(monthLabel(c.targetDate))}${g.rateMode==='percent'?' · %-Rate — im Sparmodell anpassen':''}</div>`
          : `<div class="rsub" style="margin-top:2px">nötig ${fmtAmt(c.needed)}/Mo bis ${esc(monthLabel(c.targetDate))} ✓</div>`))
      : '';
    const fixBtn = c && c.behind && g.rateMode==='fixed'
      ? `<div style="flex-basis:100%"><button class="linkbtn" style="padding:2px 0" onclick="setGoalRateToNeeded('${g.id}')">Rate auf ${fmtAmt(c.needed)}/Mo setzen ›</button></div>`
      : '';
    return `<div class="row" style="align-items:flex-start;flex-wrap:wrap">
      <button class="rowmain" style="display:block;text-align:left" onclick="openGoalForm('${g.id}')">
        <div style="display:flex;justify-content:space-between;gap:12px;width:100%">
          <div class="rname">${esc(g.name)}${c?(c.expired?' <span class="chip neg">Zieldatum abgelaufen</span>':(c.behind?' <span class="chip warn">hinter Plan</span>':' <span class="chip pos">auf Kurs</span>')):''}</div>
          <div class="num amt">${fmtAmt(g.saved)}${g.target>0 ? ' / '+fmtAmt(g.target) : ''}</div>
        </div>
        <div class="rsub">${g.target>0 ? '' : 'Offenes Ziel · '}${rate}${g.targetDate ? ' · bis '+monthLabel(g.targetDate) : ''} · ${esc(accName(S,g.accountId))}</div>
        ${cohInfo}
        ${g.target>0 ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
      </button>
      <div class="rowq" style="margin-left:8px">
        <button class="qadj" aria-label="Entnehmen" onclick="openQuickAdjust('goal','${g.id}',-1)">−</button>
        <button class="qadj" aria-label="Einzahlen" onclick="openQuickAdjust('goal','${g.id}',1)">＋</button>
      </div>
      ${fixBtn}
    </div>`;
  }).join('');
  /* Abgleich (SPEC 2.27 / Sonderfall 13): Differenz nur MELDEN, nie angleichen. */
  const drift = goalBackedDrift(S).filter(d=>d.diff!==0);
  const driftHtml = drift.map(d=>`<div class="warnbox">Abgleich «${esc(d.name)}»: Konto ${fmtMoney(d.balance)} · Σ Ziele ${fmtMoney(d.goalsSum)} · <b>Differenz ${fmtMoney(d.diff)}</b> — bitte selbst klären (Ziel-Beträge im Ziel-Editor oder Kontosaldo anpassen). Die App gleicht nichts automatisch an.</div>`).join('');
  return smHtml + `
  <section><span class="lbl sec">Longterm-Sparziele</span>
  ${driftHtml}
  ${rows || '<div class="row hint">Noch keine Ziele angelegt.</div>'}
  <button class="btn btn-add" onclick="openGoalForm(null)">＋ Ziel hinzufügen</button></section>`;
}
/* Ein-Tap-Fix (SPEC 2.30): setzt NUR die Rate aufs Nötige — keine Buchung. */
function setGoalRateToNeeded(goalId){
  const g = S.goals.find(x=>x.id===goalId);
  if(!g) return;
  const needed = goalNeededRate(S,g);
  if(needed==null) return;
  const old = g.rate;
  g.rate = needed;
  haptic(); commitState();
  showToast('Rate «'+g.name+'» auf '+fmtAmt(needed)+'/Mo gesetzt', ()=>{ g.rate = old; commitState(); });
}

/* ─────────── Konten ─────────── */
function rKonten(){
  const mains = S.accounts.filter(a=>a.kind==='main');
  const shown = new Set();
  let html = '';
  mains.forEach(m=>{
    shown.add(m.id);
    const spaces = S.accounts.filter(a=>a.parentId===m.id);
    spaces.forEach(sp=>shown.add(sp.id));
    html += `<section><span class="lbl sec">${esc(m.bank)||'Bank'}</span>${accRow(m,false,true)}${spaces.map(sp=>accRow(sp,true,true)).join('')}${spaces.length?spacesTotalRow(m):''}</section>`;
  });
  const rest = S.accounts.filter(a=>!shown.has(a.id));
  if(rest.length) html += `<section><span class="lbl sec">Weitere Konten</span>${rest.map(a=>accRow(a,false,true)).join('')}</section>`;
  return html
    + `<button class="btn btn-add" onclick="openAccountForm(null)">＋ Konto hinzufügen</button>`
    + (S.accounts.length>1?`<button class="btn btn-ghost" onclick="openRedistributePicker()">Geld umverteilen</button>`:'');
}

    <div class="ssub">${a?'Direkte Saldo-Änderungen werden im Verlauf als Anpassung vermerkt.':'Art «Space» ordnet das Konto einem Hauptkonto zu.'}</div>
    ${a?potBreakdownCard(a.id, st):''}
    <div class="frow">
      <label class="fld" style="flex:0 0 76px"><span class="lbl">Emoji</span><input type="text" id="f_emoji" maxlength="4" value="${esc(a?a.emoji:'')}"></label>
      <label class="fld"><span class="lbl">Name</span><input type="text" id="f_name" value="${esc(a?a.name:'')}"></label>
    </div>
    <label class="fld"><span class="lbl">Bank</span><input type="text" id="f_bank" value="${esc(a?a.bank:'')}"></label>
    <div class="frow">
      <label class="fld"><span class="lbl">Art</span>
        <select id="f_kind" onchange="el('f_parent_w').style.display=this.value==='space'?'':'none'">${kindOpts}</select></label>
      <label class="fld"><span class="lbl">Saldo (${esc(st.settings.currency)})</span>
        <input type="text" inputmode="decimal" id="f_bal" value="${a?a.balance:''}" placeholder="0.00"></label>
    </div>
    <label class="fld" id="f_parent_w" style="display:${a&&a.kind==='space'?'':'none'}">
      <span class="lbl">Gehört zu Hauptkonto</span>
      <select id="f_parent">${parentOpts || '<option value="">— zuerst ein Hauptkonto anlegen —</option>'}</select></label>
    ${a && goalBackedIds(st).has(a.id) ? `<label class="fld" id="f_goal_w" style="display:none">
      <span class="lbl">Zu welchem Sparziel zählt die Saldo-Anpassung? (Pflicht)</span>
      <select id="f_goal"><option value="">— Ziel wählen —</option>
        ${goalsForAccount(st,a.id).map(g=>`<option value="${g.id}">${esc(g.name)} · ${fmtAmt(g.saved)}</option>`).join('')}
      </select></label>`:''}
    <div class="togl" id="f_living_w" style="display:none"><span class="lbl">Anpassung zählt zu Leben</span><input type="checkbox" id="f_living" checked></div>
    <div class="hint" id="f_living_h" style="display:none">Der Saldo sinkt — die Anpassung wird als Alltags-Ausgabe verbucht. Aus lässt «Frei pro Tag» unberührt.</div>
    <div class="togl"><span class="lbl">Auf Home anzeigen</span><input type="checkbox" id="f_home" ${!a||a.showOnHome?'checked':''}></div>
    <button class="btn btn-acc" onclick="saveAccount('${id||''}')">Speichern</button>
    ${a?`<button class="btn btn-danger" onclick="askDeleteAccount('${a.id}')">Konto löschen</button>`:''}
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>
  `);
  /* Zielgebundenes Konto (SPEC 2.27): Ziel-Pflicht nur zeigen, wenn der Saldo
     wirklich geändert wird.
     N12 (SPEC 2.51): «Zählt zu Leben» ebenso am Saldo-Feld — aber nur, wenn die
     Anpassung, die daraus entstünde, im Leben-Verbrauch landen könnte: Saldo
     SINKT (negative Anpassung) auf dem HAUPTKONTO. Steigt der Saldo, ist die
     Anpassung ein Zufluss und die Frage sinnlos. Geprüft wird auch hier nicht
     von Hand, sondern mit der Probe-Anpassung an livingEligible. */
  if(a){
    const syncBal = ()=>{
      const nb = parseAmount(el('f_bal').value);
      if(el('f_goal_w')) el('f_goal_w').style.display = nb!==a.balance ? '' : 'none';
      const lw = el('f_living_w'), lh = el('f_living_h');
      if(lw){
        const delta = round2(nb - a.balance);
        const show = livingEligible(st, {type:'anpassung', amount:delta, fromId:null, toId:a.id, source:'manual'});
        lw.style.display = show ? '' : 'none';
        if(lh) lh.style.display = show ? '' : 'none';
      }
    };
    el('f_bal').addEventListener('input', syncBal);
  }
}
function saveAccount(id){
  const st = curState();
  const name = el('f_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  const kind = el('f_kind').value;
  const balance = parseAmount(el('f_bal').value);
  const vals = {
    name, kind, balance,
    bank: el('f_bank').value.trim(),
    emoji: el('f_emoji').value.trim(),
    showOnHome: el('f_home').checked,
    parentId: kind==='space' ? (el('f_parent').value || null) : null
  };
  const a = id ? st.accounts.find(x=>x.id===id) : null;
  if(!a){
    st.accounts.push(Object.assign({id:uid()}, vals));
  } else {
    const delta = round2(balance - a.balance);
    /* Zielgebundenes Konto (SPEC 2.27): Saldo-Edit braucht ein Ziel — die
       Anpassung führt goal.saved synchron (Invariante balance === Σ saved). */
    let goal = null;
    if(delta !== 0 && !WIZ && S.setupComplete && goalBackedIds(st).has(a.id)){
      const gid = el('f_goal') ? el('f_goal').value : '';
      goal = st.goals.find(g=>g.id===gid);
      if(!goal){ showToast('Dieses Konto gehört zu deinen Sparzielen — bitte wählen, zu welchem Ziel die Bewegung zählt.'); return; }
    }
    Object.assign(a, vals);
    /* SPEC 2.6 / Sonderfall 6: direkter Saldo-Edit → automatischer Anpassungs-Eintrag.
       Im Setup-Assistenten sind es Startsalden, dort ohne Eintrag. */
    if(delta !== 0 && !WIZ && S.setupComplete){
      /* Anpassungen werden bei Anlage nicht via applyEntry angewendet — der Edit
         hat den Saldo gesetzt; saved deshalb hier direkt mitführen. Löschung
         rechnet über applyEntry(-1) BEIDE Seiten zurück. */
      if(goal) goal.saved = round2(goal.saved + delta);
      const adj = { id:uid(), type:'anpassung', desc:'Saldo-Anpassung '+name, amount:delta,
        fromId:null, toId:a.id, date:today(), incomeKind:null, goalId: goal?goal.id:null, source:'manual' };
      /* N12: wie im Buchungs-Sheet — Flag nur, wenn die Zeile sichtbar war, und
         nur als echter Schlüssel mit dem Wert false (nie undefined). */
      const lw = el('f_living_w');
      if(lw && lw.style.display!=='none' && el('f_living') && !el('f_living').checked) adj.countsAsLiving = false;
      st.ledger.push(adj);
      showToast('Saldo geändert — Anpassung im Verlauf vermerkt');
    }
  }
  closeSheet();
  commitState();
}
function askDeleteAccount(id){
  const st = curState();
  const a = st.accounts.find(x=>x.id===id);
  if(!a) return;
  const guard = canDeleteAccount(st,id);
  if(!guard.ok && guard.reason==='spaces'){
    openSheet(`<div class="shead">Löschen nicht möglich</div>
      <div class="ssub">«${esc(a.name)}» sind noch ${guard.count} Space(s) zugeordnet. Bitte diese zuerst löschen oder einem anderen Hauptkonto zuordnen.</div>
      <button class="btn-text" onclick="closeSheet()">Verstanden</button>`);
    return;
  }
  const refs = accountRefs(st,id);
  const lines = [];
  if(refs.fk) lines.push(refs.fk+' Fixkosten-Verknüpfung(en)');
  if(refs.mp) lines.push(refs.mp+' Monats-Posten');
  if(refs.g) lines.push(refs.g+' Sparziel(e)');
  if(refs.alloc) lines.push(refs.alloc+' Sparmodell-Topf/Töpfe');
  if(refs.led) lines.push(refs.led+' Verlaufs-Einträge (bleiben als Historie)');
  openSheet(`<div class="shead">«${esc(a.name)}» löschen?</div>
    ${refs.total>0 ? `<div class="ssub">Das Konto wird noch verwendet:<br>• ${lines.join('<br>• ')}<br><br>
    Beim Löschen werden Transfers auf dieses Konto zu Abbuchungen, Quell-Verweise wandern aufs Hauptkonto,
    Ziel-Zuordnungen werden umgehängt. Der Verlauf bleibt stehen («gelöschtes Konto»).</div>`
    : `<div class="ssub">Das Konto wird nirgends verwendet.</div>`}
    <button class="btn btn-danger" onclick="doDeleteAccount('${id}')">${refs.total>0?'Löschen & bereinigen':'Löschen'}</button>
    <button class="btn btn-ghost" onclick="openAccountForm('${id}')">Abbrechen</button>`);
}
function doDeleteAccount(id){
  if(WIZ){ WIZ.draft = deleteAccountCleanup(WIZ.draft,id); closeSheet(); commitState(); showToast('Konto gelöscht'); return; }
  const snap = deepClone(S);
  S = deleteAccountCleanup(S,id);
  closeSheet();
  commitState();
  showToast('Konto gelöscht', restoreFn(snap));
}

/* ─────────── Fixkosten-Formular (Vorlage ODER Monats-Posten) ───────────
   scope: 'tpl' (Vorlage, Default) oder eine Monats-ID → bearbeitet month.fixed */
function fixCollection(scope){
  const st = curState();
  if(!scope || scope==='tpl') return st.fixedCosts;
  const m = monthById(st,scope);
  return m ? m.fixed : st.fixedCosts;
}
/* ─────────── N10: Unterposten-Entwurf (SPEC 2.50) ───────────
   Die Unterposten werden in EIGENEN Sheets bearbeitet (Muster editVariable aus
   N2). Damit die getippten Felder des Elternformulars das nicht überleben
   müssen, liegen Formularwerte UND Unterposten bis zum «Speichern» in einem
   Entwurf — der State wird dabei NICHT angefasst. So bleibt auch der
   Übernahme-Dialog (passive/dueMonth/children) intakt, weil `changes` weiter
   gegen den unveränderten Posten gerechnet wird. */
let FX_DRAFT = null;   /* {key, vals, children} */
function fxDraftKey(id,scope){ return (scope||'tpl')+'|'+(id||'new'); }
/* Formularwerte einsammeln — EINE Quelle für Speichern und Entwurf. */
function fxReadForm(){
  const rec = el('fx_rec').value, kind = el('fx_kind').value;
  return {
    name: el('fx_name').value.trim(), emoji: el('fx_emoji').value.trim(),
    amount: parseAmount(el('fx_amount').value),
    kind,
    fromId: el('fx_from').value || null,
    toId: el('fx_to').value || null,
    recurrence: rec,
    /* dueMonth null = «kein festes Datum» (SPEC 2.31) */
    dueMonth: rec==='yearly' ? (el('fx_due').value ? parseInt(el('fx_due').value,10) : null) : null,
    reserveToId: rec==='yearly' ? (el('fx_res').value || null) : null,
    passive: (kind!=='none' && rec==='monthly') ? el('fx_passive').checked : false
  };
}
function fxStash(id,scope){
  if(!FX_DRAFT || FX_DRAFT.key!==fxDraftKey(id,scope)) return;
  FX_DRAFT.vals = fxReadForm();
}
function openFixChild(id,scope,childId){
  fxStash(id,scope);
  const c = childId ? (FX_DRAFT.children||[]).find(x=>x.id===childId) : null;
  openSheet(`<div class="shead">${c?'Unterposten bearbeiten':'Neuer Unterposten'}</div>
    <div class="ssub">Gehört zu «${esc((FX_DRAFT.vals&&FX_DRAFT.vals.name)||'dem Posten')}». Der wirksame Betrag des Postens ist die Summe seiner Unterposten.</div>
    <label class="fld"><span class="lbl">Name</span><input type="text" id="fxc_name" value="${esc(c?c.name:'')}"></label>
    <label class="fld"><span class="lbl">Betrag</span>${padField('fxc_amount', c?c.amount:'')}</label>
    <button class="btn btn-acc" onclick="saveFixChild('${id||''}','${scope}','${childId||''}')">${c?'Speichern':'Hinzufügen'}</button>
    ${c?`<button class="btn btn-danger" onclick="removeFixChild('${id||''}','${scope}','${c.id}')">Unterposten löschen</button>`:''}
    <button class="btn-text" onclick="openFixForm('${id||''}','${scope}',1)">Abbrechen</button>`);
}
function saveFixChild(id,scope,childId){
  const name = el('fxc_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  const amount = parseAmount(el('fxc_amount').value);
  const ch = FX_DRAFT.children;
  const c = childId ? ch.find(x=>x.id===childId) : null;
  if(c){ c.name = name; c.amount = amount; }
  else ch.push({id:uid(), name, amount});   /* anlegen: hinten anhängen (wie saveVariable) */
  openFixForm(id||null, scope, 1);
}
function removeFixChild(id,scope,childId){
  FX_DRAFT.children = (FX_DRAFT.children||[]).filter(x=>x.id!==childId);
  openFixForm(id||null, scope, 1);
}
function openFixForm(id,scope,keepDraft){
  scope = scope || 'tpl';
  id = id || null;
  const st = curState();
  const f = id ? fixCollection(scope).find(x=>x.id===id) : null;
  /* Frischer Einstieg (Klick auf eine Zeile) setzt den Entwurf immer zurück;
     nur der Rückweg aus einem Unterposten-Sheet behält ihn (keepDraft). */
  if(!keepDraft || !FX_DRAFT || FX_DRAFT.key!==fxDraftKey(id,scope))
    FX_DRAFT = {key:fxDraftKey(id,scope), vals:null,
      children: (f && Array.isArray(f.children)) ? deepClone(f.children) : []};
  /* Anzeige-Quelle: der Entwurf, sonst der gespeicherte Posten. Beide tragen
     dieselben Feldnamen, darum genügt EINE Variable im Formular. */
  const v = FX_DRAFT.vals || f;
  const ch = FX_DRAFT.children;
  const chSum = round2(ch.reduce((s,c)=>s+parseAmount(c.amount),0));
  const opts = sel => st.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)}</option>`).join('');

  const months = `<option value="" ${v&&v.recurrence==='yearly'&&v.dueMonth==null?'selected':''}>kein festes Datum (läuft weiter)</option>`

  /* Unterposten-Block: Muster der variablen Kosten (Zeile antippen = bearbeiten,
     ✕ = löschen, ＋ = anlegen), NICHT komplizierter. */
  const chRows = ch.map(c=>`<div class="row">
      <button class="rowmain tap" style="text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0" onclick="openFixChild('${id||''}','${scope}','${c.id}')">

      <button class="linkbtn neg" style="flex:none;margin-left:12px" onclick="removeFixChild('${id||''}','${scope}','${c.id}')">✕</button></div>`).join('');
  const chBlock = `<div class="mt2"><span class="lbl">Unterposten${ch.length?' · Σ '+fmtAmt(chSum)+' wirksam':''}</span>
    ${chRows || '<div class="row hint">Keine — der Betrag oben gilt.</div>'}
    <button class="btn btn-add" onclick="openFixChild('${id||''}','${scope}','')">＋ Unterposten</button>
    <div class="hint">Für Sammelposten wie Abos: einzeln eintragen, einzeln sehen. Sobald Unterposten da sind, zählt überall ihre Summe (${ch.length?fmtAmt(chSum):'—'}) statt des Betrags oben. Löschst du den letzten, gilt wieder der Betrag oben.</div></div>`;
  openSheet(`
    <div class="shead">${f?'Fixkosten bearbeiten':'Neuer Fix-Posten'}</div>
    <div class="ssub">Die Aktion bestimmt die Schnellaktion: Abbuchung geht vom Konto ab, Transfer verschiebt in ein anderes Konto/Space. Kein Raten über Namen.</div>
    <div class="frow">
      <label class="fld" style="flex:0 0 76px"><span class="lbl">Emoji</span><input type="text" id="fx_emoji" maxlength="4" value="${esc(v?v.emoji:'')}"></label>
      <label class="fld"><span class="lbl">Name</span><input type="text" id="fx_name" value="${esc(v?v.name:'')}"></label>
    </div>
    <div class="frow">
      <label class="fld"><span class="lbl">Betrag${ch.length?' (Rückfall)':''}</span>${padField('fx_amount', v?v.amount:'')}</label>
      <label class="fld"><span class="lbl">Aktion</span>
        <select id="fx_kind" onchange="fxSyncVis()">
          <option value="debit" ${v&&v.kind==='debit'?'selected':''}>Abbuchung</option>
          <option value="transfer" ${v&&v.kind==='transfer'?'selected':''}>Transfer</option>
          <option value="none" ${(!v||v.kind==='none')?'selected':''}>Keine</option>
        </select></label>
    </div>
    <label class="fld" id="fx_from_w" style="display:${v&&v.kind!=='none'?'':'none'}"><span class="lbl">Von Konto</span>
      <select id="fx_from">${noneOpt(v&&v.fromId)}${opts(v&&v.fromId)}</select></label>
    <label class="fld" id="fx_to_w" style="display:${v&&v.kind==='transfer'?'':'none'}"><span class="lbl">Nach Konto/Space</span>
      <select id="fx_to">${noneOpt(v&&v.toId)}${opts(v&&v.toId)}</select></label>
    <label class="fld"><span class="lbl">Rhythmus</span>
      <select id="fx_rec" onchange="fxSyncVis()">
        <option value="monthly" ${(!v||v.recurrence==='monthly')?'selected':''}>Monatlich</option>
        <option value="yearly" ${v&&v.recurrence==='yearly'?'selected':''}>Jährlich (mit Monats-Rücklage)</option>
      </select></label>
    <div id="fx_year_w" style="display:${v&&v.recurrence==='yearly'?'':'none'}">
      <div class="frow">
        <label class="fld"><span class="lbl">Fällig im</span><select id="fx_due">${months}</select></label>
        <label class="fld"><span class="lbl">Rücklage auf</span><select id="fx_res">${noneOpt(v&&v.reserveToId)}${opts(v&&v.reserveToId)}</select></label>
      </div>
      <div class="hint mt1">Jahresbetrag ÷ 12 wird monatlich als Rücklage geführt (z. B. 190.00/Jahr · 15.83/Mo). Ohne festes Datum läuft die Rücklage dauerhaft weiter — die echte Rechnung begleichst du manuell aus dem Topf.</div>
    </div>
    <label class="fld" id="fx_passive_w" style="display:${v&&v.kind!=='none'&&v.recurrence!=='yearly'?'':'none'};flex-direction:row;align-items:center;gap:10px">
      <input type="checkbox" id="fx_passive" ${v&&v.passive?'checked':''} style="width:auto;min-height:0">

    </label>
    ${chBlock}
    <button class="btn btn-acc" onclick="saveFix('${id||''}','${scope}')">Speichern</button>
    ${f?`<button class="btn btn-danger" onclick="deleteFix('${f.id}','${scope}')">Posten löschen</button>`:''}
    <button class="btn-text" onclick="FX_DRAFT=null;closeSheet()">Abbrechen</button>
  `);
}
function fxSyncVis(){
  const kind = el('fx_kind').value, rec = el('fx_rec').value;
  el('fx_from_w').style.display = kind==='none' ? 'none' : '';
  el('fx_to_w').style.display = kind==='transfer' ? '' : 'none';
  el('fx_year_w').style.display = rec==='yearly' ? '' : 'none';
  el('fx_passive_w').style.display = (kind!=='none' && rec==='monthly') ? '' : 'none';
}
function saveFix(id,scope){
  const name = el('fx_name').value.trim();
  if(!name){ showToast('Bitte einen Namen angeben.'); return; }
  const rec = el('fx_rec').value;
  const vals = fxReadForm();
  vals.name = name;
  /* N10: Unterposten aus dem Entwurf; leer → undefined (kein Sammelposten mehr,
     der Betrag oben gilt wieder — genau die Konvention von normalizeState). */
  const draftCh = (FX_DRAFT && FX_DRAFT.key===fxDraftKey(id||null,scope)) ? FX_DRAFT.children : null;
  vals.children = (draftCh && draftCh.length) ? deepClone(draftCh) : undefined;
  const coll = fixCollection(scope);
  const f = id ? coll.find(x=>x.id===id) : null;
  /* Übernahme-relevante Änderungen (SPEC 2.28/2.31/2.50): passive + dueMonth + children */
  const changes = [];
  if(f){
    if((!!f.passive)!==vals.passive)
      changes.push({field:'passive', value:vals.passive, label: vals.passive?'nur rechnerisch (keine Schnellaktion)':'wieder abhakbar'});
    if(f.recurrence==='yearly' && rec==='yearly' && f.dueMonth!==vals.dueMonth)
      changes.push({field:'dueMonth', value:vals.dueMonth, label: vals.dueMonth ? 'fällig im '+MONTHS_DE[vals.dueMonth-1] : 'kein festes Datum (läuft weiter)'});
    if(!tplFieldEq('children', f.children, vals.children))
      changes.push({field:'children', value:vals.children,
        label: vals.children ? vals.children.length+' Unterposten · Σ '+fmtAmt(fixAmount({children:vals.children})) : 'keine Unterposten mehr'});
  }
  if(f) Object.assign(f, vals);
  else coll.push(Object.assign({id:uid()}, vals));
  FX_DRAFT = null;   /* Entwurf ist verbraucht (auch auf den Übernahme-Pfaden) */
  /* Übernahme-Dialog: Änderung in der VORLAGE → laufende & geplante Monate
     mitziehen (Match tplId→Name, done nie). Bei 0 Treffern NICHT still
     scheitern → manuelles Zuordnungs-Sheet (E2). */
  if((!scope || scope==='tpl') && f && changes.length){
    const st = curState();
    const targets = [];
    const seen = new Set();
    changes.forEach(c=>tplPropagationTargets(st,f,c.field,c.value).forEach(m=>{ if(!seen.has(m.id)){ seen.add(m.id); targets.push(m); } }));
    if(targets.length){
      closeSheet(); commitState();
      FIX_PROP = {tplId:f.id, changes};
      openSheet(`<div class="shead">Auch auf Monate übernehmen?</div>
        <div class="ssub">«${esc(f.name)}» ist in der Vorlage jetzt: ${changes.map(c=>esc(c.label)).join(' · ')}. Laufende &amp; geplante Monate mit diesem Posten:</div>
        <div class="card mt1">• ${targets.map(m=>esc(m.name)+' '+m.year).join('<br>• ')}</div>
        <button class="btn btn-acc" onclick="doTplProp()">Übernehmen</button>
        <button class="btn btn-ghost" onclick="closeSheet()">Nur Vorlage</button>`);
      return;
    }
    const um = tplUnmatchedMonths(st, f);
    if(um.length){
      closeSheet(); commitState();
      FIX_PROP = {tplId:f.id, changes};
      openTplAssign(f, um);
      return;
    }
  }
  closeSheet(); commitState();
}
let FIX_PROP = null;
function doTplProp(){
  if(!FIX_PROP) return;
  const st = curState();
  const tpl = st.fixedCosts.find(x=>x.id===FIX_PROP.tplId);
  let n = 0;
  if(tpl) FIX_PROP.changes.forEach(c=>{ n += applyTplFieldToMonths(st, tpl, c.field, c.value); });
  FIX_PROP = null;
  closeSheet(); commitState();
  showToast(n+' Posten in Monaten angepasst');
}
/* Zuordnungs-Sheet (E2): kein Monats-Posten passt zur Vorlage (anderer Name,
   kein tplId) → Leo wählt pro Monat den entsprechenden Posten; das setzt tplId
   (dauerhafte Verknüpfung) und übernimmt die Änderung. */
function openTplAssign(tpl, months){
  const rows = months.map(m=>`<label class="fld"><span class="lbl">${esc(m.name)} ${m.year}</span>
    <select id="tplas_${m.id}"><option value="">— kein entsprechender Posten —</option>
      ${m.fixed.map(x=>`<option value="${x.id}">${esc((x.emoji?x.emoji+' ':'')+x.name)} · ${fmtAmt(fixAmount(x))}</option>`).join('')}
    </select></label>`).join('');
  openSheet(`<div class="shead">Posten in Monaten zuordnen</div>
    <div class="ssub">In den laufenden/geplanten Monaten wurde kein Posten gefunden, der zu «${esc(tpl.name)}» gehört (evtl. anders benannt). Wähle den passenden Posten — die Zuordnung wird gemerkt und die Änderung übernommen.</div>
    ${rows}
    <button class="btn btn-acc" onclick="doTplAssign()">Zuordnen &amp; übernehmen</button>
    <button class="btn btn-ghost" onclick="FIX_PROP=null;closeSheet()">Überspringen</button>`);
}
function doTplAssign(){
  if(!FIX_PROP){ closeSheet(); return; }
  const st = curState();
  const tpl = st.fixedCosts.find(x=>x.id===FIX_PROP.tplId);
  let n = 0;
  if(tpl) st.months.forEach(m=>{
    const sel = el('tplas_'+m.id);
    if(sel && sel.value && assignTplToMonthItem(st, tpl, m.id, sel.value, FIX_PROP.changes)) n++;
  });
  FIX_PROP = null;
  closeSheet(); commitState();
  showToast(n ? n+' Posten zugeordnet & angepasst' : 'Nichts zugeordnet');
}
function deleteFix(id,scope){
  FX_DRAFT = null;
  const coll = fixCollection(scope);
  const i = coll.findIndex(x=>x.id===id);
  if(i>=0) coll.splice(i,1);
  closeSheet(); commitState();
}

    <div class="rl"><div><div class="rname">${label}</div>${sub?`<div class="rsub">${sub}</div>`:''}</div></div>
    <div class="mut">›</div></button>`;
  const wizSections = ['Profil & Währung','Banken & Konten','Arbeitsmodell','Fixkosten','Sparmodell','Sparziele','Aktueller Monat & YTD'];
  return `

    <span class="lbl sec">Darstellung</span>
    <div class="seg mt2">
      <button class="${S.settings.theme==='light'?'on':''}" onclick="setTheme('light')">Hell</button>

      <input type="checkbox" ${S.settings.colorBlindMode?'checked':''} aria-label="Farbschwäche-Modus" onchange="toggleColorBlind()"></div>

  <section>
    <span class="lbl sec">Warnschwelle Hauptkonto</span>
    <label class="fld"><span class="lbl">Minimum (${esc(S.settings.currency)})</span>
      <input type="text" inputmode="decimal" value="${S.settings.liquidMinimum}" onchange="setLiquidMinimum(this.value)"></label>
    <div class="hint mt1">Die Standard-Schwelle für jeden Monat — gegen sie prüfen Kreditkarten-Vorrang, Engpass-Warnung und Tagesbudget. Einzelne Monate können im Monats-Detail («Warnschwelle diesen Monat») einen eigenen Wert bekommen; ohne das gilt überall dieser hier. Puffer-Empfehlung: halbe Monatsausgaben (aktuell ~${fmtMoney(bufferSuggestion(S))}). Wird nur gesetzt, wenn du sie übernimmst.</div>

  <section>

    ${secRow('Variable Kosten zur Seite legen'+(S.settings.varReserveToId?' · '+esc(accName(S,S.settings.varReserveToId)):''),'Am Lohntag die geplanten variablen Kosten in einen Topf transferieren','openVarReservePlanner()')}

  <section>
    <span class="lbl sec">Hilfe</span>

  </section>
  <section>
    <span class="lbl sec">Setup-Bereiche</span>
    ${wizSections.map((s,i)=>secRow(s,'',`startWizard(${i+1},true)`)).join('')}
  </section>
  <section>
    <span class="lbl sec">Notizen &amp; Vorschläge</span>
    ${secRow('Feedback-Center'+(feedbackOpenCount(S)?' · '+feedbackOpenCount(S)+' offen':''),'Notizen & Anpassungswünsche — gehen beim Export mit','goView(\'feedback\')')}
    ${secRow('Vorschläge von Claude'+(proposalOpenCount(S)?' · '+proposalOpenCount(S)+' offen':''),'Import-Inbox — nichts wird automatisch angewendet','goView(\'proposals\')')}

  <section>
    <span class="lbl sec">Daten</span>
