<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kontoblatt</title>
<style>
/* ══════════ KONTOBLATT — Design-Tokens ══════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#B96E00; --acc-ink:#FFFFFF;
  --bg:#F7F5F0; --ink:#1B1813; --mut:#7C7466; --line:#E2DCCF; --card:#FDFCF9;
  --pos:#1E7B3C; --neg:#B3372B; --neg-bg:#F6E0DC; --warn:#8A5A00; --warn-bg:#F5E7CC;
  --sheet:#FDFCF9; --field:#F0EDE4;
}
html[data-theme="dark"]{
  --acc:#E8A33D; --acc-ink:#1B1509;
  --bg:#171310; --ink:#EFEAE0; --mut:#9A9184; --line:#2E2820; --card:#1F1A14;
  --pos:#63C284; --neg:#E8796C; --neg-bg:#33201B; --warn:#E8B45A; --warn-bg:#2E2416;
  --sheet:#221D16; --field:#2A241C;
}
html{height:100%}
/* N21: `body` darf NICHT auf 100% Höhe fixiert sein — sonst endet der
   Klebebereich des sticky-Kopfs nach einer Viewporthöhe und das Wortzeichen
   scrollt weg. `min-height` haelt die Grundflaeche, laesst den Body aber mit
   dem Inhalt wachsen. Reine Anzeige, keine Logik. */
body{
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--mut)}
/* U5.4: EINE Abstands-Skala (8/12/20) statt 18/20/26-Mischrhythmen.
   Utility-Klassen ersetzen die häufigen Inline-margin-tops. */
:root{--sp1:8px;--sp2:12px;--sp3:20px}
.mt1{margin-top:var(--sp1)} .mt2{margin-top:var(--sp2)} .mt3{margin-top:var(--sp3)}

/* Kopf */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:560px;margin:0 auto;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.wordmark{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  display:block;width:max-content;max-width:100%;position:relative;text-align:left;padding:0;border-radius:6px}
/* N21: unsichtbares Tap-Ziel >=44px. Als Pseudo-Element, damit der Knopf die
   Kopfzeile optisch nicht auseinanderzieht. `hsub` darunter ist reiner Text,
   wird also nicht um Klicks gebracht. */
.wordmark::after{content:'';position:absolute;left:-10px;right:-10px;top:50%;
  transform:translateY(-50%);height:44px;min-width:44px}
.hsub{font-size:12px;color:var(--mut);margin-top:1px}
.iconbtn{font-size:21px;line-height:1;padding:8px 2px 8px 12px;color:var(--mut)}

/* Inhalt */
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
section{margin-bottom:var(--sp3)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.lbl.sec{display:block;padding-bottom:6px;border-bottom:1px solid var(--line)}
/* N1 — Hero: Gesamtvermögen dominant (oberste Typo-Stufe, tabellarisch),
   darunter eine Haarlinie und die Kennzahl-Reihe. Rahmenlos (Kontoblatt-Seite). */
.home-hero{padding:2px 0 0}
.home-hero .lbl{color:var(--mut)}
.hero-total{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin-top:5px;font-variant-numeric:tabular-nums}
.hero-total.neg{color:var(--neg)}
.hero-rule{border:none;border-top:1px solid var(--line);margin:15px 0 0}
/* Kennzahl-Reihe (Hero + Monat&Jahr): 3 gleiche Spalten, gleiche Höhe BY DESIGN
   — keine nebeneinanderliegenden Kacheln, darum nie ein Loch. */
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:13px}
.statcell{text-align:left;padding:2px;min-width:0;border:none;background:none;color:var(--ink);font:inherit;letter-spacing:normal;text-transform:none;display:block;width:100%}
.statcell .sk{font-size:10.5px;font-weight:650;letter-spacing:.01em;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statcell .sv{display:block;font-size:19px;font-weight:750;letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statcell .sv.neg{color:var(--neg)} .statcell .sv.pos{color:var(--pos)}
/* N11: die Qualifikation trägt jetzt Quelle UND Betrag des Leben-Budgets
   («aus Leben & Essen 850.00»). Bei 375px passt das nicht in eine Zeile — statt
   die Zahl wegzukürzen darf sie auf zwei Zeilen umbrechen (danach abgeschnitten).
   Die kurzen Qualifikationen der Nachbarzellen bleiben davon unberührt. */
.statcell .sq{font-size:11px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.statcell.tap:active{background:var(--field);border-radius:8px}
/* Monat+Jahr-Auswahl (N1, ersetzt das nicht überall unterstützte type=month) */
.myp{display:flex;gap:8px}
.myp .myp-m{flex:1.6}.myp .myp-y{flex:1}
.card{transition:border-color .15s ease}
.qcheck{transition:background .12s ease,border-color .12s ease}
.qadj{transition:background .12s ease,color .12s ease}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.hint{font-size:13.5px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 2px;border-bottom:1px solid var(--line);min-height:54px;width:100%;text-align:left}
.row.tap:active{background:var(--field)}
.rl{display:flex;align-items:center;gap:11px;min-width:0}
.emoji{font-size:19px;width:26px;text-align:center;flex:none}
.rname{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:12.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* N6: Tracker-Zeile am Topf — Zahlen tabellarisch, damit sie mit den Salden
   fluchten; darf auf schmalen Viewports umbrechen statt zu kappen. */
.potline{font-variant-numeric:tabular-nums;white-space:normal;margin-top:3px;opacity:.9}
.amt{font-weight:650;font-size:15.5px;flex:none}
/* N22: rechte Spalte einer Verlauf-Zeile — Betrag oben, «Saldo danach» klein
   darunter. flex:none wie .amt selbst, damit weiterhin die Namensspalte
   schrumpft (min-width:0 + ellipsis in .rl/.rname) und nie die Zahl. */
.amtcol{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.amtcol .after{margin-top:0;font-size:11.5px}
.indent{padding-left:26px}
/* U5.4: Chips tragen Bedeutung («effektiv/geschätzt», «hinter Plan») —
   lesbar statt Caps-Lock: 11.5px, kein uppercase, kaum Letterspacing. */
.chip{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.01em;
  border:1px solid var(--line);border-radius:99px;padding:1.5px 8px;color:var(--mut)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.pos{border-color:var(--pos);color:var(--pos)}
.chip.neg{border-color:var(--neg);color:var(--neg)}
/* U5.3: Glossar «Wie rechnet die App?» — ⓘ an Blocktiteln + Begriffs-Liste */
.glossi{display:inline-block;padding:2px 6px;margin-left:2px;font-size:12.5px;line-height:1;
  color:var(--mut);border-radius:8px;vertical-align:1px}
.glossi:hover,.glossi:active{color:var(--acc)}
.gitem{padding:11px 0;border-bottom:1px solid var(--line)}
.gitem:last-of-type{border-bottom:none}
.gterm{font-weight:750;font-size:14.5px}
.gtext{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.55}
.gitem.ghl .gterm{color:var(--acc)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:var(--sp1)}
.bar>i{display:block;height:100%;background:var(--acc)}
/* U5.4: Warnboxen — fette Titelzeile (.wt), Fliesstext normalgewichtig
   (vorher war ALLES 650, auch mehrzeilige Erklärsätze). */
.warnbox{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);
  border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;margin-top:var(--sp2)}
.warnbox .wt{display:block;font-weight:750}
.warnbox b{font-weight:750}
.warnbox.strong{border-color:var(--neg);color:var(--neg);background:var(--neg-bg)}
/* Status-Band (U3.1): kompakte, aufklappbare Zusammenfassung der nicht-
   kritischen Warnungen — natives <details>, Inhalt immer im DOM. */
.statusband{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px}
.statusband summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;
  padding:10px 14px;cursor:pointer;color:var(--warn);font-size:13.5px;font-weight:750;border-radius:12px}
.statusband summary::-webkit-details-marker{display:none}
.statusband .sb-chev{margin-left:auto;flex:none;transition:transform .15s ease}
.statusband[open] .sb-chev{transform:rotate(180deg)}
.statusband .sb-items{padding:0 10px 10px}
.statusband .sb-items .warnbox{background:var(--card)}
.qcheck{width:32px;height:32px;border:2px solid var(--acc);border-radius:99px;background:none;flex:none}
.qcheck:active{background:var(--acc)}

/* Knöpfe */
.btn{display:block;width:100%;text-align:center;font-weight:700;font-size:15.5px;
  padding:14px;border-radius:12px;margin-top:var(--sp2)}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-danger{border:1px solid var(--neg);color:var(--neg)}
.btn-add{border:1px dashed var(--line);color:var(--acc);font-weight:650}
/* N23: unkonfigurierter Cloud-Sync — der Knopf bleibt sichtbar (er erklärt,
   was möglich ist), ist aber erkennbar nicht anfassbar. */
.btn:disabled{opacity:.42;cursor:default}
[hidden]{display:none!important}
/* U5.4: Sheet-Füsse — «Schliessen»/«Abbrechen» als leiser Text-Button statt
   vollbreiter Rahmen-Button; nur die eigentliche Aktion bleibt ein .btn. */
.btn-text{display:block;width:100%;text-align:center;font-weight:650;font-size:14px;
  color:var(--mut);padding:12px;min-height:44px;margin-top:4px;border-radius:12px}
.btn-text:active,.btn-text:hover{color:var(--ink)}
/* V1.3b: linksbündig — sonst erben Link-Buttons den Button-UA-Default
   text-align:center und wirken (besonders bei Umbruch) mittig, während alle
   anderen Zeilen linksbündig sind. Der bewusst zentrierte «Home anpassen»-Fuss
   setzt text-align:center wieder lokal. */
.linkbtn{color:var(--acc);font-weight:650;font-size:14px;padding:6px 0;text-align:left}

/* Dock */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
  background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
/* NUR direkte Kinder (Nav-Buttons) — die Panel-Zeilen in #sideinfo erben sonst
   Dock-Styles samt ::before-Punkt und überlappen (E4-Nachbesserung 2). */
.dock > button{flex:1;padding:13px 0 11px;font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.dock > button.on{color:var(--acc)}
.dock > button.on::before{content:"";display:block;width:4px;height:4px;border-radius:99px;
  background:var(--acc);margin:0 auto 4px}
.dock > button::before{content:"";display:block;width:4px;height:4px;border-radius:99px;
  background:transparent;margin:0 auto 4px}

/* Sheet */
#backdrop{position:fixed;inset:0;background:rgba(10,8,5,.5);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .2s}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);max-height:88vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .24s ease;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom))}
#sheet.show{transform:translateY(0)}
.grip{width:36px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.shead{font-size:17px;font-weight:750;margin-bottom:4px}
.ssub{font-size:13px;color:var(--mut);margin-bottom:12px}
.sheet-inner{max-width:560px;margin:0 auto}

/* Formulare */
.fld{display:block;margin-top:var(--sp2)}
.fld .lbl{display:block;margin-bottom:6px}
input[type=text],input[type=password],input[type=month],input[type=date],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;
  -webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:70px;resize:vertical}
.frow{display:flex;gap:10px}.frow>*{flex:1;min-width:0}
.togl{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp3);gap:12px}
.togl .lbl{margin:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:var(--sp1)}
.seg button{flex:1;padding:10px;font-size:14px;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}

/* Assistent */
.wiz-dots{display:flex;gap:6px;margin:4px 0 14px}
.wiz-dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.wiz-dots i.on{background:var(--acc)}
.wiz-title{font-size:22px;font-weight:800;letter-spacing:-.01em}
.wiz-sub{font-size:14px;color:var(--mut);margin-top:4px}
.wiz-foot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.wiz-foot-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.wiz-foot-in .btn{margin-top:0}
.wiz-skip{text-align:right;margin-bottom:2px}

/* Checks */
.chk{display:flex;gap:10px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:99px;flex:none;position:relative;top:0}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)}
.chk-det{font-size:12.5px;color:var(--neg);margin-top:3px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  z-index:60;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;
  padding:10px 18px;border-radius:99px;opacity:0;transition:all .25s;pointer-events:none;
  max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-undo{color:var(--acc);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.foot-note{font-size:11.5px;color:var(--mut);text-align:center;margin-top:30px;letter-spacing:.05em}

/* Barrierefreiheit (E7): sichtbarer Fokus, reduzierte Bewegung, Farbschwäche-Glyphen */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;scroll-behavior:auto!important}
}
/* Farbschwäche-Modus (Standard AUS): Beträge zusätzlich über ein Form-Glyph unterscheiden */
html[data-cb="1"] .amt.pos::before{content:"▲ ";font-size:.72em;vertical-align:1px}
html[data-cb="1"] .amt.neg::before{content:"▼ ";font-size:.72em;vertical-align:1px}

/* N3.1: Kopfzeile «Schnellaktionen» + ⋯-Überlaufmenü (Reset weg vom Hauptweg) */
.qahead{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* N3.2: Chart-Hover-Readout — schwebende Box, folgt der Maus, blockiert keine Klicks.
   Der globale prefers-reduced-motion-Block oben neutralisiert die Transition. */
.charttip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;max-width:240px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;
  box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:12px;line-height:1.35;color:var(--ink);
  opacity:0;transition:opacity .09s ease}
.charttip[hidden]{display:none}
.charttip.show{opacity:1}
.charttip b{font-weight:750;display:block}
.charttip .ctl{color:var(--mut);display:block}
.charttip .ctl.warnv{color:var(--neg)}

/* Universelle Schnell +/− Buttons an Zeilen */
.rowq{display:flex;align-items:center;gap:6px;flex:none}
.qadj{width:34px;height:34px;border:1px solid var(--line);border-radius:99px;font-size:18px;font-weight:700;
  color:var(--acc);line-height:1;flex:none}
.qadj:active{background:var(--acc);color:var(--acc-ink)}
.rowmain{display:flex;align-items:center;gap:11px;min-width:0;flex:1;text-align:left;min-height:44px}
.chev{width:34px;height:34px;border-radius:8px;color:var(--mut);font-size:12px;flex:none}
.chev:active{background:var(--field)}
/* Home-Konten als sauberer Baum: Spaces fluchten exakt unter das Emoji des
   Hauptkontos (Zeilen-Pad 2 + Chevron 34 + Zeilen-Gap 12 = 48px), statt der
   generischen 26px-Einrückung. Gleiche Spalte wie Top-Level-Konten mit
   Chevron-Platzhalter (V1.3a) → alle Emojis fluchten. */
.acc-tree .row.indent{padding-left:48px}

/* CHF-Tastenfeld (Zifferblock statt System-Tastatur) */
.padfield{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:700;font-variant-numeric:tabular-nums}
.padfield .curr{color:var(--mut);font-weight:600;font-size:13px;margin-left:4px}
#padwrap{position:fixed;inset:0;z-index:70;display:none}
#padwrap.show{display:block}
#padback{position:absolute;inset:0;background:rgba(10,8,5,.4)}
#pad{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.pad-disp{font-size:34px;font-weight:750;text-align:right;padding:6px 8px 12px;letter-spacing:-.02em;min-height:50px;font-variant-numeric:tabular-nums}
.pad-disp .cur{font-size:15px;color:var(--mut);font-weight:600;margin-left:6px}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad-grid button{font-size:22px;font-weight:650;padding:15px 0;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.pad-grid button:active{background:var(--acc);color:var(--acc-ink)}
.pad-actions{display:flex;gap:8px;margin-top:var(--sp1)}
.pad-actions .btn{margin-top:0;flex:1}
/* U1.1: Desktop-Betragsfeld (ab 960px liefert padField ein echtes Eingabefeld) —
   nutzt die globale input-Optik, Währung als Suffix im Feld */
.amtwrap{display:block;position:relative}
.amtwrap input{font-weight:700;font-variant-numeric:tabular-nums;padding-right:52px}
.amtwrap .curr{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--mut);font-weight:600;font-size:13px;pointer-events:none}
/* U1.7: Betrags-Vorschläge als Chips unterm Betragsfeld (Ein-Tap statt Tippen) */
.sugrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--sp1)}
.sug{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--field);
  font-size:13px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.sug:active{background:var(--acc);color:var(--acc-ink)}
/* U1.6: Zahlen mit Herkunfts-Sheet dezent als antippbar markieren */
.prov{text-decoration:underline dotted var(--mut);text-underline-offset:4px;text-decoration-thickness:1px}
svg text.provt{text-decoration:underline dotted}

/* N1: Home ist eine durchgehende, rahmenlose Kontoblatt-Seite (Bänder) — ein
   Layout für Handy UND Laptop, kein Raster, keine Kacheln, kein Drag & Drop. */
/* Seitenleisten-Überblick (E4): existiert nur auf dem Desktop */
#sideinfo{display:none}
/* U4.1-Navigation: sekundäre Einträge + Sektions-Label nur Desktop;
   der «Mehr»-Knopf nur im Handy-Dock */
.dock > .navdt{display:none}
.dock > .nav-lbl{display:none}

/* ══════════ Laptop / Desktop (≥ 960px) ══════════
   Handy-Layout bleibt unangetastet; ab 960px App-Shell mit Seitenleiste,
   breiterer Inhaltsfläche, Karten-Raster auf Home und zentrierten Dialogen. */
@media (min-width:960px){
  body{font-size:15px}

  /* Kopf = durchgehende obere Leiste mit fester Höhe (Ankerpunkt der Seitenleiste) */
  .hwrap{max-width:none;height:60px;padding:0 26px}
  .wordmark{font-size:14px}

  /* Dock → linke Seitenleiste (E4: 260px, unten Überblick-Panel statt Leerraum) */
  .dock{flex-direction:column;top:60px;bottom:0;left:0;right:auto;width:260px;
    border-top:none;border-right:1px solid var(--line);
    justify-content:flex-start;gap:2px;padding:16px 14px;overflow-y:auto}
  .dock > button{flex:none;width:100%;text-align:left;padding:12px 14px;border-radius:10px;
    font-size:12.5px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
  .dock > button::before{margin:0;width:4px;height:16px;border-radius:3px}
  .dock > button.on{background:var(--field)}
  .dock > button.on::before{width:4px;height:16px}
  .dock > button:hover{background:var(--field)}
  /* U4.1: volle Navigation — sekundäre Einträge sichtbar (kompakter, gedämpft),
     Sektions-Label wie im Panel, «Mehr»-Knopf des Handy-Docks versteckt */
  .dock > .navdt{display:flex}
  .dock > .navmob{display:none}
  .dock > button.navsub{padding:9px 14px;font-size:11.5px;color:var(--mut)}
  .dock > button.navsub.on{color:var(--acc)}
  .dock > .nav-lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--mut);padding:14px 6px 4px}
  .dock > button .navcnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--acc)}

  /* Überblick-Panel (E4): reine Readouts, füllt den Raum unter dem Menü.
     Harte Overflow-Regeln: Label ellipst, Zahl bricht nie, nichts überlappt. */
  /* V1.3c: klare Hierarchie statt flacher Label/Wert-Zeilen. Kern-Kennzahlen
     (Gesamtvermögen, Rest) als leises Label über grossem, kräftigem Wert;
     Monatswerte kompakt mit leiser Qualifikation unter dem Wert (kein
     Ellipsen-Abschnitt mehr). Ruhige, einheitliche Abstände. */
  #sideinfo{display:block;margin-top:var(--sp2);border-top:1px solid var(--line);padding-top:4px}
  #sideinfo .si-lbl{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);display:block;padding:16px 6px 4px}
  /* Hero-Kennzahl: kleines/leises Label, grosser/kräftiger Wert */
  #sideinfo .si-hero{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
    text-align:left;padding:8px 6px;border:none;background:none;color:var(--ink);cursor:pointer;
    font:inherit;letter-spacing:normal;text-transform:none;border-radius:9px}
  #sideinfo .si-hero::before{content:none}
  #sideinfo .si-hero:hover{background:var(--field)}
  #sideinfo .si-hk{font-size:11px;font-weight:500;color:var(--mut)}
  #sideinfo .si-hv{font-size:20px;font-weight:750;line-height:1.1;letter-spacing:-.015em;color:var(--ink)}
  #sideinfo .si-hv.neg{color:var(--neg)}
  /* Kompakte Kennzahl: Label links, Wert (+ leise Qualifikation) rechts */
  #sideinfo .si-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    width:100%;min-height:36px;text-align:left;padding:6px;border-radius:9px;
    border:none;background:none;color:var(--ink);cursor:pointer;font:inherit;
    letter-spacing:normal;text-transform:none}
  #sideinfo .si-row::before{content:none}
  #sideinfo .si-row:hover{background:var(--field)}
  #sideinfo .si-k{font-size:12.5px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sideinfo .si-rt{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;line-height:1.12}
  #sideinfo .si-v{font-size:14px;font-weight:700;white-space:nowrap}
  /* (c) Qualifikation («effektiv»/«aus Buchungen») bekommt Luft zur gepunkteten
     Herkunfts-Linie des Werts: mehr margin-top + kleinerer Unterstreichungs-
     Abstand der .prov-Werte im Panel — sie berühren sich nicht mehr. */
  #sideinfo .si-q{font-size:10px;color:var(--mut);margin-top:4px;font-weight:500;white-space:nowrap}
  #sideinfo .si-v.prov{text-underline-offset:2px}
  #sideinfo .si-note{font-size:11.5px;color:var(--mut);padding:2px 6px 8px;line-height:1.4}
  #sideinfo .si-note.warn{color:var(--warn)}

  /* Inhalt rechts neben der Seitenleiste: Home breit, übrige Ansichten lesbar.
     U4.0c: die Fläche zentriert sich im Raum RECHTS der Seitenleiste — beim
     Fenster-Grösserziehen klebt der Inhalt nicht mehr links an einer riesigen
     Leerfläche (max() hält immer die 260px der Seitenleiste frei). */
  /* N1: Home als ~1080px-Spalte, zentriert im Raum rechts der Seitenleiste. */
  body[data-mode="app"] main{margin-left:max(260px, calc(50vw - 410px));max-width:1080px;padding:26px 40px 72px}
  body[data-mode="app"]:not([data-view="home"]) main{max-width:940px;margin-left:max(260px, calc(50vw - 340px))}

  /* N1 — Hero (Gesamtvermögen) rahmenlos und gross; die Kennzahl-Reihe bleibt
     schmal (nicht über die ganze 1080px-Breite gezogen → ruhig statt sparrig).
     Der «Aktueller Monat»-Inhalt lebt jetzt sichtbar im Band «Dieser Monat &
     Jahr» (blockMonthYear) — kein Desktop-Ausblenden mehr. */
  body[data-view="home"] .home-hero{padding-top:4px}
  body[data-view="home"] .hero-total{font-size:52px;margin-top:6px}
  body[data-view="home"] .statrow{gap:14px;max-width:660px}
  body[data-view="home"] .statcell .sv{font-size:22px}
  body[data-view="home"] .statcell .sk{font-size:11.5px}

  /* Typo-Hierarchie (Desktop): Sektions-Übertitel klar abgesetzt (Akzent-Tick,
     dunkler), Untertitel/Beschreibungen bleiben klein + gedämpft. */
  .lbl.sec{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);
    letter-spacing:.12em;border-bottom:none;padding-bottom:10px}
  .lbl.sec::before{content:"";flex:none;width:14px;height:3px;border-radius:2px;background:var(--acc)}
  .rname{font-size:14.5px}
  .rsub{font-size:12px}

  /* N1 — Home-Bänder: rahmenlos, ein vertikaler Fluss voll-breiter Abschnitte.
     Trennung durch Weissraum + die Abschnitts-Übertitel (.lbl.sec mit Akzent-
     Tick), NICHT durch Karten. Es liegen nie zwei ungleich hohe Boxen neben-
     einander ⇒ strukturell keine Löcher, bei jeder Breite. Die Breite nutzen
     voll-breite Charts, Kennzahl-Reihen und die Konten-/Verlauf-Listen. */
  body[data-view="home"] main > section{margin-bottom:26px}
  body[data-view="home"] main > section > .row:last-child{border-bottom:none}
  /* N1-FIX: Chart läuft voll breit wie jeder Band-Abschnitt (kein max-width-Hack,
     keine Linksbündigkeit). Die Lesbarkeit sichert nicht mehr eine Breiten-Kappung,
     sondern die an die Renderbreite gekoppelte viewBox (fitWealthChart → scale ~1,
     echte px). */
  body[data-view="home"] .home-chart{width:100%}

  /* Zeigergesten */
  .row.tap:hover{background:var(--field)}
  .btn:hover{filter:brightness(1.06)}
  .btn-ghost:hover,.btn-add:hover{background:var(--field)}
  .linkbtn:hover{text-decoration:underline}
  .qcheck:hover{background:var(--field)}
  .iconbtn:hover{color:var(--ink)}
  .sug:hover{border-color:var(--acc)}

  /* Bottom-Sheet → zentrierter Modal-Dialog */
  #sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:86vh;
    border:1px solid var(--line);border-radius:16px;
    transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;
    visibility:hidden;
    transition:transform .2s ease,opacity .2s ease,visibility .2s;padding:14px 24px 24px}
  #sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;
    visibility:visible}
  #sheet .grip{display:none}
  #pad{left:50%;right:auto;transform:translateX(-50%);width:420px;bottom:24px;
    border:1px solid var(--line);border-radius:16px}

  /* Toast weg von der (nun linken) Navigation */
  #toast{bottom:28px}

  /* Assistent zentriert, ohne Seitenleisten-Versatz */
  body[data-mode="wizard"] main{max-width:620px;margin:0 auto}
}
/* V1: Die 3. Spalte (früher ab 1440px) ist entfallen. Bei der aktuellen
   Blockzahl (2 hohe „voll"-Blöcke + 4 kurze „halb"-Blöcke) liess sich ein
   3-Spalten-Raster nicht lückenlos row-major kacheln — genau dort entstanden
   die grössten Löcher. Das Home bleibt darum bis zu jeder Breite zweispaltig;
   die zusätzliche Fläche nutzen breitere Karten. */
</style>

  <div class="hwrap">
    <div>
      <button class="wordmark" id="homeBtn" onclick="goHomeTop()" aria-label="Kontoblatt — zur Startseite">Kontoblatt</button>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   KONTOBLATT — Etappe 1: Fundament & Datenvertrag
   Schema v1 gemäss SPEC.md Abschnitt 1 (verbindlich).
   Reihenfolge: pure Logik zuerst (auch headless testbar), UI danach.
   ════════════════════════════════════════════════════════════════════ */

const LS_KEY = 'kontoblatt.state';
const SCHEMA_VERSION = 1;
/* U1.8: EINZIGE Quelle fürs Versionslabel (Fusszeile Einstellungen) */
const APP_STAGE = 'Etappe N23';
/* U3: 'today' (Heute zu tun) ersetzt die früheren Blöcke 'quickActions' und
   'todos' — Legacy-Namen werden in der Normalisierung positionserhaltend gemappt.
   U4: 'accounts' (Konten-Block) ist jetzt ein normaler homeLayout-Block
   (verschieb-/ausblendbar); alte Exporte ohne den Eintrag bekommen ihn beim
   Normalisieren ans Ende angehängt — exakt die bisherige fixe Position. */
/* V1 (Home-Layout fundamental): Der eigene 'forecast'-Home-Block (U5) ist
   ENTFERNT — die Hauptkonto-Prognose mit Minimum-Linie lebt jetzt im
   Liquiditäts-Verlauf-Block (blockLiquidityChart, V1.2). Alte Exporte mit
   einem 'forecast'-Eintrag verlieren ihn sauber (normalizeState filtert
   unbekannte Blöcke; keine Bruchstelle).
   Reihenfolge = 2-Spalten-Dashboard, höhen-gepaart (V1.1): today (voll) ·
   [restToSpend | yearProgress] · liquidityChart (voll) · [ledger | accounts].
   currentMonth ist auf dem Desktop versteckt (steht im Panel) — seine Position
   zählt nur fürs Handy (einspaltig) und stört die Desktop-Paarung nicht. */
const HOME_BLOCKS = ['today','restToSpend','currentMonth','yearProgress','liquidityChart','ledger','accounts'];
/* Reihenfolge des ALTEN Defaults (bis U5, inkl. forecast) — dient allein der
   Erkennung „unveränderte Standard-Anordnung" beim Migrieren (s. normalizeState):
   wer noch exakt darauf steht, wird aufs neue 2-Spalten-Default gehoben. */
const OLD_DEFAULT_LAYOUT = ['restToSpend','today','ledger','currentMonth','liquidityChart','forecast','yearProgress','accounts'];
/* Default-Breite pro Block (V1.1): „voll" (ganze Rasterzeile) vs „halb" (eine
   Spalte). Nur die zwei hohen Blöcke laufen voll — so entsteht in der
   Standard-Anordnung nie eine hohe Karte neben einer kurzen (= keine Löcher). */
const BLOCK_WIDE_DEFAULT = { today:true, liquidityChart:true };
const BLOCK_LABELS = {restToSpend:'Rest zum Ausgeben', today:'Heute zu tun', ledger:'Verlauf',
  currentMonth:'Aktueller Monat', liquidityChart:'Liquiditäts-Verlauf',
  yearProgress:'Jahresfortschritt', accounts:'Konten'};
const TODO_SOURCES = ['claude','manual','system'];
const TODO_CATEGORIES = ['steuern','sparen','kk','reise','allgemein'];
const ACCOUNT_KINDS = ['main','debit','space','creditcard','savings'];
const KIND_LABELS = {main:'Hauptkonto',debit:'Debit',space:'Space',creditcard:'Kreditkarte',savings:'Sparkonto'};
const LEDGER_TYPES = ['eingang','ausgang','refund','transfer','anpassung'];
const LEDGER_SOURCES = ['quickAction','manual','bulkAdjust','ccPriority','instantPay','salaryPayout','claudeProposal','quickDeposit','varReserve','fixedSalaryPayout','plannedReserve'];
const PROPOSAL_ACTION_KINDS = ['transfer','setBalance','setField','note'];
/* Whitelist der per claudeProposal setField-Aktion änderbaren Pfade (nur skalare
   Einstellungen — nie Konten/Ledger direkt). */
const PROPOSAL_SETFIELD_PATHS = ['settings.liquidMinimum','settings.monthsFilter','settings.monthsSort','workModel.ratePerWorkday','workModel.instantPay.amountPerShift'];
/* N9 (SPEC 2.49): EIN monatsindizierter Pfad neben der festen Whitelist —
   `months.<YYYY-MM>.liquidMinimum` setzt die Warnschwelle EINES Monats
   (null/leer = wieder global). Bewusst als eigenes, eng gefasstes Muster statt
   als generischer Pfad-Setter: die Whitelist bleibt eine Aufzählung dessen, was
   ein Vorschlag anfassen darf. Alles andere unverändert. */
const PROPOSAL_SETFIELD_MONTH_RE = /^months\.(\d{4}-(?:0[1-9]|1[0-2]))\.liquidMinimum$/;
function setFieldPathAllowed(path){
  return PROPOSAL_SETFIELD_PATHS.includes(path) || PROPOSAL_SETFIELD_MONTH_RE.test(String(path==null?'':path));
}
const MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

/* ─────────── Helfer ─────────── */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function round2(n){ return Math.round(n*100)/100; }
/* N18: Default-Auszahlungstag des Festlohns (SPEC 2.55). */
const PAYOUT_DAY_DEFAULT = 25;
function pad2(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowMonthId(){ return today().slice(0,7); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function deepEqual(a,b){
  if(a===b) return true;
  if(typeof a!==typeof b) return false;
  if(a&&b&&typeof a==='object'){
    if(Array.isArray(a)!==Array.isArray(b)) return false;
    const ka=Object.keys(a), kb=Object.keys(b);
    if(ka.length!==kb.length) return false;
    return ka.every(k=>deepEqual(a[k],b[k]));
  }
  return false;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function germanMonthName(monthId){ const m=parseInt(String(monthId).slice(5,7),10); return MONTHS_DE[m-1]||''; }
function monthLabel(monthId){ return monthId ? germanMonthName(monthId)+' '+String(monthId).slice(0,4) : '—'; }

/* Schweizer Zahlenformat: 1'234.50 */
function fmtAmt(n){
  n = round2(Number(n)||0);
  const neg = n < 0;
  const abs = Math.abs(n).toFixed(2);
  const parts = abs.split('.');
  const int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,"'");
  return (neg?'−':'') + int + '.' + parts[1];
}
function fmtMoney(n,curr){ return fmtAmt(n) + ' ' + (curr || (typeof S!=='undefined'&&S ? S.settings.currency : 'CHF')); }
function parseAmount(v){
  if(typeof v==='number') return isFinite(v)?round2(v):0;
  if(typeof v!=='string') return 0;
  let s = v.trim().replace(/CHF/ig,'').replace(/[’'`’\s]/g,'').replace(/−/g,'-');
  if(/,/.test(s) && !/\./.test(s)) s = s.replace(',','.'); else s = s.replace(/,/g,'');
  const n = parseFloat(s);
  return isFinite(n)?round2(n):0;
}

/* ─────────── Default-State (keine Nutzerdaten, nur neutrale Defaults) ─────────── */
function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    setupComplete: false,
    settings: {
      theme:'dark', currency:'CHF', profileName:'',
      currentMonthId: nowMonthId(), ytdStartMonthId: nowMonthId(),
      liquidMinimum: 600,
      homeLayout: HOME_BLOCKS.map(b=>({block:b,visible:true,wide:!!BLOCK_WIDE_DEFAULT[b]})),
      monthsFilter: 'all', monthsSort: 'desc',
      lastCutoverMonthId: null,
      spacesCollapsed: {},
      lastBackupAt: null,        // Datum des letzten Exports (Backup-Nudge, E7)
      colorBlindMode: false,     // Farbschwäche-Modus: Vorzeichen/Icons zusätzlich (E7)
      varReserveToId: null       // Topf für die Rücklage der variablen Kosten (N6, 2.46);
                                 // null = nicht eingerichtet → KEINE Schnellaktion
    },
    /* fixedSalary (N17, SPEC 2.55): ZWEITE Lohnquelle neben der Schicht-Quelle,
       pensum-basiert. enabled:false ist der Default → für jeden Bestandsstand
       ändert sich nichts, die Migration ergänzt nur das Objekt.
       fullPensumAmount = NETTO-Monatslohn bei 100 % Pensum (wie überall in der
       App sind Sozialabzüge bereits enthalten — es gibt keine Umrechnung). */
    workModel: { ratePerWorkday:0, ratePerHour:0, instantPay:{enabled:false, amountPerShift:0}, holidayRegion:'',
      fixedSalary:{ enabled:false, name:'', fullPensumAmount:0, pensumPercent:0,
                    startMonthId:null, payoutDay:PAYOUT_DAY_DEFAULT } },
    accounts: [],
    fixedCosts: [],
    savingsModel: { mode:'fixed', allocations:[] },
    months: [],
    goals: [],
    ledger: [],
    quickActionsDone: {},
    /* Aufgezeichnete Hauptkonto-Monatsstände (N15, SPEC 2.54): beim Cutover
       festgehaltener ECHTER Saldo des soeben abgeschlossenen Geldmonats.
       Top-Level wie quickActionsDone, damit ein Monats-Import (der ein
       Monatsobjekt als GANZES ersetzt) die Aufzeichnung nicht mitnimmt.
       Einmal geschrieben = Historie: nie neu gerechnet, nie überschrieben. */
    mainSnapshots: {},
    feedback: [],
    todos: [],   /* To-Dos/Game-Plan (E3) — ersetzt den früheren actionPlan */
    /* Geplante Rücklagen (N20, SPEC 2.57): ein benannter Betrag, der in EINEM
       Monat aufs Zielkonto zurückgelegt und in einem (evtl. anderen) Monat
       gebraucht wird. EIGENES Konzept neben den variablen Kosten (2.46) —
       fliesst in KEINE Bestandsrechnung; die einzige Geld-Wirkung ist der
       physische Transfer beim Zurücklegen. */
    plannedReserves: [],
    claudeProposals: [],
    /* Steuer-Planer (E9): dynamische Rücklage auf ein Ziel-Konto (erweitert 2.12). */
    taxPlan: { enabled:false, amount:0, dueMonth:null, reserveToId:null, fromId:null, reserved:0 }
  };
}

/* ─────────── Normalisierung (robust: kaputte Stände dürfen die App nie zerlegen) ─────────── */
function nStr(v,fb){ return (typeof v==='string' && v.trim()!=='') ? v : (fb!==undefined?fb:''); }
function nEnum(v,list,fb){ return list.includes(v) ? v : fb; }
function nMonthId(v){ return (typeof v==='string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(v)) ? v : null; }
/* N1 — Monat+Jahr-Auswahl statt <input type="month">. Grund: Safari (macOS) und
   Firefox unterstützen type="month" NICHT als Picker — sie zeigen ein blankes
   Textfeld, in das man «2026-07» tippen müsste. Zwei native <select> (Monat +
   Jahr) sind überall ein echter Picker. Ein verstecktes Feld mit DERSELBEN id
   trägt weiterhin «YYYY-MM» → alle bestehenden nMonthId(el(id).value)-Lesestellen
   bleiben byte-gleich. opts.allowEmpty erlaubt «kein Monat» (hidden value ''). */
function monthYearPicker(id, value, opts){
  opts = opts || {};
  const cur = nMonthId(value);
  const nowY = parseInt(String(today()).slice(0,4),10) || 2026;
  const nowM = parseInt(String(today()).slice(5,7),10) || 1;
  const selY = cur ? parseInt(cur.slice(0,4),10) : (opts.defaultYear || nowY);
  const selM = cur ? parseInt(cur.slice(5,7),10) : (opts.defaultMonth || nowM);
  const hasMonth = cur ? true : !opts.allowEmpty;
  const hidVal = cur ? cur : (opts.allowEmpty ? '' : (selY+'-'+String(selM).padStart(2,'0')));
  const y0 = Math.min(nowY-3, selY), y1 = Math.max(nowY+6, selY);
  let years=''; for(let y=y0;y<=y1;y++) years += `<option value="${y}" ${selY===y?'selected':''}>${y}</option>`;
  const empty = opts.allowEmpty ? `<option value="0" ${cur?'':'selected'}>${esc(opts.emptyLabel||'— kein Monat —')}</option>` : '';
  const months = MONTHS_DE.map((m,i)=>`<option value="${i+1}" ${(hasMonth&&selM===i+1)?'selected':''}>${m}</option>`).join('');
  const onch = `myp_update('${id}')${opts.onchange?(';'+opts.onchange):''}`;
  return `<span class="myp">
    <input type="hidden" id="${id}" value="${hidVal}">
    <select class="myp-m" aria-label="Monat" onchange="${onch}">${empty}${months}</select>
    <select class="myp-y" aria-label="Jahr" onchange="${onch}"${(opts.allowEmpty&&!cur)?' disabled':''}>${years}</select>
  </span>`;
}
function myp_update(id){
  const hid = document.getElementById(id); if(!hid) return;
  const wrap = hid.closest('.myp'); if(!wrap) return;
  const m = parseInt(wrap.querySelector('.myp-m').value,10)||0;
  const ySel = wrap.querySelector('.myp-y');
  if(m>=1){ ySel.disabled=false; hid.value = ySel.value + '-' + String(m).padStart(2,'0'); }
  else { ySel.disabled=true; hid.value=''; }
}
/* N9: optionaler Betrag — «kein Wert» ist ein eigener Zustand (null), nicht 0.
   Leer/fehlend/kaputt/negativ → null. Bewusst NICHT einfach parseAmount: das
   liefert für 'abc' eine 0, und eine 0 wäre bei month.liquidMinimum eine echte
   Aussage («keine Schwelle») statt «nichts gesetzt». */
function nOptAmount(v){
  if(v==null) return null;
  if(typeof v!=='number' && typeof v!=='string') return null;
  if(typeof v==='string' && !/\d/.test(v)) return null;
  const n = parseAmount(v);
  return (isFinite(n) && n>=0) ? round2(n) : null;
}
function nId(v){ return (typeof v==='string' && v!=='') ? v : uid(); }
/* N18 (SPEC 2.55): Auszahlungstag des Festlohns als KALENDERTAG 1–31.
   Kaputt, leer, 0, 32, Text → der Default 25; es gibt hier bewusst kein
   «leer erlaubt» wie bei nOptAmount, weil ein Zahltag immer existiert.
   Reine Anzeige-/Planinfo: die App bucht nichts (Sonderfall 29 unverändert).
   parseAmount nimmt Zahl UND String; Math.round, damit «25.4» nicht als
   Bruchtag stehen bleibt. */
function nPayoutDay(v){
  const n = Math.round(parseAmount(v));
  return (n>=1 && n<=31) ? n : PAYOUT_DAY_DEFAULT;
}
function nDate(v){ return (typeof v==='string' && /^\d{4}-\d{2}-\d{2}/.test(v)) ? v.slice(0,10) : today(); }

function normalizeFixedItem(v, accIds){
  v = (v && typeof v==='object') ? v : {};
  const kind = nEnum(v.kind, ['debit','transfer','none'], 'none');
  const recurrence = nEnum(v.recurrence, ['monthly','yearly'], 'monthly');
  const has = id => typeof id==='string' && accIds.has(id);
  return {
    id: nId(v.id),
    name: nStr(v.name,'Posten'),
    emoji: nStr(v.emoji,''),
    amount: parseAmount(v.amount),
    kind,
    fromId: has(v.fromId) ? v.fromId : null,
    toId: (kind==='transfer' && has(v.toId)) ? v.toId : null,
    recurrence,
    /* dueMonth (SPEC 2.31): 1–12 = fester Fälligkeitsmonat; null = «kein festes
       Datum / läuft dauerhaft» (Rücklage ÷ 12 ohne Fälligkeits-Trigger). */
    dueMonth: recurrence==='yearly' ? ((Number.isInteger(v.dueMonth)&&v.dueMonth>=1&&v.dueMonth<=12)?v.dueMonth:null) : null,
    reserveToId: (recurrence==='yearly' && has(v.reserveToId)) ? v.reserveToId : null,
    /* passive (SPEC 2.28): nur rechnerisch — zählt in Monatsrechnung/Rest,
       erzeugt aber KEINE Schnellaktion. Nur für monatliche debit/transfer. */
    passive: recurrence==='monthly' && kind!=='none' ? !!v.passive : false,
    /* tplId (SPEC 2.28/E2): Verweis der Monats-Kopie auf ihren Vorlage-Posten —
       macht die Vorlage→Monate-Übernahme unabhängig vom Namen. */
    tplId: (typeof v.tplId==='string' && v.tplId) ? v.tplId : null,
    /* children (SPEC 2.50, N10): Sammelposten («Subscriptions») mit einzeln
       geführten Unterposten. FEHLT das Feld → undefined, damit alte Exporte
       Feld für Feld unverändert bleiben (kein leeres Array erfinden). */
    children: nFixChildren(v.children)
  };
}
/* Unterposten normalisieren: kaputte Einträge fliegen raus, Betrag über das
   nOptAmount-Muster (null → 0, weil ein Unterposten immer einen Betrag hat —
   «kein Wert» ist hier keine Aussage wie bei month.liquidMinimum). Leere
   Liste → undefined: ein Posten OHNE Kinder ist kein Sammelposten. */
function nFixChildren(v){
  if(!Array.isArray(v)) return undefined;
  const out = [];
  v.forEach(c=>{
    if(!c || typeof c!=='object' || Array.isArray(c)) return;
    const name = nStr(c.name,'');
    if(!name) return;
    const a = nOptAmount(c.amount);
    out.push({ id: nId(c.id), name, amount: a==null ? 0 : a });
  });
  return out.length ? out : undefined;
}
/* ─────────── N10: EINE Betragsquelle für Fixposten (SPEC 2.50) ───────────
   Ein Posten MIT Unterposten ist eine Klammer: wirksam ist Σ children. Das
   eigene `amount` bleibt gespeichert und dient als Rückfall, sobald der letzte
   Unterposten gelöscht wird — so verliert das Löschen keinen Wert und es gibt
   trotzdem nie zwei gültige Beträge gleichzeitig.
   VERBINDLICH: JEDER Verbraucher liest den Betrag eines Fixpostens über
   fixAmount(f) — Planrechnung, Rest, Überschuss, Engpass, Schnellaktionen,
   Jahresfälligkeit, Puffer, Topf-Tracker, Verlauf-Herkunft, Editor, Setup.
   Ein Posten ohne children liefert exakt f.amount (die Anker 860/850 halten). */
function fixChildren(f){
  return (f && Array.isArray(f.children) && f.children.length) ? f.children : null;
}
function fixAmount(f){
  if(!f) return 0;
  const ch = fixChildren(f);
  if(!ch) return parseAmount(f.amount);
  return round2(ch.reduce((s,c)=>s+parseAmount(c.amount),0));
}

function normalizeState(raw){
  const d = defaultState();
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return d;
  const s = d;
  s.setupComplete = !!raw.setupComplete;

  /* settings */
  const rs = (raw.settings && typeof raw.settings==='object') ? raw.settings : {};
  s.settings.theme = nEnum(rs.theme,['dark','light'],'dark');
  s.settings.currency = nStr(rs.currency,'CHF');
  s.settings.profileName = nStr(rs.profileName,'');
  s.settings.currentMonthId = nMonthId(rs.currentMonthId) || nowMonthId();
  s.settings.ytdStartMonthId = nMonthId(rs.ytdStartMonthId) || nowMonthId();
  s.settings.liquidMinimum = (rs.liquidMinimum==null) ? 600 : parseAmount(rs.liquidMinimum);
  /* V1.2-Migration: Wer noch exakt auf der alten Standard-Anordnung steht
     (inkl. forecast, alles sichtbar), wird verlustfrei aufs neue 2-Spalten-
     Default gehoben — echte Anpassungen (verschoben/ausgeblendet) bleiben
     unangetastet. Idempotent: das neue Default enthält kein forecast, matcht
     also nie wieder. */
  const rawHL = Array.isArray(rs.homeLayout) ? rs.homeLayout : [];
  const isOldDefault = rawHL.length===OLD_DEFAULT_LAYOUT.length
    && rawHL.every((e,i)=> e && e.block===OLD_DEFAULT_LAYOUT[i] && e.visible!==false);
  if(isOldDefault){
    s.settings.homeLayout = HOME_BLOCKS.map(b=>({block:b,visible:true,wide:!!BLOCK_WIDE_DEFAULT[b]}));
  } else {
  const seenB = new Set(); const hl = [];
  (Array.isArray(rs.homeLayout)?rs.homeLayout:[]).forEach(e=>{
    let b = e && e.block;
    /* Legacy-Blöcke positionserhaltend mappen: actionPlan → todos (E3),
       quickActions/todos → today (U3, Aufgaben-Zentrale). Position = die des
       ERSTEN der zusammengeführten Blöcke; sichtbar, wenn mindestens einer
       sichtbar war (kein Verlust). */
    const mergedU3 = (b==='actionPlan' || b==='quickActions' || b==='todos');
    if(mergedU3) b = 'today';
    if(!HOME_BLOCKS.includes(b)) return;
    /* Breite (U3-LAYOUT): boolesch übernehmen, sonst Blocktyp-Default —
       alte Exporte ohne wide-Feld laufen unverändert durch. */
    const w = (typeof e.wide==='boolean') ? e.wide : !!BLOCK_WIDE_DEFAULT[b];
    if(!seenB.has(b)){ seenB.add(b); hl.push({block:b, visible: e.visible!==false, wide:w}); }
    else if(mergedU3 && e.visible!==false){ const x = hl.find(y=>y.block===b); if(x) x.visible = true; }
  });
  HOME_BLOCKS.forEach(b=>{ if(!seenB.has(b)) hl.push({block:b,visible:true,wide:!!BLOCK_WIDE_DEFAULT[b]}); });
  s.settings.homeLayout = hl;
  }
  s.settings.monthsFilter = nEnum(rs.monthsFilter,['all','active','archive'],'all');
  s.settings.monthsSort = nEnum(rs.monthsSort,['desc','asc'],'desc');
  s.settings.lastCutoverMonthId = nMonthId(rs.lastCutoverMonthId);
  s.settings.spacesCollapsed = {};
  const rsc = (rs.spacesCollapsed && typeof rs.spacesCollapsed==='object') ? rs.spacesCollapsed : {};
  Object.keys(rsc).forEach(k=>{ if(typeof k==='string' && k) s.settings.spacesCollapsed[k] = !!rsc[k]; });
  s.settings.lastBackupAt = (typeof rs.lastBackupAt==='string' && /^\d{4}-\d{2}-\d{2}/.test(rs.lastBackupAt)) ? rs.lastBackupAt.slice(0,10) : null;
  s.settings.colorBlindMode = !!rs.colorBlindMode;
  /* varReserveToId (N6, SPEC 2.46): Topf für die Rücklage der variablen Kosten.
     Kein/ungültiger Wert → null; die Schnellaktion erscheint dann gar nicht.
     Die Existenz des Kontos prüft varReserveQuickItem (Konten können später
     gelöscht werden — wie bei fromId/toId im Verlauf keine Normalisierung). */
  s.settings.varReserveToId = (typeof rs.varReserveToId==='string' && rs.varReserveToId) ? rs.varReserveToId : null;

  /* workModel */
  const rw = (raw.workModel && typeof raw.workModel==='object') ? raw.workModel : {};
  s.workModel.ratePerWorkday = parseAmount(rw.ratePerWorkday);
  s.workModel.ratePerHour = parseAmount(rw.ratePerHour);
  const rip = (rw.instantPay && typeof rw.instantPay==='object') ? rw.instantPay : {};
  s.workModel.instantPay = { enabled: !!rip.enabled, amountPerShift: parseAmount(rip.amountPerShift) };
  s.workModel.holidayRegion = nStr(rw.holidayRegion,'');
  /* fixedSalary (N17): fehlt der Block komplett — jeder Bestandsstand —, greift
     der Default enabled:false / 0 / 0, und fixedIncomeFor liefert konstant 0.
     Beträge über parseAmount wie überall; das Pensum ist eine Prozentzahl >= 0
     (kein Deckel bei 100: ein 120-%-Pensum ist ungewöhnlich, aber keine
     Datenlüge — die App rechnet, sie bevormundet nicht). */
  const rfs = (rw.fixedSalary && typeof rw.fixedSalary==='object') ? rw.fixedSalary : {};
  s.workModel.fixedSalary = {
    enabled: !!rfs.enabled,
    name: nStr(rfs.name,''),
    fullPensumAmount: Math.max(0, parseAmount(rfs.fullPensumAmount)),
    pensumPercent: Math.max(0, parseAmount(rfs.pensumPercent)),
    /* N18: erster Monat, ab dem die Quelle gilt. nMonthId ist dieselbe Regel
       wie bei goals[].targetDate und taxPlan.dueMonth — alles, was kein
       sauberes 'YYYY-MM' ist (fehlend, '2026-13', 'bald', 0), wird null =
       KEINE Einschränkung, also exakt das N17-Verhalten. */
    startMonthId: nMonthId(rfs.startMonthId),
    payoutDay: nPayoutDay(rfs.payoutDay)
  };

  /* accounts (parentId erst nach dem Aufbau validieren) */
  s.accounts = (Array.isArray(raw.accounts)?raw.accounts:[]).map(a=>{
    a = (a && typeof a==='object') ? a : {};
    return {
      id: nId(a.id),
      name: nStr(a.name,'Konto'),
      bank: nStr(a.bank,''),
      kind: nEnum(a.kind, ACCOUNT_KINDS, 'debit'),
      balance: parseAmount(a.balance),
      emoji: nStr(a.emoji,''),
      showOnHome: a.showOnHome !== false,
      parentId: (typeof a.parentId==='string') ? a.parentId : null
    };
  });
  const accIds = new Set(s.accounts.map(a=>a.id));
  s.accounts.forEach(a=>{
    if(a.kind!=='space'){ a.parentId = null; return; }
    const p = s.accounts.find(x=>x.id===a.parentId);
    if(!p || p.kind==='space') a.parentId = null;
  });

  /* fixedCosts */
  s.fixedCosts = (Array.isArray(raw.fixedCosts)?raw.fixedCosts:[]).map(f=>normalizeFixedItem(f,accIds));

  /* savingsModel */
  const rsm = (raw.savingsModel && typeof raw.savingsModel==='object') ? raw.savingsModel : {};
  s.savingsModel.mode = nEnum(rsm.mode,['fixed','percent'],'fixed');
  s.savingsModel.allocations = (Array.isArray(rsm.allocations)?rsm.allocations:[])
    .filter(a=>a && typeof a==='object' && typeof a.targetId==='string' && accIds.has(a.targetId))
    .map(a=>({targetId:a.targetId, percent:parseAmount(a.percent)}));

  /* months (nur gültige IDs, dedupliziert, aufsteigend sortiert) */
  const seenM = new Set();
  s.months = (Array.isArray(raw.months)?raw.months:[]).map(m=>{
    m = (m && typeof m==='object') ? m : {};
    const id = nMonthId(m.id);
    if(!id || seenM.has(id)) return null;
    seenM.add(id);
    return {
      id,
      name: nStr(m.name, germanMonthName(id)),
      year: Number.isInteger(m.year) ? m.year : parseInt(id.slice(0,4),10),
      status: nEnum(m.status,['plan','curr','done'],'plan'),
      workdays: parseAmount(m.workdays),
      incomeOverride: (m.incomeOverride==null) ? null : parseAmount(m.incomeOverride),
      extraIncome: (Array.isArray(m.extraIncome)?m.extraIncome:[])
        .filter(x=>x && typeof x==='object')
        .map(x=>({desc:nStr(x.desc,''), amount:parseAmount(x.amount)})),
      fixed: (Array.isArray(m.fixed)?m.fixed:[]).map(f=>normalizeFixedItem(f,accIds)),
      variable: (Array.isArray(m.variable)?m.variable:[])
        .filter(x=>x && typeof x==='object')
        .map(x=>({name:nStr(x.name,''), amount:parseAmount(x.amount)})),
      /* N9 (SPEC 2.49): optionale Warnschwelle dieses Monats. null = die globale
         settings.liquidMinimum gilt. Fehlend/kaputt/negativ → null ⇒ alte
         Exporte ohne das Feld verhalten sich exakt wie bisher. */
      liquidMinimum: nOptAmount(m.liquidMinimum),
      /* N17 (SPEC 2.55): Pensum in % NUR dieses Monats. null/fehlend → das
         Standard-Pensum aus workModel.fixedSalary gilt; 0 = dieser Monat ohne
         Festlohn; >0 = abweichendes Pensum (Semesterferien 60 statt 30).
         Dieselbe nOptAmount-Regel wie liquidMinimum (N9) — kaputt/negativ →
         null ⇒ alte Exporte ohne das Feld verhalten sich exakt wie bisher.
         Gelesen wird das Feld AUSSCHLIESSLICH über fixedIncomeFor(). */
      fixedPensum: nOptAmount(m.fixedPensum),
      note: nStr(m.note,'')
    };
  }).filter(Boolean).sort((a,b)=>a.id<b.id?-1:1);

  /* goals */
  s.goals = (Array.isArray(raw.goals)?raw.goals:[]).map(g=>{
    g = (g && typeof g==='object') ? g : {};
    return {
      id: nId(g.id),
      name: nStr(g.name,'Ziel'),
      saved: parseAmount(g.saved),
      target: parseAmount(g.target),
      rateMode: nEnum(g.rateMode,['fixed','percent'],'fixed'),
      rate: parseAmount(g.rate),
      targetDate: nMonthId(g.targetDate),
      accountId: (typeof g.accountId==='string' && accIds.has(g.accountId)) ? g.accountId : null,
      notes: nStr(g.notes,'')
    };
  });

  /* ledger — Historie: Konto-IDs bleiben auch stehen, wenn das Konto gelöscht ist
     (Anzeige löst fehlende IDs als "(gelöschtes Konto)" auf).
     Sonderfall-7-Feld: incomeKind existiert ab Etappe 1 auf jedem 'eingang'. */
  s.ledger = (Array.isArray(raw.ledger)?raw.ledger:[]).map(l=>{
    l = (l && typeof l==='object') ? l : {};
    const type = nEnum(l.type, LEDGER_TYPES, 'anpassung');
    const e = {
      id: nId(l.id),
      type,
      desc: nStr(l.desc,''),
      amount: parseAmount(l.amount),
      fromId: (typeof l.fromId==='string') ? l.fromId : null,
      toId: (typeof l.toId==='string') ? l.toId : null,
      date: nDate(l.date),
      incomeKind: type==='eingang' ? nEnum(l.incomeKind,['lohn','allgemein'],'allgemein') : null,
      /* moneyMonthId (Etappe 6): explizite Geldmonat-Zuordnung eines Eingangs,
         falls sie vom Kalenderdatum abweicht (Instant Pay / Lohn-Auszahlung).
         null → fällt auf das Kalenderdatum zurück.
         N6: zusätzlich auf der Rücklage-Buchung der variablen Kosten
         (source 'varReserve') — sie trägt den Geldmonat, den sie deckt. Am
         Lohntag ist Kalendermonat == Geldmonat, davor NICHT (Sonderfall 8);
         ohne das Feld wäre die Zuordnung schlicht falsch. */
      moneyMonthId: (type==='eingang' || nEnum(l.source, LEDGER_SOURCES, 'manual')==='varReserve') ? nMonthId(l.moneyMonthId) : null,
      /* goalId (SPEC 2.27): Ziel-Kopplung einer Bewegung an einem zielgebundenen
         Konto. Bleibt wie fromId/toId als Historie stehen (applyEntry prüft
         Existenz beim Anwenden). */
      goalId: (typeof l.goalId==='string' && l.goalId) ? l.goalId : null,
      source: nEnum(l.source, LEDGER_SOURCES, 'manual')
    };
    /* countsAsLiving (N12, SPEC 2.51): «zählt diese Buchung zum Leben-Verbrauch?».
       NUR der ausdrückliche Wert false überlebt — alles andere (fehlend, null,
       'nein', 0, true) heisst JA. Zwei Gründe für genau diese Richtung: alle
       Bestandsbuchungen zählen unverändert weiter (keine Migration, kein Anker
       kippt), und der Normalfall bleibt im Export byte-gleich zu vor N12.
       VERBINDLICH: der Schlüssel wird NUR angelegt, wenn er false ist — nie als
       `countsAsLiving: undefined`. Eine Eigenschaft mit dem Wert undefined ist
       eine EIGENE Eigenschaft: deepClone (JSON) wirft sie weg, deepEqual zählt
       Schlüssel, also hielte der Zustand vor und nach einem Klon sich für
       verschieden — die Snapshot-Dedupe (N8) hätte jeden Stand doppelt gesichert.
       Beim Bauen genau so aufgelaufen; als Prüfpunkt festgenagelt.
       Die ANWENDBARKEIT wird hier bewusst NICHT geprüft (also nicht «ist das ein
       Ausgang ab Hauptkonto?»): normalizeState kennt beim Import die endgültige
       Kontenlage nicht sicher, und ein Flag an einer Buchung, für die es
       bedeutungslos ist, schadet nichts — livingEligible erreicht sie ohnehin
       nie. Nur der WERT wird normalisiert, nie die Zuständigkeit. */
    if(l.countsAsLiving===false) e.countsAsLiving = false;
    return e;
  });

  /* quickActionsDone */
  s.quickActionsDone = {};
  const rq = (raw.quickActionsDone && typeof raw.quickActionsDone==='object') ? raw.quickActionsDone : {};
  Object.keys(rq).forEach(k=>{
    const mid = nMonthId(k);
    if(!mid || !rq[k] || typeof rq[k]!=='object') return;
    const inner = {};
    Object.keys(rq[k]).forEach(fid=>{ if(rq[k][fid]) inner[fid]=true; });
    if(Object.keys(inner).length) s.quickActionsDone[mid]=inner;
  });

  /* mainSnapshots (N15, SPEC 2.54): aufgezeichnete Hauptkonto-Monatsstände.
     STRENG: nur echte, endliche Zahlen überleben — bewusst KEIN parseAmount.
     Ein unlesbarer Wert würde damit zu 0.00 und wäre danach ein «aufge-
     zeichneter Stand von null», also eine erfundene Tatsache im Chart. Lieber
     kein Punkt als ein falscher: Müll fliegt raus, der Monat bleibt leer.
     0 und negative Werte sind gültig (ein Hauptkonto darf leer/negativ sein). */
  s.mainSnapshots = {};
  const rmsRaw = (raw.mainSnapshots && typeof raw.mainSnapshots==='object' && !Array.isArray(raw.mainSnapshots)) ? raw.mainSnapshots : {};
  Object.keys(rmsRaw).forEach(k=>{
    const mid = nMonthId(k);
    const v = rmsRaw[k];
    if(mid && typeof v==='number' && isFinite(v)) s.mainSnapshots[mid] = round2(v);
  });

  /* feedback */
  s.feedback = (Array.isArray(raw.feedback)?raw.feedback:[]).map(f=>{
    f = (f && typeof f==='object') ? f : {};
    return { id:nId(f.id), date:nDate(f.date), text:nStr(f.text,''), status:nEnum(f.status,['open','done'],'open') };
  });

  /* todos (E3 / SPEC 2.33): To-Dos/Game-Plan. seen:false = «neu» (frisch aus
     Import), bis in der App gesehen. Abgrenzung: claudeProposals = konkrete
     Geldbewegungen (buchen), todos = Aufgaben zum Abhaken (KEINE Buchung). */
  s.todos = (Array.isArray(raw.todos)?raw.todos:[]).map(t=>{
    t = (t && typeof t==='object') ? t : {};
    return {
      id: nId(t.id),
      createdAt: nDate(t.createdAt),
      title: nStr(t.title,'To-Do'),
      detail: nStr(t.detail,''),
      status: nEnum(t.status,['open','done'],'open'),
      priority: nEnum(t.priority,['normal','high'],'normal'),
      category: (typeof t.category==='string' && t.category.trim()!=='') ? t.category.trim() : null,
      monthId: nMonthId(t.monthId),
      source: nEnum(t.source,TODO_SOURCES,'manual'),
      doneAt: (typeof t.doneAt==='string' && /^\d{4}-\d{2}-\d{2}/.test(t.doneAt)) ? t.doneAt.slice(0,10) : null,
      /* showFrom (N4, SPEC 2.33): Erscheinungsdatum. null = sofort sichtbar —
         fehlendes/kaputtes Feld → null, alte Exporte laufen unverändert durch
         (bewusst NICHT nDate: das würde auf heute defaulten). */
      showFrom: (typeof t.showFrom==='string' && /^\d{4}-\d{2}-\d{2}/.test(t.showFrom)) ? t.showFrom.slice(0,10) : null,
      seen: t.seen===false ? false : true
    };
  });
  /* actionPlan → todos (Sonderfall 21): der frühere Aktionsplan-Block wird
     einmalig überführt — stabile ids 'ap_'+alteId machen das idempotent
     (Re-Import alter Exporte dupliziert nie). */
  (Array.isArray(raw.actionPlan)?raw.actionPlan:[]).forEach(p=>{
    if(!p || typeof p!=='object') return;
    const id = 'ap_'+nId(p.id);
    if(s.todos.some(t=>t.id===id)) return;
    s.todos.push({ id, createdAt:today(), title:nStr(p.text,'To-Do'), detail:'',
      status:nEnum(p.status,['open','done'],'open'), priority:'normal', category:null,
      monthId:null, source:'manual', doneAt:null, showFrom:null, seen:true });
  });

  /* plannedReserves (N20, SPEC 2.57): geplante Rücklagen. Eigenes Top-Level-
     Array, NICHT geschützt — Merge über id wie todos/goals.
     ROBUST, aber ohne etwas wegzuwerfen: ein Eintrag mit kaputtem Monat, ohne
     Zielkonto oder mit Betrag <= 0 BLEIBT stehen (er ist eine Planung, keine
     Buchung) — er erzeugt dann nur keine Aktion. Das ist dieselbe Haltung wie
     bei settings.varReserveToId === null: lieber ruhig nichts tun als raten.
     toId wird gegen accIds geprüft — exakt die Regel von months[].fixed
     (normalizeFixedItem): ein Kurz-JSON OHNE accounts-Block hat keine gültigen
     Konto-IDs, also normalisiert toId auf null (dokumentierte Folge, 2.57). */
  s.plannedReserves = (Array.isArray(raw.plannedReserves)?raw.plannedReserves:[]).map(r=>{
    r = (r && typeof r==='object' && !Array.isArray(r)) ? r : {};
    return {
      id: nId(r.id),
      name: nStr(r.name,'Rücklage'),
      amount: parseAmount(r.amount),
      toId: (typeof r.toId==='string' && accIds.has(r.toId)) ? r.toId : null,
      executeMonthId: nMonthId(r.executeMonthId),
      needMonthId: nMonthId(r.needMonthId),
      status: nEnum(r.status,['planned','reserved','done'],'planned'),
      note: nStr(r.note,'')
    };
  });

  /* claudeProposals (Etappe 6): Import-Inbox. Wird NIE automatisch angewendet —
     nur normalisiert und für den Nutzer sichtbar gemacht. */
  s.claudeProposals = (Array.isArray(raw.claudeProposals)?raw.claudeProposals:[]).map(p=>{
    p = (p && typeof p==='object') ? p : {};
    const actions = (Array.isArray(p.actions)?p.actions:[])
      .filter(a=>a && typeof a==='object' && PROPOSAL_ACTION_KINDS.includes(a.kind))
      .map(a=>{
        const base = { kind:a.kind, desc:nStr(a.desc,'') };
        /* goalId (SPEC 2.27): Ziel-Angabe für Aktionen an zielgebundenen Konten. */
        const goalId = (typeof a.goalId==='string' && a.goalId) ? a.goalId : null;
        if(a.kind==='transfer') return Object.assign(base,{ fromId:(typeof a.fromId==='string'?a.fromId:null), toId:(typeof a.toId==='string'?a.toId:null), amount:parseAmount(a.amount), goalId });
        if(a.kind==='setBalance') return Object.assign(base,{ accountId:(typeof a.accountId==='string'?a.accountId:null), amount:parseAmount(a.amount), goalId });
        if(a.kind==='setField') return Object.assign(base,{ path:nStr(a.path,''), value:a.value });
        return Object.assign(base,{ text:nStr(a.text,'') }); /* note */
      });
    return { id:nId(p.id), date:nDate(p.date), title:nStr(p.title,'Vorschlag'), rationale:nStr(p.rationale,''),
      priority:nEnum(p.priority,['normal','high'],'normal'), actions,
      status:nEnum(p.status,['open','accepted','dismissed'],'open') };
  });

  /* taxPlan (E9): dynamische Steuer-Rücklage. reserveToId/fromId nur, wenn Konto existiert. */
  const rtp = (raw.taxPlan && typeof raw.taxPlan==='object') ? raw.taxPlan : {};
  s.taxPlan = {
    enabled: !!rtp.enabled,
    amount: parseAmount(rtp.amount),
    dueMonth: nMonthId(rtp.dueMonth),
    reserveToId: (typeof rtp.reserveToId==='string' && accIds.has(rtp.reserveToId)) ? rtp.reserveToId : null,
    fromId: (typeof rtp.fromId==='string' && accIds.has(rtp.fromId)) ? rtp.fromId : null,
    reserved: parseAmount(rtp.reserved)
  };

  return s;
}

/* ─────────── Format-Erkennung + Migrations-Kette ─────────── */
function detectFormat(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return 'unknown';
  if(typeof raw.schemaVersion==='number' && raw.schemaVersion>=1) return 'v1';
  if(raw.monate || raw.spaces || raw.fixTemplate || raw.bookings || ('liquide' in raw)) return 'flat-v0';
  if(raw.settings || raw.accounts || raw.months) return 'v1';
  return 'unknown';
}

/* Ur-App-Flachformat → v1.
   Das alte Format riet Konto-Zuordnungen zur Laufzeit über Schlüsselwörter.
   Die Migration übersetzt diese Semantik EINMALIG in explizite Verknüpfungen
   (kind/fromId/toId) — danach wird nie mehr über Namen geraten (SPEC 2.8). */
function migrateFlatV0(old){
  old = (old && typeof old==='object') ? old : {};
  const ids = {};
  const accounts = [];
  function mk(key,name,bank,kind,balance,emoji,showOnHome,parentId){
    const id = 'mig_'+key;
    ids[key]=id;
    accounts.push({id,name,bank,kind,balance:parseAmount(balance),emoji,showOnHome,parentId:parentId||null});
    return id;
  }
  const mainId = mk('liquide','Hauptkonto','','main', old.liquide!=null?old.liquide:0,'💳',true,null);
  if(old.ubs_cash!=null)      mk('ubs_cash','UBS Cash','UBS','debit', old.ubs_cash,'🏦',true,null);
  /* Alt: ubs_kk positiv = Schuld → v1 führt Kreditkarten-Schulden als NEGATIVEN balance */
  if(old.ubs_kk!=null)        mk('ubs_kk','UBS Kreditkarte','UBS','creditcard', -parseAmount(old.ubs_kk),'💳',true,null);
  if(old.ubs_sparkonto!=null) mk('ubs_sparkonto','UBS Sparkonto','UBS','savings', old.ubs_sparkonto,'🌱',false,null);
  const spaceNames = {miete:'Miete',date:'Date',reisen:'Reisen',sonstiges:'Sonstiges',longterm:'Longterm'};
  Object.keys(old.spaces||{}).forEach(k=>{
    const nm = spaceNames[k] || (k.charAt(0).toUpperCase()+k.slice(1));
    mk('sp_'+k, nm, '', 'space', old.spaces[k], '', false, mainId);
  });

  function deriveLink(name){
    const key = String(name||'').toLowerCase();
    if(key.includes('leben')) return {kind:'none',fromId:null,toId:null};
    const rules = [
      [['spar','longterm'],'sp_longterm'], [['steuer','sonstig'],'sp_sonstiges'],
      [['reise'],'sp_reisen'], [['date'],'sp_date'], [['miete'],'sp_miete'], [['notfall'],'ubs_cash']
    ];
    for(const [kws,target] of rules){
      if(kws.some(k=>key.includes(k)) && ids[target]) return {kind:'transfer',fromId:mainId,toId:ids[target]};
    }
    return {kind:'debit',fromId:mainId,toId:null};
  }

  const fixedCosts = (Array.isArray(old.fixTemplate)?old.fixTemplate:[]).map((f,i)=>{
    const link = deriveLink(f.n||f.name);
    return { id:'mig_fx_'+i, name:f.n||f.name||'Posten', emoji:f.e||'', amount:parseAmount(f.b!=null?f.b:f.amount),
      kind:link.kind, fromId:link.fromId, toId:link.toId, recurrence:'monthly', dueMonth:null, reserveToId:null };
  });

  const nowY = new Date().getFullYear();
  function flatMonthId(m,yr){
    if(typeof m==='string' && /^\d{4}-\d{2}$/.test(m)) return m;
    const y = Number.isInteger(yr) ? yr : nowY;
    const i = MONTHS_DE.indexOf(m);
    if(i>=0) return y+'-'+pad2(i+1);
    const n = parseInt(m,10);
    if(n>=1 && n<=12) return y+'-'+pad2(n);
    return null;
  }
  const months = (Array.isArray(old.monate)?old.monate:[]).map(mo=>{
    mo = (mo && typeof mo==='object') ? mo : {};
    const id = flatMonthId(mo.m, mo.yr);
    if(!id) return null;
    const status = ({done:'done',curr:'curr',aktuell:'curr',plan:'plan'})[mo.st] || 'plan';
    const fixed = (Array.isArray(mo.fix)?mo.fix:[]).map((f,i)=>{
      const link = deriveLink(f.n||f.name);
      return { id:'mig_m'+id+'_f'+i, name:f.n||f.name||'Posten', emoji:f.e||'', amount:parseAmount(f.b!=null?f.b:f.amount),
        kind:link.kind, fromId:link.fromId, toId:link.toId, recurrence:'monthly', dueMonth:null, reserveToId:null };
    });
    /* sp = geplante Schichten, sa = absolvierte → workdays je nach Status */
    const workdays = status==='plan' ? (mo.sp!=null?mo.sp:(mo.sa||0)) : (mo.sa!=null?mo.sa:(mo.sp||0));
    const lohn = parseAmount(mo.l);
    return {
      id, name: MONTHS_DE.includes(mo.m) ? mo.m : germanMonthName(id),
      year: Number.isInteger(mo.yr) ? mo.yr : parseInt(id.slice(0,4),10),
      status, workdays: parseAmount(workdays),
      incomeOverride: lohn>0 ? lohn : null, /* alter 'l'-Wert = eingetragener Lohn → Override */
      extraIncome: [],
      fixedPensum: null,   /* N17: die Ur-App kannte keinen Festlohn → Standard-Pensum */
      fixed,
      variable: (Array.isArray(mo.vr)?mo.vr:[]).map(v=>({name:v.n||v.name||'', amount:parseAmount(v.b!=null?v.b:v.amount)})),
      note: mo.nt||mo.note||''
    };
  }).filter(Boolean);

  const mapAcc = k=>{
    if(typeof k!=='string' || !k) return null;
    if(ids[k]) return ids[k];
    const base = k.replace(/_pay$/,'');
    return ids[base] || null;
  };
  const ledger = (Array.isArray(old.bookings)?old.bookings:[]).map(b=>{
    b = (b && typeof b==='object') ? b : {};
    const type = LEDGER_TYPES.includes(b.type) ? b.type : 'anpassung';
    const date = nDate(b.date);
    let incomeKind = null;
    if(type==='eingang'){
      /* Sonderfall 7 (SPEC Abschnitt 5.7), Datenanlage schon in Etappe 1:
         Ein Lohn-Eingang zählt als 'allgemein', wenn der Zielmonat bereits
         einen Lohn-Override hat — sonst würde der Lohn doppelt gezählt. */
      const mo = months.find(m=>m.id===date.slice(0,7));
      const isLohn = /lohn/i.test(b.desc||'');
      incomeKind = (isLohn && !(mo && mo.incomeOverride!=null)) ? 'lohn' : 'allgemein';
    }
    return { id:b.id||uid(), type, desc:b.desc||'', amount:parseAmount(b.amt!=null?b.amt:b.amount),
      fromId:mapAcc(b.from), toId:mapAcc(b.to), date, incomeKind, source:'manual' };
  });

  /* Erledigt-Häkchen: alte Keyword-IDs bestmöglich auf die migrierten Monats-Posten mappen */
  const qad = {};
  const roots = {sparpln:'spar', steuern:'steuer', reisen:'reise', notfall:'notfall', date:'date', miete:'miete'};
  Object.keys(old.qa_done||{}).forEach(mName=>{
    const mo = months.find(m=>m.name===mName);
    if(!mo) return;
    const inner = {};
    Object.keys(old.qa_done[mName]||{}).forEach(oldId=>{
      const root = roots[oldId] || String(oldId).replace(/^ab_/,'').replace(/_\d+$/,'');
      const item = mo.fixed.find(f=>f.name.toLowerCase().includes(root));
      if(item) inner[item.id]=true;
    });
    if(Object.keys(inner).length) qad[mo.id]=inner;
  });

  const goals = (Array.isArray(old.goals)?old.goals:[]).map((g,i)=>({
    id:'mig_goal_'+i, name:g.n||g.name||'Ziel',
    saved:parseAmount(g.a), target:parseAmount(g.z),
    rateMode:'fixed', rate:parseAmount(g.s),
    targetDate:nMonthId(g.dt), accountId: ids['sp_longterm']||mainId, notes:g.notes||''
  }));

  const sortedIds = months.map(m=>m.id).sort();
  const curr = months.find(m=>m.status==='curr');
  return {
    schemaVersion: SCHEMA_VERSION,
    setupComplete: true,
    settings: {
      theme:'dark', currency:'CHF', profileName:'',
      currentMonthId: curr ? curr.id : (sortedIds[sortedIds.length-1]||nowMonthId()),
      ytdStartMonthId: sortedIds[0]||nowMonthId(),
      liquidMinimum: 600,
      homeLayout: HOME_BLOCKS.map(b=>({block:b,visible:true,wide:!!BLOCK_WIDE_DEFAULT[b]}))
    },
    workModel: { ratePerWorkday:0, ratePerHour:0, instantPay:{enabled:false,amountPerShift:0}, holidayRegion:'',
      fixedSalary:{ enabled:false, name:'', fullPensumAmount:0, pensumPercent:0,
                    startMonthId:null, payoutDay:PAYOUT_DAY_DEFAULT } },
    accounts, fixedCosts,
    savingsModel: {mode:'fixed', allocations:[]},
    months, goals, ledger,
    quickActionsDone: qad,
    feedback: []
  };
}

function migrateToV1(raw){
  const format = detectFormat(raw);
  if(format==='unknown') throw new Error('Unbekanntes Datenformat — kein Kontoblatt-/SPEC-Export und kein bekanntes Altformat.');
  let st = raw;
  if(format==='flat-v0') st = migrateFlatV0(raw);
  /* Migrations-Kette für künftige Versionen: v1→v2→… hier anhängen */
  return { state: normalizeState(st), format };
}

/* ─────────── Import = Merge, nie blind überschreiben (SPEC Abschnitt 3) ─────────── */
/* N4 (Sonderfall 23): fehlender Block ≠ geänderter Block. Kurz-JSONs (nur
   months/todos/claudeProposals) sind der Normalfall — normalizeState füllt die
   fehlenden Blöcke mit Standardwerten, was ohne diese Prüfung als «Abweichung»
   erschiene und mit Haken die echten Stände (inkl. taxPlan.reserved) mit
   Standardwerten überschriebe. Darum: an der ROHEN JSON merken, was drin ist. */
const SETTINGS_BLOCKS = ['settings','workModel','savingsModel','taxPlan'];
function presentSettingsBlocks(raw){
  const p = {};
  const ok = raw && typeof raw==='object' && !Array.isArray(raw);
  SETTINGS_BLOCKS.forEach(k=>{
    p[k] = !!(ok && raw[k] && typeof raw[k]==='object' && !Array.isArray(raw[k]));
  });
  return p;
}
function anySettingsBlock(p){ return SETTINGS_BLOCKS.some(k=>p[k]); }
/* U2.2 (Sonderfall 23): opts.adoptSettings — Default true (bisheriges Verhalten,
   alle bestehenden Aufrufer unverändert). Bei false bleiben die lokalen Blöcke
   settings/workModel/savingsModel/taxPlan stehen (inkl. taxPlan.reserved!);
   der Daten-Merge (Collections, todos, ledger, quickActionsDone) läuft identisch. */
function mergeStates(localRaw, incomingRaw, opts){
  const adoptSettings = !opts || opts.adoptSettings!==false;
  const local = normalizeState(localRaw);
  const inc = normalizeState(incomingRaw);
  const out = deepClone(local);
  const summary = { collections:[], ledger:{neu:0,dupl:0}, settingsChanged:false };

  function mergeColl(key,label){
    const loc = out[key];
    let neu=0, akt=0;
    inc[key].forEach(item=>{
      const i = loc.findIndex(x=>x.id===item.id);
      if(i<0){ loc.push(deepClone(item)); neu++; }
      else if(!deepEqual(loc[i],item)){ loc[i]=deepClone(item); akt++; }
    });
    const beh = local[key].filter(x=>!inc[key].some(y=>y.id===x.id)).length;
    summary.collections.push({key,label,neu,akt,beh});
  }
  mergeColl('accounts','Konten');
  mergeColl('fixedCosts','Fixkosten');
  mergeColl('months','Monate');
  mergeColl('goals','Ziele');
  mergeColl('feedback','Feedback');
  /* N20 (SPEC 2.57): geplante Rücklagen sind KEIN geschützter Block — sie
     mergen über id wie goals/feedback, damit im Chat geplant werden kann.
     Bewusst kein Status-Schutz wie bei todos (Sonderfall 19): der Lebenszyklus
     planned→reserved→done hängt hier am Geld (die Buchung im Verlauf), nicht an
     einem Häkchen; wer die Rücklage importiert, importiert ihren Plan. */
  mergeColl('plannedReserves','Geplante Rücklagen');
  mergeColl('claudeProposals','Vorschläge von Claude');

  /* todos (SPEC 2.33 / Sonderfall 19): eigener Merge mit Status-Schutz —
     mein erledigt-Status gewinnt IMMER, neue kommen als «neu» (seen:false),
     system-todos werden nie importiert (lokaler Sync besitzt sie). */
  {
    let neu=0, akt=0;
    inc.todos.forEach(item=>{
      if(item.source==='system') return;
      const mine = out.todos.find(x=>x.id===item.id);
      if(!mine){
        const t = deepClone(item); t.seen = false;
        out.todos.push(t); neu++;
        return;
      }
      const upd = deepClone(item);
      if(mine.status==='done'){ upd.status='done'; upd.doneAt=mine.doneAt; }
      upd.seen = mine.seen;
      if(!deepEqual(mine,upd)){ Object.assign(mine,upd); akt++; }
    });
    const beh = local.todos.filter(x=>!inc.todos.some(y=>y.id===x.id)).length;
    summary.collections.push({key:'todos',label:'To-Dos',neu,akt,beh});
  }

  /* Verlauf vereinigen + deduplizieren (über ID, ersatzweise inhaltliche Signatur) */
  const sig = l => l.id + '§' + [l.type,l.desc,l.amount,l.date,l.fromId,l.toId].join('|');
  const seen = new Set(out.ledger.map(sig));
  const seenContent = new Set(out.ledger.map(l=>[l.type,l.desc,l.amount,l.date,l.fromId,l.toId].join('|')));
  inc.ledger.forEach(l=>{
    const c = [l.type,l.desc,l.amount,l.date,l.fromId,l.toId].join('|');
    if(seen.has(sig(l)) || (out.ledger.every(x=>x.id!==l.id) && seenContent.has(c))){ summary.ledger.dupl++; return; }
    if(out.ledger.some(x=>x.id===l.id)){ summary.ledger.dupl++; return; }
    seen.add(sig(l)); seenContent.add(c);
    const e = deepClone(l);
    /* Sonderfall 7 (SPEC 5.7): ein importierter "Eingang: Lohn" zählt als
       "Allgemein", wenn der Zielmonat bereits einen Lohn-Override hat —
       sonst würde der Lohn doppelt gezählt. Monate sind hier schon gemergt. */
    if(e.type==='eingang' && e.incomeKind==='lohn'){
      const mo = out.months.find(m=>m.id===ledgerMoneyMonth(e));
      if(mo && mo.incomeOverride!=null) e.incomeKind='allgemein';
    }
    out.ledger.push(e);
    summary.ledger.neu++;
  });

  Object.keys(inc.quickActionsDone).forEach(mid=>{
    out.quickActionsDone[mid] = Object.assign({}, out.quickActionsDone[mid]||{}, inc.quickActionsDone[mid]);
  });

  /* mainSnapshots (N15, SPEC 2.54 / Sonderfall 28): anders als quickActionsDone
     gewinnt hier LOKAL. Ein aufgezeichneter Monatsstand ist eine Beobachtung
     dieses Geräts zum Zeitpunkt des Cutovers — ein Import darf sie nicht
     überschreiben, sonst wäre «nie überschreiben» durch die Hintertür verletzt.
     Der Import füllt nur LÜCKEN: frisches Gerät, wiederhergestelltes Backup,
     zweites Gerät mit eigener Historie. Läuft unabhängig von adoptSettings —
     mainSnapshots sind Daten, kein Einstellungs-Block. */
  Object.keys(inc.mainSnapshots).forEach(mid=>{
    if(!Object.prototype.hasOwnProperty.call(out.mainSnapshots, mid)) out.mainSnapshots[mid] = inc.mainSnapshots[mid];
  });

  /* N4 (Sonderfall 23): nur Blöcke übernehmen, die der Import WIRKLICH mitbringt.
     Präsenz an der rohen incomingRaw (vor der Normalisierung); opts.presentBlocks
     überschreibt sie dort, wo der Aufrufer bereits normalisiert hat (Import-Flow:
     migrateToV1 liefert immer alle vier). Vollständige Exporte → alle Blöcke
     präsent → Verhalten exakt wie bisher. */
  const present = (opts && opts.presentBlocks) ? opts.presentBlocks : presentSettingsBlocks(incomingRaw);
  if(adoptSettings){
    SETTINGS_BLOCKS.forEach(k=>{
      if(!present[k]) return;   /* fehlender Block wird NIE übernommen, auch nicht mit Haken */
      if(!deepEqual(out[k], inc[k])){ out[k]=deepClone(inc[k]); summary.settingsChanged=true; }
    });
  }
  out.setupComplete = local.setupComplete || inc.setupComplete;
  out.schemaVersion = SCHEMA_VERSION;
  return { merged: normalizeState(out), summary };
}

/* U2.2 (Sonderfall 23): konkrete Import-Vorschau — listet die ECHTEN Abweichungen
   der Blöcke settings/workModel/savingsModel/taxPlan zwischen lokalem Stand und
   Import einzeln auf (pur, nimmt zwei normalisierte States, gibt String-Zeilen). */
/* N4: drittes optionales Argument `present` (aus presentSettingsBlocks) — ein im
   Import fehlender Block liefert KEINE Diff-Zeilen (er wird ja auch nicht
   übernommen; Standardwerte als «Abweichung» zu melden wäre eine Erfindung).
   Ohne das Argument: alle vier Blöcke gelten als vorhanden = Verhalten wie bisher. */
function settingsDiff(local, inc, present){
  const p = present || {settings:true, workModel:true, savingsModel:true, taxPlan:true};
  const lines = [];
  const themeLbl = t => t==='dark' ? 'dunkel' : 'hell';
  const onOff = b => b ? 'AN' : 'AUS';
  if(p.settings){
  const ls = local.settings, is = inc.settings;
  if(ls.liquidMinimum !== is.liquidMinimum) lines.push(`Warnschwelle ${fmtAmt(ls.liquidMinimum)} → ${fmtAmt(is.liquidMinimum)}`);
  if(ls.theme !== is.theme) lines.push(`Theme ${themeLbl(ls.theme)} → ${themeLbl(is.theme)}`);
  if(ls.currency !== is.currency) lines.push(`Währung ${ls.currency} → ${is.currency}`);
  if(ls.profileName !== is.profileName) lines.push(`Profilname «${ls.profileName||'—'}» → «${is.profileName||'—'}»`);
  if(!deepEqual(ls.homeLayout, is.homeLayout)) lines.push('Home-Layout wird ersetzt');
  if(ls.colorBlindMode !== is.colorBlindMode) lines.push(`Farbschwäche-Modus ${onOff(ls.colorBlindMode)} → ${onOff(is.colorBlindMode)}`);
  if(ls.varReserveToId !== is.varReserveToId) lines.push(`Topf für variable Kosten ${ls.varReserveToId?'«'+accName(local,ls.varReserveToId)+'»':'nicht eingerichtet'} → ${is.varReserveToId?'«'+accName(inc,is.varReserveToId)+'»':'nicht eingerichtet'}`);
  const handled = ['liquidMinimum','theme','currency','profileName','homeLayout','colorBlindMode','varReserveToId'];
  const rest = Object.keys(ls).filter(k=>!handled.includes(k) && !deepEqual(ls[k], is[k]));
  if(rest.length) lines.push('Weitere Einstellungen: '+rest.join(', '));
  }
  if(p.workModel){
  const lw = local.workModel, iw = inc.workModel;
  if(lw.ratePerWorkday !== iw.ratePerWorkday) lines.push(`Lohn pro Arbeitstag ${fmtAmt(lw.ratePerWorkday)} → ${fmtAmt(iw.ratePerWorkday)}`);
  if(lw.ratePerHour !== iw.ratePerHour) lines.push(`Stundenlohn ${fmtAmt(lw.ratePerHour)} → ${fmtAmt(iw.ratePerHour)}`);
