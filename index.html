     die Rücklage steht mit demselben Titel auch hier in der Herkunft. */
  const rows = r.items.map(i=>`<div class="row"><div class="rl"><span class="emoji">${esc(i.emoji)||'▪︎'}</span>
      <div style="min-width:0"><div class="rname"${i.plannedReserve?' style="white-space:normal"':''}>${esc(i.name)}</div><div class="rsub${i.plannedReserve?' potline':''}">${esc(qaSubLabel(i))}${i.yearlyAmount?' · '+fmtAmt(i.yearlyAmount)+'/Jahr':''}</div></div></div>

    ${r.min>0?`<div class="row"><div class="rl"><div><div class="rname">Warnschwelle</div>
      <div class="rsub">Notlinie dieses Monats — so viel soll liegen bleiben</div></div></div>
      <div class="num amt">−${fmtAmt(r.min)}</div></div>
    <div class="row"><div class="rl"><div><div class="rname">Frei bis Minimum</div>
      <div class="rsub">${r.free>=0?'Was insgesamt noch weg darf — «Leben» eingeschlossen, weil es oben nicht projiziert ist':'Die Schwelle ist bereits unterschritten'}</div></div></div>
      <div class="num amt ${r.free<0?'neg':'pos'}">${fmtMoney(r.free)}</div></div>`:''}

/* N11 — Herkunft von «Frei pro Tag» (SPEC 2.32). Bis N10 zeigte die Kennzahl aufs

      <div><div class="rname">${esc(f.name)}</div><div class="rsub">Fix-Posten ohne Verknüpfung</div></div></div>
    <div class="num amt">${fmtAmt(fixAmount(f))}</div></div>`).join('');

    .map(l=>`<div class="row"><div class="rl"><div><div class="rname">${esc(l.desc||'Ausgabe')}</div>
      <div class="rsub">${esc(l.date)}${l.type==='anpassung'?' · Saldo-Anpassung':''}</div></div></div>

    ${budgetRows || '<div class="row hint">Kein Fix-Posten ohne Verknüpfung in diesem Monat — ohne Budget kann die Kennzahl nichts sagen.</div>'}

    ${spentRows || '<div class="row hint">Noch keine Alltags-Ausgabe in diesem Geldmonat.</div>'}
    ${sp.entries.length>12?`<div class="row hint">… und ${sp.entries.length-12} weitere</div>`:''}
    <div class="row"><div class="rname">Verbraucht</div><div class="num amt neg">−${fmtMoney(db.spent)}</div></div>
    <div class="row"><div class="rname">Übrig</div><div class="num amt ${db.left<0?'neg':'pos'}">${fmtMoney(db.left)}</div></div>
    <div class="row"><div class="rname">${db.days!=null&&db.days>0?'÷ '+db.days+' Tage bis Lohn':'Tage bis Lohn'}</div>
      <div class="num amt ${db.warn?'neg':''}">${db.perDay!=null?'~'+fmtMoney(db.perDay):'—'}</div></div>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
/* ─────────── «Heute zu tun» (U3.2) — EIN Aufgaben-Block ───────────
   Führt die früheren Blöcke «Schnellaktionen» und «To-Dos» plus Backup-Nudge
   und «Kommt bald» zusammen, sortiert nach Dringlichkeit:
   (0) Auto-Lohn-Karte (zeitkritisch) → (1) KK/Engpass-Kritisches lebt im
   Status-Band (De-Dup U3.3, hier bewusst leer) → (2) fällige Jahres-/Steuer-
   rechnungen → (3) offene Schnellaktionen → (4) offene To-Dos (nach De-Dup) →
   (5) Backup-Nudge → (6) «Kommt bald» (reine Info).
   NUR Orchestrierung: jede Zeile ruft AUSSCHLIESSLICH ihre bestehende Funktion
   (doQuickAction→executeQuickAction, doAllQuickActions, confirmPayDue,
   confirmPayTax, toggleTodo, runSysTodoAction, quickBackup) — keine neue
   Rechen- oder Buchungslogik. Titel-Zähler = todayOpenCount (identisch zum
   Seitenleisten-Panel; zählt nur hier sichtbare offene Zeilen). */
function blockToday(){
  const monthId = S.settings.currentMonthId;
  const hasMonth = !!monthById(S,monthId);
  const qa = hasMonth ? quickActionsFor(S,monthId) : {open:[],total:0,doneCount:0};
  const dues = hasMonth ? yearlyDueFor(S,monthId) : [];
  const taxDue = hasMonth ? taxDueFor(S) : null;
  const w = autoSalaryWindow(S, today());
  const fw = fixedSalaryWindow(S, today());
  const nOpen = todayOpenCount(S), nNew = todayNewCount(S);
  /* (0) Auto-Lohn zuoberst: erscheint im 2-Tage-Fenster vor dem Lohntag (SPEC 2.20) */
  const autoCard = w ? `<div class="card" style="border-color:var(--acc);margin-bottom:12px">
      <div style="font-weight:750;font-size:15px">Lohn eingegangen? · ${esc(monthLabel(w.targetId))}</div>
      <div class="rsub" style="margin-top:2px">Lohntag ${fmtDate(w.payday)}${w.daysUntil>0?' · in '+w.daysUntil+' Tag'+(w.daysUntil>1?'en':''):(w.daysUntil===0?' · heute':'')}. ${w.instant>0?'Instant Pay bereits '+fmtAmt(w.instant)+' — gebucht wird nur die Restauszahlung.':'Gesamtlohn eintragen und buchen.'}</div>
      <div style="display:flex;gap:10px;margin-top:var(--sp2)">
        <button class="btn btn-acc" style="flex:1;margin-top:0" onclick="startAssistant()">Monat starten</button>
        <button class="btn btn-ghost" style="flex:1;margin-top:0" onclick="openAutoSalary()">Nur Lohn buchen</button>
      </div>
    </div>` : '';
  /* (1) N19: Festlohn — die ZWEITE Lohnquelle kommt an ihrem eigenen Tag und
     wird nie automatisch gebucht (Sonderfall 29). Die Karte steht direkt unter
     der Auto-Lohn-Karte, weil beide dieselbe Frage stellen («ist das Geld da?»),
     und ist bewusst als eigene Karte getrennt: eine gemeinsame Karte würde
     genau die Vermischung nahelegen, die 2.55 verhindert. */
  const fixCard = fw ? `<div class="card" style="border-color:var(--acc);margin-bottom:12px">
      <div style="font-weight:750;font-size:15px">Festlohn eingegangen?${fw.name?' «'+esc(fw.name)+'»':''} · ${esc(monthLabel(fw.targetId))}</div>
      <div class="rsub potline" style="margin-top:2px">Erwartet ${fmtDate(fw.due)}${fw.overdue
        ? ' · <b>noch nicht gebucht</b>'
        : (fw.daysUntil>0 ? ' · in '+fw.daysUntil+' Tag'+(fw.daysUntil>1?'en':'') : ' · heute')} · geplant ${fmtAmt(fw.plan)}.
        Datum und Betrag stellst du beim Buchen selbst ein — der Eingang muss nicht auf den Zahltag fallen.</div>
      <button class="btn btn-acc" onclick="openFixedSalary()">Festlohn buchen · ${fmtAmt(fw.plan)}</button>
    </div>` : '';
  /* (2) Fällige Jahres-/Steuerrechnungen — Einzel-Bestätigung bleibt */
  const dueRows = dues.map(d=>`<div class="row"><div class="rl"><span class="emoji">${esc(d.emoji)||'▪︎'}</span>
      <div><div class="rname">${esc(d.name)} · Jahresrechnung</div>
      <div class="rsub">fällig — aus «${esc(accName(S,d.payFromId))}» begleichen · belastet den Rest nicht</div></div></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="num amt">${fmtAmt(d.amount)}</span>
      <button class="qcheck" aria-label="Begleichen" onclick="confirmPayDue('${d.fixedId}')"></button></div>
  </div>`).join('');
  const taxRow = taxDue ? `<div class="row"><div class="rl"><span class="emoji">${esc(taxDue.emoji)||'📋'}</span>
      <div><div class="rname">${esc(taxDue.name)} · Jahresrechnung</div>
      <div class="rsub">fällig — aus «${esc(accName(S,taxDue.payFromId))}» begleichen · belastet den Rest nicht</div></div></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="num amt">${fmtAmt(taxDue.amount)}</span>
      <button class="qcheck" aria-label="Steuern begleichen" onclick="confirmPayTax()"></button></div></div>` : '';
  const anyDue = dueRows + taxRow;
  /* (3) Schnellaktionen */
  const pct = qa.total ? Math.round(qa.doneCount/qa.total*100) : 0;
  /* N20: `min-width:0` am Text-Wrapper — ohne das kann das text-overflow:ellipsis
     von `.rname` nie greifen (der Flex-Kasten schrumpft nicht unter seine
     Inhaltsbreite) und ein langer Titel läuft über den Betrag. Latenter
     Bestandsdefekt, den erst der längere Titel «Zurücklegen: …» sichtbar
     gemacht hat; bei allen bisherigen (kurzen) Namen ändert sich nichts.
     Die Rücklage-Zeile darf zusätzlich UMBRECHEN statt zu kappen (Muster
     todayTodoRow) — der Name ist hier die Identität, nicht Beiwerk. */
  const qaRows = qa.open.map(i=>`<div class="row"><div class="rl"><span class="emoji">${esc(i.emoji)||'▪︎'}</span>
      <div style="min-width:0"><div class="rname"${i.plannedReserve?' style="white-space:normal"':''}>${esc(i.name)}</div>
      <div class="rsub${i.plannedReserve?' potline':''}">${esc(qaSubLabel(i))}${i.yearlyAmount?' · '+fmtAmt(i.yearlyAmount)+'/Jahr':''}</div></div></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="num amt">${fmtAmt(i.amount)}</span>
      <button class="qcheck" aria-label="Erledigen" onclick="doQuickAction('${i.fixedId}')"></button></div>
  </div>`).join('');
  const ipLink = mainAccount(S) ? `<button class="linkbtn" onclick="openInstantPay()">＋ Instant Pay (Lohn-Vorschuss) erfassen</button>` : '';
  /* U4.4: der Assistent bleibt sichtbar, solange noch Schnellaktionen offen
     sind (er ist genau für teil-erledigte Monate gebaut) — bei angefangenem
     Monat als «fortsetzen» mit Fortschritt. Alles erledigt → kein Link. */
  /* N3.1: Handlungs-Hierarchie nach KONSEQUENZ, nicht nach Deko.
     · PRIMÄR (echter Akzent-Button): «Monat starten/fortsetzen» — geführt, harmlos.
     · SEKUNDÄR (Ghost-Button, als Buchung erkennbar): «Alle N buchen».
     · DESTRUKTIV (Monats-Reset): weg vom Hauptweg ins ⋯-Menü (openQAMenu), mit
       Bestätigung UND Rückgängig — nie ein Textlink neben «Alle buchen». */
  const maBtn = (mainAccount(S) && qa.open.length>0) ? `<button class="btn btn-acc" onclick="startAssistant()">${qa.doneCount>0
      ? 'Monat fortsetzen · '+qa.doneCount+' von '+qa.total+' erledigt'
      : 'Monat starten · geführter Ablauf'}</button>` : '';
  const qaMenuBtn = qa.doneCount>0 ? `<button class="iconbtn" aria-label="Weitere Monats-Aktionen" title="Weitere Monats-Aktionen" onclick="openQAMenu()">⋯</button>` : '';
  const qaHtml = qa.total ? `<div class="qahead" style="margin-top:${autoCard||fixCard||anyDue?'14px':'2px'}">
      <span class="lbl" style="margin:0">Schnellaktionen · ${qa.doneCount} von ${qa.total} erledigt</span>${qaMenuBtn}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${qaRows || '<div class="row"><div class="rname pos">Alle erledigt ✓</div></div>'}
    ${maBtn}
    ${qa.open.length>1?`<button class="btn btn-ghost" onclick="doAllQuickActions()">⤵ Alle ${qa.open.length} Schnellaktionen buchen</button>`:''}` : '';
  /* (4) To-Dos nach De-Dup (U3.3): im Band stehende Bedingungen NICHT nochmal */
  const sorted = todayVisibleTodos(S).sort((a,b)=>{ const ka=todoSortKey(a), kb=todoSortKey(b);
    return ka<kb?-1:(ka>kb?1:0); });
  const open = sorted.filter(t=>t.status==='open');
  const done = sorted.filter(t=>t.status==='done');
  /* N4: per showFrom noch nicht erschienene To-Dos — eingeklappt auffindbar,
     zählen nirgends mit (der Zähler zählt nur sichtbare offene Zeilen). */
  const later = todayLaterTodos(S).sort((a,b)=>{ const ka=a.showFrom+a.id, kb=b.showFrom+b.id;
    return ka<kb?-1:(ka>kb?1:0); });
  const todoHtml = `<span class="lbl" style="display:block;margin-top:${autoCard||fixCard||anyDue||qaHtml?'14px':'2px'}">To-Dos${open.length?' · '+open.length+' offen':''}</span>
    ${open.map(todayTodoRow).join('')}
    ${!open.length && !done.length && !later.length?'<div class="row hint">Keine To-Dos — neue kommen per Import (Game-Plan von Claude) oder von Hand.</div>':''}
    ${later.length?`<div><button class="linkbtn" onclick="TODOS_SHOW_LATER=!TODOS_SHOW_LATER;render()">${TODOS_SHOW_LATER?'Später verbergen':'Später ('+later.length+')'}</button></div>`:''}
    ${TODOS_SHOW_LATER?later.map(todayTodoRow).join(''):''}
    ${done.length?`<div><button class="linkbtn" onclick="TODOS_SHOW_DONE=!TODOS_SHOW_DONE;render()">${TODOS_SHOW_DONE?'Erledigte verbergen':'Erledigte anzeigen ('+done.length+')'}</button></div>`:''}
    ${TODOS_SHOW_DONE?done.map(todayTodoRow).join(''):''}
    ${nNew?`<button class="linkbtn" onclick="markTodosSeen()">Alle als gesehen markieren</button>`:''}
    <button class="btn btn-add" onclick="openTodoForm(null)">＋ To-Do</button>`;
  /* (5) Backup-Nudge (E7): dezent, nur wenn > 14 Tage / nie exportiert */
  let bk = '';
  if(backupNudgeNeeded(S, today())){
    const d = daysSinceBackup(S, today());
    const txt = d===null ? 'Noch kein Backup erstellt.' : 'Letztes Backup vor '+d+' Tagen.';
    bk = `<div class="warnbox" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:var(--sp2)">
      <div>${esc(txt)} Sichere deine Daten mit einem Export.</div>
      <button class="linkbtn" style="padding:0;white-space:nowrap" onclick="quickBackup()">Jetzt exportieren</button>
    </div>`;
  }
  /* (6) «Kommt bald» (E7): anstehende Jahresrechnungen — reine Information.
     U4.2: die Steuer (taxPlan, oft die grösste Einzelrechnung) erscheint hier
     ebenfalls — reine Anzeige vorhandener Felder (amount/dueMonth/reserved),
     keine neue Rechnung; upcomingBills() selbst bleibt unangetastet. Im
     Fälligkeitsmonat übernimmt die «Jahresrechnung fällig»-Zeile (taxDueFor). */
  const up = upcomingBills(S, today(), 3);
  let taxUpHtml = '';
  const tp = S.taxPlan;
  if(!taxDue && tp.enabled && tp.dueMonth && tp.amount>0 && !(S.quickActionsDone[tp.dueMonth]||{})['tax_due']){
    const tDiff = monthDiffId(today().slice(0,7), tp.dueMonth);
    if(tDiff>=0 && tDiff<=3){
      taxUpHtml = `<div class="row"><div class="rl"><span class="emoji">📋</span>
        <div><div class="rname">Steuern</div><div class="rsub">${esc(germanMonthName(tp.dueMonth))} ${tp.dueMonth.slice(0,4)} · ${tDiff===0?'diesen Monat':'in '+tDiff+' Monat'+(tDiff>1?'en':'')} · ${fmtAmt(tp.reserved)} von ${fmtAmt(tp.amount)} zurückgelegt</div></div></div>
      <div class="num amt">${fmtMoney(tp.amount)}</div></div>`;
    }
  }
  const upHtml = (up.length || taxUpHtml) ? `<span class="lbl" style="display:block;margin-top:var(--sp2)">Kommt bald</span>
    ${up.map(u=>`<div class="row"><div class="rl"><span class="emoji">${esc(u.emoji)||'📅'}</span>
      <div><div class="rname">${esc(u.name)}</div><div class="rsub">${esc(germanMonthName(u.dueId))} ${u.dueId.slice(0,4)} · ${u.monthsAway===0?'diesen Monat':'in '+u.monthsAway+' Monat'+(u.monthsAway>1?'en':'')}</div></div></div>
    <div class="num amt">${fmtMoney(u.amount)}/Jahr</div></div>`).join('')}
    ${taxUpHtml}
    <div class="hint" style="padding:6px 0 0">Nur Information — angespart wird laufend, gebucht wird hier nichts.</div>` : '';
  return `<section>
    <span class="lbl sec">Heute zu tun${nOpen?' · '+nOpen+' offen':''}${nNew?' · '+nNew+' neu':''}</span>
    ${autoCard}
    ${fixCard}
    ${anyDue?`<span class="lbl" style="display:block;margin-top:2px">Jahresrechnung fällig</span>${anyDue}`:''}
    ${qaHtml}
    ${!qa.total && !anyDue && !autoCard && !fixCard && hasMonth?'<div class="row hint">Keine offenen Schnellaktionen.</div>':''}
    ${ipLink}
    ${todoHtml}
    ${bk}
    ${upHtml}
  </section>`;
}

/* ─────────── Universelle Schnell-Einzahlung / -Entnahme (SPEC 2.18) ─────────── */
/* U1.7: Betrags-Vorschläge fürs ±-Sheet — liest NUR vorhandene Plandaten:
   Space/Konto → geplanter monatlicher Fix-Transfer des aktuellen Monats,
   Ziel → hinterlegte Rate (fixed) bzw. aktueller %-Topf (savingsPots),
   Hauptkonto-Einzahlung → Instant-Pay-Schichtbetrag. Max. 3 Chips. */
function qaSuggestions(kind, id, sign){
  const out = [];
  const push = (label, amount)=>{
    const a = round2(parseAmount(amount));
    if(a>0 && !out.some(x=>x.amount===a)) out.push({label, amount:a});
  };
  const m = monthById(S, S.settings.currentMonthId);
  if(kind==='account'){
    const acc = S.accounts.find(a=>a.id===id);
    const main = mainAccount(S);
    if(acc && m) m.fixed.forEach(f=>{
      const fa = fixAmount(f);
      if(f.kind==='transfer' && f.toId===acc.id && f.recurrence==='monthly' && fa>0) push('Fix-Transfer', fa);
    });
    if(acc && main && acc.id===main.id && sign>0 && S.workModel.instantPay && S.workModel.instantPay.enabled)
      push('Instant-Pay-Schicht', S.workModel.instantPay.amountPerShift);
  } else if(kind==='goal'){
    const g = S.goals.find(x=>x.id===id);
    if(g && g.rateMode==='fixed') push('Rate', g.rate);
    else if(g){
      const p = savingsPots(S, S.settings.currentMonthId).find(x=>x.targetId===g.accountId);
      if(p && p.amount>0) push('%-Topf', p.amount);
    }
  }
  return out.slice(0,3);
}
function openQuickAdjust(kind, id, sign){
  const name = kind==='goal' ? (S.goals.find(g=>g.id===id)||{}).name : accName(S,id);
  const main = mainAccount(S);
  const isMainDep = kind==='account' && sign>0 && main && main.id===id;
  const acc = kind==='account' ? S.accounts.find(a=>a.id===id) : null;
  /* Entnahme-Modus (SPEC 2.29): Ausgabe (Standard) vs. interner Transfer.
     Kein Modus am Hauptkonto (Entnahme dort ist immer Ausgabe). */
  let modeHtml = '';
  if(acc && sign<0 && main && acc.id!==main.id){
    const target = (acc.kind==='space' && acc.parentId) ? accName(S,acc.parentId) : main.name;
    modeHtml = `<label class="fld"><span class="lbl">Art der Entnahme</span>
      <select id="qa_mode">
        <option value="expense" selected>Ausgabe (Geld weg) — zählt als Abfluss</option>
        <option value="transfer">Nur Transfer (intern) → ${esc(target)}</option>
      </select></label>`;
  }
  /* Zielgebundenes Konto (SPEC 2.27): Bewegung braucht ein Ziel. */
  let goalHtml = '';
  if(acc && goalBackedIds(S).has(acc.id)){
    const gs = goalsForAccount(S, acc.id);
    goalHtml = `<label class="fld"><span class="lbl">Zu welchem Sparziel zählt das? (Pflicht)</span>
      <select id="qa_goal"><option value="">— Ziel wählen —</option>
        ${gs.map(g=>`<option value="${g.id}">${esc(g.name)} · ${fmtAmt(g.saved)}</option>`).join('')}
      </select></label>`;
  }
  /* U1.7: Vorschlags-Chips aus BESTEHENDEN Plandaten (keine neue Rechnung) */
  const sugs = qaSuggestions(kind, id, sign);
  const sugHtml = sugs.length ? `<div class="sugrow">${sugs.map(s=>
    `<button type="button" class="sug" onclick="setAmtField('qa_amt',${s.amount})">${esc(s.label)} · ${fmtAmt(s.amount)}</button>`).join('')}</div>` : '';
  /* N6: Entnahme (Ausgabe) aus dem Topf → «Wofür?» wählbar. Die Wahl wird zur
     Beschreibung, der Namens-Abgleich ordnet die Zahlung dem variablen Posten zu
     (Tracker-Y sinkt). Nur bei Ausgabe, nicht beim internen Transfer. */
  let purposeHtml = '';
  if(acc && sign<0 && acc.id===S.settings.varReserveToId){
    const items = varItemStatus(S, S.settings.currentMonthId).filter(it=>it.remaining>0);
    if(items.length) purposeHtml = `<label class="fld" id="qa_purpose_w"><span class="lbl">Wofür aus dem Topf? (nur bei «Ausgabe»)</span>
      <select id="qa_purpose"><option value="">— frei / nicht zuordnen —</option>
        ${items.map(it=>`<option value="${esc(it.name)}">${esc(it.name)} · noch ${fmtAmt(it.remaining)}</option>`).join('')}
      </select></label>`;
  }
  openSheet(`<div class="shead">${sign>0?'Einzahlen':'Entnehmen'} · ${esc(name||'')}</div>
    <div class="ssub">${sign>0?'Betrag einzahlen':'Betrag entnehmen'} — landet im Verlauf und ist per «Rückgängig» umkehrbar.</div>
    <label class="fld"><span class="lbl">Betrag</span>${padField('qa_amt','')}</label>
    ${sugHtml}
    ${modeHtml}${purposeHtml}${goalHtml}
    <button class="btn btn-acc" onclick="doQuickAdjust('${kind}','${id}',${sign})">${sign>0?'Einzahlen':'Entnehmen'}</button>
    ${isMainDep?`<button class="btn btn-ghost" onclick="openInstantPay()">Stattdessen Instant Pay (Lohn-Vorschuss)</button>`:''}
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function doQuickAdjust(kind,id,sign){
  const amount = parseAmount(el('qa_amt').value);
  if(amount<=0){ showToast('Bitte einen Betrag eingeben.'); return; }
  const modeEl = el('qa_mode'), goalEl = el('qa_goal'), purposeEl = el('qa_purpose');
  const goalId = goalEl ? goalEl.value : null;
  if(goalEl && !goalId){ showToast('Dieses Konto gehört zu deinen Sparzielen — bitte wählen, zu welchem Ziel die Bewegung zählt.'); return; }
  const mode = modeEl?modeEl.value:'expense';
  /* purpose gilt nur für die Ausgabe (nicht beim internen Transfer). */
  const purpose = (purposeEl && mode!=='transfer') ? purposeEl.value : '';
  const snap = deepClone(S);
  const r = quickAdjust(S,kind,id,sign,amount,{mode, goalId, purpose});
  closeSheet();
  if(!r){ showToast('Nicht möglich.'); return; }
  haptic(); commitState();
  showToast((sign>0?'Eingezahlt: ':'Entnommen: ')+fmtMoney(r.amount), restoreFn(snap));
}

/* ─────────── Auto-Lohn-Aktion (SPEC 2.20): Gesamtlohn − Instant Pays ─────────── */
/* N19 (SPEC 2.56): Festlohn buchen — Betrag UND Datum frei. Kein zweiter
   Rechenweg: der Plan-Betrag kommt aus dem Fenster (das ihn aus fixedIncomeFor
   hat), der Hinweis vergleicht nur die zwei Zahlen. Muster U2.0 wie beim
   Auto-Lohn: beim Tippen wird NUR der Hinweis neu gezeichnet, nie das Sheet —
   ein openSheet-Neuaufbau beim Blur würde den ersten Klick auf «buchen»
   schlucken. */
function fsNoteHtml(plan, amount){
  if(!(amount>0)) return 'Trag den Betrag ein, der wirklich eingegangen ist.';
  const d = round2(amount - plan);
  if(d===0) return 'Entspricht der Planzahl ('+fmtAmt(plan)+'). Der Monatslohn ändert sich dadurch nicht — nur der Kontostand steigt.';
  return 'Geplant waren '+fmtAmt(plan)+'. Der gebuchte Betrag <b>ersetzt</b> die Planzahl im Monatslohn ('
    + (d>0?'+':'−') + fmtAmt(Math.abs(d)) + '). Doppelt gezählt wird nie: entweder gebucht oder geplant.';
}
function fsRefresh(){
  const w = fixedSalaryWindow(S, today());
  if(!w || !el('fs_note')) return;
  el('fs_note').innerHTML = fsNoteHtml(w.plan, parseAmount(el('fs_amount').value));
}

    <div class="ssub">Wird als Eingang auf «${esc(accName(S,main.id))}» gebucht und dem Geldmonat
      ${esc(monthLabel(w.targetId))} zugeordnet. Erwartet war ${fmtDate(w.due)} — trag ein, wann das Geld wirklich kam.</div>

function doFixedSalary(){

   beim Blur würde den ersten «Lohn buchen»-Klick schlucken (Button wird zwischen
   mousedown und mouseup ersetzt → kein Click-Event). */
function asRefresh(){
  const w = autoSalaryWindow(S, today());
  if(!w) return;
  const gross = parseAmount(el('as_gross').value);
  if(el('as_brk')) el('as_brk').innerHTML = asBrkRows(gross, w);
  if(el('as_warn')) el('as_warn').innerHTML = asWarnHtml(gross, w);
}
function asBrkRows(gross, w){
  const payout = round2(Math.max(0, gross - w.instant));
  return `<div class="row" style="border:none;padding:5px 0;min-height:0"><div class="rsub">Gesamtlohn</div><div class="num amt">${fmtAmt(gross)}</div></div>
      <div class="row" style="border:none;padding:5px 0;min-height:0"><div class="rsub">− Instant Pay (${w.instantCount} Vorschü${w.instantCount===1?'ss':'sse'})</div><div class="num amt ${w.instant>0?'neg':''}">−${fmtAmt(w.instant)}</div></div>
      <div class="row" style="border:none;padding:5px 0;min-height:0"><div class="rname">= Auszahlung</div><div class="num amt pos">${fmtAmt(payout)}</div></div>`;
}
function asWarnHtml(gross, w){
  return gross<w.instant ? `<div class="warnbox strong">Gesamtlohn ist kleiner als die Instant Pays (<b>${fmtMoney(w.instant)}</b>) — bitte korrigieren.</div>` : '';
}
function renderAutoSalary(grossOverride){
  const w = autoSalaryWindow(S, today());
  if(!w){ closeSheet(); return; }
  const gross = grossOverride==null ? w.gross : parseAmount(grossOverride);
  openSheet(`<div class="shead">Lohn eingegangen · ${esc(monthLabel(w.targetId))}</div>
    <div class="ssub">Trag den GESAMTEN Lohn ein (am Vortag potenziell, am Lohntag exakt). Bereits bezogene Instant Pays werden abgezogen — gebucht wird nur die Restauszahlung. Bestätigen stellt den aktuellen Monat auf ${esc(monthLabel(w.targetId))}.</div>
    <label class="fld"><span class="lbl">Gesamtlohn</span>${padField('as_gross', gross||'', '0.00', 'asRefresh')}</label>
    <div class="card" id="as_brk" style="margin-top:var(--sp2)">${asBrkRows(gross, w)}</div>
    <div id="as_warn">${asWarnHtml(gross, w)}</div>
    <button class="btn btn-acc" onclick="doAutoSalary()">Lohn buchen</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function doAutoSalary(){
  const w = autoSalaryWindow(S, today());
  if(!w){ closeSheet(); return; }
  const gross = parseAmount(el('as_gross').value);
  if(gross < w.instant){ showToast('Gesamtlohn kleiner als die Instant Pays.'); return; }
  const snap = deepClone(S);
  const res = bookSalaryPayout(S, w.targetId, gross);
  closeSheet();
  if(res.error){ showToast(res.error); return; }
  haptic(15); commitState();
  showToast('Lohn gebucht: '+fmtMoney(res.payout)+(res.cutover?' · Monat umgestellt':''), restoreFn(snap));
}

/* ─────────── Verlauf ─────────── */
/* Verlaufs-Ordnung: Datum absteigend, bei gleichem Datum die spätere
   ledger-Position zuerst — Zeichen für Zeichen der Vergleich aus filterLedger.
   N22: auf den State gehoben, damit «Saldo danach» (balancesAfter) und die
   Liste garantiert dieselbe Reihenfolge sehen. */
function sortedLedgerOf(state){
  return state.ledger.map((l,i)=>({l,i}))
    .sort((a,b)=> a.l.date===b.l.date ? b.i-a.i : (a.l.date<b.l.date?1:-1))
    .map(x=>x.l);
}
function sortedLedger(){ return sortedLedgerOf(S); }
function ledgerKindLabel(l){
  return {eingang: l.incomeKind==='lohn'?'Eingang · Lohn':'Eingang · Allgemein',
    refund:'Rückerstattung', ausgang:'Ausgang', transfer:'Transfer', anpassung:'Anpassung'}[l.type];
}
/* U4.3: ledger[].source in verständlichem Deutsch — die rohen Codes
   (quickAction, ccPriority, …) sind Entwickler-Sprache und bleiben nur im
   Datenmodell. Reine Anzeige, keine Funktionsänderung. */
const SOURCE_LABELS = {
  quickAction:'per Schnellaktion gebucht', manual:'manuell erfasst',
  bulkAdjust:'Sammel-Anpassung', ccPriority:'aus Kreditkarten-Vorschlag',
  instantPay:'Instant Pay (Lohn-Vorschuss)', salaryPayout:'Lohn-Auszahlung',
  claudeProposal:'aus Claude-Vorschlag (angenommen)', quickDeposit:'Schnell-Einzahlung (±)',
  fixedSalaryPayout:'Festlohn-Eingang (zweite Lohnquelle)',
  plannedReserve:'geplante Rücklage zurückgelegt'
};
function sourceLabel(src){ return SOURCE_LABELS[src] || 'manuell erfasst'; }
/* N22: welches Konto ist in DIESER Zeile gemeint? Filtert der Nutzer nach
   einem Konto, ist es dieses — sonst die Seite, an der die Zeile hängt: beim
   Abfluss die Quelle, sonst das Ziel. Ein Transfer berührt zwei Konten; in der
   Zeile steht das kontextrelevante, im Detail-Sheet stehen beide. */
function rowContextAcc(l, filterAccId){
  if(filterAccId && filterAccId!=='all' && (l.fromId===filterAccId || l.toId===filterAccId)) return filterAccId;
  return (l.type==='ausgang' || l.type==='transfer') ? l.fromId : l.toId;
}
function ledgerRow(l, ctxAccId, after){
  const cfg = {
    eingang:{sign:'+',cls:'pos'}, refund:{sign:'+',cls:'pos'}, ausgang:{sign:'−',cls:'neg'},
    transfer:{sign:'',cls:'mut'},
    anpassung:{sign:l.amount<0?'−':'+', cls:l.amount<0?'neg':'pos'}
  }[l.type];
  const route = [l.fromId?accName(S,l.fromId):null, l.toId?accName(S,l.toId):null].filter(Boolean).join(' → ');
  /* «Saldo danach» nur, wenn die Karte einen Wert für dieses Konto hat —
     gelöschtes/unauflösbares Konto ⇒ die Zeile bleibt still (keine Zahl). */
  const ctx = (typeof ctxAccId==='string') ? ctxAccId : null;
  const bal = (after && ctx && after[l.id] && Object.prototype.hasOwnProperty.call(after[l.id], ctx))
    ? after[l.id][ctx] : null;
  return `<button class="row tap" onclick="openEntrySheet('${l.id}')">
    <div class="rl"><div style="min-width:0"><div class="rname">${esc(l.desc)||ledgerKindLabel(l)}</div>
      <div class="rsub">${fmtDate(l.date)} · ${ledgerKindLabel(l)}${route?' · '+esc(route):''}</div></div></div>
    <div class="amtcol"><div class="num amt ${cfg.cls}">${cfg.sign}${fmtAmt(Math.abs(l.amount))}</div>${
      bal===null ? '' : `<div class="rsub num after">danach ${fmtAmt(bal)}</div>`}</div></button>`;
}
function blockLedger(){
  const recent = sortedLedger().slice(0,5);
  const after = balancesAfter(S);
  return `<section><span class="lbl sec">Verlauf</span>
    ${recent.map(l=>ledgerRow(l, rowContextAcc(l,null), after)).join('') || '<div class="row hint">Noch keine Buchungen.</div>'}
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="goView('verlauf')">Alle anzeigen</button>
      <button class="btn btn-acc" style="flex:1" onclick="openBookingForm()">＋ Buchung</button>
    </div></section>`;
}
let VERLAUF_FILTER = {q:'', type:'all', accId:'all', from:'', to:''};
let VERLAUF_FILTER_OPEN = false;
function renderVerlaufList(){
  const list = filterLedger(S, VERLAUF_FILTER);
  const after = balancesAfter(S);
  const active = VERLAUF_FILTER.q || VERLAUF_FILTER.type!=='all' || VERLAUF_FILTER.accId!=='all' || VERLAUF_FILTER.from || VERLAUF_FILTER.to;
  return `<div class="rsub" style="padding:6px 2px">${list.length} ${list.length===1?'Eintrag':'Einträge'}${active?' (gefiltert)':''}</div>`
    + (list.map(l=>ledgerRow(l, rowContextAcc(l, VERLAUF_FILTER.accId), after)).join('') || `<div class="row hint">${S.ledger.length?'Keine Treffer für diesen Filter.':'Noch keine Buchungen — leg mit «＋ Buchung» los.'}</div>`);
}
function rVerlauf(){
  const typeOpts = [['all','Alle Typen'],['eingang','Eingang'],['ausgang','Ausgang'],['transfer','Transfer'],['refund','Rückerstattung'],['anpassung','Anpassung']];
  const f = VERLAUF_FILTER;
  const accOpts = [['all','Alle Konten']].concat(S.accounts.map(a=>[a.id, a.name]));
  const sel = (id,val,opts,ph)=>`<select id="${id}" onchange="VERLAUF_FILTER.${val}=this.value;applyVerlaufFilter()">${opts.map(o=>`<option value="${o[0]}" ${f[val]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  const filterUI = VERLAUF_FILTER_OPEN ? `
    <div class="frow mt1">
      <label class="fld" style="margin-top:0"><span class="lbl">Typ</span>${sel('vf_type','type',typeOpts)}</label>
      <label class="fld" style="margin-top:0"><span class="lbl">Konto</span>${sel('vf_acc','accId',accOpts)}</label>
    </div>
    <div class="frow">
      <label class="fld"><span class="lbl">Von</span><input type="date" value="${f.from}" onchange="VERLAUF_FILTER.from=this.value;applyVerlaufFilter()"></label>
      <label class="fld"><span class="lbl">Bis</span><input type="date" value="${f.to}" onchange="VERLAUF_FILTER.to=this.value;applyVerlaufFilter()"></label>
    </div>
    <button class="linkbtn" onclick="resetVerlaufFilter()">Filter zurücksetzen</button>` : '';
  return `<section>
    <button class="linkbtn" onclick="goView('home')">‹ Home</button>
    <span class="lbl sec mt1">Verlauf</span>
    <label class="fld mt2"><input type="text" placeholder="Suchen (Beschreibung, Betrag, Art) …" value="${esc(f.q)}" aria-label="Verlauf durchsuchen" oninput="VERLAUF_FILTER.q=this.value;applyVerlaufFilter()"></label>
    <button class="row tap" onclick="toggleVerlaufFilter()" style="min-height:44px">
      <div class="rl"><div style="min-width:0"><div class="rname">Filtern</div><div class="rsub">nach Typ, Konto oder Zeitraum</div></div></div>
      <div class="mut">${VERLAUF_FILTER_OPEN?'Schliessen ▲':'Öffnen ▼'}</div></button>
    ${filterUI}
    <div id="verlauf_list" style="margin-top:var(--sp1)">${renderVerlaufList()}</div>
    <button class="btn btn-acc" onclick="openBookingForm()">＋ Buchung</button>
  </section>`;
}
function applyVerlaufFilter(){ const c=el('verlauf_list'); if(c) c.innerHTML = renderVerlaufList(); }
function toggleVerlaufFilter(){ VERLAUF_FILTER_OPEN=!VERLAUF_FILTER_OPEN; render(); }
function resetVerlaufFilter(){ VERLAUF_FILTER={q:'',type:'all',accId:'all',from:'',to:''}; render(); }
function openEntrySheet(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l) return;
  /* N22 (SPEC 2.60): «Saldo danach» je berührtem Konto. Ein Transfer berührt
     zwei — hier stehen BEIDE Seiten mit ihrem jeweiligen Stand. Ohne Wert
     (gelöschtes Konto) bleibt die Zeile wie bisher, ohne erfundene Zahl. */
  const afterMap = balancesAfter(S)[id] || {};
  const afterTxt = accId => (accId && Object.prototype.hasOwnProperty.call(afterMap, accId))
    ? `<div class="rsub num">danach ${fmtAmt(afterMap[accId])}</div>` : '';
  openSheet(`<div class="shead">${esc(l.desc)||ledgerKindLabel(l)}</div>
    <div class="ssub">${ledgerKindLabel(l)} · ${fmtDate(l.date)} · ${sourceLabel(l.source)}</div>
    <div class="row"><div class="rsub">Betrag</div><div class="num amt">${fmtMoney(l.amount)}</div></div>
    ${l.fromId?`<div class="row"><div class="rsub">Von</div><div>${esc(accName(S,l.fromId))}${afterTxt(l.fromId)}</div></div>`:''}
    ${l.toId?`<div class="row"><div class="rsub">Nach</div><div>${esc(accName(S,l.toId))}${afterTxt(l.toId)}</div></div>`:''}
    ${l.goalId?`<div class="row"><div class="rsub">Sparziel</div><div>${esc((S.goals.find(g=>g.id===l.goalId)||{}).name||'(gelöschtes Ziel)')}</div></div>`:''}
    ${livingEligible(S,l)?`<div class="togl"><span class="lbl">Zählt zu Leben</span>
      <input type="checkbox" id="e_living" ${l.countsAsLiving===false?'':'checked'} onchange="toggleEntryLiving('${l.id}')"></div>
    <div class="hint">${l.countsAsLiving===false
        ? 'Zählt derzeit NICHT ins Alltagsbudget — «Frei pro Tag» rechnet ohne diese Buchung.'
        : 'Zählt ins Alltagsbudget. Aus nehmen für einmalige Sonderausgaben (Semestergebühr, Anschaffung).'}</div>`:''}
    ${entryEditable(l)
      ? `<button class="btn btn-ghost" onclick="openEntryEditForm('${l.id}')">Bearbeiten</button>`
      : `<div class="hint mt3">Automatisch erzeugt (${esc(sourceLabel(l.source))}) — hier nur löschen. Solche Einträge hängen an Zählern und Status ausserhalb des Verlaufs; ändern liesse sich das eine ohne das andere.</div>`}
    ${l.type!=='anpassung'?`<button class="btn btn-ghost" onclick="rebookEntry('${l.id}')">Als Vorlage für neue Buchung</button>`:''}
    <button class="btn btn-danger" onclick="confirmDeleteEntry('${l.id}')">Eintrag löschen</button>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
/* N12 (SPEC 2.51): «Zählt zu Leben» an einer BESTEHENDEN Buchung umschalten —
   der Weg, auf dem die schon gebuchte Semestergebühr nachträglich aus dem
   Alltagsbudget fällt. Ändert AUSSCHLIESSLICH dieses Feld: kein Saldo, kein
   Ziel, kein Datum, keine Herkunft. commitState rechnet «Frei pro Tag» sofort
   neu; das Sheet wird neu aufgebaut, damit der Erklärtext zur Schalterstellung
   passt. Undo als direkter Gegenzug (Muster toggleTodo) statt Snapshot — es ist
   ein einzelnes Feld, da braucht es keinen State-Klon. */
function toggleEntryLiving(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l || !livingEligible(S,l)) return;
  const off = l.countsAsLiving!==false;
  /* delete statt = undefined: der Schlüssel darf nur existieren, wenn er false
     ist (siehe normalizeState) — sonst hielte deepEqual den Stand nach einem
     deepClone für verändert. */
  if(off) l.countsAsLiving = false; else delete l.countsAsLiving;
  haptic(); commitState(); openEntrySheet(id);
  showToast(off ? 'Zählt nicht mehr zu Leben' : 'Zählt wieder zu Leben', ()=>{
    const x = S.ledger.find(y=>y.id===id);
    if(x){ if(off) delete x.countsAsLiving; else x.countsAsLiving = false; }
    commitState(); openEntrySheet(id);
  });
}
/* U1.4: Eintrag als Vorlage — öffnet das Buchungsformular vorbefüllt
   (Betrag/Beschreibung/Typ/Konten), aber mit HEUTIGEM Datum, als NEUE Buchung. */
function rebookEntry(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l || l.type==='anpassung') return;
  openBookingForm({type:l.type, desc:l.desc, amount:Math.abs(l.amount),
    fromId:l.fromId, toId:l.toId, incomeKind:l.incomeKind, goalId:l.goalId});
}
/* N22 (SPEC 2.59): Einstieg ins Bearbeiten. Zwei Formen, weil zwei Dinge
   gemeint sind: eine manuelle BUCHUNG bekommt das bewährte Buchungs-Sheet im
   Bearbeiten-Modus (gleiche Felder, gleiche Toggles, gleiche Ziel-Pflicht —
   kein zweites Formular, das auseinanderlaufen könnte); eine SALDO-ANPASSUNG
   bekommt ein kleines eigenes Sheet, weil an ihr nur Betrag (mit Vorzeichen),
   Beschreibung und Datum sinnvoll sind — Typ und Konto gehören zur Anpassung
   selbst. */
function openEntryEditForm(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l || !entryEditable(l)) return;
  if(l.type==='anpassung'){ openAdjustEditForm(id); return; }
  openBookingForm({type:l.type, desc:l.desc, amount:Math.abs(l.amount), date:l.date,
    fromId:l.fromId, toId:l.toId, incomeKind:l.incomeKind, goalId:l.goalId,
    countsAsLiving:l.countsAsLiving}, id);
}
function openAdjustEditForm(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l || l.type!=='anpassung' || !entryEditable(l)) return;
  const livShow = livingEligible(S,l);
  openSheet(`<div class="shead">Anpassung bearbeiten</div>
    <div class="ssub">Saldo-Anpassung an «${esc(accName(S,l.toId))}» · ${esc(sourceLabel(l.source))}</div>
    <div class="frow">
      <label class="fld" style="margin-top:0"><span class="lbl">Betrag (±)</span>
        <input type="text" inputmode="decimal" id="a_amount" value="${l.amount}"></label>
      <label class="fld" style="margin-top:0"><span class="lbl">Datum</span>
        <input type="date" id="a_date" value="${esc(l.date)}"></label>
    </div>
    <div class="hint">Minus senkt den Saldo, Plus hebt ihn. Konto und Herkunft bleiben, wie sie sind.</div>
    <label class="fld"><span class="lbl">Beschreibung</span><input type="text" id="a_desc" value="${esc(l.desc)}"></label>
    ${livShow?`<div class="togl"><span class="lbl">Zählt zu Leben</span>
      <input type="checkbox" id="a_living" ${l.countsAsLiving===false?'':'checked'}></div>`:''}
    <button class="btn btn-acc" onclick="saveAdjustEdit('${id}')">Änderungen speichern</button>
    <button class="btn btn-ghost" onclick="openEntrySheet('${id}')">Abbrechen</button>`);
}
function saveAdjustEdit(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l) return;
  const amount = round2(parseAmount(el('a_amount').value));
  if(!amount){ showToast('Eine Anpassung über 0.00 wäre keine — Betrag mit + oder − angeben.'); return; }
  const date = el('a_date').value;
  if(!adjustDateAllowed(S, date)){ showToast('Anpassungen gibt es nur für Monate, die nicht in der Zukunft liegen.'); return; }
  const patch = {amount, date, desc: el('a_desc').value.trim()};
  if(el('a_living')) patch.countsAsLiving = el('a_living').checked ? undefined : false;
  const snap = deepClone(S);
  if(!editEntry(S, id, patch)){ showToast('Änderung nicht möglich.'); return; }
  haptic(); closeSheet(); commitState();
  showToast('Anpassung geändert — Saldo neu gerechnet', restoreFn(snap));
}
function confirmDeleteEntry(id){
  const l = S.ledger.find(x=>x.id===id);
  if(!l) return;
  openSheet(`<div class="shead">Eintrag löschen?</div>
    <div class="ssub">«${esc(l.desc)||ledgerKindLabel(l)}» über ${fmtMoney(l.amount)} wird entfernt und die betroffenen Salden werden sauber zurückgerechnet.</div>
    <button class="btn btn-danger" onclick="doDeleteEntry('${id}')">Löschen & rückrechnen</button>
    <button class="btn btn-ghost" onclick="openEntrySheet('${id}')">Abbrechen</button>`);
}
function doDeleteEntry(id){
  const snap = deepClone(S);
  deleteEntry(S,id);
  closeSheet(); commitState();
  showToast('Eintrag gelöscht — Salden zurückgerechnet', restoreFn(snap));
}

/* ─────────── Buchungsformular (SPEC 2.5) ─────────── */
/* U1.4: optionales prefill {type,desc,amount,fromId,toId,incomeKind,goalId} —
   füllt die Felder («Nochmal buchen»), Datum bleibt IMMER heute, neue Buchung. */
function openBookingForm(prefill, editId){
  const opts = sel => S.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const main = mainAccount(S);
  /* U1.4-Lexikon: bisherige Beschreibungen als datalist — der Browser schlägt
     beim Tippen passend zum Buchstaben vor (dedupliziert, neueste zuerst). */
  const seen = new Set();
  const descOpts = sortedLedger()
    .filter(l=>l.desc && l.type!=='anpassung')
    .filter(l=>{ const k=l.desc.trim().toLowerCase(); if(!k || seen.has(k)) return false; seen.add(k); return true; })
    .slice(0,40)
    .map(l=>`<option value="${esc(l.desc)}"></option>`).join('');
  /* N12: Startzustand der «Zählt zu Leben»-Zeile schon im Markup — das Sheet
     öffnet mit Typ «Ausgang» und dem Hauptkonto als Quelle, also genau im Fall,
     in dem die Zeile stehen MUSS. Sie erst per bkLivingSync nachzuziehen hiesse,
     sie beim Öffnen kurz zu verstecken. Die Regel ist dieselbe (livingEligible),
     nur einmal vorab gefragt statt nach dem ersten Feld-Ereignis. */
  const livShow = livingEligible(S, {type:'ausgang', fromId: main?main.id:null, toId:null, amount:1, source:'manual'});
  /* N22: derselbe Bauplan im Bearbeiten-Modus — nur Titel, Datum, Knopf und
     der Abbruch-Weg unterscheiden sich. Ein zweites Formular hätte dieselben
     Sync-Regeln (Ziel-Pflicht, Topf-Info, «Zählt zu Leben») ein zweites Mal
     gebraucht; genau da laufen Formulare auseinander. */
  const dateVal = (editId && prefill && prefill.date) ? prefill.date : today();
  openSheet(`<div class="shead">${editId?'Buchung bearbeiten':'Neue Buchung'}</div>
    ${editId?`<div class="ssub">Der Eintrag behält seine Identität und seine Herkunft — die alte Wirkung wird zurückgerechnet, die neue angewendet.</div>`:''}
    <label class="fld"><span class="lbl">Typ</span>
      <select id="b_type" onchange="bkToggle(this.value)">
        <option value="ausgang">Ausgang</option>
        <option value="eingang">Eingang</option>
        <option value="transfer">Transfer</option>
        <option value="refund">Rückerstattung</option>
      </select></label>
    <label class="fld" id="b_kind_w" style="display:none"><span class="lbl">Eingangs-Typ</span>
      <select id="b_kind">
        <option value="allgemein" selected>Allgemein — zählt nicht als Lohn</option>
        <option value="lohn">Lohn — zählt als Einkommen des Monats</option>
      </select></label>
    <div class="frow">
      <label class="fld"><span class="lbl">Betrag</span>${padField('b_amount','')}</label>
      <label class="fld"><span class="lbl">Datum</span><input type="date" id="b_date" value="${dateVal}"></label>
    </div>
    <label class="fld"><span class="lbl">Beschreibung</span><input type="text" id="b_desc" list="b_desc_list" autocomplete="off" onchange="bkDescPick(this.value)"><datalist id="b_desc_list">${descOpts}</datalist></label>
    <label class="fld" id="b_from_w"><span class="lbl">Von Konto</span><select id="b_from" onchange="bkGoalSync()">${opts(main?main.id:null)}</select></label>
    <div id="b_potinfo" class="hint" style="display:none"></div>
    <label class="fld" id="b_potpurpose_w" style="display:none"><span class="lbl">Wofür aus dem Topf?</span>
      <select id="b_potpurpose" onchange="bkPotPurposePick(this.value)"></select></label>
    <label class="fld" id="b_to_w" style="display:none"><span class="lbl">Nach Konto</span><select id="b_to" onchange="bkGoalSync()">${opts(main?main.id:null)}</select></label>
    <label class="fld" id="b_goal_w" style="display:none"><span class="lbl">Zu welchem Sparziel zählt das? (Pflicht)</span><select id="b_goal"></select></label>
    <div class="togl" id="b_living_w" style="display:${livShow?'':'none'}"><span class="lbl">Zählt zu Leben</span><input type="checkbox" id="b_living" checked></div>
    <div class="hint" id="b_living_h" style="display:${livShow?'':'none'}">Aus zählt die Buchung nicht ins Alltagsbudget — «Frei pro Tag» bleibt davon unberührt.</div>
    <div id="b_dup" class="warnbox" style="display:none"></div>
    <button class="btn btn-acc" id="b_savebtn" onclick="saveBooking(${editId?`'${editId}'`:''})">${editId?'Änderungen speichern':'Buchen'}</button>
    ${editId?`<button class="btn btn-ghost" onclick="openEntrySheet('${editId}')">Abbrechen</button>`
            :`<button class="btn-text" onclick="closeSheet()">Abbrechen</button>`}`);
  BOOKING_DUP_OK=false;
  if(prefill) bkApplyPrefill(prefill);
  /* Bestehendes «Zählt zu Leben» übernehmen — bkApplyPrefill fasst nur die
     Felder an, die auch eine Vorlage kennt. */
  if(editId && prefill && prefill.countsAsLiving===false && el('b_living')) el('b_living').checked = false;
}
/* U1.4: Felder aus einer Vorlage setzen — nutzt die bestehenden Toggles/Syncs,
   damit exakt die Felder sichtbar sind, die der Typ verlangt. */
function bkApplyPrefill(p){
  if(p.type && el('b_type').querySelector(`option[value="${p.type}"]`)){
    el('b_type').value = p.type; bkToggle(p.type);
  }
  if(p.incomeKind && el('b_kind')) el('b_kind').value = p.incomeKind;
  if(p.amount!=null && p.amount>0) setAmtField('b_amount', p.amount);
  if(p.desc) el('b_desc').value = p.desc;
  if(p.fromId && S.accounts.some(a=>a.id===p.fromId)) el('b_from').value = p.fromId;
  if(p.toId && S.accounts.some(a=>a.id===p.toId)) el('b_to').value = p.toId;
  bkGoalSync();
  if(p.goalId && el('b_goal') && el('b_goal').querySelector(`option[value="${p.goalId}"]`))
    el('b_goal').value = p.goalId;
}
/* U1.4-Lexikon: exakter Treffer gewählt UND Betrag noch leer → Betrag/Typ/Konten
   der letzten gleichen Buchung übernehmen. Füllt nur, was leer ist — nie
   überschreiben, was schon eingetippt wurde. */
function bkDescPick(desc){
  const d = (desc||'').trim().toLowerCase();
  if(!d) return;
  const amtEl = el('b_amount');
  if(!amtEl || parseAmount(amtEl.value)>0) return;
  const l = sortedLedger().find(x=>x.desc && x.type!=='anpassung' && x.desc.trim().toLowerCase()===d);
  if(!l) return;
  bkApplyPrefill({type:l.type, amount:Math.abs(l.amount), fromId:l.fromId, toId:l.toId,
    incomeKind:l.incomeKind, goalId:l.goalId});
}
let BOOKING_DUP_OK=false;
function bkToggle(t){
  el('b_kind_w').style.display = t==='eingang'?'':'none';
  el('b_from_w').style.display = (t==='ausgang'||t==='transfer')?'':'none';
  el('b_to_w').style.display = (t==='eingang'||t==='transfer'||t==='refund')?'':'none';
  bkGoalSync();
}
/* Zielgebundene Konten im Buchungs-Sheet (SPEC 2.27): sobald «Von» ODER «Auf»
   zielgebunden ist, erscheint das Pflicht-Dropdown mit den Zielen des Kontos. */
function bkInvolvedGoalAccounts(){
  const t = el('b_type').value;
  const gb = goalBackedIds(S);
  const out = [];
  if((t==='ausgang'||t==='transfer') && gb.has(el('b_from').value)) out.push(el('b_from').value);
  if((t==='eingang'||t==='transfer'||t==='refund') && gb.has(el('b_to').value) && !out.includes(el('b_to').value)) out.push(el('b_to').value);
  return out;
}
/* N6: ruhige Info-Zeile, sobald das Von-Konto der Topf ist — «woraus greife ich
   gerade?». Bewusst KEIN Tor und KEINE Warnung: aus dem Topf zu zahlen ist der
   richtige Weg, und ein Extra-Klick würde genau das bestrafen. Reine Orientierung. */
function bkPotInfo(){
  const w = el('b_potinfo'), pw = el('b_potpurpose_w'), ps = el('b_potpurpose');
  if(!w) return;
  const t = el('b_type').value;
  const from = (t==='ausgang'||t==='transfer') ? el('b_from').value : null;
  const b = (from && from===S.settings.varReserveToId) ? potBreakdown(S, from) : null;
  if(!b){ w.style.display='none'; w.innerHTML=''; if(pw) pw.style.display='none'; return; }
  const bits = b.parts.map(p=>`${esc(p.name)} ${fmtAmt(p.amount)}`);
  w.innerHTML = 'Topf «'+esc(b.pot.name)+'» · '+fmtMoney(b.pot.balance)+': '
    + (bits.length ? 'davon '+bits.join(' · ') : 'nichts zugeordnet')
    + (b.rest>0 ? ' · frei '+fmtAmt(b.rest) : b.rest<0 ? ' · ungedeckt '+fmtAmt(-b.rest) : '');
  w.style.display='';
  /* «Wofür?» nur beim Ausgang aus dem Topf: die Wahl setzt die Beschreibung auf
     den Posten-Namen, damit der bestehende Namens-Abgleich (2.46) die Zahlung
     der variablen Kosten zuordnet und der Tracker-Wert Y exakt sinkt. Kein neues
     Feld, kein Zielsystem — nur die implizite Zuordnung sichtbar gemacht. */
  if(pw && ps){
    if(t!=='ausgang'){ pw.style.display='none'; }
    else {
      const items = varItemStatus(S, S.settings.currentMonthId).filter(it=>it.remaining>0);
      ps.innerHTML = `<option value="">— frei eintragen —</option>`
        + items.map(it=>`<option value="${esc(it.name)}">${esc(it.name)} · noch ${fmtAmt(it.remaining)}</option>`).join('');
      pw.style.display = items.length ? '' : 'none';
    }
  }
}
function bkPotPurposePick(name){
  if(name && el('b_desc')) el('b_desc').value = name;
}
/* N12 (SPEC 2.51): «Zählt zu Leben» — nur beim Ausgang AB HAUPTKONTO, also
   genau dann, wenn die Buchung im Leben-Verbrauch überhaupt landen kann.
   Die Bedingung wird nicht nachgebaut, sondern an livingEligible gestellt
   (EINE Regel für Sichtbarkeit und Rechnung); die Probe-Buchung trägt nur
   die Felder, die livingEligible liest. Transfer/Eingang/Refund und jeder
   Ausgang aus Space/Zweitkonto fallen damit von selbst weg. */
function bkLivingSync(){
  const w = el('b_living_w'), h = el('b_living_h');
  if(!w) return;
  const t = el('b_type').value;
  const fromId = (t==='ausgang'||t==='transfer') ? el('b_from').value : null;
  const show = livingEligible(S, {type:t, fromId, toId:null, amount:1, source:'manual'});
  w.style.display = show ? '' : 'none';
  if(h) h.style.display = show ? '' : 'none';
}
function bkGoalSync(){
  /* Läuft aus bkToggle, beiden Konto-Selects und bkApplyPrefill — genau die
     Stellen, an denen sich auch die Topf-Info ändern kann. */
  bkPotInfo();
  bkLivingSync();
  const inv = bkInvolvedGoalAccounts();
  const w = el('b_goal_w');
  if(!w) return;
  if(inv.length!==1){ w.style.display='none'; el('b_goal').innerHTML=''; return; }
  const gs = goalsForAccount(S, inv[0]);
  el('b_goal').innerHTML = `<option value="">— Ziel wählen —</option>`+
    gs.map(g=>`<option value="${g.id}">${esc(g.name)} · ${fmtAmt(g.saved)}</option>`).join('');
  w.style.display='';
}
function saveBooking(editId){
  const type = el('b_type').value;
  const amount = parseAmount(el('b_amount').value);
  if(amount<=0){ showToast('Betrag muss grösser als 0 sein.'); return; }
  const fromId = (type==='ausgang'||type==='transfer') ? el('b_from').value : null;
  const toId = (type==='eingang'||type==='transfer'||type==='refund') ? el('b_to').value : null;
  if((type==='ausgang'||type==='transfer') && !fromId){ showToast('Quellkonto wählen.'); return; }
  if(type!=='ausgang' && !toId){ showToast('Zielkonto wählen.'); return; }
  if(type==='transfer' && fromId===toId){ showToast('Quelle und Ziel sind identisch.'); return; }
  /* Ziel-Kopplung (SPEC 2.27): Bewegung an zielgebundenem Konto braucht ein Ziel. */
  const inv = bkInvolvedGoalAccounts();
  if(inv.length>1){ showToast('Beide Konten gehören zu Sparzielen — bitte in zwei einzelne Buchungen aufteilen.'); return; }
  const goalId = inv.length===1 ? el('b_goal').value : null;
  if(inv.length===1 && !goalId){ showToast('Dieses Konto gehört zu deinen Sparzielen — bitte wählen, zu welchem Ziel die Bewegung zählt.'); return; }
  const desc = el('b_desc').value.trim();
  const date = el('b_date').value;
  /* Hinweise vor dem Buchen — alle nicht blockierend, EIN gemeinsames Tor:
     erst zeigen, erneuter Klick bucht trotzdem. Nichts wird automatisch
     umgebucht oder verrechnet.
     · Doppelbuchungs-Schutz (E6): gleicher Betrag + Beschreibung + Datum.
     · Doppelzahlungs-Warnung (N6, SPEC 2.46): Ausgang vom Hauptkonto, der zu
       einem variablen Posten passt, während dafür noch Geld im Topf liegt —
       sonst ist es doppelt (einmal im Topf gebunden, einmal vom Konto weg). */
  const hints = [];
  /* Beim Bearbeiten sich selbst nicht als Doppelbuchung melden. */
  const dup = S.ledger.find(l=>l.id!==editId && Math.abs(l.amount)===amount && (l.desc||'')===desc && l.date===date);
  if(dup) hints.push('Schon gebucht? «'+esc(desc||'—')+'» über '+fmtMoney(amount)+' am '+fmtDate(date)+' existiert bereits.');
  const ph = potPayHint(S, {type, fromId, desc});
  if(ph) hints.push('<span class="wt">Dafür liegen '+fmtMoney(ph.inPot)+' im Topf «'+esc(ph.potName)+'» — von dort zahlen?</span>'
    + '«'+esc(ph.item.name)+'» ist als variable Kosten geplant und schon zurückgelegt. Zahlst du vom Hauptkonto, ist es doppelt.');
  if(hints.length && !BOOKING_DUP_OK){
    el('b_dup').innerHTML = hints.join('<hr style="border:0;border-top:1px solid currentColor;opacity:.25;margin:8px 0">');
    el('b_dup').style.display='';
    el('b_savebtn').textContent='Trotzdem buchen';
    BOOKING_DUP_OK=true;
    return;
  }
  haptic();
  /* N12: das Flag nur setzen, wenn die Zeile auch sichtbar war — sonst trüge
     eine Buchung, für die die Frage gar nicht gestellt wurde, eine Antwort. */
  const livW = el('b_living_w');
  const livVisible = !!(livW && livW.style.display!=='none');
  const countsAsLiving = (livVisible && el('b_living') && !el('b_living').checked) ? false : undefined;
  if(editId){
    /* N22: Bearbeiten. Der patch trägt countsAsLiving NUR, wenn die Zeile
       sichtbar war — sonst bliebe ein bestehendes Flag ohne Frage entfernt. */
    const patch = {type, desc, amount, fromId, toId, date, goalId,
      incomeKind: type==='eingang'?el('b_kind').value:null};
    if(livVisible) patch.countsAsLiving = countsAsLiving;
    const snap = deepClone(S);
    if(!editEntry(S, editId, patch)){ showToast('Änderung nicht möglich.'); return; }
    closeSheet(); commitState();
    showToast('Buchung geändert — Salden neu gerechnet', restoreFn(snap));
    return;
  }
  const entry = addBooking(S,{type, desc, amount, fromId, toId, date, goalId, countsAsLiving, incomeKind: type==='eingang'?el('b_kind').value:null});
  const eid = entry.id;
  closeSheet(); commitState();
  showToast('Gebucht', ()=>{ deleteEntry(S,eid); commitState(); });
}

/* ─────────── Home: Monats- und Konten-Block ─────────── */
/* blockCurrentMonth ist in blockMonthYear aufgegangen (N1) — die Monatswerte
   (Lohn/Ausgaben/Saldo) stehen jetzt als Kennzahl-Reihe im Band «Dieser Monat &
   Jahr», sichtbar auf Handy UND Laptop. openMonth bleibt der Absprung. */
/* Home-Konten (Etappe 5/6): Hauptkonten MIT ihren Spaces (eingerückt, mit Saldo),
   Spaces pro Hauptkonto auf-/zuklappbar (SPEC 2.18), universelle +/− an jeder Zeile. */
function spacesCollapsedFor(mainId, spaceCount){
  const st = S.settings.spacesCollapsed || {};
  if(Object.prototype.hasOwnProperty.call(st, mainId)) return !!st[mainId];
  return spaceCount>3; /* Default: eingeklappt, wenn >3 Spaces */
}
function toggleSpaces(mainId){
  const spaces = S.accounts.filter(a=>a.parentId===mainId).length;
  S.settings.spacesCollapsed[mainId] = !spacesCollapsedFor(mainId, spaces);
  commitState();
}
function accMainRow(m, spaceCount, collapsed){
  const sub = [m.bank, KIND_LABELS[m.kind]].filter(Boolean).join(' · ');
  const chev = spaceCount>0
    ? `<button class="chev" aria-label="Spaces auf-/zuklappen" onclick="toggleSpaces('${m.id}')">${collapsed?'▶':'▼'}</button>`
    : `<span class="chev"></span>`;
  /* Spaces-Total (SPEC 2.34): eingeklappt gleich in der Sub-Zeile ablesbar */
  const spTot = spaceCount>0 ? spacesTotal(S, m.id) : null;
  return `<div class="row">
    ${chev}
    <button class="rowmain" onclick="openAccountForm('${m.id}')">
      <span class="emoji">${esc(m.emoji)||'▪︎'}</span>
      <div style="min-width:0"><div class="rname">${esc(m.name)}</div>
        <div class="rsub">${esc(sub)}${spaceCount?' · '+spaceCount+' Space'+(spaceCount>1?'s':'')+' · Σ '+fmtAmt(spTot):''}</div></div>
    </button>
    <div class="rowq"><span class="num amt ${m.balance<0?'neg':''}">${fmtMoney(m.balance)}</span>
      <button class="qadj" aria-label="Entnehmen" onclick="openQuickAdjust('account','${m.id}',-1)">−</button>
      <button class="qadj" aria-label="Einzahlen" onclick="openQuickAdjust('account','${m.id}',1)">＋</button>
    </div></div>`;
}
/* Abschlusszeile «Total Spaces … · inkl. Hauptkonto …» (SPEC 2.34):
   inkl. Hauptkonto = der Wert, den die Bank-App (Neon) als Total zeigt. */
function spacesTotalRow(m){
  const spTot = spacesTotal(S, m.id);
  return `<div class="row indent" style="min-height:0;padding-top:4px;padding-bottom:8px">
    <div class="rsub">Total Spaces</div>
    <div style="text-align:right"><div class="num amt">${fmtMoney(spTot)}</div>
      <div class="rsub">inkl. Hauptkonto ${fmtAmt(round2(spTot + m.balance))}</div></div></div>`;
}
function blockAccounts(){
  const shown = new Set();
  let rows = '';
  S.accounts.filter(a=>a.kind==='main' && a.showOnHome).forEach(m=>{
    shown.add(m.id);
    const spaces = S.accounts.filter(a=>a.parentId===m.id);
    const collapsed = spacesCollapsedFor(m.id, spaces.length);
    rows += accMainRow(m, spaces.length, collapsed);
    spaces.forEach(sp=>{ shown.add(sp.id); if(!collapsed) rows += accRow(sp,true,true); });
    if(spaces.length && !collapsed) rows += spacesTotalRow(m);
  });
  S.accounts.filter(a=>a.showOnHome && a.kind!=='space' && !shown.has(a.id)).forEach(a=>{ rows += accRow(a,false,true,true); });
  return `<section class="acc-tree"><span class="lbl sec">Konten</span>
    ${rows || '<div class="row hint">Keine Konten auf Home — unter «Konten» aktivierbar.</div>'}</section>`;
}

/* ─────────── Monate: Liste + YTD (dynamisch) ─────────── */
/* Monate-Liste nach gespeichertem Filter + Sortierung (SPEC 2.17):
   Filter Alle / Aktiv & Geplant / Archiv, Sortierung Neueste/Älteste zuerst. */
function filteredMonths(state){
  const f = state.settings.monthsFilter;
  let list = state.months.filter(m=>
    f==='active' ? (m.status==='curr'||m.status==='plan') :
    f==='archive' ? (m.status==='done') : true);
  list = list.slice().sort((a,b)=> state.settings.monthsSort==='asc' ? (a.id<b.id?-1:1) : (a.id<b.id?1:-1));
  return list;
}
function setMonthsFilter(f){ S.settings.monthsFilter = f; saveState(); render(); }
function setMonthsSort(s){ S.settings.monthsSort = s; saveState(); render(); }
function rMonate(){
  const ytd = ytdStats(S);
  const list = filteredMonths(S);
  const rows = list.map(m=>{
    const inc = monthIncome(S,m);
    const chip = {done:'Abgeschlossen',curr:'Aktuell',plan:'Geplant'}[m.status];
    return `<button class="row tap" onclick="openMonth('${m.id}')">
      <div class="rl"><div><div class="rname">${esc(m.name)} ${m.year}</div>
        <div class="rsub"><span class="chip ${m.status==='curr'?'on':''}">${chip}</span></div></div></div>
      <div><div class="num amt" style="text-align:right">${fmtAmt(inc.amount)}</div>
        <div class="rsub" style="text-align:right">Lohn · ${inc.label}</div></div></button>`;
  }).join('');
  const f = S.settings.monthsFilter, so = S.settings.monthsSort;
  const fLabel = {all:'Alle',active:'Aktiv & Geplant',archive:'Archiv'}[f];
  const soLabel = {desc:'Neueste zuerst',asc:'Älteste zuerst'}[so];
  const filterUI = MONTHS_FILTER_OPEN ? `
    <div class="seg" style="margin-bottom:8px">
      <button class="${f==='all'?'on':''}" onclick="setMonthsFilter('all')">Alle</button>
      <button class="${f==='active'?'on':''}" onclick="setMonthsFilter('active')">Aktiv &amp; Geplant</button>
      <button class="${f==='archive'?'on':''}" onclick="setMonthsFilter('archive')">Archiv</button>
    </div>
    <div class="seg" style="margin-bottom:6px">
      <button class="${so==='desc'?'on':''}" onclick="setMonthsSort('desc')">Neueste zuerst</button>
      <button class="${so==='asc'?'on':''}" onclick="setMonthsSort('asc')">Älteste zuerst</button>
    </div>` : '';
  return `
  <section>
    <span class="lbl sec">Jahr bisher (YTD) · ${monthLabel(ytd.from)} – ${monthLabel(ytd.to)}</span>
    <div class="row"><div class="rsub">Lohn</div><div class="num amt pos">${fmtMoney(ytd.income)}</div></div>
    <div class="row"><div class="rsub">Ausgaben</div><div class="num amt neg">${fmtMoney(ytd.expenses)}</div></div>
    <div class="row"><div class="rsub">Saldo</div><div class="num amt ${ytd.saldo<0?'neg':'pos'}">${fmtMoney(ytd.saldo)}</div></div>
    <button class="btn btn-ghost" onclick="goView('forecast')">Ausblick · geplante Monate ›</button>
  </section>
  <section><span class="lbl sec">Monate · ${list.length}</span>
    <button class="row tap" onclick="toggleMonthsFilter()" style="min-height:44px">
      <div class="rl"><span class="emoji">⇅</span><div class="rsub">${esc(fLabel)} · ${esc(soLabel)}</div></div>
      <div class="mut">${MONTHS_FILTER_OPEN?'Schliessen ▲':'Filtern ▼'}</div></button>
    ${filterUI}
    ${rows || '<div class="row hint">Keine Monate in dieser Ansicht.</div>'}
    <button class="btn btn-add" onclick="openNewMonthSheet()">＋ Monat anlegen</button>
  </section>`;
}
let MONTHS_FILTER_OPEN = false;
function toggleMonthsFilter(){ MONTHS_FILTER_OPEN = !MONTHS_FILTER_OPEN; render(); }
function nextMonthId(id){
  const y = parseInt(id.slice(0,4),10), m = parseInt(id.slice(5,7),10);
  return m===12 ? (y+1)+'-01' : y+'-'+pad2(m+1);
}
function openNewMonthSheet(){
  const last = S.months.length ? S.months[S.months.length-1].id : S.settings.currentMonthId;
  openSheet(`<div class="shead">Monat anlegen</div>
    <div class="ssub">Der neue Monat erhält eine Kopie der Fixkosten-Vorlage (${S.fixedCosts.length} Posten).</div>
    <label class="fld"><span class="lbl">Monat</span>${monthYearPicker('nm_id', nextMonthId(last), {})}</label>
    <button class="btn btn-acc" onclick="doCreateMonth()">Anlegen (geplant)</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function doCreateMonth(){
  const id = nMonthId(el('nm_id').value);
  if(!id){ showToast('Bitte einen Monat wählen.'); return; }
  if(monthById(S,id)){ showToast('Monat existiert bereits.'); return; }
  createMonthFromTemplate(S,id,'plan');
  closeSheet(); commitState(); openMonth(id);
}
function openMonth(id){ CUR_MONTH = id; goView('monat'); }

/* ═══════════ Etappe 8: Monats-Assistent (geführter Payday-Ablauf) ═══════════
   Reine Orchestrierung — jeder Schritt ruft bestehende Aktionen auf. */
let MA = {step:1};
function startAssistant(){ MA = {step:1}; VIEW='assistant'; closeSheet(); render(); }
function exitAssistant(){ VIEW='home'; render(); }
function assistantNext(){ if(MA.step<5){ MA.step++; render(); } else exitAssistant(); }
function assistantPrev(){ if(MA.step>1){ MA.step--; render(); } }
function rAssistant(){
  const st = assistantSteps(S);
  const step = MA.step;
  let body='';
  if(step===1) body = assistantStep1(st);
  else if(step===2) body = assistantStepQA(st.dist, 'Fixkosten & Spaces verteilen', 'Die fälligen Fix-Transfers und Abbuchungen dieses Geldmonats — einzeln abhaken oder alle auf einmal.');
  else if(step===3) body = assistantStepQA(st.pots, 'Sparpläne / %-Töpfe einzahlen', 'Die prozentualen Spar-Töpfe aus dem Überschuss dieses Monats.');
  else if(step===4) body = assistantStep4(st);
  else body = assistantStep5();
  return `<section>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="linkbtn" onclick="exitAssistant()">✕ Schliessen</button>
      <div class="rsub">Schritt ${step} / 5</div>
    </div>
    <div class="bar" style="margin:8px 0 16px"><i style="width:${step/5*100}%"></i></div>
    ${body}
    <div style="display:flex;gap:10px;margin-top:var(--sp3)">
      ${step>1?`<button class="btn btn-ghost" style="flex:0 0 96px" onclick="assistantPrev()">Zurück</button>`:''}
      <button class="btn btn-acc" style="flex:1" onclick="assistantNext()">${step<5?'Weiter':'Abschliessen'}</button>
    </div>
    ${step<5?`<button class="linkbtn" style="display:block;margin:8px auto 0" onclick="assistantNext()">Diesen Schritt überspringen</button>`:''}
  </section>`;
}
function assistantStep1(st){
  const w = st.salary;
  if(w){
    return `<div class="wiz-title">1 · Lohn bestätigen</div>
      <div class="wiz-sub">Gesamtlohn eintragen — bereits bezogene Instant Pays (${fmtAmt(w.instant)}) werden abgezogen, gebucht wird nur die Restauszahlung.</div>
      <div class="card mt2">
        <div class="row" style="border:none;padding:5px 0;min-height:0"><div class="rsub">Gesamtlohn (Vorschlag)</div><div class="num amt">${fmtAmt(w.gross)}</div></div>

function openRedistribute(fromId){
  const from = S.accounts.find(a=>a.id===fromId);

  const gb = goalBackedIds(S);
  const goalSel = (id, accId) => `<select id="${id}" style="margin-top:4px"><option value="">— Ziel wählen (Pflicht) —</option>
    ${goalsForAccount(S,accId).map(g=>`<option value="${g.id}">${esc(g.name)} · ${fmtAmt(g.saved)}</option>`).join('')}</select>`;
  /* Zielgebundene Quelle UND zielgebundenes Ziel in einer Buchung geht nicht
     (eine Buchung, ein Ziel) → solche Zielkonten ausblenden. */
  const targets = S.accounts.filter(a=>a.id!==fromId && !(gb.has(fromId) && gb.has(a.id)));
  const rows = targets.map(a=>`<label class="fld"><span class="lbl">${esc(a.name)} · ${esc(KIND_LABELS[a.kind])}</span>${padField('red_'+a.id,'','0.00','redSum')}${gb.has(a.id)?goalSel('redg_'+a.id, a.id):''}</label>`).join('');
  openSheet(`<div class="shead">Umverteilen · aus ${esc(from.name)}</div>
