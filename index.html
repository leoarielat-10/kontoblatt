function toggleColorBlind(){ S.settings.colorBlindMode = !S.settings.colorBlindMode; saveState(); render(); }

/* ─────────── Variable Kosten zur Seite legen (N6, SPEC 2.46) ─────────── */
/* Eine einzige Einstellung: WOHIN. Der Betrag kommt aus month.variable[], der
   Stand aus dem Verlauf — es gibt hier nichts weiter zu konfigurieren. */
function openVarReservePlanner(){
  const cur = S.settings.currentMonthId;
  const potId = S.settings.varReserveToId;
  const main = mainAccount(S);
  const gb = goalBackedIds(S);
  const opts = S.accounts.filter(a=>!main || a.id!==main.id)
    .map(a=>`<option value="${a.id}" ${potId===a.id?'selected':''} ${gb.has(a.id)?'disabled':''}>${esc(a.name)} · ${esc(KIND_LABELS[a.kind])}${gb.has(a.id)?' (gehört zu Sparzielen)':''}</option>`).join('');
  const total = varTotalFor(S, cur);
  const reserved = varReservedFor(S, cur);
  const m = monthById(S, cur);
  const list = (m && m.variable.length)
    ? m.variable.map(v=>`<div class="row" style="min-height:0;padding:5px 2px"><div class="rsub">${esc(v.name)}</div><div class="num amt">${fmtAmt(v.amount)}</div></div>`).join('')
    : '<div class="row hint">Für diesen Monat sind keine variablen Kosten geplant.</div>';
  openSheet(`<div class="shead">Variable Kosten zur Seite legen</div>
    <div class="ssub">Am Lohntag wandert die Summe deiner geplanten variablen Kosten als Transfer vom Hauptkonto in einen Topf. Dein «Rest zum Ausgeben» sinkt dadurch von selbst — weil das Geld wirklich nicht mehr auf dem Hauptkonto liegt. Bezahlt wird später aus dem Topf.</div>
    <label class="fld"><span class="lbl">Topf-Konto</span>
      <select id="vr_to"><option value="">— nicht eingerichtet —</option>${opts}</select></label>
    <div class="hint mt1">Ohne Topf-Konto erscheint keine Schnellaktion. Konten, die zu einem Sparziel gehören, kommen nicht in Frage — dort verlangt jede Buchung ein Ziel (Ziel-Kopplung).</div>
    <div class="card mt2">
      <div class="rname">${esc(monthLabel(cur))} · geplant</div>
      ${list}
      <div class="row" style="min-height:0;padding-top:6px"><div class="rsub">Summe</div><div class="num amt">${fmtAmt(total)}</div></div>
      ${reserved>0?`<div class="row" style="min-height:0;padding:2px"><div class="rsub">bereits zurückgelegt</div><div class="num amt">${fmtAmt(reserved)}</div></div>`:''}
    </div>
    <button class="btn btn-acc" onclick="saveVarReservePlanner()">Speichern</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveVarReservePlanner(){
  const v = el('vr_to').value;
  S.settings.varReserveToId = v || null;
  closeSheet(); commitState();
  showToast(v ? 'Topf gesetzt: '+accName(S,v) : 'Topf entfernt — keine Rücklage-Schnellaktion mehr');
}

/* ─────────── Steuer-Planer (E9) ─────────── */
function taxTemplateCandidates(){ return S.fixedCosts.filter(f=>/steuer/i.test(f.name)); }
function openTaxPlanner(){
  const tp = S.taxPlan;
  const main = mainAccount(S);
  const accOpts = sel => S.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} · ${esc(KIND_LABELS[a.kind])}</option>`).join('');
  const rate = taxMonthlyRate(S);
  const rem = tp.dueMonth ? taxRemainingMonths(S) : null;
  const sf = salaryForecast(S);
  const cand = taxTemplateCandidates();
  openSheet(`<div class="shead">Steuer-Planer</div>
    <div class="ssub">Dynamische Rücklage auf ein Ziel-Konto. Trag den Steuerbetrag laut Kanton (AG) + Fälligkeit ein — die App rechnet die Monatsrate automatisch und passt sie an, wenn sich Betrag oder Restmonate ändern.</div>
    <div class="togl"><span class="lbl">Steuer-Planer aktiv</span><input type="checkbox" id="tax_on" ${tp.enabled?'checked':''}></div>
    <label class="fld"><span class="lbl">Steuerbetrag total (${esc(S.settings.currency)})</span>${padField('tax_amount', tp.amount||'')}</label>
    <div class="frow">
      <label class="fld"><span class="lbl">Fällig im</span>${monthYearPicker('tax_due', tp.dueMonth||'', {allowEmpty:true})}</label>
      <label class="fld"><span class="lbl">Bereits zurückgelegt</span>${padField('tax_reserved', tp.reserved||'')}</label>
    </div>
    <label class="fld"><span class="lbl">Rücklage-Konto (Standard: Space «Sonstiges»)</span><select id="tax_to"><option value="">— wählen —</option>${accOpts(tp.reserveToId)}</select></label>
    <label class="fld"><span class="lbl">Rücklage ab Konto</span><select id="tax_from"><option value="">— wählen —</option>${accOpts(tp.fromId || (main?main.id:null))}</select></label>
    ${(tp.enabled && tp.dueMonth && tp.amount>0) ? (()=>{
      /* N2 (B1): bezahlt → «erledigt»-Karte statt Rate/Kohärenz. Kein Auto-Roll —
         wartet auf neuen Betrag + Fälligkeit; deren Merker ist leer → Reaktivierung. */
      if(taxPaid(S)) return `<div class="card mt2" style="border-color:var(--acc)">
        <div class="rname">Steuern ${esc(monthLabel(tp.dueMonth))} · bezahlt ✓</div>
        <div class="rsub" style="margin-top:2px">Für die nächste Rechnung Betrag + Fälligkeitsmonat neu setzen — der Planer läuft dann automatisch wieder an.</div></div>`;
      /* Kohärenz-Flag (SPEC 2.30): überfällig deutlich, «Rate wirkt hoch» dezent */
      const tc = taxCoherence(S);
      const flag = !tc ? '' : (tc.overdue
        ? `<div class="warnbox strong mt1">Fälligkeit ${esc(monthLabel(tc.dueMonth))} erreicht — es fehlen <b>${fmtMoney(tc.missing)}</b>. Nötige Rücklage jetzt: ${fmtAmt(tc.rate)}/Mo.</div>`
        : (tc.rateHigh ? `<div class="warnbox mt1">Nötige Rücklage ${fmtAmt(tc.rate)}/Mo wirkt hoch (über Ø-Liquidität der Planmonate) — im Monats-Check prüfen.</div>` : ''));
      return `<div class="card mt2">
      <div class="rname">Steuern ${fmtAmt(tp.amount)} · ${fmtAmt(rate)}/Mo bis ${esc(germanMonthName(tp.dueMonth))}</div>
      <div class="rsub" style="margin-top:2px">noch ${rem} Monat${rem===1?'':'e'} · zurückgelegt ${fmtAmt(tp.reserved)} · Einkommens-Kontext: Jahreslohn ~${fmtAmt(sf.total)}</div></div>`+flag;
    })() : ''}
    <button class="btn btn-acc" onclick="saveTaxPlan()">Speichern</button>
    ${cand.length?`<button class="btn btn-ghost" onclick="removeTaxTemplate()">Alten «Steuern»-Fixposten aus Vorlage entfernen (${cand.length})</button>`:''}
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveTaxPlan(){
  S.taxPlan = {
    enabled: el('tax_on').checked,
    amount: parseAmount(el('tax_amount').value),
    dueMonth: nMonthId(el('tax_due').value),
    reserveToId: el('tax_to').value || null,
    fromId: el('tax_from').value || null,
    reserved: parseAmount(el('tax_reserved').value)
  };
  closeSheet(); commitState(); showToast('Steuer-Planer gespeichert');
}
function removeTaxTemplate(){
  const ids = new Set(taxTemplateCandidates().map(f=>f.id));
  S.fixedCosts = S.fixedCosts.filter(f=>!ids.has(f.id));   /* nur Vorlage — bestehende Monate unberührt */
  commitState(); openTaxPlanner(); showToast('Steuer-Vorlageposten entfernt (Monate unberührt)');
}
function backupInfoText(){
  const d = daysSinceBackup(S, today());
  return d===null ? 'Noch kein Backup erstellt — Export empfohlen.'
    : 'Letztes Backup vor '+d+' '+(d===1?'Tag':'Tagen')+' ('+fmtDate(S.settings.lastBackupAt)+').';
}
/* Rückgängig-Ansicht (E7, N8 ausgebaut): das Rücknehmen NACH dem flüchtigen
   Toast. Jeder Punkt zeigt, wie lange er her ist und welche Aktion zu ihm
   geführt hat (snapLabel) — der Snapshot entsteht NACH der Änderung. */
function fmtSnapTs(ts){ const d=new Date(ts); if(isNaN(d.getTime())) return String(ts); return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function snapSummary(st){ try{
  const n = (v,ein,mehr)=>v+' '+(v===1?ein:mehr);
  return n(st.accounts.length,'Konto','Konten')+' · '+n(st.ledger.length,'Buchung','Buchungen')+' · '+n(st.months.length,'Monat','Monate');
}catch(e){ return ''; } }
function snapTitle(s){ return (s && s.label) ? s.label : 'Gesicherter Stand'; }
function rRestore(){
  const snaps = loadSnapshots();
  const now = Date.now();
  const rows = snaps.map((s,i)=>{
    const cur = i===0 ? '<span class="chip" style="margin-left:8px">jetziger Stand</span>' : '';
    return `<div class="row">
      <button class="rowmain" onclick="doRestore(${i})"><div style="min-width:0">
        <div class="rname" style="white-space:normal">${esc(relTime(s.ts, now))} · ${esc(snapTitle(s))}${cur}</div>
        <div class="rsub" style="white-space:normal">${esc(fmtSnapTs(s.ts))} · ${esc(snapSummary(s.state))}</div></div></button>
      <button class="btn btn-ghost" style="width:auto;margin:0;padding:9px 14px;flex:none" onclick="doRestore(${i})">Zurück</button></div>`;
  }).join('');
  return `<section>
    <button class="linkbtn" onclick="goView('einst')">‹ Einstellungen</button>
    <span class="lbl sec mt1">Rückgängig</span>
    <div class="hint" style="padding:10px 2px">Die letzten ${SNAP_MAX} Stände werden bei jeder Änderung automatisch gesichert — rein lokal, kein Server, nicht im Export. Ein Punkt zeigt den Stand <b>nach</b> der genannten Aktion. Der Rücksprung wird selbst gesichert und ist damit wieder rücknehmbar.</div>
    ${rows || '<div class="row hint">Noch keine Punkte — sie entstehen automatisch bei Änderungen.</div>'}
  </section>`;
}
function doRestore(i){
  const snap = loadSnapshots()[i];
  if(!snap){ showToast('Punkt nicht gefunden.'); return; }
  openSheet(`<div class="shead">Zu diesem Stand zurück?</div>
    <div class="ssub">Zurück auf <b>${esc(relTime(snap.ts))} · ${esc(snapTitle(snap))}</b> (${esc(fmtSnapTs(snap.ts))}, ${esc(snapSummary(snap.state))}).
    <b>Alles, was du seither geändert hast, wird verworfen.</b> Der Rücksprung wird selbst als Punkt gesichert — du kommst also wieder zurück.</div>
    <button class="btn btn-acc" onclick="reallyRestore(${i})">Zu diesem Stand zurück</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function reallyRestore(i){
  const snap = loadSnapshots()[i];
  closeSheet();
  if(!snap) return;
  const before = deepClone(S);
  /* Erst den JETZIGEN Stand sichern (sonst ist der Rücksprung nur so lange
     umkehrbar, wie der Toast steht), dann zurückspringen und auch den
     wiederhergestellten Stand als eigenen Punkt ablegen. */
  recordSnapshot('Stand vor dem Rücksprung');
  S = normalizeState(snap.state);
  saveState(); recordSnapshot('Rücksprung auf '+fmtSnapTs(snap.ts));
  render();
  showToast('Zustand wiederhergestellt', restoreFn(before));
}
function setLiquidMinimum(v){ S.settings.liquidMinimum = parseAmount(v); saveState(); render(); showToast('Warnschwelle: '+fmtMoney(S.settings.liquidMinimum)); }
function applyBufferSuggestion(){ S.settings.liquidMinimum = bufferSuggestion(S); saveState(); render(); showToast('Empfehlung übernommen: '+fmtMoney(S.settings.liquidMinimum)); }

/* ─────────── Feedback-Center (SPEC 2.13) ─────────── */
function rFeedback(){
  const open = S.feedback.filter(f=>f.status==='open');
  const done = S.feedback.filter(f=>f.status==='done');
  const row = f=>`<div class="row">
    <button class="qcheck" style="${f.status==='done'?'background:var(--acc)':''}" aria-label="Erledigt umschalten" onclick="toggleFeedback('${f.id}')"></button>
    <button style="text-align:left;flex:1;min-width:0;padding:4px 0" onclick="openFeedbackForm('${f.id}')">
      <div class="rname" style="white-space:normal;${f.status==='done'?'text-decoration:line-through;color:var(--mut)':''}">${esc(f.text)}</div>
      <div class="rsub">${fmtDate(f.date)}</div>
    </button></div>`;
  return `<section>
    <button class="linkbtn" onclick="goView('einst')">‹ Einstellungen</button>
    <span class="lbl sec mt1">Feedback-Center${open.length?' · '+open.length+' offen':''}</span>
    <div class="hint" style="padding:10px 2px">Kurze Notizen und Anpassungswünsche. Die Einträge gehen beim Export mit (Datei und Copy-Feld) und werden beim Import zusammengeführt.</div>
    ${S.feedback.length?'<button class="btn btn-add" onclick="openFeedbackForm(null)">＋ Notiz</button>':''}
    ${open.map(row).join('')}${done.map(row).join('')}
    ${!S.feedback.length?'<div class="row hint">Noch keine Notizen.</div>':''}
    <button class="btn btn-add" onclick="openFeedbackForm(null)">＋ Notiz</button>
  </section>`;
}
function toggleFeedback(id){
  const f = S.feedback.find(x=>x.id===id);
  if(!f) return;
  f.status = f.status==='open' ? 'done' : 'open';
  commitState();
}
function openFeedbackForm(id){
  const f = id ? S.feedback.find(x=>x.id===id) : null;
  openSheet(`<div class="shead">${f?'Notiz bearbeiten':'Neue Notiz'}</div>
    <label class="fld"><span class="lbl">Text</span><textarea id="fb_text">${esc(f?f.text:'')}</textarea></label>
    <div class="frow">
      <label class="fld"><span class="lbl">Datum</span><input type="date" id="fb_date" value="${f?f.date:today()}"></label>
      ${f?`<label class="fld"><span class="lbl">Status</span><select id="fb_status">
        <option value="open" ${f.status==='open'?'selected':''}>Offen</option>
        <option value="done" ${f.status==='done'?'selected':''}>Erledigt</option></select></label>`:''}
    </div>
    <button class="btn btn-acc" onclick="saveFeedback('${id||''}')">Speichern</button>
    ${f?`<button class="btn btn-danger" onclick="deleteFeedback('${f.id}')">Löschen</button>`:''}
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function saveFeedback(id){
  const text = el('fb_text').value.trim();
  if(!text){ showToast('Bitte einen Text angeben.'); return; }
  const f = id ? S.feedback.find(x=>x.id===id) : null;
  if(f){ f.text = text; f.date = nDate(el('fb_date').value); f.status = el('fb_status').value; }
  else S.feedback.push({id:uid(), date:nDate(el('fb_date').value), text, status:'open'});
  closeSheet(); commitState();
}
function deleteFeedback(id){
  const snap = deepClone(S);
  S.feedback = S.feedback.filter(x=>x.id!==id);
  closeSheet(); commitState();
  showToast('Notiz gelöscht', restoreFn(snap));
}

/* ─────────── Vorschläge von Claude (SPEC 2.19): Import-Inbox ─────────── */
function rProposals(){
  const open = S.claudeProposals.filter(p=>p.status==='open');
  const other = S.claudeProposals.filter(p=>p.status!=='open');
  const card = p=>{
    const acts = p.actions.map(a=>`<div class="rsub" style="margin-top:3px">• ${esc(proposalActionText(S,a))}</div>`).join('');
    const below = p.status==='open' ? proposalMainBelowMin(S,p.id) : 0;
    return `<div class="card" style="margin-top:var(--sp2)${p.priority==='high'?';border-color:var(--warn)':''}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <div class="rname" style="white-space:normal">${esc(p.title)}</div>
        <span class="chip ${p.priority==='high'?'on':''}">${p.priority==='high'?'Hoch':'Normal'}</span>
      </div>
      <div class="rsub" style="margin-top:1px">${fmtDate(p.date)}</div>
      ${p.rationale?`<div style="margin-top:var(--sp1);font-size:14px">${esc(p.rationale)}</div>`:''}
      <div class="mt1">${acts||'<div class="rsub">Keine Aktionen.</div>'}</div>
      ${below>0?`<div class="warnbox mt1">Annehmen würde das Hauptkonto ${fmtMoney(below)} unter dein Minimum drücken.</div>`:''}
      ${p.status==='open'?`<div style="display:flex;gap:10px;margin-top:var(--sp2)">
        <button class="btn btn-acc" style="flex:1;margin-top:0" onclick="doAcceptProposal('${p.id}')">Annehmen</button>
        <button class="btn btn-ghost" style="flex:1;margin-top:0" onclick="doDismissProposal('${p.id}')">Ablehnen</button></div>`
        :`<div class="rsub mt1">${p.status==='accepted'?'✓ Angenommen':'✕ Abgelehnt'}</div>`}
    </div>`;
  };
  return `<section>
    <button class="linkbtn" onclick="goView('einst')">‹ Einstellungen</button>
    <span class="lbl sec mt1">Vorschläge von Claude${open.length?' · '+open.length+' offen':''}</span>
    <div class="hint" style="padding:10px 2px">Kommen per Import in deine Inbox — nichts wird automatisch angewendet. «Annehmen» führt die Aktionen aus (mit Rückgängig), «Ablehnen» verwirft.</div>
    ${open.map(card).join('') || '<div class="row hint">Keine offenen Vorschläge.</div>'}
    ${other.length?`<span class="lbl sec mt3">Erledigt</span>${other.map(card).join('')}`:''}
  </section>`;
}
function doAcceptProposal(id){
  const below = proposalMainBelowMin(S,id);
  const p = S.claudeProposals.find(x=>x.id===id);
  if(below>0 && !(p && p._confirmed)){
    openSheet(`<div class="shead">Vorschlag annehmen?</div>
      <div class="ssub">Dieser Vorschlag würde das Hauptkonto ${fmtMoney(below)} unter deine Warnschwelle drücken. Trotzdem ausführen?</div>
      <button class="btn btn-acc" onclick="reallyAcceptProposal('${id}')">Trotzdem annehmen</button>
      <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
    return;
  }
  reallyAcceptProposal(id);
}
function reallyAcceptProposal(id){
  const snap = deepClone(S);
  const res = applyProposal(S, id);
  closeSheet();
  if(!res){ showToast('Nicht möglich.'); return; }
  haptic(12); commitState();
  const n = res.done.filter(d=>d.entry).length;
  showToast('Vorschlag angenommen'+(n?' · '+n+' gebucht':''), restoreFn(snap));
}
function doDismissProposal(id){
  const snap = deepClone(S);
  dismissProposal(S, id);
  commitState();
  showToast('Vorschlag abgelehnt', restoreFn(snap));
}


/* ─────────── Cloud-Sync über GitHub — Oberfläche + Netz (N23) ─────────── */
/* Der EINZIGE Ort, an dem das Token die App verlässt: der Authorization-Header.
   Es steht in keinem Körper, in keiner URL, in keiner Meldung, in keinem Log. */
function ghFetch(cfg, method, body){
  const c = normalizeSyncCfg(cfg);
  const init = { method: method, headers: {
    'Authorization': 'Bearer '+c.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28' } };
  if(body){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  return fetch(syncContentsUrl(c), init);
}
function fmtSyncTs(iso){ return iso ? fmtSnapTs(iso) : '—'; }
function syncStatusHtml(){
  const c = loadSyncCfg();
  return 'Zuletzt hochgeladen: <b>'+esc(fmtSyncTs(c.lastUpload))+'</b><br>'
       + 'Zuletzt heruntergeladen: <b>'+esc(fmtSyncTs(c.lastDownload))+'</b>';
}
/* Meldungen erscheinen IM Abschnitt, nicht als flüchtiger Toast: ein
   Sync-Fehler will gelesen und behoben werden. */
function syncMsg(text, bad){
  const d = el('sync_msg'); if(!d) return;
  d.innerHTML = text
    ? '<div class="card mt2" style="border-color:'+(bad?'var(--neg)':'var(--acc)')+'"><div style="font-size:14px;color:'
      + (bad?'var(--neg)':'var(--pos)')+'">'+esc(text)+'</div></div>'
    : '';
}
function syncBusy(on, label){
  const b = el('sync_busy'); if(b) b.textContent = on ? (label||'…') : '';
  const ready = syncConfigured(loadSyncCfg());
  ['sync_up','sync_down'].forEach(id=>{ const x = el(id); if(x) x.disabled = on || !ready; });
  if(on) syncMsg('');
}
/* Tippen speichert sofort — die Zugangsdaten sind kein Teil des States und
   laufen deshalb bewusst NICHT über commitState()/saveState(). Kein
   Re-Render: das würde beim Tippen den Fokus aus dem Feld werfen. */
function syncSetField(key, val){
  if(['owner','repo','path','token'].indexOf(key)<0) return;
  const cfg = loadSyncCfg();
  cfg[key] = String(val==null?'':val);
  saveSyncCfg(cfg);
  syncRefresh();
}
function syncRefresh(){
  const ready = syncConfigured(loadSyncCfg());
  ['sync_up','sync_down'].forEach(id=>{ const x = el(id); if(x) x.disabled = !ready; });
  const n = el('sync_need'); if(n) n.hidden = ready;
  const st = el('sync_status'); if(st) st.innerHTML = syncStatusHtml();
}

/* HOCHLADEN: GET (nur um die sha der bestehenden Datei zu holen) → PUT.
   404 beim GET heisst «gibt es drüben noch nicht» und ist KEIN Fehler. */
async function doSyncUpload(){
  const cfg = loadSyncCfg();
  if(!syncConfigured(cfg)){ syncMsg('Erst Benutzername, Repository, Dateipfad und Token eintragen.', true); return; }
  syncBusy(true, 'Lädt hoch …');
  let sha = null;
  try{
    const g = await ghFetch(cfg, 'GET', null);
    if(g.status===200){ const j = await g.json(); sha = (j && j.sha) ? j.sha : null; }
    else if(g.status!==404){ syncBusy(false); syncMsg(syncErrorText(g.status,'upload'), true); return; }
  }catch(e){ syncBusy(false); syncMsg(syncErrorText(0,'upload'), true); return; }
  const ts = syncStamp();
  try{
    const r = await ghFetch(cfg, 'PUT', syncUploadBody(S, sha, ts));
    if(r.status!==200 && r.status!==201){ syncBusy(false); syncMsg(syncErrorText(r.status,'upload'), true); return; }
  }catch(e){ syncBusy(false); syncMsg(syncErrorText(0,'upload'), true); return; }
  /* Zeitstempel gehört zu den Zugangsdaten, nicht in den State. */
  const c2 = loadSyncCfg(); c2.lastUpload = ts; saveSyncCfg(c2);
  syncBusy(false);
  syncRefresh();
  syncMsg('Hochgeladen · '+fmtSyncTs(ts)+(sha?'':' · Datei neu angelegt'), false);
  markBackup();   /* ein Upload IST ein Backup — sonst mahnt der Nudge (2.21) weiter */
}

/* HERUNTERLADEN: holen, dekodieren, auf gültiges JSON prüfen — und dann in den
   BESTEHENDEN Import-Pfad geben. Kein zweiter Merge, keine zweite Vorschau:
   die Datei landet im Textfeld des Import-Sheets, checkImport() macht daraus
   die gewohnte Zusammenfassung (mergeStates + Haken «Einstellungen &
   Planer-Stände», Default AUS — Sonderfall 23). Angewendet wird erst mit
   «Import anwenden». Genau derselbe Weg wie readImportFile(). */
async function doSyncDownload(){
  const cfg = loadSyncCfg();
  if(!syncConfigured(cfg)){ syncMsg('Erst Benutzername, Repository, Dateipfad und Token eintragen.', true); return; }
  syncBusy(true, 'Holt …');
  let txt;
  try{
    const r = await ghFetch(cfg, 'GET', null);
    if(r.status!==200){ syncBusy(false); syncMsg(syncErrorText(r.status,'download'), true); return; }
    const j = await r.json();
    /* Über 1 MB antwortet GitHub mit encoding:'none' und leerem content. */
    if(!j || j.encoding!=='base64' || typeof j.content!=='string'){ syncBusy(false); syncMsg(syncErrorText('big','download'), true); return; }
    txt = base64ToUtf8(j.content);
  }catch(e){ syncBusy(false); syncMsg(syncErrorText(0,'download'), true); return; }
  try{ JSON.parse(txt); }
  catch(e){ syncBusy(false); syncMsg(syncErrorText('json','download'), true); return; }
  const ts = syncStamp();
  const c2 = loadSyncCfg(); c2.lastDownload = ts; saveSyncCfg(c2);
  syncBusy(false);
  syncRefresh();
  openImportSheet();
  const ta = el('imp_ta');
  if(ta){ ta.value = txt; checkImport(); }
}

/* ─────────── Export ─────────── */
/* Ein Aufrufer der EINEN Serialisierung (N23); der Upload ist der zweite.
   Was hier herausfällt, ist Wort für Wort das, was hochgeladen wird. */
function exportJSON(){ return exportStateJSON(S); }
/* Backup-Datum merken (Nudge, E7). Kein Re-Render erzwingen — greift beim nächsten. */
function markBackup(){ if(S && S.setupComplete){ S.settings.lastBackupAt = today(); saveState(); } }
function downloadExport(prefix){
  const blob = new Blob([exportJSON()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (prefix||'kontoblatt-export')+'-'+today()+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  markBackup();
}
function openExportSheet(){
  openSheet(`
    <div class="shead">Export</div>
    <div class="ssub">Kompletter Stand inkl. Feedback — als Datei oder zum Kopieren.</div>
    <button class="btn btn-acc" onclick="downloadExport()">Als Datei herunterladen</button>
    <label class="fld"><span class="lbl">JSON zum Kopieren</span>
      <textarea id="exp_ta" readonly style="min-height:130px" class="mono">${esc(exportJSON())}</textarea></label>
    <button class="btn btn-ghost" onclick="copyExport()">In Zwischenablage kopieren</button>
    <button class="btn btn-ghost" onclick="copyForClaude()">Für Claude kopieren (Anleitung + JSON)</button>
    <button class="btn-text" onclick="closeSheet()">Schliessen</button>`);
}
function copyExport(){
  const ta = el('exp_ta');
  ta.focus(); ta.select();
  const done = ()=>{ markBackup(); showToast('Kopiert — als Backup vermerkt'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done, ()=>{ document.execCommand('copy'); done(); });
  } else { document.execCommand('copy'); done(); }
}
/* U1.5: Ein-Tap-Paket für den Chat — Standard-Instruktion + kompletter Export.
   todos[] + claudeProposals[] sind das Austauschformat (SPEC 3b), Merge über id. */
function claudeHandoffText(){
  return [
    'Mein Kontoblatt-Stand als JSON (unten). So arbeitest du damit:',
    '- Antworte mit dem VOLLSTÄNDIGEN JSON zurück und ändere darin NUR todos[] und claudeProposals[] — alles andere unangetastet lassen.',
    '- todos[] = Aufgaben/Game-Plan. Jedes todo hat eine stabile id (Merge läuft darüber): bestehende ids nie ändern, neue todos mit neuer id und source:"claude" anhängen. status/doneAt/seen bestehender todos nicht anfassen — mein Erledigt-Status gewinnt beim Import immer.',
    '- Keine todos mit source:"system" erzeugen oder ändern (verwaltet die App selbst; sie werden beim Import ignoriert).',
    '- claudeProposals[] = konkrete Geldbewegungen als Vorschlag: {id, date, title, rationale, priority:"normal"|"high", status:"open", actions:[…]}. Aktions-Arten: transfer {fromId,toId,amount,desc}, setBalance {accountId,amount,desc}, setField {path,value,desc} (nur Whitelist wie settings.liquidMinimum sowie months.<JJJJ-MM>.liquidMinimum = Warnschwelle EINES Monats, value null = wieder global), note {text}. Nichts wird automatisch ausgeführt — ich bestätige jede Aktion in der App.',
    '- Berührt eine Aktion ein zielgebundenes Konto (ein Konto, auf das ein goals[]-Eintrag via accountId zeigt), braucht sie zusätzlich action.goalId — sonst wird sie beim Annehmen übersprungen.',
    '- Der Import ist ein Merge über id: Weglassen löscht nichts, Doppel-Senden erzeugt keine Duplikate.',
    '', ''
  ].join('\n') + exportJSON();
}
function copyForClaude(){
  const txt = claudeHandoffText();
  const done = ()=>{ markBackup(); showToast('Für Claude kopiert — Anleitung + Export'); };
  const fallback = ()=>{
    const ta = el('exp_ta');
    if(ta){ const keep = ta.value; ta.value = txt; ta.focus(); ta.select();
      document.execCommand('copy'); ta.value = keep; }
    done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
}

/* ─────────── Import (Merge mit Vorschau) ─────────── */
function openImportSheet(){
  PENDING_IMPORT = null;
  openSheet(`
    <div class="shead">Import</div>
    <div class="ssub">JSON einfügen oder Datei wählen. Vor dem Anwenden zeigt dir Kontoblatt, was zusammengeführt wird.</div>
    <label class="fld"><span class="lbl">Datei</span><input type="file" id="imp_file" accept=".json,application/json" onchange="readImportFile(this)"></label>
    <label class="fld"><span class="lbl">…oder JSON einfügen</span>
      <textarea id="imp_ta" class="mono" style="min-height:130px" placeholder='{"schemaVersion":1, …}'></textarea></label>
    <button class="btn btn-acc" onclick="checkImport()">Prüfen</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>
    <div id="imp_result"></div>`);
}
function readImportFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ el('imp_ta').value = String(r.result); checkImport(); };
  r.readAsText(f);
}
function checkImport(){
  const txt = el('imp_ta').value.trim();
  if(!txt){ showToast('Kein JSON vorhanden.'); return; }
  let raw;
  try{ raw = JSON.parse(txt); }
  catch(e){ el('imp_result').innerHTML = `<div class="card hint" style="margin-top:var(--sp2);color:var(--neg)">Kein gültiges JSON: ${esc(e.message)}</div>`; return; }
  let mig;
  try{ mig = migrateToV1(raw); }
  catch(e){ el('imp_result').innerHTML = `<div class="card hint" style="margin-top:var(--sp2);color:var(--neg)">${esc(e.message)}</div>`; return; }
  /* U2.2 (Sonderfall 23): Checkbox-Zustand VOR dem Neuaufbau lesen (Default AUS =
     lokale settings/workModel/savingsModel/taxPlan bleiben, nur Daten werden gemergt). */
  const adopt = !!(el('imp_adopt') && el('imp_adopt').checked);
  /* N4 (Sonderfall 23): Präsenz der vier Blöcke an der ROHEN JSON bestimmen —
     migrateToV1 normalisiert und hätte danach immer alle vier. Beim alten
     Flach-Format sind Einstellungen echter Bestandteil der Migration
     (migrateFlatV0 leitet sie aus den Ur-Daten ab) → als vorhanden behandeln. */
  const present = mig.format==='flat-v0'
    ? {settings:true, workModel:true, savingsModel:true, taxPlan:false}
    : presentSettingsBlocks(raw);
  const anyBlock = anySettingsBlock(present);
  const {merged, summary} = mergeStates(S, mig.state, {adoptSettings: adopt && anyBlock, presentBlocks: present});
  PENDING_IMPORT = merged;
  const fmtLabel = mig.format==='flat-v0' ? 'Altes Flach-Format (Ur-App) — automatisch migriert' : 'SPEC-Schema v1';
  const lines = summary.collections
    .filter(c=>c.neu||c.akt||c.beh)
    .map(c=>`${c.label}: ${c.neu} neu · ${c.akt} aktualisiert · ${c.beh} nur lokal (bleiben)`);
  lines.push(`Verlauf: ${summary.ledger.neu} neu · ${summary.ledger.dupl} Duplikate übersprungen`);
  const sd = settingsDiff(normalizeState(S), mig.state, present);
  let sdHtml = '';
  if(sd.length){
    sdHtml = adopt
      ? `<div style="margin-top:var(--sp2);font-size:14px"><span class="lbl">Einstellungen — werden übernommen:</span><br>${sd.map(l=>'• '+esc(l)).join('<br>')}</div>`
      : `<div class="hint" style="margin-top:var(--sp2);font-size:13px"><span class="lbl">Abweichungen im Import — werden NICHT übernommen:</span><br>${sd.map(l=>'• '+esc(l)).join('<br>')}</div>`;
  }
  /* N4: ruhige Zeile für die Blöcke, die der Import gar nicht enthält — sie
     bleiben unverändert, egal wie der Haken steht. Ist KEINER der vier dabei
     (Kurz-JSON, der Normalfall), erscheint die Checkbox gar nicht erst. */
  const missing = SETTINGS_BLOCKS.filter(k=>!present[k]);
  const MISS_LBL = {settings:'Einstellungen', workModel:'Arbeitsmodell', savingsModel:'Sparmodell', taxPlan:'Steuer-Planer'};
  const missHtml = missing.length
    ? `<div class="hint" style="margin-top:var(--sp2);font-size:13px">${esc(missing.map(k=>MISS_LBL[k]).join(', '))} ${missing.length>1?'sind':'ist'} im Import nicht enthalten — bleib${missing.length>1?'en':'t'} unverändert.</div>`
    : '';
  const adoptHtml = anyBlock
    ? `<div class="togl mt2"><span class="lbl">Einstellungen &amp; Planer-Stände aus Import übernehmen</span>
        <input type="checkbox" id="imp_adopt" ${adopt?'checked':''} aria-label="Einstellungen aus Import übernehmen" onchange="checkImport()"></div>`
    : '';
  el('imp_result').innerHTML = `
    <div class="card mt3">
      <span class="lbl">Erkannt: ${esc(fmtLabel)}</span>
      <div style="margin-top:var(--sp1);font-size:14px">${lines.map(l=>'• '+esc(l)).join('<br>')}</div>
      ${adoptHtml}
      ${sdHtml}
      ${missHtml}
    </div>
    <button class="btn btn-acc" onclick="applyImport()">Import anwenden</button>`;
}
function applyImport(){
  if(!PENDING_IMPORT) return;
  S = PENDING_IMPORT;
  PENDING_IMPORT = null;
  syncSystemTodos(S);   /* System-To-Dos nach Import abgleichen (SPEC 2.33) */
  saveState();
  closeSheet();
  render();
  showToast('Import angewendet');
}

/* ─────────── Komplett neu einrichten ─────────── */
function confirmReset(){
  openSheet(`
    <div class="shead">Komplett neu einrichten?</div>
    <div class="ssub">Alle Daten in dieser App werden gelöscht und der Setup-Assistent startet neu.
    Vorher wird automatisch ein Export-Backup heruntergeladen.</div>
    <button class="btn btn-danger" onclick="doReset()">Backup laden & neu einrichten</button>
    <button class="btn-text" onclick="closeSheet()">Abbrechen</button>`);
}
function doReset(){
  downloadExport('kontoblatt-backup');
  S = defaultState();
  saveState();
  WIZ = null;
  closeSheet();
  VIEW = 'home';
  render();
}

/* ─────────── Selbst-Check-Ansicht ─────────── */
function rChecks(){
  const rep = runSelfChecks();
  const rows = rep.results.map(r=>`
    <div class="chk"><span class="dot ${r.ok?'ok':'bad'}"></span>
      <div style="min-width:0"><div class="rname" style="white-space:normal">${esc(r.name)}</div>
      <div class="rsub">${r.details.filter(d=>d.ok).length} / ${r.details.length} Prüfpunkte</div>
      ${r.details.filter(d=>!d.ok).map(d=>`<div class="chk-det">✗ ${esc(d.msg)}</div>`).join('')}
      </div></div>`).join('');
  return `
  <section>
    <button class="linkbtn" onclick="goView('einst')">‹ Einstellungen</button>
    <span class="lbl sec mt1">Selbst-Checks</span>
    <div style="padding:14px 2px;font-weight:750;font-size:17px" class="${rep.failed?'neg':'pos'}">
      ${rep.passed} von ${rep.results.length} Checks bestanden${rep.failed?' · '+rep.failed+' fehlgeschlagen':''}
    </div>
    ${rows}
  </section>
  <section class="card hint">Geprüft werden pure Funktionen mit festen Fällen — u. a. echte Ur-App-Daten und ein kompletter SPEC-v1-Export. Auch per URL-Parameter <span class="mono">?selftest=1</span> aufrufbar.</section>`;
}

/* ─────────── Boot ─────────── */
function boot(){
  S = loadState();
  /* Geldmonat-Cutover am Lohntag (SPEC 2.16): vor dem Rendern anwenden, damit
     Rest/Engpass/Liquidität sofort auf dem korrekten aktiven Geldmonat rechnen. */
  if(applyMoneyMonthCutover(S, today())) saveState();
  syncSystemTodos(S);   /* System-To-Dos beim Start abgleichen (SPEC 2.33) */
  if(typeof location!=='undefined' && /[?&]selftest=1/.test(location.search)) VIEW='checks';
  render();
}
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  /* N1-FIX: bei Fenster-Resize den Vermögens-Chart auf die neue Bandbreite
     nachziehen (entkoppelt vom Voll-Render — misst + zeichnet nur die Grafik). */
  if(typeof window!=='undefined'){
    let _fitT=null;
    window.addEventListener('resize', ()=>{ clearTimeout(_fitT); _fitT=setTimeout(fitWealthChart,150); });
  }
}
